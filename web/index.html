function edDirty(){
  const e=state.ed; if(!e)return false;
  return !!(Object.keys(e.ov).length||e.rm.size||e.newModels.length||
            edModelEdits().length||e.newType||e.newDict||
            JSON.stringify(e.loc)!==JSON.stringify(e.d.loc));
}
/* ---- what each touched bmdb entry sends ----
   Texture paths go by faction + kind, never by span index: ticking a faction on
   or off renumbers every texture slot in the entry, so an index captured by the
   page would land on the wrong one. Meshes keep using indices — those are stable. */
function edModelEdits(){
  const e=state.ed;
  return Object.keys(e.mEdits).map(name=>{
    const me=e.mEdits[name];
    if(!me._touched)return null;
    const m=e.d.models.find(x=>x.name===name); if(!m)return null;
    const v=edTexView(m), kinds=edKinds(m), faction_paths={};
    edFacs(m).forEach(f=>{
      const o={},cur=v.facs[f]||{};
      kinds.forEach(k=>{ if(cur[k]&&cur[k]!==v.defs[k])o[k]=cur[k]; });
      if(Object.keys(o).length)faction_paths[f]=o;
    });
    return {entry:name,new_name:me.new_name||'',paths:me.paths||{},copies:me.copies||[],
      imports:(me.imports||[]).map(x=>({src:x.src,dest_dir:x.dest_dir})),
      defaults:v.defs,faction_paths,factions:me.factions||null,
      move_dir:me.move_dir||'',move_shared:!!me.move_shared};
  }).filter(Boolean);
}
function edPayload(extra){

function edWireModels(){

  });

      if(v&&v!==m.texture_defaults[k])me.defaults[k]=v; else delete me.defaults[k];
      inp.classList.toggle('changed',k in me.defaults);};
  });
  document.querySelectorAll('#edBody input[data-fac]').forEach(inp=>{

      const me=edTouch(name),v=inp.value.trim();

// Where an imported texture should land: alongside the one it replaces, else in
// the model folder's textures/ (sprites live in their own shared folder).
function edImportDir(m,kind){
  const cur=edTexView(m).defs[kind]||'';
  if(cur.includes('/'))return cur.slice(0,cur.lastIndexOf('/'));
  const me=state.ed.mEdits[m.name]||{};
  const base=me.move_dir||m.folder.base||m.folder.suggestion;

const TEX_FILTER='Textures (*.texture)|*.texture|All files (*.*)|*.*';
const SPR_FILTER='Sprites (*.spr)|*.spr|All files (*.*)|*.*';
async function edImportInto(name,kind,set){
  const m=state.ed.d.models.find(x=>x.name===name);
  const r=await api.post('/api/browse_file',
    {title:'Select a file to import',filter:kind==='sprite'?SPR_FILTER:TEX_FILTER});
  if(!r.path)return;
  const dir=edImportDir(m,kind),rel=dir+'/'+r.path.split(/[\\\/]/).pop();
  const me=edTouch(name);
  me.imports=(me.imports||[]).filter(x=>x.rel!==rel).concat([{src:r.path,dest_dir:dir,rel}]);
  set(me,rel); edRenderTab(); edPreview();
}
const edImportDefault=(name,kind)=>edImportInto(name,kind,(me,rel)=>{me.defaults[kind]=rel;});
const edImportFac=(name,fac,kind)=>edImportInto(name,kind,(me,rel)=>{
  (me.faction_paths[fac]||(me.faction_paths[fac]={}))[kind]=rel;});

/* ---- EDU field access shared by every tab ----
   `e.ov` holds overrides keyed by the label block_fields() produced; `e.added`
   remembers fields this session created, so an override that happens to equal
   the (empty) starting value still gets written. */
const csv=s=>(s||'').split(',').map(x=>x.trim()).filter(Boolean);
function edFieldVal(label){const e=state.ed;
  if(label in e.ov)return e.ov[label];
  const f=e.d.fields.find(x=>x[0]===label); return f?f[1]:'';}
function edSetField(label,val){
  const e=state.ed,f=e.d.fields.find(x=>x[0]===label);
  if(!f){e.d.fields=e.d.fields.concat([[label,'']]); e.added.add(label);}
  if(val===((f||['',''])[1])&&!e.added.has(label)) delete e.ov[label]; else e.ov[label]=val;
  e.rm.delete(label); edStale();
}
// Put a field back exactly as it was — including "it wasn't there at all", which
// setting it to "" would not do (an empty EDU line is still a line).
function edRestoreField(label,val){
  const e=state.ed;
  if(val===''&&e.added.has(label)){
    e.added.delete(label); delete e.ov[label];
    e.d.fields=e.d.fields.filter(f=>f[0]!==label); edStale(); return;
  }
  edSetField(label,val);
}

/* ---- identity + localisation ---- */
// export_units.txt keeps a description on ONE line, so a real newline or tab
// typed into the box would split the record. They are written as the literal
// two-character escapes the game reads instead, the moment the box loses focus.
const escLines=s=>(s==null?'':''+s).replace(/\r\n?|\n/g,'\\n').replace(/\t/g,'\\t');
function edIsMerc(){return csv(edFieldVal('attributes')).includes('mercenary_unit');}

    <label>Description (info card)<textarea id="edDescr" style="min-height:150px">${esc(e.loc.descr)}</textarea></label>
    <div class="count" style="margin-top:4px">The description is stored on a single line — any
      new line or tab you type becomes <code>\\n</code> / <code>\\t</code> when you click away.</div>
    <fieldset style="margin-top:12px"><legend>Mercenary</legend>
      <button class="${merc?'on':''}" onclick="edToggleMerc(${merc?'false':'true'})">${

        Recruitment still needs a pool entry in <code>descr_mercenaries.txt</code> — not written by

}
function edToggleMerc(on){

  if(on&&i<0)attrs.push('mercenary_unit');

}
function edWireIdentity(){
  const e=state.ed,d=e.d;
  const bind=(id,fn)=>{const el=document.getElementById(id);
    if(el)el.oninput=()=>{fn(el.value);edStale();};};

/* ---- every EDU field, editable, with a real delete ----
   Four of them are comma-separated lists whose ORDER is meaningful, so they get
   drag-to-reorder chips instead of a text box: `ownership` / `era 0..2` (the
   factions that may field the unit) and `armour_ug_models` (position N = armour
   upgrade level N). */
const LIST_FIELDS=new Set(['ownership','era 0','era 1','era 2']);
function edFields(){
  const e=state.ed,d=e.d;
  const present=new Set(d.fields.map(([l])=>l.replace(/#\d+$/,'')));
  const missing=(d.known_fields||[]).filter(k=>!present.has(k));
  // type/dictionary/soldier define the block — the engine refuses to drop them
  const PROTECTED=new Set(['type','dictionary','soldier']);
  const rmBtn=(label,gone)=>PROTECTED.has(label.replace(/#\d+$/,''))
    ? '<span class="rm" title="This field defines the unit and can\'t be removed"> </span>'
    : `<button class="rm" data-rm="${esc(label)}" title="${
        gone?'Keep this field':'Remove this line from the unit'}">${gone?'↺':'✕'}</button>`;
  const rows=d.fields.map(([label,val])=>{
    const cur=(label in e.ov)?e.ov[label]:val;
    const gone=e.rm.has(label);
    const head=`<div class="afrow wide${gone?' gone':''}" data-label="${esc(label)}">
      <label title="${esc(label)}">${esc(label)}</label>`;
    if(LIST_FIELDS.has(label)&&!gone)
      return head+edFactionField(label,cur)+rmBtn(label,gone)+'</div>';
    if(label==='armour_ug_models'&&!gone)
      return head+edArmourField(label,cur)+rmBtn(label,gone)+'</div>';
    return `<div class="afrow${gone?' gone':''}" data-label="${esc(label)}">
      <label title="${esc(label)}">${esc(label)}</label>
      <input data-k="${esc(label)}" value="${esc(cur)}" ${gone?'disabled':''}
        class="${(label in e.ov)&&e.ov[label]!==val?'changed':''}">
      ${rmBtn(label,gone)}</div>`;
  }).join('');
  return `<fieldset><legend>EDU fields — edited in place</legend>
    <div class="fieldbar">
      <input id="fieldFilter" placeholder="Filter fields…" oninput="filterFields()">
      <span class="count" id="fieldChanged"></span>
    </div>
    <div class="allfields" id="allFields">${rows}</div>
    <div class="count" style="margin-top:6px">✕ removes the whole line — clearing a value
      leaves an empty field, which the game still reads.</div>
    <div class="prow" style="margin-top:8px;grid-template-columns:170px 1fr auto">
      <span class="pl">Add a missing field</span>
      <select id="edAddKey">${missing.map(k=>`<option>${esc(k)}</option>`).join('')||'<option value="">— none missing —</option>'}</select>
      <button onclick="edAddField()">Add</button>
    </div></fieldset>`;
}
function edWireFields(){
  const e=state.ed;
  document.querySelectorAll('#allFields input[data-k]').forEach(inp=>{
    inp.oninput=()=>{const k=inp.dataset.k,orig=(e.d.fields.find(f=>f[0]===k)||['',''])[1];
      if(inp.value!==orig)e.ov[k]=inp.value; else delete e.ov[k];
      inp.classList.toggle('changed',inp.value!==orig); edCount(); edStale();};
  });
  document.querySelectorAll('#allFields .rm').forEach(b=>{
    b.onclick=()=>{const k=b.dataset.rm;
      if(e.rm.has(k)){e.rm.delete(k);} else {e.rm.add(k); delete e.ov[k];}
      edRenderTab();};
  });
  edCount();
}
function edCount(){
  const e=state.ed,el=document.getElementById('fieldChanged'); if(!el)return;
  const n=Object.keys(e.ov).length,r=e.rm.size;
  el.textContent=[n?`${n} changed`:'',r?`${r} removed`:''].filter(Boolean).join(' · ');
}
function edAddField(){
  const e=state.ed,sel=document.getElementById('edAddKey'); const k=sel&&sel.value; if(!k)return;
  e.d.fields=e.d.fields.concat([[k,'']]);      // shows up as a new (empty) row
  e.added.add(k); e.ov[k]=''; edRenderTab();
  const inp=document.querySelector(`#allFields input[data-k="${cssq(k)}"]`);
  if(inp){inp.focus();}
}

/* ---- drag-to-reorder chip lists ---------------------------------------
   The order of these lists is data, not decoration: armour_ug_models[N] is the
   model shown at armour upgrade level N, and era lines are conventionally led by
   the faction the unit belongs to. Dropping a chip rewrites the whole line. */
let edDrag=null;
function edDragStart(ev,label,i){
  edDrag={label,i}; ev.dataTransfer.effectAllowed='move';
  try{ev.dataTransfer.setData('text/plain',String(i));}catch(_){}
  ev.currentTarget.classList.add('drag');
}
function edDragOver(ev,label){
  if(!edDrag||edDrag.label!==label)return;
  ev.preventDefault(); ev.currentTarget.classList.add('over');
}
function edDragLeave(ev){ev.currentTarget.classList.remove('over');}
function edDragEnd(ev){ev.currentTarget.classList.remove('drag'); edDrag=null;}
function edDrop(ev,label,i){
  if(!edDrag||edDrag.label!==label)return;
  ev.preventDefault();
  const list=csv(edFieldVal(label)),from=edDrag.i;
  if(from===i){edDrag=null; edRenderTab(); return;}
  const [moved]=list.splice(from,1); list.splice(i,0,moved);
  edDrag=null; edSetField(label,list.join(', ')); edRenderTab();
}
function edChips(label,items,extra){
  return `<div class="chips">${items.map((v,i)=>`<span class="chipd" draggable="true"
      ondragstart="edDragStart(event,'${q1(esc(label))}',${i})"
      ondragover="edDragOver(event,'${q1(esc(label))}')" ondragleave="edDragLeave(event)"
      ondragend="edDragEnd(event)" ondrop="edDrop(event,'${q1(esc(label))}',${i})"
      title="drag to reorder">
      <span class="g">⠿</span><span class="${i===0?'first':''}">${esc(v)}</span>
      ${(extra||(()=>''))(v,i)}
      <button class="x" title="Remove" onclick="edListRemove('${q1(esc(label))}',${i})">✕</button>
    </span>`).join('')||'<span class="count">— empty —</span>'}</div>`;
}
function edListRemove(label,i){
  const list=csv(edFieldVal(label)); list.splice(i,1);
  edSetField(label,list.join(', ')); edRenderTab();
}
function edListSet(label,items){edSetField(label,items.join(', ')); edRenderTab();}
function edListToggle(label,fac,on){
  const list=csv(edFieldVal(label)),i=list.indexOf(fac);
  if(on&&i<0)list.push(fac); else if(!on&&i>=0)list.splice(i,1);
  edListSet(label,list);
}

/* ---- ownership / era 0..2: a faction checklist over a chip list ---- */
function edFactionList(){
  const d=state.ed.d,seen=new Set();
  const all=(d.all_factions||[]).slice();
  ['ownership','era 0','era 1','era 2'].forEach(l=>csv(edFieldVal(l)).forEach(f=>all.push(f)));
  return all.filter(f=>!seen.has(f)&&seen.add(f))
            .sort((a,b)=>edFacLabel(a).localeCompare(edFacLabel(b)));
}
const edFacLabel=f=>facTwoNames(f,(state.ed.d.faction_names||{})[f]);
function edFactionField(label,cur){
  const list=csv(cur),chosen=new Set(list);
  const isEra=label!=='ownership';
  const own=csv(edFieldVal('ownership'));
  const boxes=edFactionList().map(f=>`<div class="facrow">
      <label class="chk"><input type="checkbox" ${chosen.has(f)?'checked':''}
        onchange="edListToggle('${q1(esc(label))}','${q1(esc(f))}',this.checked)">
        ${esc(edFacLabel(f))}</label></div>`).join('');
  return `<div style="flex:1;min-width:0">
    ${edChips(label,list)}
    <div class="barrow">
      <details class="drop"><summary>▾ Choose factions — ${list.length} selected</summary>
        <div class="dropbody"><div class="barrow" style="margin:0 0 6px">
          <button onclick="edListSet('${q1(esc(label))}',${JSON.stringify(edFactionList()).replace(/"/g,'&quot;')})">All</button>
          <button onclick="edListSet('${q1(esc(label))}',[])">None</button>
        </div><div class="faclist" style="border:none;padding:0;max-height:none">${boxes}</div></div>
      </details>
      ${isEra?`<button ${own.length?'':'disabled'}
          onclick="edListSet('${q1(esc(label))}',${JSON.stringify(own).replace(/"/g,'&quot;')})"
          title="Replace this era with the ownership line">Copy ownership (${own.length})</button>
        <button ${own.length?'':'disabled'}
          onclick="edListSet('${q1(esc(label))}',['${q1(esc(own[0]||''))}'])"
          title="Replace this era with just the first faction of ownership">Copy 1st ownership${
            own.length?` (${esc(own[0])})`:''}</button>`:''}
    </div></div>`;
}

/* ---- armour_ug_models: reorder tiers, jump to an entry, add the next one ---- */
function edArmourField(label,cur){
  const models=csv(cur),levels=csv(edFieldVal('armour_ug_levels'));
  const jump=(v)=>`<button title="Edit ${esc(v)} in the Battle models tab"
      onclick="edJumpModel('${q1(esc(v))}')">✎</button>`;
  return `<div style="flex:1;min-width:0">
    ${edChips(label,models,jump)}
    <div class="barrow">
      <button onclick="edAddArmourTier()" title="Clone the last model into a new entry and add it as the next tier">＋ Add armour tier</button>
      <span class="count">position = upgrade level${levels.length?` · armour_ug_levels: ${esc(levels.join(', '))}`:''}${
        levels.length&&levels.length!==models.length
          ? ` <span class="w-warn">— ${levels.length} level(s) for ${models.length} model(s)</span>`:''}</span>
    </div></div>`;
}
// Jump straight to a model's entry in the bmdb tab (the ✎ beside an armour tier
// and the model links elsewhere both land here).
function edJumpModel(name){
  const e=state.ed,key=(name||'').toLowerCase();
  if(!e.d.models.some(m=>m.name===key)){
    if(e.newModels.some(n=>n.name===key)){e.tab='models'; renderEditor(); return;}
    toast(`“${name}” is not one of this unit's model entries`); return;
  }
  e.tab='models'; e.open[key]=true; renderEditor();
  const el=document.querySelector(`#edBody .mentry[data-entry="${cssq(key)}"]`);
  if(el)el.scrollIntoView({block:'center'});
}
// "+" beside armour_ug_models: clone the tier below into a brand-new entry, add
// it as the next tier, bump armour_ug_levels, and open the form to give it its
// own mesh/texture — an upgrade tier pointing at the same files as the tier
// below it is not an upgrade.
function edAddArmourTier(){
  const e=state.ed,d=e.d;
  const models=csv(edFieldVal('armour_ug_models'));
  const src=(models[models.length-1]||edFieldVal('soldier').split(',')[0]||'').trim().toLowerCase();
  if(!src||!d.models.some(m=>m.name===src)){
    toast('No existing model entry to clone this tier from'); return;}
  const levels=csv(edFieldVal('armour_ug_levels'));
  const nextLevel=levels.length?(Math.max(...levels.map(x=>parseInt(x,10)||0))+1)
                               :(models.length?models.length+1:1);
  const stem=src.replace(/_ug\d+$/,'');
  let name=`${stem}_ug${models.length+1}`,n=models.length+1;
  while(d.model_names.includes(name)||e.newModels.some(x=>x.name===name)||models.includes(name))
    name=`${stem}_ug${++n}`;
  const from=d.models.find(m=>m.name===src)||{};
  e.form={clone_from:src,name,
          dest_dir:(from.folder&&(from.folder.base||from.folder.suggestion))||'unit_models',
          mesh_src:'',texture_src:'',normal_src:'',sprite_src:'',
          mesh_all_lods:true,apply_to_attach:false,assign_to:'',
          // the tier list and levels are set now so the chips show it straight
          // away; dropping the pending entry puts both back
          _tier:{models:edFieldVal('armour_ug_models'),levels:edFieldVal('armour_ug_levels')}};
  edSetField('armour_ug_models',models.concat([name]).join(', '));
  edSetField('armour_ug_levels',levels.concat([String(nextLevel)]).join(', '));
  e.tab='models'; renderEditor();
}

/* ---- battle model entries ----
   One entry per card: its name, who else uses it, its meshes, ONE set of default
   textures that every faction inherits, the faction checklist (with a per-faction
   override panel where a faction needs its own skin), and the folder its files
   live in. */
const TEX_KINDS=['texture','normal','sprite','attach_texture','attach_normal'];
const KIND_LABEL={texture:'Texture',normal:'Normal map',sprite:'Sprite (.spr)',
  attach_texture:'Attachment texture',attach_normal:'Attachment normal map'};
// An attachment has no sprite — the format stores an empty string there — so
// that slot is never offered.
const edKinds=m=>['texture','normal','sprite'].concat(
  m.has_attach?['attach_texture','attach_normal']:[]);
const edFacs=m=>((state.ed.mEdits[m.name]||{}).factions)||m.factions;
// What each faction's slots read right now: the entry's own values, with the
// edits made in this session on top. Anything equal to the default is *not* sent
// as an override, so changing a default really does reach every faction that
// shares it — and only those.
// With a folder move pending, every path shown (and sent) is the one it will
// have AFTER the move — otherwise the boxes would still read the old folder and
// send it straight back.
function edRebase(name,val,kind){
  const me=state.ed.mEdits[name]||{};
  if(!me.move_dir||!val||kind==='sprite')return val;
  const base=me.move_dir.replace(/\/+$/,''),file=val.split('/').pop();
  return (kind==='mesh'?base:base+'/textures')+'/'+file;
}
function edTexView(m){
  const me=state.ed.mEdits[m.name]||{};
  const defs={},facs={};
  const merged=Object.assign({},m.texture_defaults,me.defaults||{});
  Object.keys(merged).forEach(k=>{defs[k]=edRebase(m.name,merged[k],k);});
  edFacs(m).forEach(f=>{
    const src=Object.assign({},m.textures[f]||{},(me.faction_paths||{})[f]||{}),out={};
    Object.keys(src).forEach(k=>{out[k]=edRebase(m.name,src[k],k);});
    facs[f]=out;});
  return {defs,facs};
}
function edModels(){
  const e=state.ed,d=e.d;
  const pending=e.newModels.map((n,i)=>`<div class="pending">
      <button class="x" onclick="edDropNew(${i})" title="Discard">✕</button>
      <b>${esc(n.name)}</b> — new entry cloned from
      <a class="ulink" onclick="edJumpModel('${q1(esc(n.clone_from))}')">${esc(n.clone_from)}</a>
      ${n.assign_to?` → <code>${esc(n.assign_to)}</code>`:''}
      ${n._tier?' <span class="count">· next armour tier</span>':''}
      <div class="count">${esc(n.dest_dir||'(no folder)')} · ${n.mesh_src?esc(n.mesh_src.split(/[\\\/]/).pop()):'(clone mesh)'}
        · ${n.texture_src?esc(n.texture_src.split(/[\\\/]/).pop()):'(clone texture)'}
        <button style="padding:1px 7px;font-size:11px;margin-left:6px" onclick="edEditNew(${i})">Edit…</button></div></div>`).join('');
  const entries=d.models.map((m,i)=>edModelCard(m,i)).join('');
  return `${pending}${e.form?edNewModelForm():''}
    <div class="count" style="margin-bottom:8px">Paths are relative to the mod's <code>data/</code> folder.
      “Import…” copies a file from anywhere on disk into the mod and points the slot at it.</div>
    ${entries}`;
}
function edModelCard(m,idx){
  const e=state.ed;
  if(m.missing) return `<div class="mentry"><div class="mhead">
      <span class="mn w-bad">${esc(m.name)}</span>
      <span class="count">missing from this mod's modeldb${m.slots.length?` · ${m.slots.map(esc).join(', ')}`:''}</span>
    </div></div>`;
  const open=!!e.open[m.name];
  const me=e.mEdits[m.name]||{};
  const facs=edFacs(m);
  const meshes=m.paths.filter(p=>p.group==='lod').map(p=>{
    const cur=edRebase(m.name,(me.paths&&p.i in me.paths)?me.paths[p.i]:p.value,'mesh');
    return `<div class="prow">
      <span class="pl" title="${esc(p.label)}">${esc(p.label)}</span>
      <input data-entry="${esc(m.name)}" data-i="${p.i}" value="${esc(cur)}"
        class="${cur!==p.value?'changed':''}">
      <button onclick="edImportPath('${q1(esc(m.name))}',${p.i},'mesh')">Import…</button>
      <button onclick="edResetPath('${q1(esc(m.name))}',${p.i})" title="Undo this change">↺</button></div>`;
  }).join('');
  return `<div class="mentry" data-entry="${esc(m.name)}">
    <div class="mhead" onclick="edToggle('${q1(esc(m.name))}')">
      <span>${open?'▾':'▸'}</span><span class="mn">${esc(m.name)}</span>
      <span class="grow count">${m.slots.map(esc).join(', ')
        ||(e.bmdb?'<span class="w-warn">nothing references it</span>':'referenced by this unit')}
        · ${m.lods.length} LOD${m.lods.length===1?'':'s'} · ${facs.length} skin${facs.length===1?'':'s'}</span>
      ${edSharedDrop(m)}
    </div>
    ${open?`<div class="mbody2">
      <div class="prow" style="grid-template-columns:170px 1fr auto">
        <span class="pl">Entry name</span>
        <input id="edmn${idx}" value="${esc(me.new_name||m.name)}"
          oninput="edRename('${q1(esc(m.name))}',${idx},this.value)"
          class="${me.new_name?'changed':''}">
        <button onclick="edNewFrom('${q1(esc(m.name))}')">＋ New entry from this</button>
      </div>
      <div class="prow" style="grid-template-columns:170px 1fr"><span class="pl"></span>
        <span id="edmns${idx}" class="count">${edNameHint(m,me.new_name||m.name)}</span></div>
      <div class="count" style="margin-top:5px">Skeletons: ${m.skeletons.map(esc).join(', ')||'—'}</div>
      ${edFolderBox(m)}
      <div class="psec">Meshes (LODs)</div>${meshes||'<div class="count">none</div>'}

function edSharedDrop(m){

function edNameHint(m,val){
  const e=state.ed,v=(val||'').trim().toLowerCase();
  if(!v)return '<span class="w-bad">the entry needs a name</span>';
  if(v===m.name)return 'unchanged';

    return '<span class="w-bad">✗ taken — another entry in this mod already has that name</span>';
  const n=(m.used_by||[]).length+1;
  return `<span class="w-good">✓ available</span> — ${n} unit reference${n===1?'':'s'} will be

/* ---- the faction checklist, with a per-faction override panel ---- */

    return `<div class="facrow">

          ${esc(edFacLabel(f))}</label>
        ${on?`<button class="uq ${uniq||open?'on':''}" title="Give ${esc(f)} its own textures"
          onclick="edFacUnique('${q1(esc(m.name))}','${q1(esc(f))}')">${uniq?'✎ unique':'✎'}</button>`:''}

function edFacUniquePanel(m,f,v,kinds){

/* ---- preview / save / delete ---- */
// bmdb mode posts the very same body to the very same planner, minus the unit —

const edApi=p=>(state.ed&&state.ed.bmdb?'/api/bmdb/':'/api/edit/')+p;
async function edPreview(){

async function edSave(){
  const e=state.ed,bm=!!e.bmdb;
  if(!edDirty()){toast('Nothing to save');return;}
  const r=await api.post(edApi('plan'),edPayload());
  if(r.error){toast('Error: '+r.error);return;}
  if(r.errors&&r.errors.length){
    document.getElementById('edPreview').innerHTML=edPlanHtml(r);

  const what=bm?e.d.models[0].name:e.unit;
  document.getElementById('modal').innerHTML=`<h2>Saving…</h2>
    <div class="mbody"><div class="progress-track"><div class="progress-fill" style="width:60%"></div></div>
    <div class="count" style="margin-top:8px">Writing ${esc(what)} into ${esc(e.mod)}…</div></div>`;
  const res=await api.post(edApi('apply'),edPayload({run_cleaner:cleanerOptIn}));
  if(res.error){toast('Save failed: '+res.error);bm?renderBmdbEditor():renderEditor();return;}
  closeModal();
  const c=res.cleaner;
  toast(bm?`Saved “${esc(what)}” ✓  (undo in 🕑 Log)`
          :`Saved “${res.plan.resolved_type}” ✓${c?(c.ran?'  · cleaner ran':'  · cleaner failed'):''}  (undo in 🕑 Log)`,4200);
  state.destData=null; state.bmdb=null; loadSource();
}
/* =====================================================================
   BMDB MODE — the whole battle_models.modeldb, not one unit's slice of it.

   The list is every entry in the mod; opening one loads it in the SAME model
   card the unit editor uses (server-side it is literally the same payload and
   the same plan engine), so an entry can be edited without going through a unit
   that happens to reference it. Entries nothing references are flagged, and
   "Clean up" moves them — and the files under unit_models nothing mentions —
   out of the mod entirely. */
async function loadBmdb(){
  main.innerHTML='<div class="empty">Reading '+esc(state.src)+'’s battle_models.modeldb…</div>';
  try{ state.bmdb=await api.get('/api/bmdb/entries?mod='+enc(state.src)); }
  catch(e){ main.innerHTML=`<div class="empty">Couldn't read the modeldb.<br>
    <span class="count">${esc(''+e)}</span><br><br>
    <button class="primary" onclick="loadBmdb()">Retry</button></div>`; return; }
  renderBmdb();
}
function renderBmdb(){
  if(!state.bmdb||state.bmdb.mod!==state.src)return loadBmdb();
  const qq=search.value.trim().toLowerCase();
  const rows=state.bmdb.entries.filter(e=>
    (!qq||e.name.includes(qq)||(e.folder||'').toLowerCase().includes(qq)
      ||e.used_by.some(u=>u.toLowerCase().includes(qq)))
    &&(!unusedOnly.checked||e.unused));
  const nUnused=state.bmdb.entries.filter(e=>e.unused).length;
  const dupes=state.bmdb.count-state.bmdb.names;
  count.textContent=`${rows.length}/${state.bmdb.names}`;
  // 2000+ rows of HTML in one go is fine; it's the icons that are expensive and
  // there are none here.
  main.innerHTML=`<div class="dbhead">
      <h2>${esc(state.src)} · ${state.bmdb.names} battle-model entries</h2>
      <span class="count">${nUnused} referenced by nothing${
        nUnused?' — <b class="w-warn">🧹 Clean up BMDB…</b> moves them out':''}${

/* ---- clean-up: what nothing uses, and where to put it ---- */
async function openCleanup(){
  const modal=document.getElementById('modal');
  modal.className='modal wide';
  overlay.classList.add('open');
  const job=newJob();
  let a;
  try{ a=await runJob(job,`Clean up ${esc(state.src)}’s BMDB`,
        `Scanning every entry, every unit that names one, and every file under
         <code>data/unit_models</code>… (a big mod takes a few seconds)`,
        ()=>api.get(`/api/bmdb/audit?mod=${enc(state.src)}&job=${enc(job)}`)); }
  catch(e){ a={error:''+e}; }
  if(a.error){ modal.innerHTML=`<h2>Clean up</h2><div class="mbody w-bad">${esc(a.error)}</div>
    <div class="foot"><button onclick="closeModal()">Close</button></div>`; return; }
  state.clean={a,target:state.settings.last_cleanup_target||'',
    entries:new Set(a.unused.map(u=>u.entry)),     // unused: pre-ticked, they are dead by definition
    merges:new Set(),                              // suggestions: never pre-ticked, they change a model
    into:Object.fromEntries(a.merges.map(m=>[m.entry,m.into])),
    orphans:new Set(a.orphans.map(o=>o.rel)),
    mounts:new Set(),                              // rewrites descr_mount.txt: opt in by hand
    open:{unused:true,merges:true,mounts:false,orphans:false},plan:null};
  renderCleanup();
}
const MB=n=>(n/1048576).toFixed(1)+' MB';

      <button onclick="clPreview()">Preview</button>

}
function clToggle(k){state.clean.open[k]=!state.clean.open[k];renderCleanup();}
function clStale(){const b=document.getElementById('clPreview');

async function clPickTarget(){

function clUnusedBody(){

/* Suggestions, never decisions: the twin has the same animations, skeletons and

function clMergeBody(){

/* "already an armour tier of the same unit" is a fact about the PICKED twin, not

const clIsOwn=(m,into)=>(m.own_options||[]).includes(into);

/* A mount nothing rides is dead weight in descr_mount.txt, and its model entry is

   one part of the cleanup that rewrites descr_mount.txt. */
function clMountBody(){

function clOrphanBody(){
  const c=state.clean,rows=c.a.orphans;
  if(!rows.length)return '<div class="count" style="margin-top:8px">None — every file under unit_models is named by an entry.</div>';
  return `<div class="count" style="margin-top:7px">Files sitting in <code>data/unit_models</code> that
      <b>no</b> modeldb entry names — removed ones or not. They go to
      <code>unused_files\\</code> in the destination, paths mirrored.</div>
    <div class="clbar">
      <button onclick="clAll('orphans',true)">Select all</button>
      <button onclick="clAll('orphans',false)">None</button></div>

function clCountText(k){
  const c=state.clean,a=c.a;
  if(k==='unused')return `${c.entries.size}/${a.unused.length} ticked`;
  if(k==='merges')return `${c.merges.size}/${a.merges.length} ticked · needs your eye`;
  if(k==='mounts'){
    const frees=a.unused_mounts.filter(m=>c.mounts.has(m.mount)&&m.frees_model).length;
    return `${c.mounts.size}/${a.unused_mounts.length} ticked${frees?` · frees ${frees} entr${frees===1?'y':'ies'}`:''}`;
  }
  const bytes=a.orphans.reduce((n,o)=>n+(c.orphans.has(o.rel)?o.size:0),0);
  return `${c.orphans.size}/${a.orphans.length} ticked · ${MB(bytes)}`;
}
function clCounts(){['unused','merges','mounts','orphans'].forEach(k=>{
  const el=document.getElementById('clc_'+k); if(el)el.textContent=clCountText(k);});}
// The checkbox already shows its own new state, so only the header count needs
// touching — that keeps ticking one of 3000 rows instant.
function clPick(key,id,on){const s=state.clean[key]; on?s.add(id):s.delete(id);
  clStale(); clCounts();}
function clAll(key,on){
  const c=state.clean;
  const all=key==='entries'?c.a.unused.map(u=>u.entry)
           :key==='merges'?c.a.merges.map(m=>m.entry)
           :key==='mounts'?c.a.unused_mounts.map(m=>m.mount)
           :c.a.orphans.map(o=>o.rel);
  c[key]=new Set(on?all:[]);
  const head=document.getElementById('clc_'+(key==='entries'?'unused':key));
  if(head)head.closest('.clsec').querySelectorAll('.cllist input[type=checkbox]')
    .forEach(cb=>{cb.checked=on;});
  clStale(); clCounts();
}
function clPayload(){
  const c=state.clean;
  // A ticked mount carries its model with it, so the freed entries ride along in
  // `entries` — they are never in the unused list (the mount was referencing them).
  const freed=c.a.unused_mounts.filter(m=>c.mounts.has(m.mount)&&m.frees_model).map(m=>m.model);
  return {mod:c.a.mod,target:c.target,
    entries:[...new Set([...c.entries,...freed])],
    merges:[...c.merges].map(e=>({entry:e,into:c.into[e]})),
    mounts:[...c.mounts],
    orphans:[...c.orphans]};
}
async function clPreview(){
  const box=document.getElementById('clPreview'); if(!box)return null;
  box.innerHTML='<div class="preview">Planning…</div>';
  const r=await api.post('/api/bmdb/cleanup_plan',clPayload());
  if(r.error){box.innerHTML=`<div class="preview w-bad">${esc(r.error)}</div>`;return null;}
  state.clean.plan=r;
  box.innerHTML=clPlanHtml(r); return r;
}
function clPlanHtml(r){
  const li=(cls,items)=>items.map(x=>`<div class="srow ${cls}"><span class="sicon">${
      cls==='bad'?'✗':cls==='warn'?'!':'·'}</span><span class="stext">${esc(x)}</span></div>`).join('');
  const sample=r.exports.slice(0,12);
  return `<div class="sum" style="margin-top:10px">
    <div class="srow shead"><span class="sicon">🧹</span><span class="stext">What this moves</span></div>
    ${li('',r.changes)}
    ${r.target?`<div class="srow"><span class="sicon">📁</span><span class="stext">into <span class="path">${esc(r.target)}</span></span></div>`:''}
    ${sample.length?`<div class="srow"><span class="sicon">·</span><span class="stext">
      ${sample.map(x=>`<span class="path">${esc(x)}</span>`).join('<br>')}
      ${r.export_count>sample.length?`<br><i>…and ${r.export_count-sample.length} more</i>`:''}</span></div>`:''}
    ${li('warn',r.warnings)}${li('bad',r.errors)}</div>`;
}
async function clApply(){
  const c=state.clean;
  if(!c.target){toast('Choose where the removed assets should go first');return;}
  const r=state.clean.plan||await clPreview();
  if(!r)return;
  if(r.errors&&r.errors.length){toast(r.errors[0]);return;}
  if(!r.entry_deletes.length&&!r.export_count&&!r.mount_deletes.length){toast('Nothing is ticked');return;}
  if(!confirm(`Move ${r.entry_deletes.length} modeldb entr${r.entry_deletes.length===1?'y':'ies'} `+
      `and ${r.export_count} file(s) out of “${c.a.mod}”?\n\nThey are copied to:\n${r.target}\n\n`+
      `${r.merges.length?`${r.merges.length} unit soldier line(s) are repointed at their twin.\n\n`:''}`+
      `${r.mount_deletes.length?`${r.mount_deletes.length} mount(s) are removed from descr_mount.txt.\n\n`:''}`+
      `Everything touched is backed up first — 🕑 Log → Undo puts it all back.`+
      `${cleanerOptIn?`\n\n⚠ Full Cleaner.bat is ticked. It runs afterwards and deletes mod files `+
        `that are NOT backed up — including data/terrain/aerial_map/sea, the campaign map's water `+
        `art. Undo will not bring those back.`:''}`))return;
  const job=newJob();
  const res=await runJob(job,'Cleaning up…',
    `Copying ${r.export_count} file(s) out, then rewriting ${esc(c.a.mod)}’s modeldb.
     Everything is backed up as it goes — 🕑 Log → Undo puts it all back.`,
    ()=>api.post('/api/bmdb/cleanup_apply',{...clPayload(),job,run_cleaner:cleanerOptIn}));
  if(res.error){toast('Cleanup failed: '+res.error);renderCleanup();return;}
  closeModal();
  const cl=res.cleaner;
  toast(`Removed ${res.plan.entry_deletes.length} entr${res.plan.entry_deletes.length===1?'y':'ies'} `+
        `and ${res.plan.export_count} file(s) ✓${cl?(cl.ran?' · cleaner ran':' · cleaner failed'):''}`+
        `  (undo in 🕑 Log)`,5200);
  state.bmdb=null; state.destData=null; loadSource();
}

  const box=document.getElementById('edPreview'); if(!box)return;
  box.innerHTML='<div class="preview">Planning…</div>';
  const r=await api.post('/api/edit/plan',edPayload(edDeleteOpts()));
  box.innerHTML=r.error?`<div class="preview w-bad">${esc(r.error)}</div>`:edPlanHtml(r);
}
async function edDoDelete(){
  const e=state.ed;
  if(!confirm(`Delete “${e.d.type}” from ${e.mod}?\n\nIt is backed up first, so you can undo it from the 🕑 Log.`))return;
  const res=await api.post('/api/edit/apply',edPayload(edDeleteOpts()));
  if(res.error){toast('Delete failed: '+res.error);return;}
  closeModal(); toast(`Deleted “${e.d.type}” ✓  (undo in 🕑 Log)`,4200);
  state.destData=null; loadSource();
}

/* ---- new unit: reuses the transfer engine with source == destination ---- */
function openNewUnitPicker(){
  const modal=document.getElementById('modal');
  const d=state.data||{};
  modal.className='modal';
  modal.innerHTML=`<h2>New unit — pick the unit to build it from</h2>
    <div class="mbody">
      <div class="count" style="margin-bottom:8px">The new unit is a copy of the one you pick: same models,
        icons and stats, under a new <code>type</code> and <code>dictionary</code>. Nothing is duplicated on
        disk — identical models and cards are reused. You can then change any field in the next step.</div>
      <input id="nuSearch" placeholder="Filter units…" style="width:100%" oninput="renderNewUnitList()">
      <div class="barrow" style="margin-bottom:6px">
        <select id="nuFac" onchange="renderNewUnitList()">${
          opts('All factions',(d.factions||[]),facLabel)}</select>
        <select id="nuCat" onchange="renderNewUnitList()">${opts('All categories',d.categories||[])}</select>
        <select id="nuClass" onchange="renderNewUnitList()">${opts('All classes',d.classes||[])}</select>
        <label class="chk"><input type="checkbox" id="nuMerc" onchange="renderNewUnitList()"> mercs only</label>
        <span class="count" id="nuCount"></span>
      </div>
      <div class="baselist" id="nuList" style="max-height:420px"></div>
    </div>
    <div class="foot"><button onclick="closeModal()">Cancel</button></div>`;
  overlay.classList.add('open');
  renderNewUnitList();
}
// A labelled list (factions) is ordered by what it SHOWS, so a picker follows the
// same A→Z as the sidebar; a plain one keeps the order it came in.
const opts=(allLabel,values,label)=>`<option value="">${allLabel}</option>`+
  (label?[...values].sort((a,b)=>label(a).localeCompare(label(b))):values)
    .map(v=>`<option value="${esc(v)}">${esc(label?label(v):v)}</option>`).join('');
function renderNewUnitList(){
  const g=id=>(document.getElementById(id)||{}).value||'';
  const qq=g('nuSearch').trim().toLowerCase();
  const fac=g('nuFac'),cat=g('nuCat'),cls=g('nuClass');
  const merc=(document.getElementById('nuMerc')||{}).checked;
  const all=state.data?state.data.units:[];
  const units=all.filter(u=>
    (!qq||u.name.toLowerCase().includes(qq)||u.type.toLowerCase().includes(qq)
      ||u.dictionary.toLowerCase().includes(qq))
    &&(!fac||u.ownership.includes(fac))&&(!cat||u.kind===cat)&&(!cls||u.class===cls)
    &&(!merc||u.mercenary));
  const cnt=document.getElementById('nuCount');
  if(cnt)cnt.textContent=`${units.length}/${all.length}`;
  document.getElementById('nuList').innerHTML=units.slice(0,400).map(u=>`
    <div class="baserow" onclick="startNewUnit('${q1(esc(u.type))}')">
      <img onerror="iconRetry(this)" src="${iconUrl(state.src,u.type)}">
      <div><div>${esc(u.name)}</div><div class="count">${esc(u.type)} · ${esc(u.kind||u.category||'?')}${
        u.class?' / '+esc(u.class):''}${u.mercenary?' · merc':''}</div></div>
    </div>`).join('')||'<div class="count" style="padding:8px">No units match.</div>';
}
function startNewUnit(type){
  state.dst=state.src; state.destData=null;      // same-mod "transfer" = a new unit
  const u=(state.data.units.find(x=>x.type===type)||{});
  const c=cfgFor(type);
  c.on_conflict='rename';
  c.new_type=type+' (new)';
  c.new_dictionary=(u.dictionary||type)+'_new';
  // nothing needs relocating inside one mod: identical models/cards are reused
  c.asset_conflict='use_existing'; c.icon_conflict='use_existing'; c.engine_conflict='use_existing';
  c._resolved=true;
  openComposer([type]);
}

/* ---------- settings ---------- */
async function openSettings(){
  document.getElementById('modal').className='modal';
  const s=await api.get('/api/settings'); state.settings=s;
  const ign=s.unit_limit_ignored||[];
  const ignHtml=ign.length
    ? ign.map(m=>`<div class="ovr"><span><code>${esc(m)}</code></span><button onclick="reenableLimit('${q1(esc(m))}')">Re-enable warning</button></div>`).join('')
    : '<div class="count">None — the 500-unit-limit warning is active for every mod.</div>';
  document.getElementById('modal').innerHTML=`<h2>Settings</h2>
    <div class="mbody">
      <fieldset><legend>Medieval II root folder</legend>
        <div class="count" style="margin-bottom:8px">Point to your Medieval II install (contains <b>mods</b>) or a mods folder directly. Remembered next time.</div>
        <div style="display:flex;gap:6px">
          <input id="rootInput" style="width:100%" value="${esc(s.med2_root||'')}" placeholder="C:\\...\\Total War MEDIEVAL II Definitive Edition">
          <button onclick="autoDetectRoot()">Auto-detect</button>
          <button onclick="browseRoot()">Browse…</button>
        </div>
        <div id="rootStatus" class="count" style="margin-top:8px"></div>
      </fieldset>
      <fieldset><legend>Launcher</legend>
        <label class="chk"><input type="checkbox" id="consoleChk" ${s.show_console?'checked':''} onchange="saveConsole()">
          Keep the console window open</label>
        <div class="count" style="margin-top:6px"><code>Launch-Unit-Transfer.bat</code> <b>always</b> opens a console so a failed
          start is readable instead of a window that flashes and vanishes. It shows the startup checks, then the unit-card
          TGA→PNG conversions as they run. Off (default): it hides itself once that's done. On: it stays, showing every
          request and transfer. <b>Applies from the next launch.</b></div>
        <div class="count" style="margin-top:6px">If anything fails — before or after startup — the console comes back with the
          reason and stays put. Everything is also written to <code>config\\server.log</code>, console or not.
          To re-run just the checks: <code>py app.py --check</code></div>
        <div style="margin-top:8px"><button class="danger" onclick="quitServer()">⏻ Quit server</button>
          <span class="count">stops the tool (needed when running silently)</span></div>
      </fieldset>
      <fieldset><legend>Transfer defaults</legend>
        <label class="chk"><input type="checkbox" id="soldierBaseChk" ${s.soldier_from_base?'checked':''} onchange="saveSoldierBase()">
          Use the base unit's <b>soldier</b> line by default</label>
        <div class="count" style="margin-top:6px">When you pick a “use another unit as base”, default the <b>Soldier</b> source to the base (so the base's soldier model &amp; projectile are used) instead of the transferred unit's. You can still flip it per unit in the composer.</div>
      </fieldset>
      <fieldset><legend>Full Cleaner.bat</legend>
        <div class="count">Off by default. Every Apply / Save / Move-them-out dialog has its own <b>Also run Full Cleaner.bat</b> box at the bottom — tick it there, for that one job. Nothing runs it automatically any more.</div>
        <div class="count" style="margin-top:6px">What it is for: it deletes the caches M2TW regenerates on launch, notably <code>export_units.txt.strings.bin</code>, which otherwise keeps showing the OLD unit text in game. Tick it when a change you made is not showing up.</div>
        <div class="count w-warn" style="margin-top:6px">Why it is not on by default: the script also deletes files the mod ships and the game does <b>not</b> rebuild — all of <code>data/terrain/aerial_map/sea</code> (the campaign map's water art, which is what rivers are drawn with), four historical battle maps, and <code>data/scripts/show_me</code>. It runs as a subprocess, so none of that is backed up and <b>Undo cannot restore it</b>. Have a copy of the mod before you tick it.</div>
        <label class="chk" style="margin-top:8px"><input type="checkbox" id="cleanerChk" ${s.run_full_cleaner===false?'checked':''} onchange="saveCleaner()">
          Never let it run, even if a box is ticked</label>
      </fieldset>
      <fieldset><legend>Unit-limit warning (500 vanilla cap)</legend>
        <div class="count" style="margin-bottom:8px">Mods where the ${VANILLA_UNIT_LIMIT}-unit warning is suppressed (you confirmed M2TWEOP / EOP is in use):</div>
        ${ignHtml}
      </fieldset>
    </div>
    <div class="foot"><button onclick="closeModal()">Close</button><button class="primary" onclick="saveRoot()">Save & scan</button></div>`;
  overlay.classList.add('open');
}
async function saveRoot(){const root=document.getElementById('rootInput').value.trim();
  rootStatus.textContent='Scanning…'; await api.post('/api/settings',{med2_root:root});
  const mods=await api.get('/api/mods');
  rootStatus.innerHTML=mods.length?`Found ${mods.length}: ${mods.map(m=>esc(m.name)).join(', ')}`:'<span class="w-bad">No mods under that folder.</span>';
  if(mods.length){await refreshMods(state.src,state.dst);setTimeout(closeModal,700);}
}
async function autoDetectRoot(){
  rootStatus.textContent='Looking up the registry…';
  const r=await api.get('/api/detect_med2_root');
  if(!r.path){rootStatus.innerHTML='<span class="w-bad">Not found in the registry — install not detected. Type or paste the path instead.</span>';return;}
  document.getElementById('rootInput').value=r.path;
  await saveRoot();
}
async function browseRoot(){
  rootStatus.textContent='Opening folder browser…';
  const r=await api.post('/api/browse_folder',{title:'Select your Medieval II Total War folder'});
  if(!r.path){rootStatus.textContent='Cancelled.';return;}
  document.getElementById('rootInput').value=r.path;
  await saveRoot();
}

/* ---------- log ---------- */
function newerSameDest(log,e){const idx=log.indexOf(e);
  return log.slice(idx+1).filter(x=>x.dest_root===e.dest_root&&x.applied&&!x.undone);}
async function openLog(){
  document.getElementById('modal').className='modal';
  const log=await api.get('/api/log'); state.logCache=log;
  const items=[...log].reverse().map(e=>{
    const newer=newerSameDest(log,e);
    const id=q1(esc(e.id));
    const undoBtn=e.applied&&!e.undone?`<button class="danger" onclick="doUndo('${id}')">Undo</button>`:'';
    const revBtn=e.applied&&!e.undone
      ?`<button onclick="doRevert('${id}')" title="Restore “${esc(e.dest)}” to its state at this point (undo everything newer)">⟲ Revert to here${newer.length?` (${newer.length})`:''}</button>`
      :'';
    return `<div class="log-item ${e.undone?'undone':''}">
    <div class="top"><div><b>${esc(e.resolved_type||e.unit_type)}</b> <span class="pill">${
      e.mode==='sounds'?`🔊 voice edits in ${esc(e.dest)}`
      :e.mode==='bmdb'?`${e.action==='cleanup'?'🧹 cleaned out of':'🗄 bmdb edit in'} ${esc(e.dest)}`
      :e.mode==='edit'?`${e.action==='delete'?'🗑 deleted in':'✎ edited in'} ${esc(e.dest)}`
                     :`${esc(e.source)} → ${esc(e.dest)}`}</span></div>
      <div style="display:flex;gap:8px;align-items:center"><span class="when">${esc(e.when)}</span>
      ${undoBtn}${revBtn}
      ${e.undone?'<span class="pill">undone</span>':(!e.applied?'<span class="pill">not applied</span>':'')}</div></div>
    ${renderSummary(e.summary||'')}</div>`;}).join('')||'<div class="empty">No transfers yet.</div>';
  document.getElementById('modal').innerHTML=`<h2>Transfer log</h2>
    <div class="mbody"><div class="count" style="margin-bottom:8px">“Undo” reverts just that transfer. “Revert to here” rolls the destination back to its state at that point, undoing every newer transfer to it (backups restored byte-exact).</div>${items}</div>
    <div class="foot"><button onclick="closeModal()">Close</button></div>`;
  overlay.classList.add('open');
}
async function doUndo(id){const r=await api.post('/api/undo',{id});if(r.error){toast('Undo error: '+r.error);return;}
  toast('Undone ✓');state.destData=null;openLog();if(state.data)loadSource();}
async function doRevert(id){
  const log=state.logCache||await api.get('/api/log');
  const e=log.find(x=>x.id===id); if(!e){toast('Log entry not found');return;}
  const newer=newerSameDest(log,e);
  if(!newer.length){toast('Already at this stage — nothing newer to undo.');return;}
  if(!confirm(`Revert “${e.dest}” to its state right after this transfer?\n\n`+
      `This undoes ${newer.length} newer transfer(s) to “${e.dest}” (newest first). `+
      `All backed-up files (EDU, localisation, modeldb, overwritten textures) are restored byte-exact and moved-in files are removed.`)) return;
  const r=await api.post('/api/revert',{id});
  if(r.error){toast('Revert error: '+r.error);return;}
  toast(`Reverted to this stage — undid ${r.count} transfer(s) ✓`);
  state.destData=null; openLog(); if(state.data)loadSource();}

init();
</script>
