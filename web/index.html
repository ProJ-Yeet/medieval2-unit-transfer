const gfKey=label=>label.replace(/#\d+$/,'');

/* ---- splitting a line into its slots, and putting it back together ---- */
function gfParse(spec,val){
  const raw=(val==null?'':''+val);
  const n=(spec.parts||[]).length;
  if(!n)return {parts:[],ok:true};
  if(!raw.trim())return {parts:new Array(n).fill(''),ok:true,empty:true};
  let p=raw.split(',').map(s=>s.trim());
  const allow=spec.arity||[n];
  if(allow.indexOf(p.length)<0)return {parts:p,ok:false};
  if(spec.pad)p=spec.pad(p);
  while(p.length<n)p.push('');
  return {parts:p,ok:true};
}
function gfBuild(spec,parts){
  if(spec.join)return spec.join(parts);
  return parts.map(x=>(''+(x==null?'':x)).trim()).join(', ');
}

/* ---- host adapters ------------------------------------------------------
   The unit editor and the transfer composer keep their edits in different
   places (`state.ed.ov` + a removal set vs a per-unit `field_overrides`), have
   different extras (a real delete vs the base-unit B switches) and read
   different mods. Everything the renderer needs comes through here. */
function gfHostEditor(){
  const e=state.ed;
  return {
    id:'ed', key:'ed:'+e.mod+':'+e.unit, mod:e.mod,
    vocab:gfVocabFor(e.mod),
    fields:()=>e.d.fields,
    known:new Set(e.d.known_fields||[]),
    get:edFieldVal,
    orig:l=>{const f=e.d.fields.find(x=>x[0]===l);return f?f[1]:'';},
    set:(l,v)=>edSetField(l,v),
    changed:l=>(l in e.ov)&&e.ov[l]!==((e.d.fields.find(x=>x[0]===l)||['',''])[1]),
    removed:l=>e.rm.has(l),
    canRemove:true,
    protectedKeys:new Set(['type','dictionary','soldier']),
    toggleRemove:l=>{if(e.rm.has(l))e.rm.delete(l);else{e.rm.add(l);delete e.ov[l];}edRenderTab();},
    badge:()=>'',
    lock:()=>null,
    factions:()=>edFactionList(),
    facLabel:edFacLabel,
    missing:()=>{const present=new Set(e.d.fields.map(([l])=>gfKey(l)));
      return (e.d.known_fields||[]).filter(k=>!present.has(k));},
    add:k=>{e.d.fields=e.d.fields.concat([[k,'']]);e.added.add(k);e.ov[k]='';edRenderTab();},
    addLabel:(k,l)=>{e.d.fields=e.d.fields.concat([[l,'']]);e.added.add(l);e.ov[l]='';edRenderTab();},
    richArmour:true,          // the editor's ＋ tier menu and ✎ jump-to-model
    rerender:()=>edRenderTab(),
    count:()=>edCount(),
    stale:()=>edStale(),
  };
}
function gfHostComposer(){
  const c=cfgFor(state.editing);
  const inh=new Set(c.base_type?(c._inherited||[]):[]);
  const lockFor=gfComposerLock(c);
  return {
    id:'cm', key:'cm:'+state.dst+':'+state.editing, mod:state.dst,
    vocab:gfVocabFor(state.dst),
    fields:()=>gfComposerFields(c),
    known:new Set(Object.keys(GF_FIELDS)),
    get:l=>{const lk=lockFor(gfKey(l)); if(lk)return lk.val;
      return (l in c.field_overrides)?c.field_overrides[l]:c._orig[l];},
    orig:l=>c._orig[l],
    set:(l,v)=>{if(v!==c._orig[l])c.field_overrides[l]=v; else delete c.field_overrides[l];},
    changed:l=>(l in c.field_overrides)&&c.field_overrides[l]!==c._orig[l],
    removed:()=>false,
    canRemove:false,
    protectedKeys:new Set(),
    toggleRemove:()=>{},
    badge:(l,cur)=>inh.has(gfKey(l))&&!/#\d+$/.test(l)?baseBadge(c,l,cur):'',
    lock:l=>/#\d+$/.test(l)?null:lockFor(gfKey(l)),
    factions:()=>gfComposerFactions(c),
    facLabel:facLabel,
    missing:()=>{const present=new Set(gfComposerFields(c).map(([l])=>gfKey(l)));
      return (state.ed&&state.ed.d.known_fields||Object.keys(GF_FIELDS)).filter(k=>!present.has(k));},
    add:k=>{c._fields=c._fields.concat([[k,'']]);c.field_overrides[k]='';renderAllFields(state.editing);},
    addLabel:(k,l)=>{c._fields=c._fields.concat([[l,'']]);c.field_overrides[l]='';renderAllFields(state.editing);},
    richArmour:false,
    rerender:()=>renderAllFields(state.editing),
    count:()=>updateFieldChanged(),
    stale:()=>{},
  };
}
// Same two locks the raw view applies: a copied voice owns accent + voice_type,
// and replacing a unit keeps the replaced unit's type + dictionary.
function gfComposerLock(c){
  const snd=soundDonor(c);
  const sndLock=snd.accent?{vals:{accent:snd.accent,voice_type:snd.cls},
    why:`Locked by the voice panel — “${snd.name}”’s sounds are copied into ${snd.accent} / ${snd.cls}, `
       +`and these two fields are what point the game at that block. Choose “Don’t import sound” to edit them yourself.`}:null;
  const rb=baseUnitOf(c);
  const idLock=(isReplace(c)&&rb)?{vals:{type:rb.type,dictionary:rb.dictionary},
    why:`Locked — this transfer rewrites “${rb.type}” in place, so it keeps its own type and dictionary.`}:null;
  return key=>(idLock&&(key in idLock.vals))?{val:idLock.vals[key],why:idLock.why}
             :(sndLock&&(key in sndLock.vals))?{val:sndLock.vals[key],why:sndLock.why}:null;
}
function gfComposerFields(c){
  const snd=soundDonor(c);
  let fields=c._fields||[];
  if(snd.accent){        // a copied voice ADDS these two lines if the unit lacks them
    fields=fields.slice();
    for(const k of ['voice_type','accent']){
      if(fields.some(([l])=>l===k))continue;
      const after=fields.findIndex(([l])=>l==='voice_type'||l==='class');
      fields.splice(after<0?0:after+1,0,[k,k==='accent'?snd.accent:snd.cls]);
    }
  }
  return fields;
}
// The composer has no per-unit faction list of its own: use the destination mod's,
// widened by whatever the unit's own ownership/era lines already name.
function gfComposerFactions(c){
  const all=Object.keys(state.factionNames||{}).slice();
  (state.destData&&state.destData.factions||[]).forEach(f=>all.push(f.name||f));
  ['ownership','era 0','era 1','era 2'].forEach(l=>{
    const v=(l in c.field_overrides)?c.field_overrides[l]:c._orig[l];
    csv(v||'').forEach(f=>all.push(f));
  });
  const seen=new Set();
  return all.filter(f=>f&&!seen.has(f)&&seen.add(f)).sort((a,b)=>facLabel(a).localeCompare(facLabel(b)));
}

/* ---- per-dialog view state (which section, the search box, which cards have
        their raw line or help opened) ---- */
function gfState(host){
  if(!state.gf||state.gf.key!==host.key)
    state.gf={key:host.key,tab:'basics',q:'',raw:new Set(),help:new Set()};
  return state.gf;
}

/* ---- warnings ------------------------------------------------------------
   Things the engine will not do, or will do differently from what the numbers
   suggest. They never block a save — a mod may know better — but the point of a
   guided editor is that you find out here rather than at the loading screen. */
function gfWarnings(host){
  const out={},add=(l,h,k)=>{(out[l]||(out[l]=[])).push({h,k:k||'warn'});};
  const val=l=>host.get(l)||'';
  const has=l=>host.fields().some(([x])=>x===l)&&!host.removed(l);
  const parts=l=>val(l).split(',').map(s=>s.trim());
  const num=x=>{const n=parseFloat(x);return isNaN(n)?null:n;};

  const cat=(val('category')||'').toLowerCase();
  const cls=(val('class')||'').toLowerCase();
  if(has('class')&&cat==='infantry'&&cls==='spearmen'){/* fine */}
  if(has('class')&&cat!=='infantry'&&cls==='spearmen')
    add('class','<b>spearmen</b> is an infantry class — on a '+esc(cat)+' unit the engine falls back to a default.');
  if(has('animal')&&cat!=='handler')
    add('animal','An <code>animal</code> line needs <code>category handler</code>, otherwise the animals never appear.');
  // a unit carries ONE kind of attachment; the engine reads whichever it finds
  // first and the others are dead weight
  const extras=['ship','engine','mounted_engine','animal'].filter(has);
  if(extras.length>1)extras.forEach(k=>add(k,
    'A unit can only use one of <code>ship</code>, <code>engine</code>, <code>mounted_engine</code> and '
    +'<code>animal</code> — this one has <b>'+extras.join('</b>, <b>')+'</b>.','bad'));

  ['stat_pri','stat_sec','stat_ter'].forEach(k=>{
    if(!has(k))return;
    const p=parts(k); if(p.length<11)return;
    const atk=num(p[0]),proj=(p[2]||'').toLowerCase(),rng=num(p[3]),ammo=num(p[4]),wt=(p[5]||'').toLowerCase();
    if(atk!==null&&atk>63)add(k,'Attack <b>'+esc(p[0])+'</b> is above the engine’s cap of 63 — it will behave as 63.');
    const missile=(wt==='missile'||wt==='thrown'||wt==='siege_missile');
    if(missile&&proj==='no')add(k,'Weapon type is <b>'+esc(wt)+'</b> but the projectile is <code>no</code> — it will never fire.');
    if(!missile&&proj!=='no'&&proj)add(k,'A projectile is set but the weapon type is <b>'+esc(wt||'—')+'</b>; only missile/thrown/siege_missile weapons fire.');
    if(missile&&!rng)add(k,'Missile weapon with range 0 — it cannot reach anything.');
    if(missile&&!ammo)add(k,'Missile weapon with 0 ammunition — it fires nothing.');
    if(proj&&proj!=='no'&&!gfHas(gfDefined(host,'projectile'),p[2])&&gfDefined(host,'projectile').length)
      add(k,'Projectile <code>'+esc(p[2])+'</code> is not defined in this mod’s <code>descr_projectile.txt</code>.','bad');
    if(p.length>=12&&(p[9]||'').trim()&&!/^[A-Za-z_][\w]*$/.test(p[9].trim()))
      add(k,'The 12-value form puts the fire effect in slot 10 — <code>'+esc(p[9])+'</code> does not look like an effect name.');
  });
  if(has('stat_pri')&&has('stat_sec')){
    const w=x=>((parts(x)[5])||'').toLowerCase();
    const missileSec=['missile','thrown'].indexOf(w('stat_sec'))>=0;
    if(missileSec&&['missile','thrown','siege_missile'].indexOf(w('stat_pri'))<0)
      add('stat_sec','A missile weapon has to be the <b>primary</b> one — the engine ignores a secondary bow.');
  }
  if(has('stat_ter')!==has('stat_ter_attr'))
    add(has('stat_ter')?'stat_ter':'stat_ter_attr','A third weapon needs <b>all</b> of stat_ter and stat_ter_attr, or the engine drops it.');

  if(has('formation')){
    const p=parts('formation');
    if(p.length>=7){
      const a=(p[5]||'').toLowerCase(),b=(p[6]||'').toLowerCase();
      if(b&&['square','horde'].indexOf(a)<0)
        add('formation','With two formations the first must be <b>square</b> or <b>horde</b>.');
      if(b&&['schiltrom','shield_wall','phalanx','testudo','wedge'].indexOf(b)<0)
        add('formation','<b>'+esc(b)+'</b> is not one of the switchable formations (schiltrom, shield_wall, phalanx, testudo, wedge).');
      if(b==='phalanx'&&csv(val('stat_pri_attr')).indexOf('long_pike')<0)
        add('formation','A <b>phalanx</b> unit normally needs <code>long_pike</code> in its primary weapon attributes.');
    }
  }
  const lv=csv(val('armour_ug_levels')),md=csv(val('armour_ug_models'));
  if(has('armour_ug_models')&&lv.length&&md.length&&md.length>lv.length)
    add('armour_ug_models',`<b>${md.length}</b> upgrade model(s) but only <b>${lv.length}</b> level(s) — `
      +'the tiers past the last level have nothing to trigger them.');
  else if(has('armour_ug_models')&&lv.length&&md.length&&lv.length>md.length)
    add('armour_ug_models',`<b>${lv.length}</b> armour levels share <b>${md.length}</b> model(s) — the last `
      +'model carries the levels above it. Common and fine; add models only if the tiers should look different.','info');
  const defModels=gfDefined(host,'model');
  if(defModels.length){
    md.forEach(m=>{if(!gfHas(defModels,m))add('armour_ug_models','<code>'+esc(m)+'</code> is not an entry in this mod’s battle_models.modeldb.','bad');});
    const sm=(parts('soldier')[0]||'');
    if(has('soldier')&&sm&&!gfHas(defModels,sm))
      add('soldier','<code>'+esc(sm)+'</code> is not an entry in this mod’s battle_models.modeldb.','bad');
  }
  [['mount','mount'],['engine','engine'],['mounted_engine','mounted_engine'],
   ['ship','ship'],['animal','animal']].forEach(([k,v])=>{
    const list=gfDefined(host,v);
    if(has(k)&&list.length&&!gfHas(list,val(k)))
      add(k,'<code>'+esc(val(k))+'</code> is not defined in this mod’s <code>descr_'+
        (k==='mounted_engine'?'mounted_engines':k==='engine'?'engines':k==='animal'?'animals':k)+'.txt</code>.','bad');
  });
  if(has('soldier')){
    // NB: not "fewer than 4". The guide gives 4 as the minimum, but shipped mods
    // field 2-man scout and monster units that work perfectly well — only a unit
    // with no men at all is definitely wrong.
    const men=num(parts('soldier')[1]);
    if(men!==null&&men<1)add('soldier','A unit with no men — nothing will be recruited.','bad');
  }
  if(has('ownership')&&!csv(val('ownership')).length)
    add('ownership','No owner — no faction can recruit this unit, and its unit card has no faction folder to live in.','bad');
  const attrs=csv(val('attributes'));
  if(attrs.indexOf('mercenary_unit')>=0&&!has('card_pic_dir'))
    add('attributes','<code>mercenary_unit</code>: the unit card is looked up under <code>ui/units/mercs/</code> unless <code>card_pic_dir</code> says otherwise.','info');
  if(attrs.indexOf('can_run_amok')>=0&&!has('mount'))
    add('attributes','<code>can_run_amok</code> only does anything on a mounted unit.');
  if(has('stat_mental')){
    const p=parts('stat_mental');
    if(p.length>3&&(p[3]||'').toLowerCase()!=='lock_morale')
      add('stat_mental','The optional fourth value can only be <code>lock_morale</code>.','bad');
  }
  return out;
}

/* ---- rendering ---------------------------------------------------------- */
function gfRender(host){
  const gf=gfState(host);
  const warns=gfWarnings(host);
  const groups={};GF_SECTIONS.forEach(s=>groups[s.id]=[]);
  host.fields().forEach(([label])=>{
    const k=gfKey(label);
    let sec=GF_SECTION_OF[k];
    // a repeated line only has a guided shape when the field itself is repeatable
    if(sec&&/#\d+$/.test(label)&&k!=='officer')sec=null;
    (groups[sec||'other']).push(label);
  });
  const q=(gf.q||'').trim().toLowerCase();
  let shown,heading='';
  if(q){
    shown=host.fields().map(([l])=>l).filter(l=>{
      const sp=GF_FIELDS[gfKey(l)]||{};
      return (l+' '+(sp.t||'')+' '+(sp.doc||'')).toLowerCase().indexOf(q)>=0;});
    heading=`<div class="gfintro">${shown.length} field(s) matching “${esc(gf.q)}”.</div>`;
  }else{
    if(!groups[gf.tab]||(!groups[gf.tab].length&&gf.tab!=='other'))
      gf.tab=(GF_SECTIONS.find(s=>groups[s.id].length)||GF_SECTIONS[0]).id;
    shown=groups[gf.tab];
  }
  const nWarn=Object.keys(warns).length;
  const nav=GF_SECTIONS.map(s=>{
    const n=groups[s.id].length;
    if(!n&&s.id==='other')return '';
    const bad=groups[s.id].filter(l=>gfReal(warns[l]).length).length;
    return `<button class="${!q&&gf.tab===s.id?'on':''}" onclick="gfTab('${s.id}')">${esc(s.t)}
      <span class="n">${n}</span>${bad?`<span class="bad" title="${bad} thing(s) to look at">▲</span>`:''}</button>`;
  }).join('');
  return `<div class="gfwrap">
    <div class="gfnav" id="gfNav">${nav}</div>
    <div class="gfbody" id="gfBody">
      <div class="gfsum" id="gfSum">${gfSumHtml(host,warns)}</div>
      ${heading}
      ${shown.length?shown.map(l=>gfCard(host,l,warns)).join('')
        :'<div class="gfempty">Nothing in this group. The unit has no such lines — add one below.</div>'}
      ${gfAddHtml(host)}
    </div>
    ${gfDatalists(host)}</div>`;
}
function gfTab(id){const gf=state.gf; if(!gf)return; gf.tab=id; gf.q='';
  const f=document.getElementById('fieldFilter'); if(f)f.value='';
  gfRerenderBody();}
// Re-draw just the guided body, so switching a section or opening a raw line
// does not throw away the rest of the dialog (or its scroll position).
function gfRerenderBody(){
  const box=document.getElementById('allFields'); if(!box)return;
  if(!((state.mode==='edit'&&state.ed)||state.editing))return;
  const host=gfHost();
  const b=document.getElementById('gfBody'),was=b?b.scrollTop:0;
  box.innerHTML=gfRender(host); gfWire(host);
  const now=document.getElementById('gfBody'); if(now&&was)now.scrollTop=was;
}
const gfReal=list=>(list||[]).filter(x=>x.k!=='info');
function gfSumHtml(host,warns){
  const n=Object.values(warns).reduce((a,b)=>a+gfReal(b).length,0);
  const bad=Object.values(warns).reduce((a,b)=>a+b.filter(x=>x.k==='bad').length,0);
  return `<span class="count">${host.fields().length} line(s) in this unit.</span>`
    +(n?`<span class="pill warn" onclick="gfShowWarnings()" title="Jump to the first one">
        ${bad?'✖ '+bad+' broken':''}${bad&&n-bad?' · ':''}${n-bad?'▲ '+(n-bad)+' to check':''}</span>`
      :`<span class="pill" style="border-color:var(--good);color:var(--good)">✓ nothing looks wrong</span>`);
}
function gfShowWarnings(){
  const el=document.querySelector('#gfBody .gfnote.bad,#gfBody .gfnote.warn');
  if(el){el.scrollIntoView({block:'center'});return;}
  // the first problem is in another section — find it and switch there
  const w=gfWarnings(gfHost()),first=Object.keys(w).find(k=>gfReal(w[k]).length); if(!first)return;
  gfTab(GF_SECTION_OF[gfKey(first)]||'other');
  setTimeout(()=>{const e2=document.querySelector('#gfBody .gfnote.bad,#gfBody .gfnote.warn');
    if(e2)e2.scrollIntoView({block:'center'});},0);
}

// One <datalist> per open drop-down, emitted once for the whole body.
function gfDatalists(host){
  const want=new Set();
  Object.values(GF_FIELDS).forEach(sp=>(sp.parts||[]).forEach(p=>{if(p.type==='combo')want.add(p.v);}));
  return [...want].map(v=>`<datalist id="gfdl-${esc(v)}">${
    gfV(host,v).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`).join('');
}

function gfCard(host,label,warns){
  const key=gfKey(label);
  const spec=GF_FIELDS[key];
  const gone=host.removed(label);
  const lk=host.lock(label);
  const cur=host.get(label);
  const changed=host.changed(label);
  const gf=gfState(host);
  const rawOpen=gf.raw.has(label)||!spec;
  const parsed=spec&&spec.parts?gfParse(spec,cur):null;
  const title=spec?spec.t:label;
  const canRm=host.canRemove&&!host.protectedKeys.has(key);
  const head=`<div class="gfhead">
    ${spec?qmSpec(key,null):''}
    <span class="t">${esc(title)}</span>
    <span class="k">${esc(label)}</span>
    ${spec&&spec.opt?'<span class="count" title="The engine works without this line">optional</span>':''}
    ${lk?`<span class="ibadge" title="${esc(lk.why)}">🔒</span>`:host.badge(label,cur)}
    <span class="sp"></span>
    ${(!gone&&!lk&&GF_ACTIONS[key])?GF_ACTIONS[key](label,cur):''}
    ${spec?`<button class="${gf.help.has(label)?'on':''}" title="What this line does"
        onclick="gfHelp('${q1(esc(label))}')">?</button>`:''}
    ${lk?'':`<button class="${rawOpen?'on':''}" title="Show the line exactly as the file stores it"
        onclick="gfRaw('${q1(esc(label))}')">&lt;/&gt;</button>`}
    ${canRm?`<button class="rm" title="${gone?'Keep this line':'Delete this line from the unit'}"
        onclick="gfRemove('${q1(esc(label))}')">${gone?'↺':'✕'}</button>`:''}
  </div>`;
  let body='';
  if(gone)body='<div class="gfnote">This line will be removed from the unit.</div>';
  else if(lk)body=`<div class="gfrow"><div class="gfpart grow"><span class="pl">value</span>
      <input value="${esc(lk.val)}" disabled title="${esc(lk.why)}"></div></div>
    <div class="gfnote">${esc(lk.why)}</div>`;
  else if(spec&&spec.w)body=gfWidget(host,label,spec,cur);
  else if(spec&&parsed&&parsed.ok)body=gfParts(host,label,spec,parsed);
  else if(spec)body=`<div class="gfnote warn">This line has ${parsed.parts.length} value(s); the engine
      reads ${(spec.arity||[spec.parts.length]).join(' or ')} here, so it is shown as raw text.</div>`;
  const raw=(rawOpen&&!gone&&!lk)?`<div class="gfraw">
      <span class="pl">${esc(key)}</span>
      <input data-gfraw="${esc(label)}" value="${esc(cur)}" spellcheck="false"
        class="${changed?'changed':''}"></div>`:'';
  const doc=(spec&&gf.help.has(label))?`<div class="gfdoc">${spec.doc||''}</div>`:'';
  const empty=(parsed&&parsed.empty&&!gone)?'<div class="gfnote">This line is empty — fill it in and it gets written.</div>':'';
  return `<div class="gfcard${changed?' changed':''}${gone?' gone':''}" data-card="${esc(label)}">
    ${head}${doc}${body}${empty}${raw}
    <div data-warn="${esc(label)}">${gfNotes(warns[label])}</div></div>`;
}
/* Quick actions in a card's header. "No secondary weapon" is not a cosmetic
   shortcut: the engine recognises one exact line as "this unit has no sidearm"
   (`0, 0, no, 0, 0, no, melee_simple, blunt, none, 25, 1`), and typing eleven
   values by hand to say nothing is how the reference editor makes people do it. */
const GF_NO_WEAPON='0, 0, no, 0, 0, no, melee_simple, blunt, none, 25, 1';
const gfIsNoWeapon=v=>{const p=(v||'').split(',').map(x=>x.trim());
  return p.length>=9&&p[0]==='0'&&p[2]==='no'&&(p[5]==='no'||p[5]==='');};
const GF_ACTIONS={
  stat_sec:(label,cur)=>gfIsNoWeapon(cur)?'':`<button title="Write the line the engine reads as
'this unit has no sidearm', and clear its attributes"
    onclick="gfNoWeapon('${q1(esc(label))}')">no secondary weapon</button>`,
  stat_ter:(label,cur)=>gfIsNoWeapon(cur)?'':`<button title="Write the empty-weapon line and clear its attributes"
    onclick="gfNoWeapon('${q1(esc(label))}')">no third weapon</button>`,
};
function gfNoWeapon(label){
  const host=gfHost();
  host.set(label,GF_NO_WEAPON);
  const attr=label+'_attr';
  if(host.fields().some(([l])=>l===attr))host.set(attr,'no');
  host.stale(); gfRerenderBody();
}
const gfNotes=list=>(list||[]).map(m=>`<div class="gfnote ${m.k||'warn'}">${m.h}</div>`).join('');

// Which PART of a multi-value line differs from what the file said. A whole-line
// "changed" flag is no help on `stat_pri 7, 3, no, 0, 0, melee, …`: you want the
// one number you touched lit up, not all thirteen.
function gfPartChanged(host,label,spec,parsed){
  const was=gfParse(spec,(host.orig?host.orig(label):'')||'');
  const whole=host.changed(label);
  const norm=v=>(v==null?'':''+v).trim();
  return i=>{
    if(!was||!was.ok||!parsed.ok)return whole;   // can't line them up — mark the lot
    return norm(parsed.parts[i])!==norm(was.parts[i]);
  };
}
function gfParts(host,label,spec,parsed){
  const key=gfKey(label);
  const partChanged=gfPartChanged(host,label,spec,parsed);
  const cells=spec.parts.map((p,i)=>{
    const v=parsed.parts[i]==null?'':parsed.parts[i];
    const ch=partChanged(i);
    const cls='gfpart'+(p.grow?' grow':p.w===3?' w3':p.w===2?' w2':'')+(ch?' changed':'');
    const attr=`data-gfp="${esc(label)}" data-i="${i}"`;
    const chc=ch?' changed':'';                  // the amber "you changed this"
    // the explanation hangs off the ? beside the part's name; the control keeps
    // an accessible name of its own, since the label is not a <label for=…>
    const aria=` aria-label="${esc(p.pl)}"`;
    let ctl;
    if(p.type==='flag'){
      ctl=`<label class="chk" style="height:26px"><input type="checkbox" ${attr}${aria}
        class="${chc.trim()}" ${v?'checked':''}> ${esc(p.on||'on')}</label>`;
    }else if(p.type==='sel'){
      const opts=gfV(host,p.v);
      const list=opts.indexOf(v)<0?[v].concat(opts):opts;
      ctl=`<select ${attr}${aria} class="${chc.trim()}">${list.map(o=>`<option value="${esc(o)}"${
        o===v?' selected':''}>${o===''?(p.optional?'— none —':'—'):esc(o)}</option>`).join('')}</select>`;
    }else if(p.type==='combo'){
      ctl=`<input ${attr}${aria} class="${chc.trim()}" list="gfdl-${esc(p.v)}"
        value="${esc(v)}" spellcheck="false">`;
    }else if(p.type==='num'){
      ctl=gfSpin(attr+aria,v,chc);
    }else{
      ctl=`<input ${attr}${aria} class="${chc.trim()}" value="${esc(v)}" spellcheck="false"
        ${p.mono?' style="font-family:ui-monospace,Consolas,monospace"':''}>`;
    }
    return `<div class="${cls}"><span class="pl">${qmSpec(key,i)}${esc(p.pl)}${
      p.optional?' <span style="opacity:.6">(opt)</span>':''}</span>${ctl}</div>`;
  }).join('');
  return `<div class="gfgrid">${cells}</div>`;
}
/* A number box with its own ▴▾. The browser's own <input type=number> is not
   used on purpose: EDU values are decimals, negatives and occasionally blanks,
   and a number input quietly refuses or reformats those. This keeps a plain text
   box — so any value in the file survives being looked at — and puts the
   stepping in buttons and the ↑/↓ keys, which are the only things that clamp. */
const gfSpin=(attr,v,cls)=>`<span class="gfspin"><input ${attr} class="gfnum${cls||''}" value="${esc(v)}"
    spellcheck="false" inputmode="decimal"><span class="gfsp">
    <button type="button" tabindex="-1" data-spin="1" aria-label="increase">▴</button>
    <button type="button" tabindex="-1" data-spin="-1" aria-label="decrease">▾</button>
  </span></span>`;

/* ---- the ? marker -------------------------------------------------------
   Explanations are ASKED FOR, not sprung: a field's help hangs off a small ?
   at its top-left rather than off the field itself, so moving the pointer
   across a form does not set off a trail of cards, and a box you are trying to
   read is never covered by a tip about the box next to it.

   `qm(text)` is the plain form. `qmSpec(key, i)` is the one the guided editor
   uses, which pulls a full card out of GF_FIELDS instead of a line of text.
   Both are read by the same delegated handler below. */
// The markers are deliberately NOT tab stops: there is one per field, and a
// guided unit has four hundred of them — putting each in the tab order would
// double the keystrokes to cross a form. Keyboard users get the same card when
// they focus the field itself (see the focusin handler), and the marker keeps a
// plain `title` so it still has an accessible name of its own.
const qm=(text,title)=>!text?'':`<span class="qm" tabindex="-1"
  title="${esc(text)}"${title?` data-tiptitle="${esc(title)}"`:''}
  data-tiptext="${esc(text)}">?</span>`;
const qmSpec=(key,i)=>`<span class="qm" tabindex="-1" title="What is this?"
  data-tip="${esc(key)}"${i==null?'':` data-tipi="${i}"`}>?</span>`;
// A field's documentation as plain text, for the raw view — GF_FIELDS writes its
// `doc` as HTML, and a ? marker carries text.
function gfPlainDoc(key){
  const spec=GF_FIELDS[key];
  if(!spec||!spec.doc)return '';
  return spec.doc.replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
}

/* ---- the hover card -----------------------------------------------------
   One floating element driven by delegation, so it survives the guided body
   being redrawn (which happens on nearly every edit) without rebinding
   anything. */
function gfTipHtml(key,i){
  const spec=GF_FIELDS[key]; if(!spec)return '';
  if(i==null||i===''){
    return `<div class="tt">${esc(spec.t)}</div>
      <div class="tk">${esc(key)}${spec.syn?'  '+esc(spec.syn):''}</div>
      <div class="tb">${spec.doc||''}</div>
      ${spec.opt?'<div class="tf">Optional — the engine works without this line.</div>':''}`;
  }
  const p=(spec.parts||[])[+i]; if(!p)return '';
  const range=[];
  if(p.type==='num'){
    if(p.min!=null&&p.max!=null)range.push(`${p.min} to ${p.max}`);
    else if(p.min!=null)range.push(`${p.min} or more`);
    else if(p.max!=null)range.push(`up to ${p.max}`);
    if(p.step&&p.step!==1)range.push(`steps of ${p.step}`);
  }
  return `<div class="tt">${esc(p.pl)}${p.optional?' <span class="topt">optional</span>':''}</div>
    <div class="tk">${esc(key)} — value ${(+i)+1} of ${spec.parts.length}</div>
    <div class="tb">${p.help||spec.doc||''}</div>
    ${range.length?`<div class="tf">▴▾ and the ↑/↓ keys step within ${range.join(', ')} —
      hold Shift for ×10, or hold the button down to repeat. Typing is never clamped.</div>`:''}`;
}
let gfTipEl=null;
function gfTipShow(el){
  let html;
  if(el.dataset.tiptext!==undefined){
    // a plain explanation moved off a field's own title attribute
    html=(el.dataset.tiptitle?`<div class="tt">${esc(el.dataset.tiptitle)}</div>`:'')
        +`<div class="tb">${esc(el.dataset.tiptext)}</div>`;
  }else{
    const key=el.dataset.tip,i=el.dataset.tipi;
    html=gfTipHtml(key,i===undefined?null:i);
  }
  if(!html)return;
  if(!gfTipEl){gfTipEl=document.createElement('div');gfTipEl.className='gftip';document.body.appendChild(gfTipEl);}
  gfTipEl.innerHTML=html; gfTipEl.style.display='block';
  gfTipEl.style.left='0px'; gfTipEl.style.top='0px';         // measure unconstrained
  const r=el.getBoundingClientRect(),t=gfTipEl.getBoundingClientRect();
  let x=r.left, y=r.bottom+7;
  if(x+t.width>window.innerWidth-10)x=Math.max(10,window.innerWidth-10-t.width);
  if(y+t.height>window.innerHeight-10)y=Math.max(10,r.top-7-t.height);
  gfTipEl.style.left=x+'px'; gfTipEl.style.top=y+'px';
}
function gfTipHide(){if(gfTipEl)gfTipEl.style.display='none';}
// bound once, on the document — the guided body is replaced wholesale on edits
const TIP_SEL='[data-tip],[data-tiptext]';
document.addEventListener('mouseover',ev=>{
  const el=ev.target&&ev.target.closest&&ev.target.closest(TIP_SEL);
  if(!el){gfTipHide();return;}
  if(el===gfTipEl)return;
  gfTipShow(el);
});
document.addEventListener('mouseleave',gfTipHide,true);
window.addEventListener('scroll',gfTipHide,true);
// Focusing a field shows its ? card, so the help is reachable without a mouse
// even though the markers themselves are out of the tab order.
document.addEventListener('focusin',ev=>{
  const t=ev.target;
  if(!t||!t.closest){gfTipHide();return;}
  let el=t.closest(TIP_SEL);
  if(!el&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName||'')){
    const cell=t.closest('.gfpart,.afrow,.brow,.condrow,.gfcard');
    el=cell?cell.querySelector('.qm'):null;
  }
  if(el)gfTipShow(el); else gfTipHide();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')gfTipHide();});

/* ---- the widgets a plain box cannot do ---- */
function gfWidget(host,label,spec,cur){
  if(spec.w==='attrs')return gfAttrWidget(host,label,cur);
  if(spec.w==='wattr')return gfWeaponAttrWidget(host,label,cur);
  if(spec.w==='factions')return gfFactionWidget(host,label,cur);
  if(spec.w==='meffect')return gfMountEffectWidget(host,label,cur);
  if(spec.w==='ugmodels')return host.richArmour?`<div class="gfrow">${edArmourField(label,cur)}</div>`
    :gfListWidget(host,label,cur,'model');
  if(spec.w==='uglevels')return host.richArmour
    ?`<div class="gfrow"><div class="gfpart grow"><span class="pl">smith level per tier</span>
        <input data-gfraw="${esc(label)}" value="${esc(cur)}" spellcheck="false"></div></div>`
    :gfListWidget(host,label,cur,'');
  return '';
}
// A generic reorderable list of names (armour tiers in the composer).
function gfListWidget(host,label,cur,vocabName){
  const items=csv(cur);
  return `<div class="gfrow"><div style="flex:1;min-width:0">
    ${gfChips(host,label,items)}
    <div class="barrow">
      <input id="${gfAddId(label)}" placeholder="add…" style="width:190px;font-size:12px;padding:3px 7px"
        ${vocabName?`list="gfdl-${esc(vocabName)}"`:''}>
      <button onclick="gfListAdd('${q1(esc(label))}')">Add</button>
    </div></div></div>`;
}
function gfListAdd(label){
  const el=document.getElementById(gfAddId(label));
  const host=gfHost(); const v=(el&&el.value||'').trim(); if(!v)return;
  const list=csv(host.get(label)); list.push(v);
  host.set(label,list.join(', ')); host.stale(); gfRerenderBody();
}
/* What a list field said before you touched it. A plain "the field changed"
   flag is no use on a list of forty factions — you want to see WHICH ones are
   yours — so every list widget marks its own entries against this. Membership
   only: reordering `ownership` is a change to the field, not to any one entry. */
function gfListWas(host,label){
  return new Set(csv((host.orig?host.orig(label):'')||''));
}
// Drag-to-reorder chips, host-agnostic (the editor's own edChips is bound to
// state.ed, and the composer has no such state).
function gfChips(host,label,items){
  const was=gfListWas(host,label);
  const gone=[...was].filter(v=>items.indexOf(v)<0);
  return `<div class="chips">${items.map((v,i)=>`<span class="chipd${
      was.has(v)?'':' added'}" draggable="true"
      ondragstart="gfDragStart(event,'${q1(esc(label))}',${i})"
      ondragover="gfDragOver(event,'${q1(esc(label))}')" ondragleave="edDragLeave(event)"
      ondragend="edDragEnd(event)" ondrop="gfDrop(event,'${q1(esc(label))}',${i})"
      title="${was.has(v)?'drag to reorder':'Added by you · drag to reorder'}">
      <span class="g">⠿</span><span class="${i===0?'first':''}">${esc(v)}</span>
      <button class="x" title="Remove ${esc(v)}"
        onclick="gfListRemove('${q1(esc(label))}',${i})">✕</button></span>`).join('')
    ||'<span class="count">— empty —</span>'}
    ${gone.map(v=>`<span class="chipd gone" title="Removed by you — click to put it back"
      onclick="gfListRestore('${q1(esc(label))}','${q1(esc(v))}')">${esc(v)}</span>`).join('')}</div>`;
}
function gfListRestore(label,v){
  const host=gfHost(),list=csv(host.get(label));
  if(list.indexOf(v)<0)list.push(v);
  host.set(label,list.join(', ')); host.stale(); gfRerenderBody();
}
let gfDrag=null;
function gfDragStart(ev,label,i){gfDrag={label,i};ev.dataTransfer.effectAllowed='move';
  try{ev.dataTransfer.setData('text/plain',String(i));}catch(_){}
  ev.currentTarget.classList.add('drag');}
function gfDragOver(ev,label){if(!gfDrag||gfDrag.label!==label)return;
  ev.preventDefault();ev.currentTarget.classList.add('over');}
function gfDrop(ev,label,i){
  if(!gfDrag||gfDrag.label!==label)return; ev.preventDefault();
  const host=gfHost(),list=csv(host.get(label)),from=gfDrag.i; gfDrag=null;
  if(from===i){gfRerenderBody();return;}
  const [m]=list.splice(from,1); list.splice(i,0,m);
  host.set(label,list.join(', ')); host.stale(); gfRerenderBody();
}
function gfListRemove(label,i){
  const host=gfHost(),list=csv(host.get(label)); list.splice(i,1);
  host.set(label,list.join(', ')); host.stale(); gfRerenderBody();
}

/* attributes: tick boxes grouped into what the unit can DO and what the AI is
   told it is, plus a free box for a mod's own attribute. */
function gfAttrWidget(host,label,cur){
  const have=csv(cur),haveSet=new Set(have);
  const all=gfV(host,'unit_attr');
  const AI=['peasant','pike','crossbow','gunmen','guncavalry','artillery','cannon','rocket','mortar',
    'explode','incendiary','standard','foot_archers','horse_archers','foot_javelinmen','horse_javelinmen',
    'foot_slingers','foot_pila','foot_darts','foot_francisca','wagon_fort'];
  const isAI=a=>AI.indexOf(a)>=0;
  const known=new Set(all);
  const wasSet=gfListWas(host,label);
  const box=(a)=>facCheckRow(a,'',
    `gfListToggle('${q1(esc(label))}','${q1(esc(a))}',this.checked)`,
    haveSet.has(a),'',haveSet.has(a)!==wasSet.has(a));
  const abilities=all.filter(a=>!isAI(a)),hints=all.filter(isAI);
  const unknown=have.filter(a=>!known.has(a));
  return `<div class="gfrow"><div style="flex:1;min-width:0">
    ${gfChips(host,label,have)}
    <div class="barrow">
      <details class="drop"><summary>▾ Abilities — ${have.filter(a=>!isAI(a)).length} on</summary>
        <div class="dropbody"><div class="faclist" style="border:none;padding:0;max-height:none">
          ${abilities.map(box).join('')}</div></div></details>
      <details class="drop"><summary>▾ AI hints — ${have.filter(isAI).length} on</summary>
        <div class="dropbody"><div class="count" style="margin-bottom:6px">These change nothing about the
          unit itself; they tell the campaign AI what kind of unit it is looking at.</div>
          <div class="faclist" style="border:none;padding:0;max-height:none">${hints.map(box).join('')}</div>
        </div></details>
      <input id="${gfAddId(label)}" list="gfdl-unit_attr" placeholder="add your own…"
        style="width:170px;font-size:12px;padding:3px 7px">
      <button onclick="gfListAdd('${q1(esc(label))}')">Add</button>
    </div>
    ${unknown.length?`<div class="gfnote">Not in this mod’s usual set:
      <b>${unknown.map(esc).join(', ')}</b> — kept as typed.</div>`:''}
  </div></div>`;
}
// stat_pri_attr / stat_sec_attr / stat_ter_attr: same idea, but "empty" is the
// word `no`, and the spear bonuses are mutually exclusive.
function gfWeaponAttrWidget(host,label,cur){
  const have=csv(cur).filter(a=>a.toLowerCase()!=='no');
  const all=gfV(host,'weapon_attr');
  const haveSet=new Set(have);
  const wasSet=gfListWas(host,label);
  return `<div class="gfrow"><div style="flex:1;min-width:0">
    ${gfChips(host,label,have.length?have:[])}
    <div class="barrow">
      <details class="drop"><summary>▾ Choose attributes — ${have.length} on</summary>
        <div class="dropbody"><div class="faclist" style="border:none;padding:0;max-height:none">
          ${all.map(a=>facCheckRow(a,'',
            `gfWAttrToggle('${q1(esc(label))}','${q1(esc(a))}',this.checked)`,
            haveSet.has(a),'',haveSet.has(a)!==wasSet.has(a))).join('')}
        </div></div></details>
      <input id="${gfAddId(label)}" list="gfdl-weapon_attr" placeholder="add your own…"
        style="width:170px;font-size:12px;padding:3px 7px">
      <button onclick="gfListAdd('${q1(esc(label))}')">Add</button>
    </div>
    ${have.length?'':'<div class="gfnote">None — the line is written as <code>no</code>.</div>'}
  </div></div>`;
}
function gfWAttrToggle(label,attr,on){
  const host=gfHost(),list=csv(host.get(label)).filter(a=>a.toLowerCase()!=='no');
  const i=list.indexOf(attr);
  // only one spear bonus can apply, so picking one drops the other
  if(on&&/^spear_bonus_/.test(attr))
    for(let j=list.length-1;j>=0;j--)if(/^spear_bonus_/.test(list[j]))list.splice(j,1);
  const at=list.indexOf(attr);
  if(on&&at<0)list.push(attr); else if(!on&&at>=0)list.splice(at,1);
  host.set(label,list.length?list.join(', '):'no'); host.stale(); gfRerenderBody();
}
function gfListToggle(label,v,on){
  const host=gfHost(),list=csv(host.get(label)),i=list.indexOf(v);
  if(on&&i<0)list.push(v); else if(!on&&i>=0)list.splice(i,1);
  host.set(label,list.join(', ')); host.stale(); gfRerenderBody();
}
// A host's facLabel runs both names together ("Mordor (england)"); a checklist
// wants them apart, so pull the display name back out of it.
function gfFacName(host,code){
  const both=host.facLabel(code);
  if(both===code)return '';
  const m=/^(.*)\s\((.*)\)$/.exec(both);
  if(!m)return both;
  return m[1]===code?m[2]:m[1];
}
/* ownership / era N: the editor already has a faction checklist bound to its own
   state; the composer gets the same shape driven by the host. */
function gfFactionWidget(host,label,cur){
  if(host.richArmour)return `<div class="gfrow">${edFactionField(label,cur)}</div>`;
  const list=csv(cur),chosen=new Set(list),all=host.factions();

        <div class="dropbody"><div class="faclist" style="border:none;padding:0;max-height:none">
          ${all.map(f=>facCheckRow(f,gfFacName(host,f),
              `gfListToggle('${q1(esc(label))}','${q1(esc(f))}',this.checked)`,

function gfSetList(label,items){const host=gfHost();

/* mount_effect: up to three "<mount> <±n>" pairs. The mount name may contain
   spaces ("mailed horse +2"), so the number is split off the end, not the start. */
function gfMountEffectWidget(host,label,cur){
  const pairs=csv(cur).map(s=>{const m=/^(.*?)\s*([+-]?\d+(?:\.\d+)?)$/.exec(s.trim());
    return m?{n:m[1].trim(),v:m[2]}:{n:s.trim(),v:''};});
  const rows=pairs.map((p,i)=>`<div class="gfoff">
      <span class="idx">${i+1}</span>
      <input data-gfme="${esc(label)}" data-i="${i}" data-part="n" list="gfdl-mount_class"
        value="${esc(p.n)}" style="width:180px;font-size:12.5px;padding:4px 7px">
      ${gfSpin(`data-gfme="${esc(label)}" data-i="${i}" data-part="v" aria-label="modifier"`,p.v)}
      <button class="rm" title="Remove" onclick="gfMeRemove('${q1(esc(label))}',${i})"
        style="background:none;border:1px solid transparent;color:var(--dim);padding:2px 6px">✕</button>
    </div>`).join('');
  return `<div class="gfgrid" style="flex-direction:column;align-items:flex-start">${rows}
    <div class="barrow">
      <button ${pairs.length>=3?'disabled title="The engine reads at most three"':''}
        onclick="gfMeAdd('${q1(esc(label))}')">＋ Add a mount effect</button>
      <span class="count">${pairs.length}/3 · a class (horse, camel, elephant) or one specific mount</span>
    </div></div>`;
}
function gfMeParts(host,label){
  return csv(host.get(label)).map(s=>{const m=/^(.*?)\s*([+-]?\d+(?:\.\d+)?)$/.exec(s.trim());
    return m?{n:m[1].trim(),v:m[2]}:{n:s.trim(),v:''};});
}
function gfMeWrite(host,label,pairs){
  host.set(label,pairs.filter(p=>p.n).map(p=>{
    const v=(p.v||'').trim(); const s=(/^[+-]/.test(v)||!v)?v:'+'+v;
    return (p.n+' '+s).trim();}).join(', '));
  host.stale();
}
function gfMeAdd(label){const host=gfHost();const p=gfMeParts(host,label);
  p.push({n:'horse',v:'+1'}); gfMeWrite(host,label,p); gfRerenderBody();}
function gfMeRemove(label,i){const host=gfHost();const p=gfMeParts(host,label);
  p.splice(i,1); gfMeWrite(host,label,p); gfRerenderBody();}

/* ---- adding a line the unit doesn't have ---- */
function gfAddHtml(host){
  const missing=host.missing();
  const gf=gfState(host);
  const offCount=host.fields().filter(([l])=>gfKey(l)==='officer').length;
  const sec=GF_SECTIONS.find(s=>s.id===gf.tab);
  const here=missing.filter(k=>sec&&sec.keys.indexOf(k)>=0);
  const list=here.length?here:missing;
  return `<div class="gfmissing">
    <span class="count">Add a line:</span>
    <select id="gfAddKey">${(list.length?list:missing).map(k=>{
      const sp=GF_FIELDS[k];
      return `<option value="${esc(k)}">${esc(k)}${sp?' — '+esc(sp.t):''}</option>`;}).join('')
      ||'<option value="">— the unit already has every known line —</option>'}</select>
    <button onclick="gfAdd()">Add</button>
    ${offCount<3?`<button onclick="gfAddOfficer()" title="Officers are extra men on top of the unit; up to three"
      >＋ Officer (${offCount}/3)</button>`:''}
    ${here.length&&here.length!==missing.length?'<span class="count">— missing from this group</span>':''}
  </div>`;
}
function gfAdd(){
  const sel=document.getElementById('gfAddKey'),k=sel&&sel.value; if(!k)return;
  gfHost().add(k);
}
function gfAddOfficer(){
  const host=gfHost();
  const n=host.fields().filter(([l])=>gfKey(l)==='officer').length;
  if(n>=3)return;
  host.addLabel('officer',n?`officer#${n+1}`:'officer');

/* ---- wiring ------------------------------------------------------------- */
const gfHost=()=>((state.mode==='edit'&&state.ed)?gfHostEditor():gfHostComposer());
function gfHelp(label){const gf=state.gf;
  if(gf.help.has(label))gf.help.delete(label); else gf.help.add(label); gfRerenderBody();}
function gfRaw(label){const gf=state.gf;
  if(gf.raw.has(label))gf.raw.delete(label); else gf.raw.add(label); gfRerenderBody();}
function gfRemove(label){gfHost().toggleRemove(label);}

function gfWire(host){
  // one slot of a line: write the whole line back, but never re-render — that
  // would take the caret out of the box being typed into
  const write=(label,i,value)=>{
    const spec=GF_FIELDS[gfKey(label)];
    const p=gfParse(spec,host.get(label));
    if(!p.ok)return;
    p.parts[i]=value;
    host.set(label,gfBuild(spec,p.parts));
    host.stale(); gfAfterEdit(host,label);
  };
  document.querySelectorAll('#allFields [data-gfp]').forEach(el=>{
    const label=el.dataset.gfp,i=+el.dataset.i;
    if(el.type==='checkbox'){
      el.onchange=()=>{write(label,i,el.checked?(GF_FIELDS[gfKey(label)].parts[i].on||'1'):'');};
      return;
    }
    const fire=()=>write(label,i,el.value);
    el.oninput=fire; el.onchange=fire;
    if(!el.classList.contains('gfnum'))return;
    const spec=GF_FIELDS[gfKey(label)];
    gfWireNum(el,spec&&spec.parts&&spec.parts[i],fire);
  });
  // the whole line as text
  document.querySelectorAll('#allFields [data-gfraw]').forEach(el=>{
    const label=el.dataset.gfraw;
    el.oninput=()=>{host.set(label,el.value); host.stale(); gfAfterEdit(host,label,true);};
    el.onblur=()=>{const spec=GF_FIELDS[gfKey(label)];
      // a retyped raw line can change how many values it has, which changes the
      // boxes above it — redraw once the user has finished with it
      if(spec&&spec.parts)gfRerenderBody();};
  });
  // mount_effect's paired boxes
  document.querySelectorAll('#allFields [data-gfme]').forEach(el=>{
    const label=el.dataset.gfme,i=+el.dataset.i,part=el.dataset.part;
    const fire=()=>{const p=gfMeParts(host,label);
      if(!p[i])return; p[i][part]=el.value; gfMeWrite(host,label,p); gfAfterEdit(host,label);};
    el.oninput=fire;
    // a mount effect is a signed modifier, so it steps by 1 either way
    if(part==='v')gfWireNum(el,{min:-100,max:100},fire);
  });
  host.count();
}
// The ↑/↓ keys and the ▴▾ buttons of one number box. The buttons repeat while
// held — a cost field is a long way from 0 one click at a time.
function gfWireNum(el,p,fire){
  el.onkeydown=ev=>gfNumKey(ev,p,el,fire);
  const box=el.parentElement;
  (box?box.querySelectorAll('[data-spin]'):[]).forEach(b=>{
    const dir=+b.dataset.spin;
    b.onmousedown=ev=>{
      if(ev.button)return;
      ev.preventDefault();
      const once=()=>{gfStep(p,el,dir,ev.shiftKey);fire();};
      once();
      const start=setTimeout(()=>{b._rep=setInterval(once,60);},400);
      const stop=()=>{clearTimeout(start);clearInterval(b._rep);
        document.removeEventListener('mouseup',stop);};
      document.addEventListener('mouseup',stop);
    };
  });
}
/* Stepping a number box, from either the ▴▾ buttons or the ↑/↓ keys.
   `dir` is +1 / -1 and Shift multiplies by 10. The part's own min/max clamp the
   RESULT — and only the result: a value already outside the range (a mod's
   attack of 65, say) is left alone until you step it, and typing is never
   touched at all. An empty box starts from the minimum, or 0. */
function gfStep(p,el,dir,big){
  const step=(p&&p.step)||1;
  const dec=(p&&p.dec!=null)?p.dec
    :/\./.test(''+step)?(''+step).split('.')[1].length
    :/\./.test(el.value)?(el.value.split('.')[1]||'').length:0;
  const cur=parseFloat(el.value);
  let n=(isNaN(cur)?((p&&p.min!=null)?p.min:0):cur)+step*(big?10:1)*dir;
  if(p&&p.min!=null&&n<p.min)n=p.min;
  if(p&&p.max!=null&&n>p.max)n=p.max;
  el.value=dec?n.toFixed(dec):String(Math.round(n));
}
function gfNumKey(ev,p,el,fire){
  if(ev.key!=='ArrowUp'&&ev.key!=='ArrowDown')return;
  ev.preventDefault();
  gfStep(p,el,ev.key==='ArrowUp'?1:-1,ev.shiftKey);
  fire();
}
// After an edit that did NOT redraw: refresh the things that depend on the value
// (the changed marks, the warnings, the base-unit B, the raw box).
function gfAfterEdit(host,label,fromRaw){
  const cur=host.get(label),changed=host.changed(label);
  const card=document.querySelector(`#allFields .gfcard[data-card="${cssq(label)}"]`);
  if(card){
    card.classList.toggle('changed',changed);
    card.querySelectorAll('[data-gfraw]').forEach(r=>{
      if(r!==document.activeElement)r.value=cur;
      r.classList.toggle('changed',changed);});
    const spec=GF_FIELDS[gfKey(label)];
    const p=spec&&spec.parts?gfParse(spec,cur):null;
    if(fromRaw&&p&&p.ok){    // keep the guided boxes in step while the raw line is typed
      card.querySelectorAll('[data-gfp]').forEach(el=>{
        const v=p.parts[+el.dataset.i]==null?'':p.parts[+el.dataset.i];
        if(el.type==='checkbox')el.checked=!!v; else if(el.value!==v)el.value=v;});
    }
    // …and light up only the part that now differs from the file
    if(p){
      const pc=gfPartChanged(host,label,spec,p);
      card.querySelectorAll('[data-gfp]').forEach(el=>{
        const on=pc(+el.dataset.i);
        el.classList.toggle('changed',on);
        const cell=el.closest('.gfpart'); if(cell)cell.classList.toggle('changed',on);});
    }
    const b=card.querySelector('button[data-b]');
    if(b)b.outerHTML=host.badge(label,cur);
  }
  const w=gfWarnings(host);
  document.querySelectorAll('#allFields [data-warn]').forEach(el=>{
    const html=gfNotes(w[el.dataset.warn]);
    if(el.innerHTML!==html)el.innerHTML=html;});
  const sum=document.getElementById('gfSum'); if(sum)sum.innerHTML=gfSumHtml(host,w);
  host.count();
}

/* =========================================================================
   Buildings mode — data/export_descr_buildings.txt

   A building "line" is an upgrade chain (Barracks -> Militia Barracks -> …).
   The grid lists lines; opening one gives a tab per level with its stats, its
   capabilities and, the point of the whole screen, its recruit pools: which
   units it trains, at what rate, for whom.

   Building art is per CULTURE, not per faction — data/ui/<culture>/buildings/
   #<culture>_<level>.tga is the small icon and #<culture>_<level>_constructed.tga
   the big one. A mod ships only what it changed, so anything it doesn't have
   falls back to unpacked vanilla art and then to a drawn placeholder; the badge
   on the picture says which you're looking at.
   ========================================================================= */

const BLD_SETTLE_LABEL={city:'City',castle:'Castle',both:'City + castle'};

//: The four numbers of a `recruit_pool` line, explained on their ? markers.
const POOL_HELP={
  initial:'Points the pool holds the moment the building finishes. One point is '
    +'one unit ready to hire, so 1 means the first one can be recruited straight away.',
  per_turn:'Points the pool gains each turn — one point is one unit. The ▲▼ move '
    +'it by a whole turn at a time, and the grey reading beside it says how long '
    +'one unit actually takes.',
  maximum:'The most points the pool can hold. It stops filling here, so this is '
    +'how many of the unit can be waiting to hire at once.',
  experience:'Experience the unit is recruited with, 0 to 9. Each point is a '
    +'chevron; 9 is three gold ones.',
};

/* ---- number boxes ----
   A number box is an ordinary input with ▲▼ beside it; the arrows only set
   .value and fire `input`, so the field's own handler stores the change exactly
   as typing would (and so undo records it as one step).

   `step` is how far one click moves the value, with one special case: 'turns'
   moves a recruit rate by one whole TURN rather than by a fraction. A rate of
   0.066667 is "a unit every 15 turns", and nobody thinks in the fraction — ▲
   there gives 1/14 = 0.071429, still "the number goes up". */
const numFmt=n=>String(+(+n).toFixed(6));
function numBox(attrs,value,step,after){
  return `<span class="numwrap"><input ${attrs} data-step="${esc(step)}"
      value="${esc(value)}" inputmode="decimal">
    <span class="spin"><button type="button" tabindex="-1" data-bump="1" title="Increase">▲</button
      ><button type="button" tabindex="-1" data-bump="-1" title="Decrease">▼</button></span>
    ${after||''}</span>`;
}
// Turns per unit, for a recruit pool's points-per-turn. 0 or nonsense = never.
function poolTurns(v){
  const n=parseFloat(v);
  if(!isFinite(n)||n<=0)return 'never';
  const t=1/n;
  if(t<=1.02)return 'every turn';
  return (t<10?numFmt(t.toFixed(1)):Math.round(t))+' turns';
}
function numBump(inp,dir){
  const step=inp.dataset.step||'1';
  const cur=parseFloat(inp.value);
  let next;
  if(step==='turns'){
    const turns=(isFinite(cur)&&cur>0)?Math.max(1,Math.round(1/cur)):1;
    next=1/Math.max(1,turns-dir);       // ▲ = one turn sooner = a bigger rate
  }else{
    next=(isFinite(cur)?cur:0)+dir*(parseFloat(step)||1);
    if(next<0)next=0;                   // no negative costs, pools or build times
  }
  inp.value=numFmt(next);
  inp.dispatchEvent(new Event('input',{bubbles:true}));
}
// Wire every ▲▼ under `root`, and keep any "= 15 turns" readout beside a rate
// box in step with what is typed into it.
function wireNumBoxes(root){
  root.querySelectorAll('.numwrap').forEach(w=>{
    const inp=w.querySelector('input'); if(!inp)return;
    const turns=w.querySelector('.turns');
    w.querySelectorAll('[data-bump]').forEach(btn=>{
      btn.onclick=e=>{e.preventDefault();numBump(inp,+btn.dataset.bump);};
    });
    if(turns)inp.addEventListener('input',()=>{turns.textContent='= '+poolTurns(inp.value);});
  });
}

function bldIcon(level,kind,culture){
  return `/building_icon?mod=${enc(state.src)}&culture=${enc(culture||bldCultureNow())}`
       + `&level=${enc(level)}&kind=${kind||'small'}`;
}
function bldCultureNow(){
  const b=state.bld; return (b&&b.culture)||'';
}
// One in-flight request per mod, shared by every caller. render() fires again on
// each keystroke and filter tick, and switching mod nulls state.bld mid-await —
// without this the second caller could resume before the first had assigned.
//
// The overview is also per CULTURE, because a building's name is: DaC names
// every one of its buildings per culture and leaves the shared key a
// placeholder, so the grid has to ask for the names of the culture on show.
let _bldLoading=null;
async function loadBuildings(force){
  const want=state.settings.bld_culture||'';
  if(state.bld&&state.bld.mod===state.src&&!force)return state.bld;
  if(_bldLoading&&_bldLoading.mod===state.src&&!force)return _bldLoading.p;
  main.innerHTML='<div class="empty">Reading '+esc(state.src)+'’s buildings…</div>';
  const mod=state.src;
  const p=(async()=>{
    let ov=await api.get('/api/buildings?mod='+enc(mod)+'&culture='+enc(want));
    // Which culture's art and names lead: whatever was picked last if this mod
    // has it, else the first culture folder that holds building art.
    const culture=(ov.cultures||[]).includes(want)?want:(ov.cultures||[])[0]||'';
    // the remembered culture is not one this mod has, so the names that came
    // back are the wrong culture's — ask again for the one actually on show
    if(culture!==want)ov=await api.get('/api/buildings?mod='+enc(mod)+'&culture='+enc(culture));
    const b={mod,ov,culture,line:null,d:null,work:null,lvl:0,plan:null,own:{},
             view:state.settings.bld_view==='grid'?'grid':'rows',
             poolFac:new Set(),fixOwnership:true,
             sel:{settlement:new Set(),religion:new Set(),faction:new Set()}};
    // the mod may have been switched away from while this was in flight
    if(state.src===mod)state.bld=b;
    return b;
  })();
  _bldLoading={mod,p};
  try{ return await p; }
  finally{ if(_bldLoading&&_bldLoading.p===p)_bldLoading=null; }
}
async function renderBuildings(){
  let b;
  try{ b=await loadBuildings(); }
  catch(e){ main.innerHTML=`<div class="empty">Couldn't read the buildings of “${esc(state.src)}”.<br>
    <span class="count">${esc(''+e)}</span><br><br>
    <button class="primary" onclick="render()">Retry</button></div>`; return; }
  // the picker moved on while we were loading — whoever it moved to will render
  if(!b||b.mod!==state.src||state.mode!=='buildings')return;
  const ov=b.ov;
  if(!ov.has_file){
    main.innerHTML=`<div class="empty">“${esc(state.src)}” has no
      <code>data/export_descr_buildings.txt</code>.</div>`;
    count.textContent=''; return;
  }
  bldBuildFilters();
  const lines=ov.lines.filter(bldMatches);
  count.textContent=`${lines.length}/${ov.lines.length}`;
  if(!lines.length){main.innerHTML='<div class="empty">No buildings match.</div>';return;}
  main.innerHTML=`<section class="faction-group"><div class="faction-head">
      <h2>${esc(state.src)} — buildings</h2>
      <span class="n">${lines.length} line${lines.length===1?'':'s'}, ${
        lines.reduce((n,l)=>n+l.level_count,0)} levels</span>
      ${ov.vanilla_ui?'':'<span class="n w-warn">no unpacked vanilla UI — missing art shows a placeholder</span>'}
    </div><div class="bgrid">${lines.map(bldCardHtml).join('')}</div></section>`;
  main.querySelectorAll('.bcard').forEach(c=>c.onclick=()=>openBuilding(c.dataset.line));
}
function bldCardHtml(l){
  // the last level is the finished building, so its constructed art is the one
  // that says what the line IS at a glance
  const top=l.top_level||l.levels[l.levels.length-1]||'';
  const a=bldCardArt(l);
  const tags=[`<span class="badge">${esc(BLD_SETTLE_LABEL[l.settlement]||l.settlement)}</span>`,
    `<span class="badge">${l.level_count} level${l.level_count===1?'':'s'}</span>`];
  if(l.recruit_count)tags.push(`<span class="badge cls">${l.recruit_count} unit${l.recruit_count===1?'':'s'}</span>`);
  if(l.religion)tags.push(`<span class="badge merc">${esc(l.religion)}</span>`);
  if(l.missing_units.length)tags.push(`<span class="badge" style="color:var(--bad);border-color:var(--bad)"
      title="Named in a recruit pool but not in this mod's EDU: ${esc(l.missing_units.join(', '))}"
      >${l.missing_units.length} unknown</span>`);
  return `<div class="bcard" data-line="${esc(l.name)}">
    <div class="art"><img loading="lazy" onerror="iconRetry(this)" alt=""
        src="${bldIcon(top,'large',a.culture)}">
      ${bldArtBadge(a)}</div>
    <div class="bmeta"><div class="nm">${esc(l.label)}</div>
      <div class="sub">${esc(l.name)}</div>
      <div class="tags">${tags.join('')}</div></div></div>`;
}
// Where the card's picture comes from in the culture being shown: 'mod',
// 'vanilla' or '' for nothing at all. The overview says so per line, so the grid
// never has to ask the server about art it is already displaying.
function bldArtSource(l,culture){
  const a=(l.art||{})[culture||state.bld.culture]||{};
  return a.large||a.small||'';
}
// Most building lines are culture-specific, so with one culture picked the
// majority of the grid would be placeholders for buildings the mod HAS drawn —
// just for someone else. So a line with nothing in the chosen culture borrows
// the art of a culture that does have it, and the badge says whose.
function bldCardArt(l){
  const want=state.bld.culture;
  const own=bldArtSource(l,want);
  if(own)return {culture:want,source:own,borrowed:false};
  for(const c of Object.keys(l.art||{})){
    const s=bldArtSource(l,c);
    if(s)return {culture:c,source:s,borrowed:true};
  }
  return {culture:want,source:'',borrowed:false};
}
function bldArtBadge(a){
  if(a.borrowed)return `<span class="src vanilla"
    title="This mod has no ${esc(state.bld.culture)} art for this building — showing its ${esc(a.culture)} art instead"
    >${esc(a.culture)}</span>`;
  if(a.source==='vanilla')return `<span class="src vanilla"
    title="Borrowed from the unpacked vanilla UI — this mod ships no art for it">vanilla</span>`;
  if(!a.source)return `<span class="src placeholder"
    title="Neither this mod nor the unpacked vanilla UI has art for this building">no art</span>`;
  return '';
}
function bldMatches(l){
  const b=state.bld,S=b.sel,qq=search.value.trim().toLowerCase();
  if(qq&&!(l.label.toLowerCase().includes(qq)||l.name.toLowerCase().includes(qq)
      ||l.levels.some(x=>x.toLowerCase().includes(qq))
      ||(l.level_labels||[]).some(x=>x.toLowerCase().includes(qq))))return false;
  if(S.settlement.size&&!S.settlement.has(l.settlement))return false;
  if(S.religion.size&&!S.religion.has(l.religion||'(none)'))return false;
  if(S.faction.size&&!l.factions.some(f=>S.faction.has(f)))return false;
  if(bldRecruitOnly.checked&&!l.recruit_count)return false;
  // "missing its own art" = the mod ships nothing for it in ANY culture
  if(bldMissingArt.checked&&Object.values(l.art||{}).some(a=>a.small==='mod'||a.large==='mod'))
    return false;
  return true;
}
let _bldFiltersFor='';
function bldBuildFilters(){
  const b=state.bld,ov=b.ov,key=b.mod+'|'+b.culture;
  if(_bldFiltersFor===key)return;                 // only rebuild when the mod changes
  _bldFiltersFor=key;
  bldCulture.innerHTML=(ov.cultures||[]).map(c=>
    `<option value="${esc(c)}" ${c===b.culture?'selected':''}>${esc(c)}</option>`).join('')
    ||'<option value="">(no culture folders)</option>';
  bldCulture.onchange=()=>{bldSetCulture(bldCulture.value);};
  const religions=[...new Set(ov.lines.map(l=>l.religion||'(none)'))].sort();
  bldReligionFilter.innerHTML=religions.map(r=>
    `<label class="opt"><input type="checkbox" value="${esc(r)}">${esc(r)}</label>`).join('');
  const factions=[...new Set(ov.lines.flatMap(l=>l.factions))]
    .sort((a,b2)=>bldFacLabel(a).localeCompare(bldFacLabel(b2)));
  bldFactionFilter.innerHTML=factions.map(f=>
    `<label class="opt"><input type="checkbox" value="${esc(f)}">${esc(bldFacLabel(f))}</label>`).join('')
    ||'<span class="count">—</span>';
  const wire=(box,key2)=>box.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{
    cb.checked?b.sel[key2].add(cb.value):b.sel[key2].delete(cb.value); render();});
  wire(bldReligionFilter,'religion'); wire(bldFactionFilter,'faction');
  document.querySelectorAll('.bldset').forEach(cb=>cb.onchange=()=>{
    cb.checked?b.sel.settlement.add(cb.value):b.sel.settlement.delete(cb.value); render();});
  bldRecruitOnly.onchange=render;
  bldMissingArt.onchange=render;
}
// A `requires factions { … }` clause names factions AND cultures; only the
// factions have an in-game name to show alongside the code.
function bldFacLabel(f){

/* ---------- the building editor ---------- */
async function openBuilding(name,keepLevel){
  const modal=document.getElementById('modal');
  modal.className='modal wide'; modal.innerHTML='<h2>Loading building…</h2>';
  overlay.classList.add('open');
  let d;
  // the overview holds the culture list and the capability vocabulary the editor
  // needs; a save or a mod switch can leave it not yet loaded
  try{ await loadBuildings(); }
  catch(e){ modal.innerHTML=`<h2>Building</h2><div class="mbody w-bad">${esc(''+e)}</div>
    <div class="foot"><button onclick="closeModal()">Close</button></div>`; return; }
  try{ d=await api.get(`/api/building?mod=${enc(state.src)}&line=${enc(name)}`
                       +`&culture=${enc((state.bld&&state.bld.culture)||'')}`); }
  catch(e){ modal.innerHTML=`<h2>Building</h2><div class="mbody w-bad">${esc(''+e)}</div>
    <div class="foot"><button onclick="closeModal()">Close</button></div>`; return; }
  const b=state.bld;
  b.line=name; b.d=d; b.plan=null; b.locSel=null;
  if(!keepLevel)b.lvl=0;
  // The working copy the form edits. Everything is sent on save and the server
  // skips whatever still matches the file, so the page never has to diff.
  // `locAll` is every culture's name/description keyed by culture ('' = the
  // shared key), so the culture picker never has to go back to the server.
  b.work={levels:d.levels.map(lv=>({
      name:lv.name, settlement:lv.settlement, requires:lv.requires,
      conds:JSON.parse(JSON.stringify(lv.conditions||[])), condEdited:false,
      scalars:Object.assign({},lv.scalars), upgrades:lv.upgrades.slice(),
      locAll:JSON.parse(JSON.stringify(lv.loc_all||{'':Object.assign({present:true},lv.loc)})),
      caps:lv.capabilities.map(c=>bldCapCopy(c,false)),
      fcaps:lv.faction_capabilities.map(c=>bldCapCopy(c,true))}))};
  b.orig=JSON.stringify(b.work);
  b.own=b.own||{};                        // unit type -> ownership check result
  undoReset();
  renderBuildingEditor();
}
/* ---- which of a level's per-culture names is the one on show ----
   The same fallback the server uses (buildings._best_loc), redone here so the
   editor stays live when the culture picker moves: the culture's own key wins,
   then the shared key, then whichever culture DOES have text — a shared key
   whose value is just the key itself is a placeholder, not a name. */
function bldLocPlaceholder(rec){
  const n=((rec&&rec.name)||'').trim();
  return !n||n===(rec&&rec.key);
}
function bldLocCulture(lv,culture){
  const all=lv.locAll||{};
  const order=[culture,''].filter(c=>c in all)
    .concat(Object.keys(all).filter(c=>c&&c!==culture));
  for(const c of order) if(!bldLocPlaceholder(all[c]))return c;
  return culture in all?culture:'';
}
function bldLevelLabel(i){
  const b=state.bld, lv=b.work&&b.work.levels[i];

// `conds` is the structured form of `requires`; `condEdited` says whether it has

// tidies) a clause nobody edited.
function bldCapCopy(c,faction){
  return {line:c.line,keyword:c.keyword,args:c.args,requires:c.requires,

/* ---- name & description, per culture ----

function bldLocSel(){

/* ---- can this building offer one faction too many units? ----
   M2TW's recruitment panel holds a limited number of units per building; past it
   the panel overflows and the game can crash on opening the settlement. That is
   a failure you only meet on the one save where enough conditions have lined up
   at once, so it is worth being told about while editing.

   The JS twin of buildings.recruitment_pressure, recomputed from the working
   copy so the count tracks pools as they are added, removed and re-gated.

   Two numbers, because they answer different questions. `always` is pools the
   faction gets with NO further condition — if that is over the limit the
   building is already broken. `most` assumes every event counter, hidden
   resource and settlement size holds at the same time; it is an upper bound on
   purpose, since which of a mod's conditions can truly coincide is not
   answerable from the EDB alone. */
function bldRecruitPressure(lv){
  const ov=state.bld.ov,fc=ov.faction_cultures||{},limit=ov.recruit_limit||32;
  const every=Object.keys(fc);
  const cultures=new Set(Object.values(fc));
  const ALL=(bldVocab().all_keyword||'all').toLowerCase();
  const most={},always={};
  [...lv.caps,...lv.fcaps].forEach(c=>{
    if(c.del||!c.pool)return;
    const conds=c.conds||[];
    const facs=conds.filter(x=>x.kind==='factions'&&!x.negate).flatMap(x=>x.values||[]);
    const gated=conds.some(x=>x.kind!=='factions');
    let who;
    if(!facs.length||facs.some(f=>(f||'').toLowerCase()===ALL))who=every;
    else{
      const s=new Set();
      facs.forEach(f=>{
        if(cultures.has(f))every.forEach(k=>{if(fc[k]===f)s.add(k);});
        else s.add(f);
      });
      who=[...s];
    }
    who.forEach(f=>{most[f]=(most[f]||0)+1; if(!gated)always[f]=(always[f]||0)+1;});
  });
  const rows=Object.keys(most)
    .filter(f=>most[f]>limit||(always[f]||0)>limit)
    .map(f=>({faction:f,most:most[f],always:always[f]||0}));
  rows.sort((a,b)=>b.always-a.always||b.most-a.most||a.faction.localeCompare(b.faction));
  return {limit,rows};
}
function bldPressureHtml(lv){
  const p=bldRecruitPressure(lv);
  if(!p.rows.length)return '';
  const hard=p.rows.filter(r=>r.always>p.limit);
  const rows=p.rows.slice(0,10).map(r=>`<div class="prow2 ${r.always>p.limit?'bad':''}">
      <span class="pf">${esc(bldFacLabel(r.faction))}</span>
      <span class="pn">${r.most}</span>
      <span class="pd">${r.always>p.limit
        ? `<b>${r.always}</b> of them with no condition at all`
        : `${r.always} unconditional · the rest need every gate to line up`}</span>
    </div>`).join('');
  return `<div class="ownwarn ${hard.length?'bad':''}" style="margin:0 0 8px">
    <b>${hard.length?'Over the recruitment limit.':'Could go over the recruitment limit.'}</b>
    M2TW shows at most <b>${p.limit}</b> units per building in a settlement's
    recruitment panel; past that the panel overflows and the game can crash on
    opening it.
    ${hard.length?'':`These counts assume every event counter, hidden resource and
      settlement condition holds <i>at the same time</i> — an upper bound, so it may
      never actually happen. The unconditional count is the one that always does.`}
    <div class="plist">${rows}</div>
    ${p.rows.length>10?`<div class="count">…and ${p.rows.length-10} more faction(s).</div>`:''}
  </div>`;
}
function bldRequiresHelp(){

async function bldSetCulture(c){

/* ---- which recruit pools are shown ----
   A big level trains hundreds of units, almost all of them gated to one faction,
   so "who can train what here" is the question you actually arrive with. */
function bldPoolMatches(c){
  const sel=state.bld.poolFac;
  if(!sel||!sel.size)return true;
  const facs=(c.conds||[]).filter(x=>x.kind==='factions'&&!x.negate)
    .flatMap(x=>x.values||[]);
  if(!facs.length)return sel.has('(any)');      // no clause = anyone can train it
  const all=(bldVocab().all_keyword)||'all';
  if(facs.includes(all))return true;
  return facs.some(f=>sel.has(f));
}
function bldPoolFilterHtml(pools){
  const sel=state.bld.poolFac||new Set();
  const counts=new Map();
  let open=0;
  const all=(bldVocab().all_keyword)||'all';
  pools.forEach(c=>{
    const facs=(c.conds||[]).filter(x=>x.kind==='factions'&&!x.negate)
      .flatMap(x=>x.values||[]);
    if(!facs.length){open++;return;}
    new Set(facs).forEach(f=>counts.set(f,(counts.get(f)||0)+1));
  });
  const rows=[...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  if(!rows.length&&!open)return '';
  return qm('Narrow the list below to the units one faction can actually train here. '
      +'A big level trains hundreds, almost all of them gated to one faction, so '
      +'"who can train what" is usually the question you arrive with.','Faction filter')
    +`<select class="mini" onchange="bldPoolFacPick(this.value);this.value=''"
      style="flex:0 0 auto;max-width:230px">
      <option value="">Faction: ${sel.size?[...sel].map(f=>f==='(any)'?'anyone':bldFacName(f)).join(', ')
        .slice(0,40):'any'}…</option>
      ${sel.size?'<option value="(clear)">— show everything —</option>':''}
      ${open?`<option value="(any)">no faction clause (${open})</option>`:''}
      ${rows.map(([f,n])=>`<option value="${esc(f)}">${esc(bldFacName(f))} — ${n}</option>`).join('')}
    </select>`;
}

/* =========================================================================
   Bulk edit over recruit pools

   Nothing here is a new kind of edit — every one of these actions is something
   the single-row buttons already do. What it changes is the arithmetic: giving
   twenty freshly added units the same `requires factions { … }` was twenty trips
   through the clause dialog, and the twentieth was where the typo went in.

   The selection holds the capability OBJECTS, not their indices. Indices into
   bldCapList() shift the moment a row is added or a new row is dropped, and a
   selection that silently slides onto its neighbours is worse than none.
   ========================================================================= */
const bldBulk=()=>(state.bld.bulk||(state.bld.bulk={on:false,sel:new Set()}));
const bldBulkOn=()=>!!(state.bld&&state.bld.bulk&&state.bld.bulk.on);
const bldBulkHas=c=>bldBulkOn()&&bldBulk().sel.has(c);
// Only rows still in the level count — a new row that was dropped again is gone
// from lv.caps but may still be sitting in the Set.
function bldBulkSel(){
  const sel=bldBulk().sel;
  return bldCapList().filter(c=>c.pool&&sel.has(c));
}
function bldBulkToggle(){
  const bu=bldBulk(); bu.on=!bu.on;
  if(!bu.on)bu.sel.clear();
  bldRenderBodyNow();
}
function bldPickBox(c,i){
  if(!bldBulkOn())return '';
  return `<label class="pick" title="Tick this pool for the bulk actions above"><input type="checkbox"
    ${bldBulkHas(c)?'checked':''} onchange="bldBulkPick(${i},this.checked)"></label>`;
}
function bldBulkPick(i,on){
  const c=bldCapList()[i]; if(!c)return;
  on?bldBulk().sel.add(c):bldBulk().sel.delete(c);
  bldRenderBodyNow();
}
function bldBulkAll(on){
  const bu=bldBulk(),lv=state.bld.work.levels[state.bld.lvl];
  // "all" means all the filter is showing, not all three hundred the level has
  const shown=[...lv.caps,...lv.fcaps].filter(c=>c.pool&&bldPoolMatches(c));
  shown.forEach(c=>on?bu.sel.add(c):bu.sel.delete(c));
  if(!on)bu.sel.clear();
  bldRenderBodyNow();
}
const bldRenderBodyNow=()=>bldRenderBody(state.bld.work.levels[state.bld.lvl],
                                         state.bld.d.levels[state.bld.lvl]);
/* ---- carrying one row's clause to the others ----
   The clipboard lives on `state`, not on the building, so a clause copied out of
   the town watch can be pasted into the barracks — which is most of why anyone
   would copy one at all. It holds a deep copy: pasting must not hand every row a
   reference to the same terms, or editing one afterwards edits all of them. */
function bldCopyBtn(i){
  return `<button class="reqbtn" onclick="bldCopyCond(${i})"
    title="Copy these requirements — tick other units under ☑ Bulk edit and paste them on">⧉</button>`;
}
function bldCopyCond(i){
  const c=bldCapList()[i]; if(!c)return;
  const name=(c.pool&&c.pool.unit)||c.keyword||'that row';
  state.condClip={unit:name,conds:JSON.parse(JSON.stringify(c.conds||[])),
                  text:bldClauseText(c.conds)};
  const bu=bldBulk();
  if(!bu.on){bu.on=true;}                     // there is nowhere to paste it otherwise
  bldRenderBodyNow();
  toast(`Copied ${name}’s requirements${state.condClip.text?': '+state.condClip.text:' (none — always)'
    } — tick the units to paste onto.`,4200);

/* Put a clause onto one row. `replace` swaps it outright; `add` joins the new
   terms onto what is already there. M2TW evaluates a clause left to right with
   no brackets, so "add" really is a concatenation — the incoming terms are
   ANDed onto the end, and a term the row already carries is skipped rather than
   written twice. */
function bldCondsOnto(host,conds,mode){
  const incoming=JSON.parse(JSON.stringify(conds||[]));
  const base=mode==='add'?JSON.parse(JSON.stringify(host.conds||[])):[];
  const seen=new Set(base.map(c=>bldCondText(c)));
  const keep=incoming.filter(c=>{
    const t=bldCondText(c);
    if(mode==='add'&&seen.has(t))return false;
    seen.add(t); return true;
  });
  keep.forEach(c=>{ if(!c.join)c.join='and'; });
  const out=base.concat(keep);
  if(out.length)out[0].join='';
  host.conds=out; host.condEdited=true; host.requires=bldClauseText(out);
  return out;
}
function bldBulkPaste(){
  const sel=bldBulkSel(),clip=state.condClip;
  if(!clip||!sel.length)return;
  const mode=bldPasteMode();
  sel.forEach(h=>bldCondsOnto(h,clip.conds,mode));
  bldTouched();
  toast(`${clip.unit}’s requirements ${mode==='add'?'added to':'copied onto'} ${
    sel.length} unit${sel.length===1?'':'s'}.`);
}
const bldPasteMode=()=>(state.bld.pasteMode==='add'?'add':'replace');
function bldSetPasteMode(v){ state.bld.pasteMode=v; }
function bldBulkDelete(){
  const b=state.bld,sel=bldBulkSel(); if(!sel.length)return;

      const i=from.indexOf(c); if(i>=0)from.splice(i,1); }
    bldBulk().sel.delete(c);

// Only the boxes you actually filled in are written — a blank one leaves that
