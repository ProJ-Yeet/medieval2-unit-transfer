  .chips.ug{margin-top:10px;row-gap:10px}
  .chipd.ug{position:relative;padding-right:9px}
  .chipd .xup{position:absolute;top:-8px;right:-7px;width:16px;height:16px;padding:0;
    border-radius:50%;background:var(--panel2);border:1px solid var(--edge);color:var(--dim);
    font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .chipd .xup:hover{background:var(--bad);border-color:var(--bad);color:#fff}
  .ugadd{font-size:15px;line-height:1;padding:1px 9px 3px;font-weight:700}
  .ugadd.on{border-color:var(--accent);color:var(--accent)}
  /* the ＋ menu: four ways to add a tier, then that mode's body */
  .ugpanel{border:1px solid var(--accent);border-radius:8px;background:var(--panel2);
    padding:9px 11px 11px;margin-top:9px}
  .ugmodes{display:flex;gap:6px;flex-wrap:wrap}
  .ugmodes button{padding:4px 9px;font-size:11.5px;text-align:left}
  .ugmodes button.on{border-color:var(--accent);color:var(--accent)}
  .ugbody{margin-top:10px}
  .uglist{max-height:230px;overflow:auto;border:1px solid var(--edge);border-radius:6px;
    background:var(--panel);margin-top:7px}
  .ugrow{display:flex;gap:8px;align-items:center;padding:4px 9px;border-bottom:1px solid var(--edge);
    font-size:12.5px;cursor:pointer}
  .ugrow:last-child{border-bottom:none}
  .ugrow:hover{background:var(--panel2)}
  .ugrow .nm{font-family:ui-monospace,Consolas,monospace;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ugrow.have{opacity:.55;cursor:default}
  .ugrow.have:hover{background:none}
  /* ---- bmdb mode: the whole modeldb as a list ---- */
  .dblist{border:1px solid var(--edge);border-radius:8px;background:var(--panel);margin-top:12px}
  .dbrow{display:flex;gap:10px;align-items:center;padding:6px 11px;border-bottom:1px solid var(--edge);
    cursor:pointer;font-size:13px}
  .dbrow:last-child{border-bottom:none}
  .dbrow:hover{background:var(--panel2)}
  .dbrow .en{font-family:ui-monospace,Consolas,monospace;font-weight:600;flex:0 0 300px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dbrow .use{flex:1;min-width:0;color:var(--dim);font-size:12px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dbrow .nums{flex:0 0 auto;color:var(--dim);font-size:11px}
  .dbrow.unused .en{color:var(--warn)}
  .dbhead{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .dbhead h2{margin:0;font-size:15px;color:var(--accent)}
  /* ---- cleanup dialog ---- */
  .clsec{border:1px solid var(--edge);border-radius:8px;margin-bottom:12px;background:var(--panel2)}
  .clsec>.h{display:flex;gap:9px;align-items:center;padding:9px 11px;cursor:pointer}
  .clsec>.h b{flex:0 0 auto} .clsec>.h .count{flex:1;min-width:0}
  .clsec>.b{padding:0 11px 11px;border-top:1px solid var(--edge)}
  .clsec.off{opacity:.55}
  .cllist{max-height:260px;overflow:auto;border:1px solid var(--edge);border-radius:6px;
    background:var(--panel);margin-top:7px}
  .clrow{display:flex;gap:8px;align-items:flex-start;padding:5px 9px;border-bottom:1px solid var(--edge);
    font-size:12.5px}
  .clrow:last-child{border-bottom:none}
  .clrow input[type=checkbox]{margin-top:3px;flex:0 0 auto}
  .clrow .nm{font-family:ui-monospace,Consolas,monospace;font-weight:600}
  .clrow .sub{color:var(--dim);font-size:11.5px;margin-top:2px;overflow-wrap:anywhere}
  .clrow .grow{flex:1;min-width:0}
  .clrow.risky{background:#2a2410}
  .clrow select{font-size:11.5px;padding:2px 5px;max-width:230px}
  .clbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}
  .clbar button{padding:3px 9px;font-size:11.5px}
  .cltarget{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-top:6px}
  .cltarget input{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .treebox{font:11.5px/1.5 ui-monospace,Consolas,monospace;color:var(--dim);background:var(--panel);
    border:1px solid var(--edge);border-radius:6px;padding:8px 10px;margin-top:7px;overflow-x:auto}
  /* ---- Sounds mode: the unit voice bank ---- */
  /* ---- sprites mode ---- */
  .sprstep{border:1px solid var(--edge);border-radius:8px;background:var(--panel);margin-top:10px}
  .sprstep>h3{margin:0;padding:8px 12px;font-size:13px;background:var(--panel2);
    border-bottom:1px solid var(--edge);border-radius:8px 8px 0 0;display:flex;gap:8px;align-items:center}
  .sprstep>h3 .n{width:19px;height:19px;border-radius:50%;background:var(--accent);color:var(--bg);
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto}
  .sprstep>h3 .grow{flex:1}
  .sprbody{padding:10px 12px;display:flex;flex-direction:column;gap:9px}
  .sprrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sprrow select,.sprrow input[type=search]{padding:4px 7px;font-size:12px}
  .sprpick{max-height:230px;overflow:auto;border:1px solid var(--edge);border-radius:6px;
    background:var(--panel2)}
  .sprpick label{display:flex;gap:8px;align-items:center;padding:4px 9px;font-size:12px;
    border-bottom:1px solid var(--edge);cursor:pointer}
  .sprpick label:last-child{border-bottom:none}
  .sprpick label:hover{background:var(--panel)}
  .sprpick .fac{color:var(--dim);font-size:11px;margin-left:auto}
  .sprlua{width:100%;min-height:66px;font-family:ui-monospace,Consolas,monospace;font-size:12px;
    padding:7px 9px;border-radius:6px;border:1px solid var(--edge);background:var(--panel2);
    color:var(--fg);resize:vertical}
  .sprtag{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--edge)}
  .sprtag.on{border-color:var(--bad);color:var(--bad)}
  .sprtag.off{border-color:var(--good);color:var(--good)}
  .sprlist{border:1px solid var(--edge);border-radius:6px;background:var(--panel2);max-height:220px;
    overflow:auto}
  .sprlist .r{display:grid;grid-template-columns:1fr 120px 90px;gap:8px;padding:4px 10px;
    font-size:12px;border-bottom:1px solid var(--edge)}
  .sprlist .r:last-child{border-bottom:none}
  .sprlist .r.hrow{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .sprnote{font-size:11.5px;color:var(--dim);line-height:1.5}
  .sprhead{position:sticky;top:0;background:var(--bg);padding:10px 0 6px;z-index:2;
    border-bottom:1px solid var(--edge)}
  .sprhead h2{margin:0 0 3px;font-size:15px;color:var(--accent)}
  .sndhead{position:sticky;top:0;background:var(--bg);padding:10px 0 6px;z-index:2;
    border-bottom:1px solid var(--edge)}
  .sndhead h2{margin:0 0 3px;font-size:15px;color:var(--accent)}
  .sndtabs{display:flex;gap:6px;margin:10px 0 0}
  .sndbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:8px 10px;
    background:var(--panel);border:1px solid var(--edge);border-radius:8px}
  .sndbar select,.sndbar input{padding:4px 7px;font-size:12px}
  .sndbar .grow{flex:1;min-width:120px}
  .sndlist{border:1px solid var(--edge);border-radius:8px;background:var(--panel);margin-top:10px}
  /* The unit column had 1.5fr and squeezed "In game now" into 88px, which cut off
     the one thing the row is telling you ("English — generic", "Gondor/General ✗").
     Half the width is plenty for a name over its type, and the freed space goes
     where the text actually is. */
  .sndrow{display:grid;grid-template-columns:minmax(120px,.8fr) minmax(150px,.6fr) 130px 100px minmax(180px,1.6fr) 46px;
    gap:8px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--edge)}
  .sndrow:last-child{border-bottom:none}
  .sndrow.hrow{background:var(--panel2);color:var(--dim);font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;position:sticky;top:0;border-radius:8px 8px 0 0}
  .sndrow.staged{background:rgba(92,201,138,.08);box-shadow:inset 3px 0 0 var(--good)}
  .sndrow.dropping{background:rgba(224,108,108,.08);box-shadow:inset 3px 0 0 var(--bad)}
  .sndrow select{width:100%;padding:3px 6px;font-size:12px;min-width:0}
  .sndrow select:disabled{opacity:.55}
  .sndrow .un{min-width:0}
  .sndrow .un .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sndrow .un .ty{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sndrow .now{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sndrow .rm{display:flex;justify-content:center}
  /* ---- composer: the voice fieldset ---- */
  .sndopt{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
  .sndpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .sndpick select{flex:0 0 auto;max-width:210px}
  .sndpick .lockicon{color:var(--warn);cursor:help}
  .sndlocked{border:1px dashed var(--warn);border-radius:6px;padding:6px 8px;margin-top:6px}
  .sndlist.mini{max-height:190px;overflow:auto;margin-top:6px}

  /* ================= guided field editor ==================================
     The default view of a unit's EDU lines: every comma-separated slot gets its
     own labelled box, a drop-down where the engine only accepts a fixed set, and
     a one-line explanation of what it does. `.gfraw` is the escape hatch — the
     whole line as text, exactly what the raw view shows. */
  .allfields.guided{max-height:none;overflow:visible;border:none;padding:0;background:none}
  .gfmode{display:inline-flex;border:1px solid var(--edge);border-radius:6px;overflow:hidden}
  .gfmode button{border:none;border-radius:0;padding:3px 9px;font-size:11.5px;background:var(--panel2);
    color:var(--dim)}
  .gfmode button+button{border-left:1px solid var(--edge)}
  .gfmode button.on{background:var(--accent2);color:#fff}
  .gfnav{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 2px;position:sticky;top:0;z-index:2;
    background:var(--panel);padding-bottom:6px}
  .gfnav button{padding:4px 10px;font-size:12px;border-radius:14px}
  .gfnav button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .gfnav button .n{opacity:.65;font-size:10.5px;margin-left:4px}
  .gfnav button .bad{color:var(--warn);margin-left:4px}
  .gfbody{max-height:min(58vh,620px);overflow:auto;border:1px solid var(--edge);border-radius:8px;
    padding:10px;background:var(--panel2)}
  .gfintro{font-size:12px;color:var(--dim);margin:0 0 10px;line-height:1.5}
  .gfcard{border:1px solid var(--edge);border-radius:8px;background:var(--panel);padding:9px 11px 11px;
    margin-bottom:9px}
  .gfcard.changed{border-color:var(--accent)}
  .gfcard.gone{opacity:.55}
  .gfcard.gone .gfhead .t{text-decoration:line-through}
  .gfhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .gfhead .t{font-size:13px;font-weight:600}
  .gfhead .k{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
  .gfhead .sp{flex:1}
  .gfhead button{background:none;border:1px solid transparent;color:var(--dim);padding:1px 6px;
    font-size:12px;border-radius:5px;line-height:1.5}
  .gfhead button:hover{border-color:var(--accent);color:var(--ink)}
  .gfhead button.on{border-color:var(--accent2);color:var(--accent2)}
  .gfhead .rm:hover{border-color:var(--bad);color:var(--bad)}
  .gfdoc{font-size:11.5px;color:var(--dim);margin:5px 0 0;line-height:1.5}
  .gfdoc code{background:var(--panel2);padding:0 3px;border-radius:3px}
  .gfgrid{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:8px}
  .gfpart{display:flex;flex-direction:column;gap:3px;min-width:0}
  .gfpart>.pl{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gfpart input,.gfpart select{padding:4px 7px;font-size:12.5px}
  .gfpart input.gfnum{width:78px;text-align:right;font-variant-numeric:tabular-nums}
  .gfpart.w2 input,.gfpart.w2 select{width:150px}
  .gfpart.w3 input,.gfpart.w3 select{width:210px}
  .gfpart.grow{flex:1;min-width:190px}
  .gfpart.grow input,.gfpart.grow select{width:100%}
  /* only the PART you changed lights up, not all thirteen numbers of a stat line */
  .gfpart input.changed,.gfpart select.changed{border-color:var(--accent);background:#241f0d}
  .gfpart.changed>.pl{color:var(--accent)}
  .gfpart .chk input.changed{outline:1px solid var(--accent);outline-offset:2px}
  .gfpart .sub{font-size:10.5px;color:var(--dim)}
  .gfrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:7px}
  .gfraw{display:flex;gap:6px;align-items:center;margin-top:8px}
  .gfraw input{flex:1;min-width:0;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;padding:4px 7px}
  .gfraw .pl{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
  .gfnote{font-size:11.5px;margin-top:7px;padding:5px 8px;border-radius:6px;border:1px solid var(--edge);
    background:var(--panel2);color:var(--dim)}
  .gfnote.warn{border-color:var(--warn);color:var(--warn)}
  .gfnote.bad{border-color:var(--bad);color:var(--bad)}
  .gfnote.good{border-color:var(--good);color:var(--good)}
  .gfnote.info{border-style:dashed}
  .gfnote b{color:var(--ink)}
  .gfmissing{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;
    border-top:1px dashed var(--edge);padding-top:9px}
  .gfmissing select{max-width:230px}
  .gfempty{color:var(--dim);font-size:12.5px;padding:14px 4px}
  .gfsum{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
  .gfsum .pill{border:1px solid var(--edge);border-radius:12px;padding:1px 9px;font-size:11.5px;
    color:var(--dim);background:var(--panel)}
  .gfsum .pill.warn{border-color:var(--warn);color:var(--warn);cursor:pointer}
  .gfoff{display:flex;gap:4px;align-items:center}
  .gfoff .idx{font-size:10.5px;color:var(--dim);width:14px;text-align:right}
  /* number box + its own ▴▾ (see gfSpin: not <input type=number>, which refuses
     the decimals, negatives and blanks the EDU is full of) */
  .gfspin{display:inline-flex;align-items:stretch}
  .gfspin input.gfnum{border-top-right-radius:0;border-bottom-right-radius:0;border-right:none}
  .gfsp{display:flex;flex-direction:column;width:17px;flex:0 0 17px}
  .gfsp button{flex:1;padding:0;margin:0;width:17px;min-height:0;font-size:8px;line-height:1;
    border:1px solid var(--edge);border-radius:0;background:var(--panel);color:var(--dim);
    display:flex;align-items:center;justify-content:center}
  .gfsp button:first-child{border-top-right-radius:6px;border-bottom:none}
  .gfsp button:last-child{border-bottom-right-radius:6px}
  .gfsp button:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .gfsp button:active{background:var(--accent);border-color:var(--accent);color:#1a1a1a}
  .gfpart.grow .gfspin,.gfpart.w2 .gfspin,.gfpart.w3 .gfspin{width:100%}
  .gfpart .gfspin input.gfnum{width:78px}
  /* the hover card: what a field or one of its values does */
  .gftip{position:fixed;z-index:60;display:none;max-width:390px;background:var(--panel);
    border:1px solid var(--accent2);border-radius:8px;padding:9px 11px;
    box-shadow:0 10px 30px #000a;pointer-events:none}
  .gftip .tt{font-size:12.5px;font-weight:600;color:var(--ink)}
  .gftip .topt{font-weight:400;color:var(--dim);font-size:11px}
  .gftip .tk{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:var(--accent);
    margin:2px 0 5px;overflow-wrap:anywhere}
  .gftip .tb{font-size:12px;line-height:1.5;color:var(--dim)}
  .gftip .tb b{color:var(--ink)}
  .gftip .tb code,.gftip .tf code{background:var(--panel2);padding:0 3px;border-radius:3px;color:var(--ink)}
  .gftip .tf{font-size:11px;color:var(--dim);margin-top:6px;padding-top:5px;
    border-top:1px solid var(--edge)}
  /* ---- the ? that carries a field's explanation ----
     Small, quiet, and at the field's top-left so it reads before the field does.
     It is a marker, not a button: it never takes an action, it only explains. */
  .qm{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:13px;height:13px;margin-right:5px;border-radius:50%;cursor:help;
    border:1px solid var(--edge);background:var(--panel2);color:var(--dim);
    font-size:9px;font-weight:700;line-height:1;vertical-align:1px;user-select:none;
    font-family:system-ui,sans-serif;letter-spacing:0;text-transform:none}
  .qm:hover,.qm:focus{border-color:var(--accent);color:var(--accent);
    background:var(--panel);outline:none}
  /* "⚠ unsaved changes" — a state to act on, not another grey line to read past */
  .dirtychip{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
    font-size:11.5px;font-weight:600;color:var(--warn);border:1px solid var(--warn);
    background:#2a2410;border-radius:5px;padding:2px 9px;white-space:nowrap}
  /* in a tight row the marker sits alone on the left of the field's label */
  .brow>.qm,.gfrow>.qm{margin-right:2px}
  .prow>.qm{justify-self:start}
  /* ---- Buildings mode: export_descr_buildings.txt ---- */
  /* Building art is landscape (78x62 small, 300x245 constructed), so these cards
     are wider and shorter than a unit card rather than reusing .card's portrait. */
  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:9px}
  .bcard{background:var(--panel);border:1px solid var(--edge);border-radius:8px;overflow:hidden;
    cursor:pointer;transition:border-color .1s;display:flex;flex-direction:column}
  .bcard:hover{border-color:var(--accent2)}
  .bcard .art{position:relative;background:#0d0f13;aspect-ratio:300/245;display:block}
  .bcard .art img{width:100%;height:100%;object-fit:contain;display:block}
  .bcard .art .src{position:absolute;top:5px;right:5px;font-size:9px;padding:1px 5px;border-radius:4px;
    background:#000a;border:1px solid var(--edge);color:var(--dim)}
  .bcard .art .src.vanilla{color:var(--accent2);border-color:var(--accent2)}
  .bcard .art .src.placeholder{color:var(--dim)}
  /* Fixed heights, for the same reason as .ucard: a building's name changes with
     the culture on show ("Stables" / "Warg Breeder"), and the tags below it must
     not move when it does. */
  .bcard .bmeta{padding:7px 9px;border-top:1px solid var(--edge)}
  .bcard .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;line-height:1.35;height:1.35em}
  .bcard .sub{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;line-height:1.35;height:1.35em}
  .bcard .tags{margin-top:4px}
  /* level strip in the editor: one chip per building in the line, in upgrade order */
  .lvstrip{display:flex;gap:6px;overflow:auto;padding:10px 16px;border-bottom:1px solid var(--edge);
    background:var(--panel2)}
  .lvchip{flex:0 0 auto;width:104px;border:1px solid var(--edge);border-radius:8px;background:var(--panel);
    padding:5px;cursor:pointer;text-align:center}
  .lvchip.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .lvchip.dirty{border-color:var(--warn)}
  .lvchip img{width:100%;aspect-ratio:78/62;object-fit:contain;background:#0d0f13;border-radius:4px;display:block}
  .lvchip .t{font-size:10.5px;margin-top:3px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;line-height:1.3;height:1.3em}
  .lvchip .n{font-size:9px;color:var(--dim)}
  .bart{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .bart figure{margin:0;text-align:center}
  .bart img{background:#0d0f13;border:1px solid var(--edge);border-radius:6px;display:block;object-fit:contain}
  .bart .small img{width:104px;height:83px}
  .bart .large img{width:260px;height:212px}
  .bart figcaption{font-size:10px;color:var(--dim);margin-top:4px}
  /* ---- number boxes with ▲▼ ----
     Every number in this screen is one a modder nudges rather than retypes — a
     cost, a build time, a recruit rate — so each gets a stepper. The buttons are
     sized to be hit repeatedly, not to be decorative. */
  .numwrap{display:flex;align-items:center;gap:3px;min-width:0;flex:1}
  .numwrap>input{min-width:0;flex:1}
  .spin{display:flex;flex-direction:column;flex:0 0 auto;gap:1px}
  .spin button{padding:0;width:22px;height:15px;font-size:9px;line-height:1;border-radius:4px;
    display:flex;align-items:center;justify-content:center;color:var(--dim)}
  .spin button:hover{color:var(--accent);border-color:var(--accent)}
  .spin button:active{background:var(--accent2);color:#fff}
  /* "= 15 turns": what a recruit rate of 0.066667 actually means */
  .turns{flex:0 0 auto;font-size:10.5px;color:var(--dim);white-space:nowrap;
    text-transform:none;letter-spacing:0}
  /* stat + capability rows */
  .brow{display:flex;gap:8px;align-items:center;margin:5px 0}
  .brow>.k{flex:0 0 128px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);text-align:right}
  .brow input,.brow select{flex:1;min-width:0;padding:4px 7px;font-size:12.5px}
  /* One amber for every box in this screen, not just the ones in a .brow — a
     recruit pool's numbers and a capability's value are the values you actually
     come here to change, and they were the two that never lit up. */
  #bldBody input.changed,#bldBody select.changed,#bldBody textarea.changed{
    border-color:var(--accent);background:#241f0d;color:var(--ink)}
  #bldBody .chk input[type=checkbox].changed{outline:1px solid var(--accent);outline-offset:2px}
  /* …and a mark on the row itself, so an edit is findable in a list of 300 */
  #bldBody .poolrow.changed,#bldBody .caprow.changed{
    box-shadow:inset 3px 0 0 var(--accent);background:#221f16}
  #bldBody .ucard.changed{border-color:var(--accent)}
  .brow .mini{flex:0 0 auto;padding:3px 7px;font-size:11.5px}
  .caplist,.poollist{border:1px solid var(--edge);border-radius:7px;background:var(--panel2);
    max-height:340px;overflow:auto}
  .caprow{display:flex;gap:6px;align-items:center;padding:5px 7px;border-bottom:1px solid var(--edge)}
  .caprow:last-child{border-bottom:none}
  .caprow.gone{opacity:.4;text-decoration:line-through}
  .caprow select.kw{flex:0 0 190px;font-size:12px;padding:3px 6px}
  .caprow input{padding:3px 6px;font-size:12px;min-width:0}
  .caprow input.val{flex:0 0 70px} .caprow input.req{flex:1}
  .caprow .numwrap{flex:0 0 auto}
  .caprow .x{flex:0 0 auto;padding:2px 7px;font-size:12px}
  /* a recruit pool: unit card, the four pool numbers, its requires clause */
  .poolrow{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--edge)}
  .poolrow:last-child{border-bottom:none}
  .poolrow.gone{opacity:.4}
  .poolrow img{width:34px;height:45px;object-fit:contain;background:#0d0f13;border-radius:4px;flex:0 0 34px}
  .poolrow .who{flex:0 0 175px;min-width:0}
  .poolrow .who .un{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .poolrow .who .ut{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .poolrow .nums{display:flex;gap:6px;flex:0 0 auto}
  .poolrow .nums label{display:flex;flex-direction:column;font-size:9px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.4px}
  .poolrow .nums input{width:62px;padding:3px 5px;font-size:12px}
  .poolrow .nums .numwrap{margin-top:2px;flex:0 0 auto}
  .poolrow .req{flex:1;min-width:80px;padding:3px 6px;font-size:11.5px;
    font-family:ui-monospace,Consolas,monospace}
  .poolrow .acts{display:flex;gap:4px;flex:0 0 auto}
  .poolrow .acts button{padding:3px 7px;font-size:11.5px}
  .poolrow.missing .who .un{color:var(--bad)}
  .bsec{margin-bottom:14px}
  .bsec>h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);
    display:flex;align-items:center;gap:8px}
  .bsec>h4 .n{color:var(--accent);font-weight:600}
  .bsec>h4 button{margin-left:auto;padding:3px 8px;font-size:11.5px}
  .bnote{font-size:11.5px;color:var(--dim);margin:4px 0 0}
  /* ---- requires clauses ---- */
  .clausebar{display:flex;gap:8px;align-items:center;min-width:0}
  .clausebar .sum{background:none;border:none;padding:0;max-height:none;overflow:visible;
    font-size:12px;flex:1;min-width:0}
  .cj{color:var(--accent);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
  .cterm{background:var(--panel2);border:1px solid var(--edge);border-radius:5px;
    padding:1px 6px;font-size:11.5px;display:inline-block;margin:1px 0}
  .cterm.neg{border-color:var(--bad);color:var(--bad)}
  .reqbtn{padding:3px 8px;font-size:11.5px;flex:0 0 auto}
  .condlist{border:1px solid var(--edge);border-radius:7px;background:var(--panel2)}
  .condrow{display:flex;gap:7px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--edge)}
  .condrow:last-child{border-bottom:none}
  .condrow .cjoin{flex:0 0 62px;font-size:11.5px;padding:3px 5px}
  .condrow .cjoin.lead{color:var(--accent);text-transform:uppercase;font-size:10.5px;
    letter-spacing:.5px;text-align:center}
  .condrow .ckind{flex:0 0 160px;font-size:11.5px;color:var(--dim);cursor:help}
  .condrow input,.condrow select{padding:3px 6px;font-size:12px;min-width:0}
  .condrow .x{flex:0 0 auto;padding:2px 7px}
  /* "📍 8 settlements" — hover it for the list out of descr_regions.txt */
  .where{position:relative;flex:0 0 auto;font-size:11px;color:var(--accent2);cursor:help;
    border:1px solid var(--edge);border-radius:5px;padding:2px 7px;white-space:nowrap}
  .where.none{color:var(--bad);border-color:var(--bad)}
  .where .wpop{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:30;
    min-width:250px;max-width:390px;max-height:280px;overflow:auto;
    background:var(--panel);border:1px solid var(--accent2);border-radius:7px;
    padding:7px 9px;box-shadow:0 8px 26px #000b;white-space:normal;cursor:auto}
  .where:hover .wpop{display:block}
  .where .whead{font-size:10.5px;color:var(--dim);margin-bottom:5px;
    border-bottom:1px solid var(--edge);padding-bottom:4px}
  .where .wrow{display:flex;gap:7px;align-items:baseline;padding:2px 0;font-size:11.5px}
  .where .wrow b{color:var(--ink);flex:0 0 auto}
  .where .wrow span{color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .where .wrow i{color:var(--accent2);font-style:normal;font-size:10.5px;flex:0 0 auto}
  .facbtn{flex:1;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:3px 8px;font-size:12px}
  .fgh{margin:12px 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
  .faclist{max-height:210px;overflow:auto;border:1px solid var(--edge);border-radius:7px;
    background:var(--panel2);padding:3px}
  /* The NAME is what you are looking for, so it gets the whole row. The code and
     culture behind it — the bit you need once, to check you ticked the right
     "Mordor" — appear over the row on hover instead of squeezing the name into
     an ellipsis. Positioned, so revealing one moves nothing. */
  .facrow{display:flex;gap:8px;align-items:center;padding:3px 7px;border-radius:5px;
    cursor:pointer;position:relative}
  .facrow:hover{background:#2a3340}
  .facrow.on{background:#2b3446}
  .facrow .fn{flex:1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .facrow .fc{position:absolute;left:26px;top:calc(100% - 2px);z-index:6;display:none;
    font-size:10.5px;color:var(--dim);font-family:ui-monospace,Consolas,monospace;
    background:var(--panel);border:1px solid var(--edge);border-radius:5px;
    padding:2px 7px;white-space:nowrap;box-shadow:0 4px 12px #0008}
  .facrow:hover .fc,.facrow:focus-within .fc{display:block}
  .facrow.allrow{border:1px solid var(--accent);margin-bottom:4px}
  .facrow.allrow .fc{position:static;display:block;background:none;border:none;
    box-shadow:none;padding:0;white-space:normal}
  /* a faction ticked or unticked since the dialog opened */
  .facrow.edited{background:#241f0d;box-shadow:0 0 0 1px var(--accent) inset}
  .facrow.edited:hover{background:#2e2712}
  .ownwarn{margin-top:10px;border:1px solid var(--warn);background:#2a2410;border-radius:7px;
    padding:8px 10px;font-size:12px;line-height:1.45}
  .ownwarn.ok{border-color:var(--good);background:#12281c;color:var(--dim)}
  .ownwarn.bad{border-color:var(--bad);background:#2a1414}
  .ownwarn code{color:var(--accent)}
  /* the per-faction breakdown under the recruitment-limit warning */
  .plist{margin-top:7px;max-height:150px;overflow:auto}
  .prow2{display:flex;gap:9px;align-items:baseline;padding:2px 0;font-size:11.5px}
  .prow2 .pf{flex:0 0 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow2 .pn{flex:0 0 38px;text-align:right;font-weight:600;color:var(--warn)}
  .prow2.bad .pn{color:var(--bad)}
  .prow2 .pd{flex:1;min-width:0;color:var(--dim)}
  .poolrow .ownflag{flex:0 0 auto;color:var(--warn);cursor:help;font-size:13px}
  /* ---- recruitment as a card grid ---- */
  .ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:7px}
  .ucard{background:var(--panel2);border:1px solid var(--edge);border-radius:7px;padding:7px;
    display:flex;flex-direction:column;gap:5px}
  .ucard.gone{opacity:.4}
  /* The name block is a FIXED height. Names run from "Archers" to "Dunedain
     Rangers of the North", and letting it grow to fit put the stat boxes at a
     different height in every card — and moved them again whenever the culture
     picker changed the names. Two lines, clamped, always. */
  .ucard .top{display:flex;gap:7px;align-items:flex-start;height:50px}
  .ucard img{width:38px;height:50px;object-fit:contain;background:#0d0f13;border-radius:4px;flex:0 0 38px}
  .ucard .nm{font-size:12.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    height:2.5em}
  .ucard .ty{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  /* two columns, not four: each box now carries a stepper beside it */
  .ucard .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:3px 6px}
  .ucard .stats label{display:flex;flex-direction:column;font-size:8.5px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.3px;min-width:0}
  .ucard .stats input{width:100%;padding:2px 4px;font-size:11.5px;text-align:center}
  .ucard .stats .numwrap{margin-top:2px}
  .ucard .acts{display:flex;gap:4px}
  .ucard .acts button{padding:2px 6px;font-size:11px;flex:1}
  .viewtoggle{display:inline-flex;border:1px solid var(--edge);border-radius:6px;overflow:hidden}
  .viewtoggle button{border:none;border-radius:0;padding:3px 9px;font-size:11.5px;background:var(--panel2)}
  .viewtoggle button+button{border-left:1px solid var(--edge)}
  .viewtoggle button.on{background:var(--accent2);color:#fff}
  /* ---- the upgrade graph ---- */
  .pathwrap{overflow-x:auto;border:1px solid var(--edge);border-radius:7px;background:var(--panel2);padding:10px}
  .prow{display:flex;gap:8px;align-items:center;margin:3px 0;white-space:nowrap}
  .pnode{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--edge);border-radius:7px;
    background:var(--panel);padding:4px 8px 4px 4px;cursor:pointer;flex:0 0 auto}
  .pnode:hover{border-color:var(--accent2)}
  .pnode.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .pnode img{width:34px;height:27px;object-fit:contain;background:#0d0f13;border-radius:3px}
  .pnode .t{font-size:11.5px}
  .pnode .n{font-size:9.5px;color:var(--dim)}
  .parrow{color:var(--dim);flex:0 0 auto}
  .pbranch{color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
  .upgrow{display:flex;gap:6px;align-items:center;padding:4px 7px;border-bottom:1px solid var(--edge)}
  .upgrow:last-child{border-bottom:none}
  .upgrow .un{flex:0 0 auto}
  .upglist{border:1px solid var(--edge);border-radius:7px;background:var(--panel2)}
  /* ---- bulk edit over recruit pools ----
     Filling out a level means giving twenty units the same requires clause, not
     one — so the pools get a selection of their own: tick rows, then act on all
     of them at once. The bar is amber like every other "this is staged" surface
     in the dialog. */
  .bulkbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;padding:7px 9px;
    border:1px solid var(--accent);border-radius:7px;background:#241f0d}
  .bulkbar button{padding:3px 8px;font-size:11.5px}
  .bulkbar button:disabled{opacity:.38;cursor:default;border-color:var(--edge)}
  .bulkbar .n{flex:0 0 auto;font-size:11.5px;color:var(--accent);font-weight:600}
  .bulkbar select{padding:3px 6px;font-size:11.5px}
  .bulkbar .bnums{display:flex;gap:6px;align-items:flex-end;flex:1 1 100%;
    border-top:1px solid var(--edge);margin-top:2px;padding-top:6px}
  .bulkbar .bnums label{display:flex;flex-direction:column;font-size:8.5px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.4px}
  .bulkbar .bnums input{width:66px;padding:3px 5px;font-size:12px}
  .bulkbar .hint{flex:1;min-width:0;font-size:10.5px;color:var(--dim)}
  .pick{flex:0 0 auto;display:flex;align-items:center;cursor:pointer}
  .pick input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  #bldBody .poolrow.picked{box-shadow:inset 3px 0 0 var(--accent2);background:#1b2430}
  #bldBody .ucard.picked{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset}
  .ucard .top .pick{align-self:flex-start;margin-top:2px}
  /* the add-unit picker ticks rather than adds, so its rows carry a box too */
  .baserow.on{background:#2b3446}
  /* ---- comparing two units ----
     The same stat twice with the better side coloured. The point is to see the
     gap and close it without leaving the page, so both columns are live boxes
     rather than text — the unit you opened is on the left, the one you compared
     against on the right, and Save writes both. */
  .cmphead{display:flex;gap:10px;align-items:center;padding:8px 10px;margin-bottom:10px;
    border:1px solid var(--edge);border-radius:8px;background:var(--panel2)}
  .cmphead .cu{display:flex;gap:8px;align-items:center;flex:1;min-width:0}
  .cmphead .cu.b{flex-direction:row-reverse;text-align:right}
  .cmphead img{width:36px;height:47px;object-fit:contain;background:#0d0f13;border-radius:4px;flex:0 0 36px}
  .cmphead .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmphead .ty{font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmphead .tally{flex:0 0 auto;text-align:center;font-size:10.5px;color:var(--dim);line-height:1.3}
  .cmphead .tally .w{color:var(--good);font-weight:600}
  .cmpbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .cmpbar .q{flex:1;min-width:130px;padding:4px 8px;font-size:12.5px}
  .cmpsec{margin-bottom:10px}
  .cmpsec>h5{margin:0 0 3px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--dim);font-weight:600}
  .cmplist{border:1px solid var(--edge);border-radius:7px;background:var(--panel2)}
  .cmprow{display:grid;gap:7px;align-items:center;padding:3px 8px;border-bottom:1px solid var(--edge);
    grid-template-columns:minmax(104px,1fr) minmax(86px,1.05fr) 62px minmax(86px,1.05fr)}
  .cmprow:last-child{border-bottom:none}
  .cmprow.same{opacity:.6}
  .cmprow .cl{font-size:11.5px;color:var(--dim);min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .cmprow .cv{min-width:0}
  .cmprow input,.cmprow select{width:100%;padding:2px 6px;font-size:12px;min-width:0}
  .cmprow .cd{text-align:center;font-size:11px;color:var(--dim);white-space:nowrap}
  .cmprow .cd.win{color:var(--good)}
  .cmprow .cd.neu{color:var(--warn)}
  .cv.win input,.cv.win select{border-color:var(--good);background:#12281c}
  .cv.lose input,.cv.lose select{border-color:var(--bad);background:#2a1414}
  .cv.diff input,.cv.diff select{border-color:var(--warn);background:#241f0d}
  .cmprow .cv.edited input,.cmprow .cv.edited select{outline:1px solid var(--accent);outline-offset:1px}
  .cmpfield{display:flex;gap:7px;align-items:baseline;padding:4px 8px;font-size:11px;
    color:var(--accent);background:#1b2027;border-bottom:1px solid var(--edge)}
  .cmpfield .count{font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<header>
  <select id="modeSel" class="mode" title="Switch between moving units between mods and editing one mod's units">
    <option value="transfer">⚔ Unit Transfer</option>
    <option value="edit">✎ Unit Editor</option>
    <option value="bmdb">🗄 BMDB Editor</option>
    <option value="sounds">🔊 Unit Sounds</option>
    <option value="sprites">🖼 Sprites</option>
    <option value="buildings">🏰 Buildings</option>
  </select>
  <button id="backBldBtn" style="display:none" title="Go back to the building you came from">← Back to building</button>
  <div class="sep"></div>
  <span class="lbl" id="srcLbl">From</span><select id="srcSel"></select>
  <span id="dstWrap"><span class="lbl">→ To</span><select id="dstSel"></select></span>
  <div class="sep"></div>
  <input type="search" id="search" placeholder="Search…">
  <label class="chk"><input type="checkbox" id="mercOnly"> mercs</label>
  <button id="selBtn" title="Select multiple units">☑ Select</button>
  <button id="batchBtn" class="primary" style="display:none">Transfer selected (0)</button>
  <button id="clearSelBtn" style="display:none" title="Untick every selected unit">✕ Clear</button>
  <button id="newUnitBtn" class="primary" style="display:none" title="Create a new unit using an existing one as the base">＋ New unit</button>
  <button id="cleanBtn" style="display:none" title="Find entries and files nothing uses and move them out of the mod">🧹 Clean up BMDB…</button>
  <button id="sndBtn" class="primary" style="display:none" title="Write the staged voice changes into this mod">Apply voice edits (0)</button>
  <label class="chk" id="unusedWrap" style="display:none"><input type="checkbox" id="unusedOnly"> unused only</label>
  <button id="settingsBtn" title="MED II root">⚙ Root</button>
  <button id="logBtn" title="Log + undo">🕑 Log</button>
  <span class="count" id="count"></span>
</header>

<div class="layout">
  <aside class="filters" id="unitFilters">
    <h3>Group by</h3>
    <select id="groupBy" style="width:100%">
      <option value="faction">Faction (ownership)</option>
      <option value="kind">Category</option>
      <option value="class">Class</option>
      <option value="none">Nothing (flat)</option>
    </select>
    <h3>Faction</h3>
    <select id="facSort" style="width:100%;margin-bottom:6px"
      title="Which of the two names factions are listed and sorted by — the other one goes in brackets">
      <option value="name">A→Z by in-game name</option>
      <option value="code">A→Z by code name</option>
    </select>
    <div id="factionFilter"></div>
    <h3>Category</h3><div id="categoryFilter"></div>
    <h3>Class</h3><div id="classFilter"></div>
    <h3>Era</h3>
    <div id="eraFilter">
      <label class="opt"><input type="checkbox" value="0" class="era"> Early</label>
      <label class="opt"><input type="checkbox" value="1" class="era"> High</label>
      <label class="opt"><input type="checkbox" value="2" class="era"> Late</label>
    </div>
  </aside>
  <!-- Buildings mode brings its own filters: the unit sidebar's category/class/era
       say nothing about a settlement building, and which CULTURE's art to show has
       no equivalent on the unit side at all. -->
  <aside class="filters" id="bldFilters" style="display:none">
    <h3>Culture (art)</h3>
    <select id="bldCulture" style="width:100%"
      title="Building icons are per culture — this picks whose art the grid shows"></select>
    <h3>Settlement</h3>
    <div id="bldSettleFilter">
      <label class="opt"><input type="checkbox" value="city" class="bldset"> City</label>
      <label class="opt"><input type="checkbox" value="castle" class="bldset"> Castle</label>
      <label class="opt"><input type="checkbox" value="both" class="bldset"> Both</label>
    </div>
    <h3>Shows</h3>
    <label class="opt"><input type="checkbox" id="bldRecruitOnly"> Recruits units only</label>
    <label class="opt"><input type="checkbox" id="bldMissingArt"> Missing its own art</label>
    <h3>Religion</h3><div id="bldReligionFilter"></div>
    <h3>Faction</h3><div id="bldFactionFilter"></div>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

<div class="drawer" id="drawer"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// `dst` is the mod being written to right now, which a single-mod mode mirrors
// onto the source. `xferDst` is the destination the user actually PICKED, kept
// apart so that entering Edit/Buildings doesn't quietly overwrite it — see
// applyMode.
const state={mods:[],src:null,dst:null,xferDst:null,data:null,destData:null,factionNames:{},
  sel:{faction:new Set(),category:new Set(),class:new Set(),era:new Set()},
  selMode:false, selected:new Set(), cfg:{}, editing:null, settings:{},
  // 'transfer' = move units between mods; 'edit' = edit the units of ONE mod;
  // 'bmdb' = edit / clean up that mod's whole battle_models.modeldb;
  // 'sounds' = which voice-bank entry each unit uses;
  // 'buildings' = that mod's export_descr_buildings.txt
  mode:'transfer', ed:null, bmdb:null, clean:null, snd:null, destSnd:null,
  // bld survives a hop into the unit editor and back — see openUnitFromBuilding
  bld:null, bldReturn:null};

const VANILLA_UNIT_LIMIT=500;   // M2TW vanilla EDU cap; M2TWEOP/EOP raise it.

// GET with a few automatic retries — a page's request can be dropped transiently
// (e.g. during an icon burst, or if the tab was open across a server restart),
// and we must never hang forever on such a blip.
const api={
  get:async(u,tries=4)=>{let err;
    for(let i=0;i<tries;i++){
      try{const r=await fetch(u,{cache:'no-store'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        return await r.json();}
      catch(e){err=e; if(i<tries-1) await new Promise(res=>setTimeout(res,200*(i+1)));}
    }
    throw err;},
  post:async(u,b)=>(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})})).json()};
const esc=s=>(s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q1=v=>v.replace(/'/g,"\\'");
function toast(m,ms=2800){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms);}
// A faction has two names — the EDU's code ("teutonic_order") and the in-game one
// ("Clans of Enedwaith") — and which one you look for depends on what you are
// doing. Whichever is picked leads and sorts; the other rides along in brackets so
// the row is still readable either way.
const facBy=()=>(state.settings.faction_sort==='code'?'code':'name');
const facTwoNames=(code,name)=>!name?code
  :facBy()==='code'?`${code} (${name})`:`${name} (${code})`;
const facLabel=f=>facTwoNames(f,state.factionNames[f]);
// In a CHECKLIST the two names are split rather than run together: the one you
// are reading down the list for leads, and the other appears over the row on
// hover (.facrow .fc), so a long name is never cut short to make room for a code
// you only need to glance at once. Which one leads is the ⚙ faction_sort setting.
const facLead=(code,name)=>!name?code:(facBy()==='code'?code:name);
const facBehind=(code,name)=>!name?'':(facBy()==='code'?name:code);
// One checklist row: tick box, the leading name, and the hover-only detail.
function facCheckRow(code,name,onchange,checked,note,edited){
  const behind=[facBehind(code,name),note].filter(Boolean).join(' · ');
  return `<div class="facrow${edited?' edited':''}">
    <label class="chk"><input type="checkbox" ${checked?'checked':''} onchange="${onchange}">
      <span class="fn">${esc(facLead(code,name))}</span></label>
    ${behind||edited?`<span class="fc">${esc(behind)}${
      edited?(behind?' · ':'')+(checked?'added by you':'removed by you'):''}</span>`:''}</div>`;
}
const iconUrl=(mod,type,kind)=>`/icon?mod=${encodeURIComponent(mod)}&type=${encodeURIComponent(type)}&kind=${kind||'card'}`;
// Icon requests can be dropped when a page fires dozens at once (connection
// bursts). A missing icon returns a valid blank PNG (onload), so onerror only
// fires on a genuine connection failure — retry it a few times with backoff.
function iconRetry(img){
  const n=(+img.dataset.try||0)+1; img.dataset.try=n;
  if(n>4) return;                       // give up quietly after 4 tries
  const base=img.src.split('#')[0];
  setTimeout(()=>{img.src=base+'#r'+n;}, 120*n*n);
}

// Keep the server alive while this tab is open; tell it to stop when the tab closes
// (so a windowless server doesn't linger holding the port). A refresh sends 'bye'
// too, but the reloaded page resumes heartbeats within the server's grace window.
let _hbStarted=false;
function startHeartbeat(){
  if(_hbStarted)return; _hbStarted=true;
  const beat=()=>{try{fetch('/api/heartbeat',{method:'POST',keepalive:true});}catch(e){}};
  beat(); setInterval(beat,4000);
  const bye=()=>{try{navigator.sendBeacon('/api/bye');}catch(e){}};
  window.addEventListener('pagehide',bye);
  window.addEventListener('beforeunload',bye);
}
async function init(){
  try{
    startHeartbeat();
    const s=await api.get('/api/settings');state.settings=s;
    facSort.value=facBy();                 // remembered across runs like the rest
    restoreFilters();                      // …and so are the filters themselves
    // ?mod=&edit= — how "open this unit in a new tab" arrives. It picks the mod
    // and opens the editor for this tab only; the remembered mod is not changed.
    const qs=new URLSearchParams(location.search);
    const qMod=qs.get('mod'),qEdit=qs.get('edit');
    state.mode=qEdit?'edit'
      :(['edit','bmdb','sounds','sprites','buildings'].includes(s.mode)?s.mode:'transfer');
    modeSel.value=state.mode;
    await refreshMods(qMod||s.last_source,qMod||s.last_dest);
    wire(); applyMode(false);
    if(qEdit){
      if(state.data&&state.data.units.some(u=>u.type===qEdit))openEditor(qEdit);
      else toast(`“${qEdit}” is not a unit in ${state.src}`,4000);
    }
  }catch(e){
    main.innerHTML=`<div class="empty">Couldn't reach the Unit Transfer server.<br>
      <span class="count">Is <code>Launch-Unit-Transfer.bat</code> (python app.py) still running?</span><br><br>
      <button class="primary" onclick="init()">Retry</button></div>`;
  }
}

async function refreshMods(pSrc,pDst){
  state.mods=await api.get('/api/mods');
  const opts=state.mods.map(m=>`<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('');
  srcSel.innerHTML=opts; dstSel.innerHTML=opts;
  if(!state.mods.length){main.innerHTML='<div class="empty">No mods found. Click ⚙ Root to point at your Medieval II folder.</div>';return;}
  state.src=pSrc&&state.mods.some(m=>m.name===pSrc)?pSrc:state.mods[0].name;
  state.dst=pDst&&state.mods.some(m=>m.name===pDst)?pDst:(state.mods[1]?.name||state.mods[0].name);
  // Older builds persisted a single-mod mode's mirrored destination as
  // last_dest, so a remembered pair can arrive as A -> A. Starting Transfer
  // pointed at the source mod reads as "copy this onto itself" — pick a real
  // second mod instead, exactly as a first run would.
  if(state.mode==='transfer'&&state.dst===state.src&&state.mods.length>1)
    state.dst=state.mods.find(m=>m.name!==state.src).name;
  state.xferDst=state.dst;
  srcSel.value=state.src; dstSel.value=state.dst;
  state.destData=null;
  await loadSource();
}
async function loadSource(){
  main.innerHTML='<div class="empty">Loading '+esc(state.src)+'…</div>';
  try{
    state.data=await api.get('/api/units?mod='+encodeURIComponent(state.src));
  }catch(e){
    main.innerHTML=`<div class="empty">Couldn't load “${esc(state.src)}”.<br>
      <span class="count">${esc(''+e)}</span><br><br>
      <button class="primary" onclick="loadSource()">Retry</button></div>`;
    return;
  }
  state.factionNames=state.data.faction_names||{};
  // Keep whatever is ticked. Saving a unit or finishing a transfer reloads this
  // list, and re-ticking the same filters every time was maddening. Only values
  // this mod doesn't have are dropped — a filter that can never match would hide
  // everything with no visible reason why.
  let dropped=false;
  const prune=(key,values)=>{const ok=new Set(values||[]);
    for(const v of [...state.sel[key]])if(!ok.has(v)){state.sel[key].delete(v);dropped=true;}};
  prune('faction',state.data.factions);
  prune('category',state.data.categories);
  prune('class',state.data.classes);
  if(dropped)saveFilters();   // don't let the next run resurrect what was dropped
  // same for a pending multi-selection: a unit that was just deleted (or that
  // this mod never had) can't be transferred, so it can't stay ticked
  const types=new Set(state.data.units.map(u=>u.type));
  for(const t of [...state.selected])if(!types.has(t))state.selected.delete(t);
  updateBatchBtn();
  buildFilter('factionFilter',state.data.factions,'faction',true);
  buildFilter('categoryFilter',state.data.categories,'category');
  buildFilter('classFilter',state.data.classes,'class');
  syncEraBoxes();
  render();
}
/* ---------- filters remembered ----------
   The filter panel is "where I was looking", the same kind of state as the mod
   pair and the faction sort, so it is persisted the same way and restored on
   the next run instead of only surviving until the next reload. */
function restoreFilters(){
  const f=state.settings.filters||{};
  state.sel={faction:new Set(f.faction||[]),category:new Set(f.category||[]),
             class:new Set(f.class||[]),era:new Set(f.era||[])};
  if(f.group_by)groupBy.value=f.group_by;
  mercOnly.checked=!!f.merc_only;
  syncEraBoxes();
}
function syncEraBoxes(){document.querySelectorAll('.era').forEach(cb=>cb.checked=state.sel.era.has(cb.value));}
let _saveFiltersT=null;
function saveFilters(){                       // debounced: ticking is a burst
  clearTimeout(_saveFiltersT);
  _saveFiltersT=setTimeout(()=>{
    state.settings.filters={faction:[...state.sel.faction],category:[...state.sel.category],
      class:[...state.sel.class],era:[...state.sel.era],
      group_by:groupBy.value,merc_only:mercOnly.checked};
    api.post('/api/settings',{filters:state.settings.filters});
  },400);
}
function filtersChanged(){saveFilters();render();}
async function ensureDest(){ if(!state.destData||state.destData.mod!==state.dst){state.destData=await api.get('/api/units?mod='+encodeURIComponent(state.dst));} return state.destData; }

function buildFilter(id,values,key,useLabel){
  const box=document.getElementById(id);
  // factions are listed under whichever name is leading, so the A→Z the user
  // picked is the A→Z they see here as well as in the group headers
  const list=useLabel?[...(values||[])].sort((a,b)=>facLabel(a).localeCompare(facLabel(b)))
                     :(values||[]);
  box.innerHTML=list.map(v=>`<label class="opt"><input type="checkbox" value="${esc(v)}" ${
    state.sel[key].has(v)?'checked':''}>${esc(useLabel?facLabel(v):v)}</label>`).join('')
    ||'<span class="count">—</span>';
  box.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{const s=state.sel[key];cb.checked?s.add(cb.value):s.delete(cb.value);filtersChanged();});
}
function wire(){
  modeSel.onchange=()=>{state.mode=modeSel.value;applyMode(true);};
  newUnitBtn.onclick=openNewUnitPicker;
  // Picking the mod that's already on the other side swaps the pair rather than
  // leaving a pointless A -> A: with A -> B, choosing A as the dest gives B -> A.
  srcSel.onchange=async e=>{
    const v=e.target.value;
    // A ticked pile belongs to the mod it was ticked in — carrying it to another
    // mod would transfer whatever happens to share a type name over there.
    if(v!==state.src)clearSelection();
    // Edit / bmdb mode works on a single mod, so both sides follow the picker.
    if(state.mode!=='transfer'){state.src=state.dst=v;dstSel.value=v;state.destData=null;
      state.cfg={};state.bmdb=null;state.snd=null;state.destSnd=null;
      state.bld=null;state.bldReturn=null;
      // the mirrored destination is not the user's transfer pick — don't save it
      await api.post('/api/settings',{last_source:v,last_dest:state.xferDst||v});return loadSource();}
    if(v===state.dst){state.dst=state.xferDst=state.src;dstSel.value=state.dst;state.destData=null;}
    state.src=v;srcSel.value=v;state.cfg={};
    await api.post('/api/settings',{last_source:state.src,last_dest:state.dst});
    loadSource();};
  dstSel.onchange=async e=>{
    const v=e.target.value;
    const srcChanged=(v===state.src);
    if(srcChanged){state.src=state.dst;srcSel.value=state.src;clearSelection();}
    state.dst=state.xferDst=v;dstSel.value=v;state.destData=null;state.destSnd=null;state.cfg={};
    await api.post('/api/settings',{last_source:state.src,last_dest:state.dst});
    if(srcChanged)loadSource();};
  search.oninput=render; mercOnly.onchange=filtersChanged; groupBy.onchange=filtersChanged;
  // rebuilds the faction list (its A→Z changes) but keeps whatever is ticked
  facSort.onchange=()=>{state.settings.faction_sort=facSort.value;
    api.post('/api/settings',{faction_sort:facSort.value});
    if(state.data)buildFilter('factionFilter',state.data.factions,'faction',true);
    render();};
  document.querySelectorAll('.era').forEach(cb=>cb.onchange=()=>{cb.checked?state.sel.era.add(cb.value):state.sel.era.delete(cb.value);filtersChanged();});
  settingsBtn.onclick=openSettings; logBtn.onclick=openLog;
  selBtn.onclick=toggleSelMode; batchBtn.onclick=openBatch; clearSelBtn.onclick=clearSelection;
  cleanBtn.onclick=openCleanup; unusedOnly.onchange=render; sndBtn.onclick=sndApply;
  backBldBtn.onclick=backToBuilding;
  overlay.onclick=e=>{if(e.target.id==='overlay')closeModal();};
}
/* ---------- mode switching ---------- */
// Edit and bmdb modes work on ONE mod in place, so the destination always mirrors
// the source: that also lets the "new unit" flow reuse the transfer engine with
// source == dest.
function applyMode(persist){
  const one=state.mode!=='transfer', edit=state.mode==='edit', bm=state.mode==='bmdb',
        snd=state.mode==='sounds', spr=state.mode==='sprites', bld=state.mode==='buildings';
  document.getElementById('srcLbl').textContent=one?'Mod':'From';
  document.getElementById('dstWrap').style.display=one?'none':'';
  selBtn.style.display=one?'none':'';
  batchBtn.style.display=(!one&&state.selMode)?'inline-block':'none';
  clearSelBtn.style.display=(!one&&state.selMode&&state.selected.size)?'inline-block':'none';
  newUnitBtn.style.display=edit?'inline-block':'none';
  cleanBtn.style.display=bm?'inline-block':'none';
  sndBtn.style.display=snd?'inline-block':'none';
  unusedWrap.style.display=bm?'inline-flex':'none';
  mercOnly.parentElement.style.display=(bm||snd||spr||bld)?'none':'inline-flex';
  // these bring their own filters — the sidebar's faction/era ones say nothing
  // about a voice entry, and nothing at all about a modeldb record or a sprite
  document.getElementById('unitFilters').style.display=(bm||snd||spr||bld)?'none':'';
  document.getElementById('bldFilters').style.display=bld?'':'none';
  // Only offered while the unit editor is what you'd be going back FROM: in
  // buildings mode the building is already on screen.
  backBldBtn.style.display=(edit&&state.bldReturn)?'inline-block':'none';
  if(state.bldReturn)backBldBtn.textContent=`← Back to ${state.bldReturn.label}`;
  search.placeholder=bm?'Search entries…':snd?'Search units…':spr?'Search models…'
                    :bld?'Search buildings…':'Search…';
  document.title=bm?'BMDB Editor':snd?'Unit Sounds':spr?'Sprites'
                :bld?'Buildings':edit?'Unit Editor':'Unit Transfer';
  if(one&&state.selMode)toggleSelMode();
  // A single-mod mode mirrors the destination onto the source, but the pick the
  // user made in Transfer is remembered rather than overwritten — both in
  // `xferDst` and in the persisted setting, so neither this switch nor the next
  // run turns the transfer pair into A -> A. Transfer never shows A -> A anyway
  // (that is what Edit's "new unit from this one" is for), so coming back to it
  // with nothing to restore falls through to any other mod, same as a first run.
  if(one){
    if(state.dst!==state.src){state.xferDst=state.dst;
      state.dst=state.src;dstSel.value=state.src;state.destData=null;}
  }else if(state.dst===state.src&&state.mods.length>1){
    const want=state.xferDst&&state.xferDst!==state.src
      &&state.mods.some(m=>m.name===state.xferDst)
        ? state.xferDst : state.mods.find(m=>m.name!==state.src).name;
    state.dst=state.xferDst=want;dstSel.value=want;state.destData=null;state.destSnd=null;
  }
  if(persist)api.post('/api/settings',
    {mode:state.mode,last_dest:one?(state.xferDst||state.dst):state.dst});
  render();
}

// Leaving select mode keeps WHAT was ticked — you step out to look at a unit in
// the drawer, or to change a filter, and coming back to an empty pile after
// ticking twenty units was the worst way to lose work here. Only the highlight
// goes (a ticked card outside select mode just looks broken); ✕ Clear, switching
// source mod, and a finished transfer are what actually empty it.
function toggleSelMode(){state.selMode=!state.selMode;document.body.classList.toggle('selmode',state.selMode);
  selBtn.classList.toggle('on',state.selMode);
  paintSelection();
  batchBtn.style.display=state.selMode?'inline-block':'none';
  updateBatchBtn();}
function clearSelection(){state.selected.clear();paintSelection();updateBatchBtn();}
// every card of every selected unit, since one unit can render under several groups
function paintSelection(){main.querySelectorAll('.card').forEach(c=>
  c.classList.toggle('sel',state.selMode&&state.selected.has(c.dataset.type)));}
function updateBatchBtn(){batchBtn.textContent=`Transfer selected (${state.selected.size})`;batchBtn.disabled=state.selected.size===0;
  clearSelBtn.style.display=(state.selMode&&state.selected.size)?'inline-block':'none';}

function unitMatches(u){
  const qq=search.value.trim().toLowerCase();
  if(qq&&!(u.name.toLowerCase().includes(qq)||u.type.toLowerCase().includes(qq)||u.dictionary.toLowerCase().includes(qq)))return false;
  if(mercOnly.checked&&!u.mercenary)return false;
  const S=state.sel;
  if(S.faction.size&&!u.ownership.some(f=>S.faction.has(f)))return false;
  if(S.category.size&&!S.category.has(u.kind))return false;
  if(S.class.size&&!S.class.has(u.class))return false;
  if(S.era.size&&![...S.era].some(e=>(u.eras[e]||[]).length>0))return false;
  return true;
}
function render(){
  if(state.mode==='bmdb')return renderBmdb();
  if(state.mode==='sounds')return renderSounds();
  if(state.mode==='sprites')return renderSprites();
  if(state.mode==='buildings')return renderBuildings();
  if(!state.data)return;
  const units=state.data.units.filter(unitMatches);
  count.textContent=`${units.length}/${state.data.units.length}`;
  const gb=groupBy.value;
  if(!units.length){main.innerHTML='<div class="empty">No units match.</div>';return;}
  // Ticking a filter says "this is what I'm here for", so its group leads —
  // otherwise picking one faction buries it under every OTHER faction its units
  // are also owned by (a unit renders once per faction it belongs to). Alphabetical
  // within the picked ones, then alphabetical for the rest.
  const picked=state.sel[{faction:'faction',kind:'category',class:'class'}[gb]]||new Set();
  const byPicked=(ka,kb,la,lb)=>(picked.has(kb)-picked.has(ka))||la.localeCompare(lb);
  let groups;
  if(gb==='none')groups=[['All units',units]];
  else if(gb==='faction'){const map=new Map();for(const u of units){for(const f of (u.ownership.length?u.ownership:['(none)']))(map.get(f)||map.set(f,[]).get(f)).push(u);}
    groups=[...map.entries()].sort((a,b)=>byPicked(a[0],b[0],facLabel(a[0]),facLabel(b[0]))).map(([f,us])=>[facLabel(f),us]);}
  else{const map=new Map();for(const u of units){const k=u[gb]||'(none)';(map.get(k)||map.set(k,[]).get(k)).push(u);}
    groups=[...map.entries()].sort((a,b)=>byPicked(a[0],b[0],a[0],b[0]));}
  main.innerHTML=groups.map(([g,us])=>`<section class="faction-group">
    <div class="faction-head"><h2>${esc(g)}</h2><span class="n">${us.length} units</span></div>
    <div class="grid">${us.map(cardHtml).join('')}</div></section>`).join('');
  main.querySelectorAll('.card').forEach(c=>c.onclick=()=>onCard(c.dataset.type));
}
function cardHtml(u){
  const s=(state.selMode&&state.selected.has(u.type))?'sel':'';
  return `<div class="card ${s}" data-type="${esc(u.type)}">
    <div class="tick">✓</div>
    <img loading="lazy" onerror="iconRetry(this)" src="${iconUrl(state.src,u.type)}" alt="">
    <div class="meta"><div class="nm">${esc(u.name)}</div><div class="sub">${esc(u.type)}</div>
    <div>${u.eop?`<span class="badge eop" title="M2TWEOP unit — defined in ${esc(u.eop_file||'an EOP unit file')}, not in export_descr_unit.txt">EOP</span>`:''}${u.mercenary?'<span class="badge merc">merc</span>':''}<span class="badge">${esc(u.kind||u.category||'?')}</span>${u.class?`<span class="badge cls">${esc(u.class)}</span>`:''}</div></div></div>`;
}
function onCard(type){
  if(state.selMode){ if(state.selected.has(type))state.selected.delete(type); else state.selected.add(type);
    updateBatchBtn(); markCardSel(type); return; }
  if(state.mode==='edit') return openEditor(type);
  openDrawer(type);
}
// A unit owned by several factions renders one card per faction group (and the
// same goes for the other group-by modes), so EVERY copy has to reflect the
// selection — querySelector would only ever find the first, making a selected
// unit look unselected under its other factions.
function markCardSel(type){const on=state.selMode&&state.selected.has(type);

const cssq=s=>s.replace(/"/g,'\\"');

/* =========================================================================
   Undo / redo — Ctrl+Z, Ctrl+Y (and Ctrl+Shift+Z)

   Every editor on this page keeps its pending changes in one plain-object
   working model and re-draws from it, so undo is a stack of SNAPSHOTS of that
   model rather than a log of commands: after any interaction the model is
   stringified and, if it differs from the top of the stack, pushed. Ctrl+Z
   restores the snapshot below and re-draws — which is why it takes back one
   value instead of closing the dialog and losing everything.

   Consecutive keystrokes in the same box collapse into one step (the box's
   identity is the coalesce key), so undo walks back value by value rather than
   letter by letter. Nothing is written to disk either way: this is the
   in-page working copy, and 🕑 Log → Undo is still what reverses a save.

   To make a new editor undoable: add a scope below. `id()` returns '' when the
   editor is not on screen and a stable string when it is (a change of string
   means "a different thing is being edited", and clears the stack); `get`/`set`
   move its working model in and out of a JSON-safe snapshot; `draw` re-renders.
   ========================================================================= */
const UNDO_SCOPES=[
  // the building editor: one working copy of every level in the line
  {id:()=>(modalOpen()&&state.bld&&state.bld.work)?'bld:'+state.bld.mod+':'+state.bld.line:'',
   get:()=>state.bld.work, set:v=>{state.bld.work=v;}, draw:()=>renderBuildingEditor()},
  // the unit editor and the bmdb editor share state.ed
  {id:()=>(modalOpen()&&state.ed)
      ?(state.ed.bmdb?'bmdb:':'ed:')+state.ed.mod+':'+(state.ed.unit||edBmdbName()):'',
   get:edSnap, set:edRestore,
   draw:()=>state.ed.bmdb?renderBmdbEditor():renderEditor()},
  // the transfer composer: one config per unit being sent across
  {id:()=>(modalOpen()&&!state.ed&&!(state.bld&&state.bld.work)&&state.editing&&composerList.length)
      ?'cfg:'+state.src+'>'+state.dst:'',
   get:cfgSnap, set:cfgRestore, draw:()=>renderComposer()},
  // sounds mode stages its changes on the page itself, with no dialog
  {id:()=>(!modalOpen()&&state.mode==='sounds'&&state.snd)?'snd:'+state.src:'',
   get:()=>state.snd.ops, set:v=>{state.snd.ops=v;}, draw:()=>renderSounds()},
];
const modalOpen=()=>document.getElementById('overlay').classList.contains('open');
const edBmdbName=()=>((state.ed.d.models[0]||{}).name||'');
// state.ed carries the read-only unit alongside the edits; only the edits go in
// a snapshot, and the two Sets have to survive the JSON round trip as arrays.
function edSnap(){
  const e=state.ed,c=e.cmp;
  // Only the compared unit's EDITS go in — not which unit it is, and not the
  // server payload it was loaded from. Undo takes back a typed number, and
  // "un-picking" a comparison would mean re-fetching a unit to put it back.
  return {ov:e.ov,rm:[...e.rm],added:[...(e.added||[])],loc:e.loc,newType:e.newType,
          newDict:e.newDict,mEdits:e.mEdits,newModels:e.newModels,
          cardSrc:e.cardSrc||'',infoSrc:e.infoSrc||'',removeOldIcons:!!e.removeOldIcons,
          cmpOv:c?c.ov:{},cmpRm:c?[...c.rm]:[],cmpAdded:c?[...c.added]:[]};
}
function edRestore(v){
  const e=state.ed;
  e.ov=v.ov; e.rm=new Set(v.rm); e.added=new Set(v.added); e.loc=v.loc;
  e.newType=v.newType; e.newDict=v.newDict; e.mEdits=v.mEdits; e.newModels=v.newModels;
  e.cardSrc=v.cardSrc; e.infoSrc=v.infoSrc; e.removeOldIcons=v.removeOldIcons;
  if(e.cmp){ e.cmp.ov=v.cmpOv||{}; e.cmp.rm=new Set(v.cmpRm||[]);
             e.cmp.added=new Set(v.cmpAdded||[]); }
}
// The underscore keys of a per-unit config are server answers cached on it
// (the field list, the conflict report) — big, and not something to undo.
function cfgSnap(){
  const out={};
  for(const t of Object.keys(state.cfg)){
    const c=state.cfg[t],o={};
    for(const k of Object.keys(c)) if(k[0]!=='_')o[k]=c[k];
    out[t]=o;
  }
  return out;
}
function cfgRestore(v){ for(const t of Object.keys(v)) Object.assign(cfgFor(t),v[t]); }

/* ---- "⚠ unsaved changes" ----
   Amber and badged, because it is a state you have to act on before closing the
   dialog — not another line of grey chrome to read past. One painter for every
   editor, driven off the same interactions the undo stack watches, so it can
   never fall out of step with what is actually pending. */
const dirtyChip=on=>on?'<span class="dirtychip">⚠ unsaved changes</span>':'';
function paintDirty(){
  const bld=document.getElementById('bldDirtyNote');
  if(bld)bld.innerHTML=dirtyChip(!!(state.bld&&state.bld.work&&bldDirty()));
  const ed=document.getElementById('edDirtyNote');
  if(ed)ed.innerHTML=dirtyChip(!!(state.ed&&(edDirty()||edCmpDirty())));
}

const undo={key:'',cur:null,ck:null,past:[],future:[]};
const UNDO_LIMIT=150;
function undoScope(){
  for(const s of UNDO_SCOPES){ const id=s.id(); if(id)return Object.assign({key:id},s); }
  return null;
}
// Called when an editor opens, so its first edit has a baseline to go back to.
function undoReset(){
  const s=undoScope();
  undo.key=s?s.key:''; undo.cur=s?JSON.stringify(s.get()):null;
  undo.ck=null; undo.past.length=0; undo.future.length=0;
}
function undoCapture(ck){
  const s=undoScope(); if(!s)return;
  if(s.key!==undo.key){ undoReset(); return; }
  const snap=JSON.stringify(s.get());
  if(snap===undo.cur)return;
  // still typing into the same box: the step already on the stack covers it
  if(!(ck&&ck===undo.ck&&undo.past.length)){
    undo.past.push(undo.cur);
    if(undo.past.length>UNDO_LIMIT)undo.past.shift();
  }
  undo.cur=snap; undo.ck=ck||null; undo.future.length=0;
}
// Snapshots are taken one tick AFTER the event, because the page's own handler
// is what puts the typed value into the model.
let _undoPend=null;
function undoTick(ck){
  clearTimeout(_undoPend);
  _undoPend=setTimeout(()=>{undoCapture(ck);paintDirty();},0);
}
// Text boxes coalesce per element; a fresh element (after a re-draw) starts a
// new step. Tick boxes, dropdowns and buttons are each one step of their own.
let _undoSeq=0;
function undoKeyOf(el){
  if(!el||!el.tagName)return '';
  if(el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA')return '';
  if(el.type==='checkbox'||el.type==='radio')return '';
  if(!el._ukey)el._ukey='k'+(++_undoSeq);
  return el._ukey;
}
// Where the caret was, so undo does not throw you out of the box you are in.
function undoFocus(){
  const el=document.activeElement;
  if(!el||!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName||''))return '';
  if(el.id)return '[id="'+cssq(el.id)+'"]';
  const own=[...el.attributes].filter(a=>a.name.indexOf('data-')===0)
    .map(a=>`[${a.name}="${cssq(a.value)}"]`).join('');
  if(!own)return '';
  const row=el.closest('[data-cap]');
  return (row?`[data-cap="${cssq(row.dataset.cap)}"] `:'')+el.tagName.toLowerCase()+own;
}
function undoRefocus(sel){
  if(!sel)return;
  const t=document.querySelector(sel); if(!t)return;
  t.focus({preventScroll:true});
  try{ if(t.setSelectionRange)t.setSelectionRange(t.value.length,t.value.length); }catch(e){}
}
/* Undo re-draws from the model, which replaces the dialog's innerHTML and so
   throws away where you were scrolled to — landing you at the top of a 300-pool
   building every time. The containers below are the ones that scroll; they are
   matched back up by position because a re-draw of the SAME editor rebuilds the
   same structure, and an id would only cover two of them. */
const UNDO_SCROLLERS='#modal,#bldBody,#edBody,.mbody,.poollist,.caplist,.faclist,'
  +'.lvstrip,.pathwrap,.upglist,.condlist,.ugrid,#main,#drawer';
function scrollSnapshot(){
  const out=[[-1,window.scrollY,window.scrollX]];
  [...document.querySelectorAll(UNDO_SCROLLERS)].forEach((el,i)=>{
    if(el.scrollTop||el.scrollLeft)out.push([i,el.scrollTop,el.scrollLeft]);
  });
  return out;
}
function scrollRestore(snap){
  const els=[...document.querySelectorAll(UNDO_SCROLLERS)];
  for(const [i,top,left] of snap){
    if(i<0){ window.scrollTo(left,top); continue; }
    const el=els[i];
    if(el){ el.scrollTop=top; el.scrollLeft=left; }
  }
}
function undoStep(redo){
  const s=undoScope();
  if(!s||s.key!==undo.key)return false;
  const from=redo?undo.future:undo.past, to=redo?undo.past:undo.future;
  if(!from.length){ toast(redo?'Nothing to redo.':'Nothing to undo.',1400); return true; }
  clearTimeout(_undoPend);                 // don't let a pending capture re-push
  const where=undoFocus(),scrolled=scrollSnapshot();
  to.push(undo.cur);
  undo.cur=from.pop(); undo.ck=null;
  s.set(JSON.parse(undo.cur));
  s.draw();
  scrollRestore(scrolled);
  undoRefocus(where);
  paintDirty();
  // a re-draw that replaces images can settle a frame later and shift things
  requestAnimationFrame(()=>scrollRestore(scrolled));
  toast((redo?'↷ Redone':'↶ Undone')+` · ${undo.past.length} more to undo`,1400);
  return true;
}
document.addEventListener('input',e=>undoTick(undoKeyOf(e.target)));
document.addEventListener('change',e=>undoTick(undoKeyOf(e.target)));
document.addEventListener('click',e=>{
  if(e.target.closest&&e.target.closest('button,a,label,.opt,.facrow,.badge,.chk'))undoTick('');
});
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)||e.altKey)return;
  const k=(e.key||'').toLowerCase();
  const redo=(k==='y')||(k==='z'&&e.shiftKey);
  if(k!=='z'&&k!=='y')return;
  // nothing of ours to undo here — leave the browser's own undo alone
  if(undoStep(redo))e.preventDefault();
});

/* ---------- per-unit config ---------- */
function cfgFor(type){
  if(!state.cfg[type]) state.cfg[type]={include_officers:true,include_mount:true,include_crew:true,include_projectile:true,include_engine:true,engine_conflict:'use_existing',
    // How the unit lands in the destination — see setMode(). 'base_type' is the
    // destination unit the 'base' and 'replace' modes both lean on (the stat
    // donor / the unit being rewritten); '' while the mode is 'new'.
    mode:'new',import_card:false,import_info_card:false,
    base_type:'',soldier_from:(state.settings&&state.settings.soldier_from_base)?'base':'source',
    officer_from:'source',mount_from:'source',crew_from:'source',upgrade_from:'source',
    field_overrides:{},on_conflict:'rename',new_type:'',new_dictionary:'',make_mercenary:false,merc_icons:false,exclude_models:[],
    asset_conflict:'mod_folder',asset_reroute_dir:'',icon_conflict:'use_existing',
    // voice: 'base' (copy the base unit's barks — the default), 'unit' (copy some
    // other destination unit's), 'none'. snd_accent/snd_class only filter the
    // donor list; the accent/class actually written are always the donor's.
    sound_mode:'base',sound_donor:'',snd_accent:'',snd_class:'',
    // where the unit's block is written: 'auto' mirrors the source unit (an EOP
    // unit stays one), 'eop' forces an M2TWEOP unit file, 'edu' forces the EDU
    eop_target:'auto',
    base_fac:'',_conflict:null,_fields:null,_orig:null,_fieldsKey:null,_inherited:null};
  return state.cfg[type];
}
/* ---- transfer mode ----------------------------------------------------------
   'new'     the unit arrives as its own EDU entry, with its own name and icons.
   'base'    same, but the stats/attributes/ownership/era are inherited from a
             destination unit — a new unit built on an existing one.
   'replace' the picked destination unit IS what gets written: its block is
             rewritten with this unit's models and nothing is added to the mod.
             It keeps its type, name, description, stats and cards; each stat can
             still be switched over one at a time with the B buttons below, and
             the cards have their own tick boxes.
   The last two share one picker (`base_type`) because they ask the same question
   — which destination unit — and both are restricted to the SAME unit kind: a
   cavalry model in an infantry entry has neither the right stats nor the right
   animations. */
const modeOf=c=>c.mode||'new';
const isReplace=c=>modeOf(c)==='replace'&&!!c.base_type;
// what the picked unit is called in prose, per mode
const donorRole=c=>modeOf(c)==='replace'?'replaced unit':'base unit';
// The destination's voice bank, fetched once per destination mod. Needed to know
// whether a base unit HAS barks to copy, and to list the units that do.
async function ensureDestSnd(){
  if(!state.destSnd||state.destSnd.mod!==state.dst){
    try{ state.destSnd=await api.get('/api/sounds?mod='+enc(state.dst)); }
    catch(e){ state.destSnd={mod:state.dst,has_file:false,donors:[],accents:[],classes:[]}; }
  }
  return state.destSnd;
}

/* ---------- composer (single or batch) ---------- */
let composerList=[];
async function openComposer(types){
  composerList=types.slice(); state.editing=types[0];
  state.ed=null;                // the composer, not a unit editor, owns this dialog
  document.getElementById('modal').className='modal';
  overlay.classList.add('open');
  await ensureDest();           // needed for the unit-limit projection + base picker
  await ensureDestSnd();        // …and to know which destination units have barks
  undoReset();
  renderComposer();
}

// The donor a config resolves to, plus why it can or can't be used.
function soundDonor(c){
  const ds=state.destSnd;
  if(!ds||!ds.has_file)return {mode:c.sound_mode,blocked:'nobank'};
  if(c.sound_mode==='none')return {mode:'none'};
  // Replacing: "the base's voice" would be the replaced unit's own entry, copied
  // onto itself. It already has it, and its accent/voice_type come across with
  // its stats — so the default means "leave the voice alone", and nothing is
  // locked. Picking another unit still copies that unit's barks as usual.
  if(c.sound_mode==='base'&&isReplace(c))return {mode:'keep',name:c.base_type};
