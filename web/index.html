<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit Transfer</title>
<style>
  :root{--bg:#14171c;--panel:#1c2128;--panel2:#232a33;--edge:#333c47;--ink:#e6e9ee;--dim:#98a3b3;
    --accent:#c8a45c;--accent2:#5b8def;--good:#5cc98a;--warn:#e0b341;--bad:#e06c6c;}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--panel);
    border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:10;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;color:var(--accent);letter-spacing:.5px;font-weight:600;white-space:nowrap}
  .sep{width:1px;height:22px;background:var(--edge);margin:0 3px}
  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  select,input,button,textarea{background:var(--panel2);color:var(--ink);border:1px solid var(--edge);
    border-radius:6px;padding:6px 9px;font-size:13px;font-family:inherit}
  input[type=search]{min-width:150px}
  button{cursor:pointer} button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600}
  button.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  button.danger{border-color:var(--bad);color:var(--bad)}
  button:disabled{opacity:.4;cursor:not-allowed}
  label.chk{display:inline-flex;gap:5px;align-items:center;color:var(--dim);font-size:12px;cursor:pointer}
  .count{color:var(--dim);font-size:12px}
  .layout{display:flex;height:calc(100vh - 50px)}
  .filters{width:210px;flex:0 0 210px;padding:12px;overflow:auto;border-right:1px solid var(--edge);background:var(--panel)}
  .filters h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:16px 0 6px}
  .filters h3:first-child{margin-top:0}
  .filters .opt{display:block;padding:2px 0;font-size:13px;cursor:pointer}
  .filters .opt input{vertical-align:middle;margin-right:6px}
  /* NB: no top padding on the scroll container — a scroll-container's top padding
     stays inside the scrollport and shows as a gap above a top:0 sticky header.
     Breathing room comes from the first group's margin, which scrolls away. */
  main{flex:1;overflow:auto;padding:0 16px 16px}
  .faction-group{margin-bottom:24px}
  .faction-group:first-child{margin-top:12px}
  .faction-head{display:flex;align-items:baseline;gap:10px;position:sticky;top:0;background:var(--bg);
    padding:8px 0 6px;border-bottom:1px solid var(--edge);margin-bottom:10px;z-index:1}
  .faction-head h2{margin:0;font-size:15px;color:var(--accent)}
  .faction-head .n{color:var(--dim);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
  .card{position:relative;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:8px;
    display:flex;gap:8px;align-items:center;cursor:pointer;transition:border-color .1s}
  .card:hover{border-color:var(--accent2)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .card img{width:48px;height:64px;object-fit:contain;background:#0d0f13;border-radius:4px;flex:0 0 48px}
  .card .meta{min-width:0}
  .card .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .sub{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .tick{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:4px;border:1px solid var(--edge);
    background:var(--panel2);display:none;align-items:center;justify-content:center;font-size:12px}
  body.selmode .card .tick{display:flex}
  .card.sel .tick{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .badge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;background:var(--panel2);
    color:var(--dim);border:1px solid var(--edge);margin-right:3px}
  .badge.merc{color:var(--warn);border-color:var(--warn)}
  /* class badge sits next to the category one — dimmer so category reads first */
  .badge.cls{background:transparent}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--edge);border-radius:5px;
    padding:2px 7px;margin:2px 3px 2px 0;font-size:12px}
  .empty{color:var(--dim);padding:40px;text-align:center}
  .projline{margin-top:4px;font-size:12px;color:var(--dim)}
  .warnbox{background:#3a2a10;border:1px solid var(--warn);color:#f4d9a0;border-radius:8px;
    padding:9px 11px;margin:0 0 12px;font-size:12.5px;line-height:1.5}
  .warnbox code{background:#00000030;padding:0 4px;border-radius:3px}
  .drawer{position:fixed;top:0;right:0;width:380px;max-width:92vw;height:100vh;background:var(--panel);
    border-left:1px solid var(--edge);box-shadow:-8px 0 24px #0008;transform:translateX(100%);
    transition:transform .16s ease;overflow:auto;z-index:20}
  .drawer.open{transform:translateX(0)}
  .drawer .dh{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--edge);align-items:center}
  .drawer .dh img{width:72px;height:96px;object-fit:contain;background:#0d0f13;border-radius:6px}
  .drawer .dh h2{margin:0 0 4px;font-size:16px}
  .drawer .infowrap{padding:14px 14px 0}
  .drawer .infowrap img{display:block;width:100%;height:auto;object-fit:contain;
    background:#0d0f13;border-radius:8px;border:1px solid var(--edge)}
  .drawer .infowrap .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--dim);margin-bottom:5px}
  .drawer .body{padding:14px}
  .drawer .row{margin-bottom:12px}
  .drawer .row .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:3px}
  .drawer .close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer}
  .overlay{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:center;justify-content:center}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--edge);border-radius:10px;width:640px;max-width:95vw;
    max-height:92vh;overflow:auto;box-shadow:0 12px 40px #000b}
  .modal h2{margin:0;padding:14px 16px;border-bottom:1px solid var(--edge);font-size:16px}
  .modal .mbody{padding:16px}
  .modal .foot{padding:12px 16px;border-top:1px solid var(--edge);display:flex;gap:8px;justify-content:flex-end;
    align-items:center;position:sticky;bottom:0;background:var(--panel)}
  label.chk.cleanerbox{max-width:52%;line-height:1.35}
  fieldset{border:1px solid var(--edge);border-radius:8px;margin:0 0 14px;padding:10px 12px}
  legend{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:0 6px}
  .radio-row label{display:block;margin:4px 0;cursor:pointer}
  .rename-fields{margin-top:8px;padding-left:22px}
  .rename-fields label{display:block;font-size:12px;color:var(--dim);margin:6px 0}
  .rename-fields input{width:100%}
  .preview{background:var(--panel2);border:1px solid var(--edge);border-radius:8px;padding:10px;
    font:12px/1.4 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:220px;overflow:auto}
  .progress-track{background:var(--panel2);border:1px solid var(--edge);border-radius:6px;height:10px;overflow:hidden}
  .progress-fill{background:var(--accent);height:100%;transition:width .15s ease}
  .proglist{max-height:260px;overflow:auto;border:1px solid var(--edge);border-radius:8px}
  .proglist-row{display:flex;gap:8px;align-items:center;padding:6px 10px;font-size:12.5px;
    border-bottom:1px solid var(--edge)}
  .proglist-row:last-child{border-bottom:none}
  .proglist-row .pi{width:14px;text-align:center;flex:0 0 auto}
  .proglist-row.w-warn .pi{animation:spin 1s linear infinite;display:inline-block}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  /* structured plan summary — each row keeps its own indent column so wrapped
     text aligns under itself instead of snapping back to the left margin */
  .sum{background:var(--panel2);border:1px solid var(--edge);border-radius:8px;
    padding:9px 11px;max-height:280px;overflow:auto;font-size:12px;line-height:1.5}
  .srow{display:flex;gap:7px;align-items:flex-start;padding:1px 0}
  .srow .sicon{flex:0 0 12px;text-align:center;color:var(--dim);font-size:11px}
  .srow .stext{flex:1;min-width:0;overflow-wrap:anywhere}
  .srow.lvl2{margin-left:14px} .srow.lvl3{margin-left:30px}
  .srow.warn .stext{color:var(--warn)} .srow.warn .sicon{color:var(--warn)}
  .srow.good .stext{color:var(--good)} .srow.bad .stext{color:var(--bad)}
  .srow.shead{margin-bottom:3px;padding-bottom:4px;border-bottom:1px solid var(--edge)}
  .srow.shead .stext{font-weight:600;color:var(--ink)}
  .srow .path{font-family:ui-monospace,Consolas,monospace;color:var(--dim)}
  .srow .num{color:var(--accent);font-weight:600}
  .w-warn{color:var(--warn)} .w-bad{color:var(--bad)} .w-good{color:var(--good)}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--edge);border-radius:8px;padding:10px 16px;z-index:50;box-shadow:0 6px 20px #000a;display:none}
  .toast.show{display:block}
  .log-item{border:1px solid var(--edge);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--panel2)}
  .log-item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .log-item .when{color:var(--dim);font-size:11px}
  .log-item pre{font:11px/1.35 ui-monospace,Consolas,monospace;white-space:pre-wrap;margin:8px 0 0;color:var(--dim);max-height:130px;overflow:auto}
  .undone{opacity:.5}
  .pill{font-size:10px;padding:1px 6px;border-radius:10px;border:1px solid var(--edge);color:var(--dim)}
  /* base picker */
  .basepick{display:flex;gap:10px;align-items:flex-start}
  .baseimg{width:56px;height:74px;object-fit:contain;background:#0d0f13;border-radius:5px;flex:0 0 56px}
  .baselist{max-height:190px;overflow:auto;border:1px solid var(--edge);border-radius:6px;margin-top:6px}
  .baserow{display:flex;gap:8px;align-items:center;padding:5px 8px;cursor:pointer;border-bottom:1px solid var(--edge)}
  .baserow:hover{background:var(--panel2)} .baserow.sel{background:#2a3340}
  .baserow img{width:32px;height:42px;object-fit:contain;background:#0d0f13;border-radius:3px}
  .baserow .bn{font-size:12px} .baserow .bs{font-size:10px;color:var(--dim)}
  /* batch */
  .batchstrip{display:flex;gap:6px;overflow:auto;padding-bottom:8px;margin-bottom:10px}
  .bchip{flex:0 0 auto;border:1px solid var(--edge);border-radius:8px;padding:6px;text-align:center;cursor:pointer;width:92px;background:var(--panel2)}
  .bchip.sel{border-color:var(--accent)}
  .bchip img{width:40px;height:52px;object-fit:contain;background:#0d0f13;border-radius:3px;display:block;margin:0 auto 3px}
  .bchip .t{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bchip .base{font-size:9px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fieldrow{display:flex;gap:6px;margin:4px 0}
  .fieldrow select{flex:0 0 200px} .fieldrow input{flex:1}
  .ovr{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 6px;border:1px solid var(--edge);border-radius:5px;margin:3px 0}
  .ovr code{color:var(--accent)}
  /* disabled include-option (officer/mount/crew absent) */
  label.chk.off{opacity:.4;cursor:not-allowed}
  label.chk.off input{cursor:not-allowed}
  /* 500 unit-limit warning banner */
  .limitwarn{border:1px solid var(--warn);background:#2a2410;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}
  .limitwarn b{color:var(--warn)}
  .limitwarn .sub{color:var(--dim);font-size:12px;margin-top:4px}
  .limitwarn .acts{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .limitwarn button{font-size:12px;padding:4px 8px}
  /* all-EDU-fields editor (matches ModdingTool's unit edit screen: every field at once) */
  .allfields{max-height:320px;overflow:auto;border:1px solid var(--edge);border-radius:6px;padding:6px;background:var(--panel2)}
  .afrow{display:flex;gap:8px;align-items:center;margin:2px 0}
  .afrow label{flex:0 0 200px;font-size:12px;color:var(--dim);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .afrow input{flex:1;min-width:0;padding:3px 6px;font-size:12px}
  .afrow input.changed{border-color:var(--accent);background:#241f0d;color:var(--ink)}
  .afrow.dup input{opacity:.5}
  .fieldbar{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .fieldbar input{flex:1} .fieldbar .count{white-space:nowrap}
  /* officer / mount / crew name lists in the transfer menu */
  .optnames{margin-top:6px;font-size:12px}
  .optnames .k{color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.5px;margin-right:6px}
  label.chk.mini{background:var(--panel2);border:1px solid var(--edge);border-radius:5px;
    padding:2px 7px;margin:2px 4px 2px 0}
  .frombase{color:var(--accent);font-size:11px;margin-left:6px}
  /* per-group "source or base" toggles, directly above the field editor */
  .basefrom{margin-bottom:8px;padding:7px 9px;border:1px solid var(--edge);
    border-radius:6px;background:var(--panel2)}
  .basefrom.off{opacity:.5}
  .basefrom .bftitle{font-size:11px;color:var(--dim);margin-bottom:5px}
  .basefrom .bftitle b{color:var(--accent)}
  .sbrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:2px 0}
  .sbrow .k{flex:0 0 66px;color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.5px}
  .sbrow label{font-size:12px;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
  .sbrow .count{font-size:11px}
  /* base picker faction filter */
  .basebar{display:flex;gap:6px} .basebar input{flex:1;min-width:0} .basebar select{flex:0 0 150px}
  /* "inherited from base" badge in the field editor — a button when the source
     unit has a value of its own to switch back to, a flat marker when it doesn't */
  .ibadge{display:inline-block;margin-left:5px;font-size:9px;background:var(--accent);color:#1a1a1a;
    border-radius:3px;padding:0 4px;font-weight:700;vertical-align:middle;
    border:1px solid var(--accent);font-family:inherit;line-height:15px}
  button.ibadge{cursor:pointer}
  button.ibadge.off{background:transparent;color:var(--dim);border-color:var(--edge)}
  button.ibadge:hover{filter:brightness(1.15)}
  /* reroute folder browser */
  .brbar{display:flex;gap:6px;align-items:center} .brbar input{flex:1;min-width:0}
  .brlist{max-height:140px;overflow:auto;border:1px solid var(--edge);border-radius:6px;margin-top:6px;background:var(--panel2)}
  .brrow{padding:4px 8px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--edge)}
  .brrow:hover{background:#2a3340}
  /* asset (texture/mesh) conflict resolver */
  .assetconf{margin-top:10px;border-color:var(--warn)}
  .assetconf .radio-row label{margin:5px 0}
  .assetconf code{color:var(--accent)}
  /* one file per row, path on its own line so sizes stay readable */
  .assetconf .flist{max-height:140px;overflow:auto;font-size:11px;color:var(--dim);
    margin-top:6px;border-top:1px solid var(--edge);padding-top:6px}
  .assetconf .frow{padding:3px 0;border-bottom:1px solid var(--edge)}
  .assetconf .frow:last-child{border-bottom:none}
  .assetconf .frow .fp{font-family:ui-monospace,Consolas,monospace;color:var(--ink);
    overflow-wrap:anywhere;display:block}
  .assetconf .frow .fs{color:var(--dim);font-size:10px}
  /* ---- unit editor (edit mode) ---- */
  header select.mode{color:var(--accent);font-weight:600;letter-spacing:.4px}
  .modal.wide{width:1020px}
  .tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--edge);background:var(--panel2)}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;
    padding:9px 12px;color:var(--dim);font-size:13px}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .ehead{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--edge)}
  .ehead img{width:56px;height:74px;object-fit:contain;background:#0d0f13;border-radius:5px}
  .ehead .nm{font-weight:600;font-size:15px}
  .frm label{display:block;margin:10px 0 0;font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;color:var(--dim)}
  .frm input,.frm textarea,.frm select{width:100%;margin-top:3px}
  .frm textarea{min-height:70px;resize:vertical;line-height:1.4}
  .frm .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .icoprev{display:flex;gap:14px;align-items:flex-start;margin-top:12px}
  .icoprev img{background:#0d0f13;border:1px solid var(--edge);border-radius:6px}
  .icoprev .card{width:96px;height:128px;object-fit:contain;padding:0}
  .icoprev .info{max-width:420px;height:auto;object-fit:contain}
  .mentry{border:1px solid var(--edge);border-radius:8px;margin-bottom:10px;background:var(--panel2)}
  .mentry>.mhead{display:flex;gap:8px;align-items:center;padding:9px 11px;cursor:pointer}
  .mentry>.mhead .mn{font-family:ui-monospace,Consolas,monospace;font-weight:600}
  .mentry>.mhead .grow{flex:1}
  .mentry .mbody2{padding:0 11px 11px;border-top:1px solid var(--edge)}
  .prow{display:grid;grid-template-columns:170px 1fr auto auto;gap:6px;align-items:center;margin-top:5px}
  .prow .pl{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow input{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;padding:4px 6px}
  .prow button{padding:3px 7px;font-size:11px}
  .prow input.changed{border-color:var(--accent);color:var(--accent)}
  .psec{margin-top:9px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
  .afrow .rm{background:none;border:none;color:var(--dim);padding:0 6px;font-size:14px}
  .afrow .rm:hover{color:var(--bad)}
  .afrow.gone label{text-decoration:line-through;opacity:.6}
  .afrow.gone input{text-decoration:line-through;opacity:.5}
  .newmodel{border:1px solid var(--accent2);border-radius:8px;padding:11px;margin-bottom:10px;background:var(--panel2)}
  .newmodel .fbrow{display:grid;grid-template-columns:120px 1fr auto;gap:6px;align-items:center;margin-top:6px}
  .newmodel .fbrow .k{font-size:11px;color:var(--dim)}
  .newmodel .fbrow input{font-size:12px;padding:4px 7px}
  .pending{border:1px dashed var(--accent2);border-radius:8px;padding:8px 11px;margin-bottom:8px;
    background:#1b2330;font-size:12.5px}
  .pending .x{float:right;background:none;border:none;color:var(--dim);cursor:pointer}
  /* ---- editor: shared-with dropdown, folder box, faction checklists ---- */
  .ulink{color:var(--accent2);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--accent2)}
  .ulink:hover{color:var(--accent);border-bottom-color:var(--accent)}
  details.drop{display:inline-block;vertical-align:middle}
  details.drop>summary{list-style:none;cursor:pointer;display:inline-flex;gap:5px;align-items:center;
    font-size:11.5px;color:var(--dim);border:1px solid var(--edge);border-radius:6px;padding:2px 8px;
    background:var(--panel2)}
  details.drop>summary::-webkit-details-marker{display:none}
  details.drop>summary:hover{border-color:var(--accent)}
  details.drop[open]>summary{border-color:var(--accent2);color:var(--ink)}
  .dropbody{border:1px solid var(--edge);border-radius:6px;background:var(--panel);padding:7px 9px;
    margin-top:5px;max-height:230px;overflow:auto}
  .dropbody .urow{padding:2px 0;font-size:12px}
  .folderbox{border:1px solid var(--edge);border-radius:7px;padding:9px 10px;margin-top:9px;background:var(--panel)}
  .folderbox.bad{border-color:var(--warn)}
  .folderbox .fpath{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--ink);
    overflow-wrap:anywhere}
  .folderbox .frow2{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;margin-top:7px}
  .folderbox .frow2 input{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;padding:4px 6px}
  .movelist{max-height:150px;overflow:auto;margin-top:6px;font-size:11px;color:var(--dim);
    font-family:ui-monospace,Consolas,monospace}
  .movelist div{padding:1px 0;overflow-wrap:anywhere}
  .faclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:2px 10px;
    max-height:260px;overflow:auto;border:1px solid var(--edge);border-radius:6px;padding:7px;
    background:var(--panel);margin-top:6px}
  .facrow{display:flex;gap:6px;align-items:center;font-size:12px;min-width:0}
  .facrow label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .facrow .uq{background:none;border:1px solid transparent;color:var(--dim);padding:0 5px;font-size:11px;
    border-radius:5px;line-height:1.6}
  .facrow .uq:hover{border-color:var(--accent)}
  .facrow .uq.on{color:var(--accent);border-color:var(--accent)}
  .facuniq{grid-column:1/-1;border:1px solid var(--accent);border-radius:6px;padding:7px 9px;margin:3px 0 6px;
    background:var(--panel2)}
  .barrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .barrow button{padding:3px 8px;font-size:11px}
  /* draggable chip lists (ownership, eras, armour upgrade models) */

  .chipd{display:inline-flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--edge);
    border-radius:12px;padding:1px 4px 1px 9px;font-size:11.5px;cursor:grab;user-select:none}
  .chipd.drag{opacity:.4} .chipd.over{border-color:var(--accent);background:#2c343f}
  .chipd .g{color:var(--dim);cursor:grab}
  .chipd button{background:none;border:none;color:var(--dim);padding:0 3px;font-size:12px;line-height:1}
  .chipd button:hover{color:var(--accent)}

  .chipd .first{color:var(--accent);font-weight:600}
  .afrow.wide{align-items:flex-start;flex-wrap:wrap}
  .afrow.wide label{padding-top:4px}
  /* ---- bmdb mode: the whole modeldb as a list ---- */
  .dblist{border:1px solid var(--edge);border-radius:8px;background:var(--panel);margin-top:12px}
  .dbrow{display:flex;gap:10px;align-items:center;padding:6px 11px;border-bottom:1px solid var(--edge);
    cursor:pointer;font-size:13px}
  .dbrow:last-child{border-bottom:none}
  .dbrow:hover{background:var(--panel2)}
  .dbrow .en{font-family:ui-monospace,Consolas,monospace;font-weight:600;flex:0 0 300px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dbrow .use{flex:1;min-width:0;color:var(--dim);font-size:12px;

  .dbhead{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .dbhead h2{margin:0;font-size:15px;color:var(--accent)}
  /* ---- cleanup dialog ---- */
  .clsec{border:1px solid var(--edge);border-radius:8px;margin-bottom:12px;background:var(--panel2)}
  .clsec>.h{display:flex;gap:9px;align-items:center;padding:9px 11px;cursor:pointer}
  .clsec>.h b{flex:0 0 auto} .clsec>.h .count{flex:1;min-width:0}
  .clsec>.b{padding:0 11px 11px;border-top:1px solid var(--edge)}
  .clsec.off{opacity:.55}
  .cllist{max-height:260px;overflow:auto;border:1px solid var(--edge);border-radius:6px;
    background:var(--panel);margin-top:7px}
  .clrow{display:flex;gap:8px;align-items:flex-start;padding:5px 9px;border-bottom:1px solid var(--edge);
    font-size:12.5px}
  .clrow:last-child{border-bottom:none}
  .clrow input[type=checkbox]{margin-top:3px;flex:0 0 auto}
  .clrow .nm{font-family:ui-monospace,Consolas,monospace;font-weight:600}
  .clrow .sub{color:var(--dim);font-size:11.5px;margin-top:2px;overflow-wrap:anywhere}
  .clrow .grow{flex:1;min-width:0}
  .clrow.risky{background:#2a2410}
  .clrow select{font-size:11.5px;padding:2px 5px;max-width:230px}
  .clbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}
  .clbar button{padding:3px 9px;font-size:11.5px}
  .cltarget{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-top:6px}
  .cltarget input{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .treebox{font:11.5px/1.5 ui-monospace,Consolas,monospace;color:var(--dim);background:var(--panel);
    border:1px solid var(--edge);border-radius:6px;padding:8px 10px;margin-top:7px;overflow-x:auto}
  /* ---- Sounds mode: the unit voice bank ---- */
  .sndhead{position:sticky;top:0;background:var(--bg);padding:10px 0 6px;z-index:2;
    border-bottom:1px solid var(--edge)}
  .sndhead h2{margin:0 0 3px;font-size:15px;color:var(--accent)}
  .sndtabs{display:flex;gap:6px;margin:10px 0 0}
  .sndbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:8px 10px;
    background:var(--panel);border:1px solid var(--edge);border-radius:8px}
  .sndbar select,.sndbar input{padding:4px 7px;font-size:12px}
  .sndbar .grow{flex:1;min-width:120px}
  .sndlist{border:1px solid var(--edge);border-radius:8px;background:var(--panel);margin-top:10px}
  /* The unit column had 1.5fr and squeezed "In game now" into 88px, which cut off
     the one thing the row is telling you ("English — generic", "Gondor/General ✗").
     Half the width is plenty for a name over its type, and the freed space goes
     where the text actually is. */
  .sndrow{display:grid;grid-template-columns:minmax(120px,.8fr) minmax(150px,.6fr) 130px 100px minmax(180px,1.6fr) 46px;
    gap:8px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--edge)}
  .sndrow:last-child{border-bottom:none}
  .sndrow.hrow{background:var(--panel2);color:var(--dim);font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;position:sticky;top:0;border-radius:8px 8px 0 0}
  .sndrow.staged{background:rgba(92,201,138,.08);box-shadow:inset 3px 0 0 var(--good)}
  .sndrow.dropping{background:rgba(224,108,108,.08);box-shadow:inset 3px 0 0 var(--bad)}
  .sndrow select{width:100%;padding:3px 6px;font-size:12px;min-width:0}
  .sndrow select:disabled{opacity:.55}
  .sndrow .un{min-width:0}
  .sndrow .un .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sndrow .un .ty{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sndrow .now{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sndrow .rm{display:flex;justify-content:center}
  /* ---- composer: the voice fieldset ---- */
  .sndopt{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
  .sndpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .sndpick select{flex:0 0 auto;max-width:210px}
  .sndpick .lockicon{color:var(--warn);cursor:help}
  .sndlocked{border:1px dashed var(--warn);border-radius:6px;padding:6px 8px;margin-top:6px}
  .sndlist.mini{max-height:190px;overflow:auto;margin-top:6px}
</style>
</head>
<body>
<header>
  <select id="modeSel" class="mode" title="Switch between moving units between mods and editing one mod's units">
    <option value="transfer">⚔ Unit Transfer</option>
    <option value="edit">✎ Unit Editor</option>
    <option value="bmdb">🗄 BMDB Editor</option>
    <option value="sounds">🔊 Unit Sounds</option>
  </select>
  <div class="sep"></div>
  <span class="lbl" id="srcLbl">From</span><select id="srcSel"></select>
  <span id="dstWrap"><span class="lbl">→ To</span><select id="dstSel"></select></span>
  <div class="sep"></div>
  <input type="search" id="search" placeholder="Search…">
  <label class="chk"><input type="checkbox" id="mercOnly"> mercs</label>
  <button id="selBtn" title="Select multiple units">☑ Select</button>
  <button id="batchBtn" class="primary" style="display:none">Transfer selected (0)</button>
  <button id="clearSelBtn" style="display:none" title="Untick every selected unit">✕ Clear</button>
  <button id="newUnitBtn" class="primary" style="display:none" title="Create a new unit using an existing one as the base">＋ New unit</button>
  <button id="cleanBtn" style="display:none" title="Find entries and files nothing uses and move them out of the mod">🧹 Clean up BMDB…</button>
  <button id="sndBtn" class="primary" style="display:none" title="Write the staged voice changes into this mod">Apply voice edits (0)</button>
  <label class="chk" id="unusedWrap" style="display:none"><input type="checkbox" id="unusedOnly"> unused only</label>
  <button id="settingsBtn" title="MED II root">⚙ Root</button>
  <button id="logBtn" title="Log + undo">🕑 Log</button>
  <span class="count" id="count"></span>
</header>

<div class="layout">
  <aside class="filters">
    <h3>Group by</h3>
    <select id="groupBy" style="width:100%">
      <option value="faction">Faction (ownership)</option>
      <option value="kind">Category</option>
      <option value="class">Class</option>
      <option value="none">Nothing (flat)</option>
    </select>
    <h3>Faction</h3>
    <select id="facSort" style="width:100%;margin-bottom:6px"
      title="Which of the two names factions are listed and sorted by — the other one goes in brackets">
      <option value="name">A→Z by in-game name</option>
      <option value="code">A→Z by code name</option>
    </select>
    <div id="factionFilter"></div>
    <h3>Category</h3><div id="categoryFilter"></div>
    <h3>Class</h3><div id="classFilter"></div>
    <h3>Era</h3>
    <div id="eraFilter">
      <label class="opt"><input type="checkbox" value="0" class="era"> Early</label>
      <label class="opt"><input type="checkbox" value="1" class="era"> High</label>
      <label class="opt"><input type="checkbox" value="2" class="era"> Late</label>
    </div>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

<div class="drawer" id="drawer"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const state={mods:[],src:null,dst:null,data:null,destData:null,factionNames:{},
  sel:{faction:new Set(),category:new Set(),class:new Set(),era:new Set()},
  selMode:false, selected:new Set(), cfg:{}, editing:null, settings:{},
  // 'transfer' = move units between mods; 'edit' = edit the units of ONE mod;
  // 'bmdb' = edit / clean up that mod's whole battle_models.modeldb;
  // 'sounds' = which voice-bank entry each unit uses
  mode:'transfer', ed:null, bmdb:null, clean:null, snd:null, destSnd:null};

const VANILLA_UNIT_LIMIT=500;   // M2TW vanilla EDU cap; M2TWEOP/EOP raise it.

// GET with a few automatic retries — a page's request can be dropped transiently
// (e.g. during an icon burst, or if the tab was open across a server restart),
// and we must never hang forever on such a blip.
const api={
  get:async(u,tries=4)=>{let err;
    for(let i=0;i<tries;i++){
      try{const r=await fetch(u,{cache:'no-store'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        return await r.json();}
      catch(e){err=e; if(i<tries-1) await new Promise(res=>setTimeout(res,200*(i+1)));}
    }
    throw err;},
  post:async(u,b)=>(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})})).json()};
const esc=s=>(s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q1=v=>v.replace(/'/g,"\\'");
function toast(m,ms=2800){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms);}
// A faction has two names — the EDU's code ("teutonic_order") and the in-game one
// ("Clans of Enedwaith") — and which one you look for depends on what you are
// doing. Whichever is picked leads and sorts; the other rides along in brackets so
// the row is still readable either way.
const facBy=()=>(state.settings.faction_sort==='code'?'code':'name');
const facTwoNames=(code,name)=>!name?code
  :facBy()==='code'?`${code} (${name})`:`${name} (${code})`;
const facLabel=f=>facTwoNames(f,state.factionNames[f]);
const iconUrl=(mod,type,kind)=>`/icon?mod=${encodeURIComponent(mod)}&type=${encodeURIComponent(type)}&kind=${kind||'card'}`;
// Icon requests can be dropped when a page fires dozens at once (connection
// bursts). A missing icon returns a valid blank PNG (onload), so onerror only
// fires on a genuine connection failure — retry it a few times with backoff.
function iconRetry(img){
  const n=(+img.dataset.try||0)+1; img.dataset.try=n;
  if(n>4) return;                       // give up quietly after 4 tries
  const base=img.src.split('#')[0];
  setTimeout(()=>{img.src=base+'#r'+n;}, 120*n*n);
}

// Keep the server alive while this tab is open; tell it to stop when the tab closes
// (so a windowless server doesn't linger holding the port). A refresh sends 'bye'
// too, but the reloaded page resumes heartbeats within the server's grace window.
let _hbStarted=false;
function startHeartbeat(){
  if(_hbStarted)return; _hbStarted=true;
  const beat=()=>{try{fetch('/api/heartbeat',{method:'POST',keepalive:true});}catch(e){}};
  beat(); setInterval(beat,4000);
  const bye=()=>{try{navigator.sendBeacon('/api/bye');}catch(e){}};
  window.addEventListener('pagehide',bye);
  window.addEventListener('beforeunload',bye);
}
async function init(){
  try{
    startHeartbeat();
    const s=await api.get('/api/settings');state.settings=s;
    facSort.value=facBy();                 // remembered across runs like the rest
    restoreFilters();                      // …and so are the filters themselves
    // ?mod=&edit= — how "open this unit in a new tab" arrives. It picks the mod
    // and opens the editor for this tab only; the remembered mod is not changed.
    const qs=new URLSearchParams(location.search);
    const qMod=qs.get('mod'),qEdit=qs.get('edit');
    state.mode=qEdit?'edit':(['edit','bmdb','sounds'].includes(s.mode)?s.mode:'transfer');
    modeSel.value=state.mode;
    await refreshMods(qMod||s.last_source,qMod||s.last_dest);
    wire(); applyMode(false);
    if(qEdit){
      if(state.data&&state.data.units.some(u=>u.type===qEdit))openEditor(qEdit);
      else toast(`“${qEdit}” is not a unit in ${state.src}`,4000);
    }
  }catch(e){
    main.innerHTML=`<div class="empty">Couldn't reach the Unit Transfer server.<br>
      <span class="count">Is <code>Launch-Unit-Transfer.bat</code> (python app.py) still running?</span><br><br>
      <button class="primary" onclick="init()">Retry</button></div>`;
  }
}

async function refreshMods(pSrc,pDst){
  state.mods=await api.get('/api/mods');
  const opts=state.mods.map(m=>`<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('');
  srcSel.innerHTML=opts; dstSel.innerHTML=opts;
  if(!state.mods.length){main.innerHTML='<div class="empty">No mods found. Click ⚙ Root to point at your Medieval II folder.</div>';return;}
  state.src=pSrc&&state.mods.some(m=>m.name===pSrc)?pSrc:state.mods[0].name;
  state.dst=pDst&&state.mods.some(m=>m.name===pDst)?pDst:(state.mods[1]?.name||state.mods[0].name);
  srcSel.value=state.src; dstSel.value=state.dst;
  state.destData=null;
  await loadSource();
}
async function loadSource(){
  main.innerHTML='<div class="empty">Loading '+esc(state.src)+'…</div>';
  try{
    state.data=await api.get('/api/units?mod='+encodeURIComponent(state.src));
  }catch(e){
    main.innerHTML=`<div class="empty">Couldn't load “${esc(state.src)}”.<br>
      <span class="count">${esc(''+e)}</span><br><br>
      <button class="primary" onclick="loadSource()">Retry</button></div>`;
    return;
  }
  state.factionNames=state.data.faction_names||{};
  // Keep whatever is ticked. Saving a unit or finishing a transfer reloads this
  // list, and re-ticking the same filters every time was maddening. Only values
  // this mod doesn't have are dropped — a filter that can never match would hide
  // everything with no visible reason why.
  let dropped=false;
  const prune=(key,values)=>{const ok=new Set(values||[]);
    for(const v of [...state.sel[key]])if(!ok.has(v)){state.sel[key].delete(v);dropped=true;}};
  prune('faction',state.data.factions);
  prune('category',state.data.categories);
  prune('class',state.data.classes);
  if(dropped)saveFilters();   // don't let the next run resurrect what was dropped
  // same for a pending multi-selection: a unit that was just deleted (or that
  // this mod never had) can't be transferred, so it can't stay ticked
  const types=new Set(state.data.units.map(u=>u.type));
  for(const t of [...state.selected])if(!types.has(t))state.selected.delete(t);
  updateBatchBtn();
  buildFilter('factionFilter',state.data.factions,'faction',true);
  buildFilter('categoryFilter',state.data.categories,'category');
  buildFilter('classFilter',state.data.classes,'class');
  syncEraBoxes();
  render();
}
/* ---------- filters remembered ----------
   The filter panel is "where I was looking", the same kind of state as the mod
   pair and the faction sort, so it is persisted the same way and restored on
   the next run instead of only surviving until the next reload. */
function restoreFilters(){
  const f=state.settings.filters||{};
  state.sel={faction:new Set(f.faction||[]),category:new Set(f.category||[]),
             class:new Set(f.class||[]),era:new Set(f.era||[])};
  if(f.group_by)groupBy.value=f.group_by;
  mercOnly.checked=!!f.merc_only;
  syncEraBoxes();
}
function syncEraBoxes(){document.querySelectorAll('.era').forEach(cb=>cb.checked=state.sel.era.has(cb.value));}
let _saveFiltersT=null;
function saveFilters(){                       // debounced: ticking is a burst
  clearTimeout(_saveFiltersT);
  _saveFiltersT=setTimeout(()=>{
    state.settings.filters={faction:[...state.sel.faction],category:[...state.sel.category],
      class:[...state.sel.class],era:[...state.sel.era],
      group_by:groupBy.value,merc_only:mercOnly.checked};
    api.post('/api/settings',{filters:state.settings.filters});
  },400);
}
function filtersChanged(){saveFilters();render();}
async function ensureDest(){ if(!state.destData||state.destData.mod!==state.dst){state.destData=await api.get('/api/units?mod='+encodeURIComponent(state.dst));} return state.destData; }

function buildFilter(id,values,key,useLabel){
  const box=document.getElementById(id);
  // factions are listed under whichever name is leading, so the A→Z the user
  // picked is the A→Z they see here as well as in the group headers
  const list=useLabel?[...(values||[])].sort((a,b)=>facLabel(a).localeCompare(facLabel(b)))
                     :(values||[]);
  box.innerHTML=list.map(v=>`<label class="opt"><input type="checkbox" value="${esc(v)}" ${
    state.sel[key].has(v)?'checked':''}>${esc(useLabel?facLabel(v):v)}</label>`).join('')
    ||'<span class="count">—</span>';
  box.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{const s=state.sel[key];cb.checked?s.add(cb.value):s.delete(cb.value);filtersChanged();});
}
function wire(){
  modeSel.onchange=()=>{state.mode=modeSel.value;applyMode(true);};
  newUnitBtn.onclick=openNewUnitPicker;
  // Picking the mod that's already on the other side swaps the pair rather than
  // leaving a pointless A -> A: with A -> B, choosing A as the dest gives B -> A.
  srcSel.onchange=async e=>{
    const v=e.target.value;
    // A ticked pile belongs to the mod it was ticked in — carrying it to another
    // mod would transfer whatever happens to share a type name over there.
    if(v!==state.src)clearSelection();
    // Edit / bmdb mode works on a single mod, so both sides follow the picker.
    if(state.mode!=='transfer'){state.src=state.dst=v;dstSel.value=v;state.destData=null;
      state.cfg={};state.bmdb=null;state.snd=null;state.destSnd=null;
      await api.post('/api/settings',{last_source:v,last_dest:v});return loadSource();}
    if(v===state.dst){state.dst=state.src;dstSel.value=state.dst;state.destData=null;}
    state.src=v;srcSel.value=v;state.cfg={};
    await api.post('/api/settings',{last_source:state.src,last_dest:state.dst});
    loadSource();};
  dstSel.onchange=async e=>{
    const v=e.target.value;
    const srcChanged=(v===state.src);
    if(srcChanged){state.src=state.dst;srcSel.value=state.src;clearSelection();}
    state.dst=v;dstSel.value=v;state.destData=null;state.destSnd=null;state.cfg={};
    await api.post('/api/settings',{last_source:state.src,last_dest:state.dst});
    if(srcChanged)loadSource();};
  search.oninput=render; mercOnly.onchange=filtersChanged; groupBy.onchange=filtersChanged;
  // rebuilds the faction list (its A→Z changes) but keeps whatever is ticked
  facSort.onchange=()=>{state.settings.faction_sort=facSort.value;
    api.post('/api/settings',{faction_sort:facSort.value});
    if(state.data)buildFilter('factionFilter',state.data.factions,'faction',true);
    render();};
  document.querySelectorAll('.era').forEach(cb=>cb.onchange=()=>{cb.checked?state.sel.era.add(cb.value):state.sel.era.delete(cb.value);filtersChanged();});
  settingsBtn.onclick=openSettings; logBtn.onclick=openLog;
  selBtn.onclick=toggleSelMode; batchBtn.onclick=openBatch; clearSelBtn.onclick=clearSelection;
  cleanBtn.onclick=openCleanup; unusedOnly.onchange=render; sndBtn.onclick=sndApply;
  overlay.onclick=e=>{if(e.target.id==='overlay')closeModal();};
}
/* ---------- mode switching ---------- */
// Edit and bmdb modes work on ONE mod in place, so the destination always mirrors
// the source: that also lets the "new unit" flow reuse the transfer engine with
// source == dest.
function applyMode(persist){
  const one=state.mode!=='transfer', edit=state.mode==='edit', bm=state.mode==='bmdb',
        snd=state.mode==='sounds';
  document.getElementById('srcLbl').textContent=one?'Mod':'From';
  document.getElementById('dstWrap').style.display=one?'none':'';
  selBtn.style.display=one?'none':'';
  batchBtn.style.display=(!one&&state.selMode)?'inline-block':'none';
  clearSelBtn.style.display=(!one&&state.selMode&&state.selected.size)?'inline-block':'none';
  newUnitBtn.style.display=edit?'inline-block':'none';
  cleanBtn.style.display=bm?'inline-block':'none';
  sndBtn.style.display=snd?'inline-block':'none';
  unusedWrap.style.display=bm?'inline-flex':'none';
  mercOnly.parentElement.style.display=(bm||snd)?'none':'inline-flex';
  // both of these bring their own filters — the sidebar's faction/era ones say
  // nothing about a voice entry, and nothing at all about a modeldb record
  document.querySelector('.filters').style.display=(bm||snd)?'none':'';
  search.placeholder=bm?'Search entries…':snd?'Search units…':'Search…';
  document.title=bm?'BMDB Editor':snd?'Unit Sounds':edit?'Unit Editor':'Unit Transfer';
  if(one&&state.selMode)toggleSelMode();
  if(one&&state.dst!==state.src){state.dst=state.src;dstSel.value=state.src;state.destData=null;}
  if(persist)api.post('/api/settings',{mode:state.mode,last_dest:state.dst});
  render();
}

// Leaving select mode keeps WHAT was ticked — you step out to look at a unit in
// the drawer, or to change a filter, and coming back to an empty pile after
// ticking twenty units was the worst way to lose work here. Only the highlight
// goes (a ticked card outside select mode just looks broken); ✕ Clear, switching
// source mod, and a finished transfer are what actually empty it.
function toggleSelMode(){state.selMode=!state.selMode;document.body.classList.toggle('selmode',state.selMode);
  selBtn.classList.toggle('on',state.selMode);
  paintSelection();
  batchBtn.style.display=state.selMode?'inline-block':'none';
  updateBatchBtn();}
function clearSelection(){state.selected.clear();paintSelection();updateBatchBtn();}
// every card of every selected unit, since one unit can render under several groups
function paintSelection(){main.querySelectorAll('.card').forEach(c=>
  c.classList.toggle('sel',state.selMode&&state.selected.has(c.dataset.type)));}
function updateBatchBtn(){batchBtn.textContent=`Transfer selected (${state.selected.size})`;batchBtn.disabled=state.selected.size===0;
  clearSelBtn.style.display=(state.selMode&&state.selected.size)?'inline-block':'none';}

function unitMatches(u){
  const qq=search.value.trim().toLowerCase();
  if(qq&&!(u.name.toLowerCase().includes(qq)||u.type.toLowerCase().includes(qq)||u.dictionary.toLowerCase().includes(qq)))return false;
  if(mercOnly.checked&&!u.mercenary)return false;
  const S=state.sel;
  if(S.faction.size&&!u.ownership.some(f=>S.faction.has(f)))return false;
  if(S.category.size&&!S.category.has(u.kind))return false;
  if(S.class.size&&!S.class.has(u.class))return false;
  if(S.era.size&&![...S.era].some(e=>(u.eras[e]||[]).length>0))return false;
  return true;
}
function render(){
  if(state.mode==='bmdb')return renderBmdb();
  if(state.mode==='sounds')return renderSounds();
  if(!state.data)return;
  const units=state.data.units.filter(unitMatches);
  count.textContent=`${units.length}/${state.data.units.length}`;
  const gb=groupBy.value;
  if(!units.length){main.innerHTML='<div class="empty">No units match.</div>';return;}
  // Ticking a filter says "this is what I'm here for", so its group leads —
  // otherwise picking one faction buries it under every OTHER faction its units
  // are also owned by (a unit renders once per faction it belongs to). Alphabetical
  // within the picked ones, then alphabetical for the rest.
  const picked=state.sel[{faction:'faction',kind:'category',class:'class'}[gb]]||new Set();
  const byPicked=(ka,kb,la,lb)=>(picked.has(kb)-picked.has(ka))||la.localeCompare(lb);
  let groups;
  if(gb==='none')groups=[['All units',units]];
  else if(gb==='faction'){const map=new Map();for(const u of units){for(const f of (u.ownership.length?u.ownership:['(none)']))(map.get(f)||map.set(f,[]).get(f)).push(u);}
    groups=[...map.entries()].sort((a,b)=>byPicked(a[0],b[0],facLabel(a[0]),facLabel(b[0]))).map(([f,us])=>[facLabel(f),us]);}
  else{const map=new Map();for(const u of units){const k=u[gb]||'(none)';(map.get(k)||map.set(k,[]).get(k)).push(u);}
    groups=[...map.entries()].sort((a,b)=>byPicked(a[0],b[0],a[0],b[0]));}
  main.innerHTML=groups.map(([g,us])=>`<section class="faction-group">
    <div class="faction-head"><h2>${esc(g)}</h2><span class="n">${us.length} units</span></div>
    <div class="grid">${us.map(cardHtml).join('')}</div></section>`).join('');
  main.querySelectorAll('.card').forEach(c=>c.onclick=()=>onCard(c.dataset.type));
}
function cardHtml(u){
  const s=(state.selMode&&state.selected.has(u.type))?'sel':'';
  return `<div class="card ${s}" data-type="${esc(u.type)}">
    <div class="tick">✓</div>
    <img loading="lazy" onerror="iconRetry(this)" src="${iconUrl(state.src,u.type)}" alt="">
    <div class="meta"><div class="nm">${esc(u.name)}</div><div class="sub">${esc(u.type)}</div>
    <div>${u.mercenary?'<span class="badge merc">merc</span>':''}<span class="badge">${esc(u.kind||u.category||'?')}</span>${u.class?`<span class="badge cls">${esc(u.class)}</span>`:''}</div></div></div>`;
}
function onCard(type){
  if(state.selMode){ if(state.selected.has(type))state.selected.delete(type); else state.selected.add(type);
    updateBatchBtn(); markCardSel(type); return; }
  if(state.mode==='edit') return openEditor(type);
  openDrawer(type);
}
// A unit owned by several factions renders one card per faction group (and the
// same goes for the other group-by modes), so EVERY copy has to reflect the
// selection — querySelector would only ever find the first, making a selected
// unit look unselected under its other factions.
function markCardSel(type){const on=state.selMode&&state.selected.has(type);
  main.querySelectorAll(`.card[data-type="${cssq(type)}"]`).forEach(c=>c.classList.toggle('sel',on));}
const cssq=s=>s.replace(/"/g,'\\"');

function openDrawer(type){

  d.innerHTML=`<button class="close" onclick="drawer.classList.remove('open')">×</button>
    <div class="dh"><img onerror="iconRetry(this)" src="${iconUrl(state.src,u.type)}"><div><h2>${esc(u.name)}</h2><div class="sub">${esc(u.type)}</div></div></div>

const row=(k,v)=>`<div class="row"><div class="k">${k}</div><div class="v">${v}</div></div>`;

/* ---------- per-unit config ---------- */
function cfgFor(type){
  if(!state.cfg[type]) state.cfg[type]={include_officers:true,include_mount:true,include_crew:true,include_projectile:true,include_engine:true,engine_conflict:'use_existing',
    base_type:'',soldier_from:(state.settings&&state.settings.soldier_from_base)?'base':'source',
    officer_from:'source',mount_from:'source',crew_from:'source',
    field_overrides:{},on_conflict:'rename',new_type:'',new_dictionary:'',make_mercenary:false,merc_icons:false,exclude_models:[],
    asset_conflict:'mod_folder',asset_reroute_dir:'',icon_conflict:'use_existing',
    // voice: 'base' (copy the base unit's barks — the default), 'unit' (copy some
    // other destination unit's), 'none'. snd_accent/snd_class only filter the
    // donor list; the accent/class actually written are always the donor's.
    sound_mode:'base',sound_donor:'',snd_accent:'',snd_class:'',
    base_fac:'',_conflict:null,_fields:null,_orig:null,_fieldsKey:null,_inherited:null};
  return state.cfg[type];
}
// The destination's voice bank, fetched once per destination mod. Needed to know
// whether a base unit HAS barks to copy, and to list the units that do.
async function ensureDestSnd(){
  if(!state.destSnd||state.destSnd.mod!==state.dst){
    try{ state.destSnd=await api.get('/api/sounds?mod='+enc(state.dst)); }
    catch(e){ state.destSnd={mod:state.dst,has_file:false,donors:[],accents:[],classes:[]}; }
  }
  return state.destSnd;
}

      ? `/api/base_fields?source=${encodeURIComponent(state.src)}&unit=${encodeURIComponent(type)}`
        +`&dest=${encodeURIComponent(state.dst)}&base=${encodeURIComponent(c.base_type)}`
        +froms.map(k=>`&${k}=${encodeURIComponent(c[k]||'source')}`).join('')

  // block, and these two are what send the game there. Editing one here would

    else if(/^-/.test(body))icon='·';
    body=body.replace(/^[!\-]\s*/,'');
    // highlight counts and file paths inside the line
    let html=esc(body)
      .replace(/(^|\s)(\d+)(?=\s|$|\))/g,'$1<span class="num">$2</span>')
      .replace(/([\w./\\-]+\.(?:mesh|texture|tga|dds|spr|txt|modeldb))/g,'<span class="path">$1</span>');
    return `<div class="srow lvl${lvl}${sev?' '+sev:''}${i===0?' shead':''}">`
      +`<span class="sicon">${icon}</span><span class="stext">${html}</span></div>`;
  }).join('');
  return `<div class="sum">${rows}</div>`;
}

/* ---------- 500 vanilla unit-limit warning ---------- */
function projectedDestCount(){
  const dd=state.destData; if(!dd) return null;
  const have=new Set(dd.units.map(u=>u.type));
  let add=0;
  for(const t of composerList){ const c=cfgFor(t);
    if(!have.has(t)) add++;                     // brand-new unit type
    else if(c.on_conflict==='rename') add++;    // copied under a new name
    // overwrite / skip add no net type
  }
  return {current:dd.units.length, add, projected:dd.units.length+add};
}
const limitIgnored=mod=>(state.settings.unit_limit_ignored||[]).includes(mod);
function unitLimitBanner(){
  const p=projectedDestCount(); if(!p) return '';
  if(Math.max(p.current,p.projected)<=VANILLA_UNIT_LIMIT || limitIgnored(state.dst)) return '';

}

/* ---------- asset (texture/mesh) conflict resolver ---------- */
const modFolderName=()=>'unit_models/'+(state.src||'').replace(/[^A-Za-z0-9._-]+/g,'_').replace(/^_+|_+$/g,'');
function assetConflictUI(type,r){
  const c=cfgFor(type);
  const list=r.asset_conflicts||[];
  // three buckets, each with its own resolution mode: battle-model assets (which
  // can be relocated), icons (located by name, can't be) and siege-engine files
  // (can't be either — their textures are baked into the mesh binaries).
  const aConf=list.filter(x=>x.kind!=='icon'&&x.kind!=='engine');
  const iConf=list.filter(x=>x.kind==='icon');
  const eConf=list.filter(x=>x.kind==='engine');
  const aDiff=aConf.filter(x=>!x.identical), aIdent=aConf.filter(x=>x.identical);
  const iDiff=iConf.filter(x=>!x.identical);
  const eDiff=eConf.filter(x=>!x.identical);
  const reloc=(c.asset_conflict==='reroute'||c.asset_conflict==='mod_folder');
  let html='';
  // --- meshes / textures: keep, overwrite, or relocate (which avoids conflicts entirely)
  if(aConf.length||reloc){
    const warn=aDiff.length&&!reloc;
    html+=`<fieldset class="assetconf" ${warn?'':'style="border-color:var(--edge)"'}>
      <legend class="${warn?'w-warn':''}">Textures / meshes</legend>
      <div class="count">${aConf.length} file(s) share a name &amp; path with the destination —
        <b class="w-good">${aIdent.length}</b> byte-identical (reused),
        <b class="${aDiff.length?'w-warn':''}">${aDiff.length}</b> differ.
        ${r.reroute_dir?`<br><span class="w-good">Relocating ${r.relocated_count} file(s) → <code>${esc(r.reroute_dir)}/</code> — no conflicts.</span>`:''}</div>
      <div class="radio-row" style="margin-top:6px">
        <label><input type="radio" name="ac" value="mod_folder" ${c.asset_conflict==='mod_folder'?'checked':''}> New folder named after the mod — <code>${esc(modFolderName())}/</code> <b class="w-good">(default)</b></label>
        <label><input type="radio" name="ac" value="reroute" ${c.asset_conflict==='reroute'?'checked':''}> Reroute — pick/type a folder under <code>unit_models/</code></label>
        <label><input type="radio" name="ac" value="use_existing" ${c.asset_conflict==='use_existing'?'checked':''}> Use existing — keep the destination’s files</label>
        <label><input type="radio" name="ac" value="overwrite" ${c.asset_conflict==='overwrite'?'checked':''}> Overwrite — replace with the source’s files (backed up, undoable)</label>
      </div>
      <div id="rerouteBox" style="${c.asset_conflict==='reroute'?'':'display:none'};margin-top:8px">
        <div class="brbar">

          <div class="brbar" style="margin-top:6px">
            <button onclick="brUp()">↑ Up</button><span class="count" id="brNow"></span>
          </div>
          <div class="brlist" id="brList"></div>
          <div class="brbar" style="margin-top:6px">
            <input id="brNew" placeholder="new sub-folder name">
            <button onclick="brMakeSub()">Use new sub-folder</button>
          </div>
        </div>
      </div>
      ${reloc?`<div class="count" style="margin-top:6px">Files keep their structure below <code>unit_models/</code>, and the added <code>battle_models.modeldb</code> entries are rewritten to the new paths.</div>`:''}
      ${aDiff.length&&!reloc?`<div class="flist">${aDiff.map(x=>`<div class="frow"><span class="fp">${esc(x.rel)}</span><span class="fs">src ${x.src_size}B vs dest ${x.dst_size}B${x.src_size===x.dst_size?' — same size, different bytes':''}</span></div>`).join('')}</div>`:''}
    </fieldset>`;
  }
  // --- icons: located by faction folder + dictionary, so they can't be relocated
  if(iConf.length){
    html+=`<fieldset class="assetconf" ${iDiff.length?'':'style="border-color:var(--edge)"'}>
      <legend class="${iDiff.length?'w-warn':''}">Unit card / info icons</legend>
      <div class="count">${iConf.length} icon(s) already exist — <b class="w-good">${iConf.length-iDiff.length}</b> identical,
        <b class="${iDiff.length?'w-warn':''}">${iDiff.length}</b> differ.
        The game finds icons by faction folder + dictionary name, so these <b>cannot be rerouted</b>.</div>
      ${iDiff.length?`<div class="radio-row" style="margin-top:6px">
        <label><input type="radio" name="ic" value="use_existing" ${c.icon_conflict!=='overwrite'?'checked':''}> Use existing icon</label>
        <label><input type="radio" name="ic" value="overwrite" ${c.icon_conflict==='overwrite'?'checked':''}> Overwrite with the source’s icon</label>
      </div>
      <div class="flist">${iDiff.map(x=>`<div class="frow"><span class="fp">${esc(x.rel)}</span><span class="fs">src ${x.src_size}B vs dest ${x.dst_size}B</span></div>`).join('')}</div>`:''}
    </fieldset>`;
  }
  // --- siege-engine files: texture paths are baked into each mesh, so no relocation
  if(eConf.length){
    html+=`<fieldset class="assetconf" ${eDiff.length?'':'style="border-color:var(--edge)"'}>
      <legend class="${eDiff.length?'w-warn':''}">Siege-engine files</legend>
      <div class="count">${eConf.length} engine file(s) already exist — <b class="w-good">${eConf.length-eDiff.length}</b> identical,
        <b class="${eDiff.length?'w-warn':''}">${eDiff.length}</b> differ.

      ${eDiff.length?`<div class="radio-row" style="margin-top:6px">
        <label><input type="radio" name="ec" value="use_existing" ${c.engine_conflict!=='overwrite'?'checked':''}> Keep the destination’s <b class="w-good">(default)</b> — the imported engine may wear its skin</label>

      </div>

    html+=`<fieldset class="assetconf"><legend class="w-warn">Engine override warning</legend>
      <div class="count">The engine references ${ovr.length} vanilla file(s) that <b>${esc(state.src)} does not override
        but ${esc(state.dst)} does</b>. Nothing is copied for them — ${esc(state.dst)}’s version wins, and it may not be
        what this engine expects. Check these by hand:</div>
      <div class="flist">${ovr.map(p=>`<div class="frow"><span class="fp">${esc(p)}</span></div>`).join('')}</div>
    </fieldset>`;
  }
  // --- descr_engine_skeleton.txt entries (a mounted engine's `class` lands here)
  const skel=r.engine_skeleton_actions||[];
  if(skel.length){
    const kept=skel.filter(x=>x.action==='reuse');
    html+=`<fieldset class="assetconf" ${kept.length?'':'style="border-color:var(--edge)"'}>
      <legend class="${skel.some(x=>x.action==='vanilla')?'w-warn':''}">Engine skeletons (<code>descr_engine_skeleton.txt</code>)</legend>
      <div class="count">An entry already present in ${esc(state.dst)} is <b>never overwritten</b> — it is reused as-is.</div>
      <div class="flist">${skel.map(x=>`<div class="frow"><span class="fp">${esc(x.name)}</span><span class="fs ${
        x.action==='vanilla'?'w-warn':x.action==='add'?'w-good':''}">${esc(x.action)} — ${esc(x.detail)}</span></div>`).join('')}</div>
    </fieldset>`;
  }
  return html;
}

async function doPreview(){
  const type=state.editing; const box=document.getElementById('previewBox'); if(!box)return null;
  box.innerHTML='<div class="preview">Planning…</div>';
  const r=await api.post('/api/plan',{source:state.src,dest:state.dst,unit:type,options:optsPayload(type)});
  if(state.editing!==type) return r;          // user switched units mid-plan
  if(r.error){box.innerHTML=`<div class="preview w-bad">${esc(r.error)}</div>`;return null;}
  let html=renderSummary(r.summary);
  cfgFor(type)._conflict=r.unit_conflict;
  // Having rendered the conflict fieldset (with its pre-filled rename defaults, editable
  // right here) IS the review step — don't also force a redundant "Apply again" pause in
  // doApply() for a unit whose resolution the user already saw and could adjust.
  if(r.unit_conflict) cfgFor(type)._resolved=true;
  if(r.unit_conflict) html+=conflictUI(type);
  html+=assetConflictUI(type,r);
  box.innerHTML=html; wireConflict(type); wireAssetConflict(type);
  return r;
}

const PROG_ICON={pending:'·',current:'⟳',done:'✓',error:'✗',skipped:'–'};
const PROG_CLS={current:'w-warn',done:'w-good',error:'w-bad',skipped:''};
function renderProgress(types,status){
  const done=status.filter(s=>s==='done'||s==='error'||s==='skipped').length;
  const curIdx=status.indexOf('current');
  const pct=types.length?Math.round((done/types.length)*100):0;
  const rows=types.map((t,i)=>{
    const st=status[i];
    return `<div class="proglist-row ${PROG_CLS[st]||''}"><span class="pi">${PROG_ICON[st]}</span> ${esc(t)}</div>`;
  }).join('');
  document.getElementById('modal').innerHTML=`<h2>Transferring…</h2>
    <div class="mbody">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="count" style="margin:8px 0 12px">${done} of ${types.length} done
        ${curIdx>=0?` — <b>${esc(types[curIdx])}</b>`:''}</div>
      <div class="proglist">${rows}</div>
    </div>`;
}

/* Real progress for the long BMDB jobs (the scan and the cleanup). Each is ONE
   request that runs for seconds, so the server reports where it is under a job id
   and this polls that id alongside the request — a bar parked at a made-up width
   is exactly what this replaces. Polling stops the moment the request settles. */
const newJob=()=>'j'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function jobBox(title,note){
  document.getElementById('modal').innerHTML=`<h2>${esc(title)}</h2>
    <div class="mbody">
      <div class="progress-track"><div class="progress-fill" id="jobFill" style="width:0%"></div></div>
      <div class="count" style="margin-top:8px"><b id="jobPct">0%</b>
        <span id="jobStep">starting…</span></div>
      <div class="count" style="margin-top:10px">${note}</div>
    </div>`;
}
// Only touches the bar if it is still on screen — the job's own result replaces
// the modal, and a late poll must not paint over it.
function jobPaint(pct,label){
  const f=document.getElementById('jobFill'); if(!f)return;
  f.style.width=Math.max(0,Math.min(100,pct))+'%';
  document.getElementById('jobPct').textContent=pct+'%';
  document.getElementById('jobStep').textContent=label?'— '+label:'';
}
async function runJob(job,title,note,run){
  let done=false;
  jobBox(title,note);
  (async()=>{while(!done){
    await new Promise(r=>setTimeout(r,300));
    if(done)break;
    // one try, no retries: a dropped poll just means the next one paints instead
    let p=null; try{p=await api.get('/api/progress?job='+enc(job),1);}catch(e){}
    if(!done&&p&&typeof p.pct==='number')jobPaint(p.pct,p.label||'');
  }})();
  try{ return await run(); } finally{ done=true; }
}
async function doApply(){
  const types=composerList.length?composerList:[state.editing];
  // ensure conflicts are resolved: preview each; if conflict and not yet resolved, focus it
  for(const t of types){
    const r=await api.post('/api/plan',{source:state.src,dest:state.dst,unit:t,options:optsPayload(t)});
    if(r.error){toast(`${t}: ${r.error}`);state.editing=t;renderComposer();await doPreview();return;}
    if(r.base_error){toast(`${t}: ${r.base_error}`);state.editing=t;renderComposer();return;}
    if(r.option_error){toast(`${t}: ${r.option_error}`);state.editing=t;renderComposer();return;}
    if(r.unit_conflict && !cfgFor(t)._resolved){ state.editing=t;renderComposer();await doPreview();
      toast(`“${t}” exists in destination — choose rename / overwrite / skip, then Apply again.`);
      cfgFor(t)._resolved=true; return; }
  }
  let ok=0,skip=0,cleaner=null;
  const status=types.map(()=>'pending');
  for(let i=0;i<types.length;i++){
    const t=types[i];
    status[i]='current'; renderProgress(types,status);
    const res=await api.post('/api/apply',{source:state.src,dest:state.dst,unit:t,
      options:optsPayload(t),
      // only if ticked, and then once per batch, after the last unit
      run_cleaner:cleanerOptIn&&i===types.length-1});
    if(res.error){status[i]='error';renderProgress(types,status);toast(`${t}: ${res.error}`);return;}
    if(res.cleaner)cleaner=res.cleaner;
    if(res.plan&&res.plan.skipped){skip++;status[i]='skipped';} else {ok++;status[i]='done';}
    renderProgress(types,status);
  }
  closeModal();
  const cmsg=cleaner?(cleaner.ran?'  · cleaner ran'+(cleaner.copied?' (copied in)':''):`  · cleaner failed: ${cleaner.error||'?'}`):'';
  toast(`${state.src===state.dst?'Created':'Transferred'} ${ok} unit(s)${skip?`, skipped ${skip}`:''} ✓${cmsg}  (undo in 🕑 Log)`,4200);
  // these ones are done — leaving them ticked invites transferring them twice
  clearSelection();
  state.cfg={};
  if(state.dst===state.src)loadSource();
}

/* ======================= SOUNDS MODE =======================
   The unit VOICE BANK (data/export_descr_sounds_units_voice.txt): which .wav files
   a unit's soldiers shout when you select them.

   A unit's voice needs two things that have to agree: a `unit <type>` entry inside
   one accent/class block of the bank, and the EDU's `accent` + `voice_type` fields
   pointing at that same block. Get one without the other and the unit is silent —
   which is why every row here writes both, and why the accent/class of a row snap
   to whatever donor you pick instead of being editable independently.

   Everything is staged in memory and written in one apply, straight into the mod,
   through the same backups + 🕑 Log undo as a transfer. (The prototype this grew
   out of needed a .bat to generate reference files, a hand-run editor, exported
   patch CSVs, and a second .bat to fold them back in — none of that exists here.) */
async function loadSounds(){
  main.innerHTML='<div class="empty">Reading '+esc(state.src)+'’s voice bank…</div>';
  let r;
  try{ r=await api.get('/api/sounds?mod='+enc(state.src)); }
  catch(e){ main.innerHTML=`<div class="empty">Couldn't read the voice bank.<br>
    <span class="count">${esc(''+e)}</span><br><br>
    <button class="primary" onclick="loadSounds()">Retry</button></div>`; return; }
  // `ops` is the staging area: unit type -> {accent, class, donor, remove}
  state.snd=Object.assign({tab:'missing',ops:{},fAccent:'',fClass:'',onlyBad:false,
                           bulkDonor:'',view:[]},r);
  renderSounds();
}
// Donors that live in one accent/class block. A donor from another block is no use:
// copying its entry into this block would give the unit that block's neighbours,
// not the sounds you picked.
function sndDonors(accent,cls){
  if(!accent||!cls)return [];
  return state.snd.donors.filter(d=>d.accent===accent&&d['class']===cls);
}
function sndOp(type){const s=state.snd; return s.ops[type]||(s.ops[type]={});}
// The value a row currently shows: what's staged, else the bank's (existing units)
// or the EDU's if the bank has a block for it (missing units — a unit whose EDU
// already names a real accent is nearly always meant to stay there).
function sndVal(u,key){
  const op=state.snd.ops[u.type]||{};
  if(op[key]!==undefined)return op[key];
  if(key==='donor')return '';
  if(key==='accent')return u.accent!==undefined?u.accent:(u.accent_valid?u.edu_accent:'');
  return u['class']!==undefined?u['class']:(u.class_valid?u.edu_class:'');
}
// A row is only sent when it would actually do something. A new entry needs a donor
// to copy (there is nothing else to build one from); an existing one can also just
// move block, or be dropped.
function sndReady(u){
  const op=state.snd.ops[u.type]||{};
  if(op.remove)return true;
  const a=sndVal(u,'accent'),c=sndVal(u,'class');
  if(!a||!c)return false;
  if(u.accent===undefined)return !!op.donor;          // missing -> needs a donor
  return !!op.donor||a!==u.accent||c!==u['class'];
}
function sndOps(){
  const s=state.snd,out=[];
  for(const u of s.missing.concat(s.existing)){
    if(!sndReady(u))continue;
    const op=s.ops[u.type]||{};
    out.push({unit:u.type,accent:sndVal(u,'accent'),class:sndVal(u,'class'),
              donor:op.donor||'',remove:!!op.remove});
  }
  for(const o of s.orphans){const op=s.ops[o.type];
    if(op&&op.remove)out.push({unit:o.type,remove:true});}
  return out;
}
/* One place where every staged change is made, and the ONLY place the row is
   repainted from — state first, paint second. Doing it the other way round is what
   made the prototype need two clicks to take a unit: picking a donor rebuilt the
   dropdown from a `copyFrom` that had not been written yet, so the first pick was
   thrown away and only the second one stuck. */
function sndPick(i,key,value){
  const u=state.snd.view[i]; if(!u)return;
  const op=sndOp(u.type);
  op[key]=value;
  if(key==='donor'&&value){
    const d=state.snd.donors.find(x=>x.name===value);
    if(d){op.accent=d.accent; op['class']=d['class'];}   // the entry has to land in ITS block
  }
  // moving the row to another block orphans a donor from the old one
  if((key==='accent'||key==='class')&&op.donor){
    const d=state.snd.donors.find(x=>x.name===op.donor);
    if(!d||d.accent!==sndVal(u,'accent')||d['class']!==sndVal(u,'class'))op.donor='';
  }
  renderSounds();
}
function sndToggleRemove(i,on){
  const u=state.snd.view[i]; if(!u)return;
  sndOp(u.type).remove=on; renderSounds();
}
function sndTab(t){state.snd.tab=t; renderSounds();}
function sndFilter(key,v){state.snd[key]=v; renderSounds();}
function sndReset(){state.snd.ops={}; renderSounds(); toast('Staged voice changes cleared.');}
// Give every visible row the same donor in one go — the usual job here is "these
// forty new units should all sound like that one", and doing it row by row is the
// step this replaces.
function sndBulk(){
  const name=state.snd.bulkDonor; if(!name){toast('Pick a unit to copy from first.');return;}
  const d=state.snd.donors.find(x=>x.name===name); if(!d)return;
  let n=0;
  for(const u of state.snd.view){
    if(u.type===name)continue;                       // never make a unit copy itself
    const op=sndOp(u.type); op.donor=name; op.accent=d.accent; op['class']=d['class']; n++;
  }
  renderSounds();
  toast(`${n} row(s) set to copy “${name}” (${d.accent}/${d['class']}).`);
}
const SND_CAP=150;   // selects are expensive; the filters above are how you reach the rest
function renderSounds(){
  if(!state.snd||state.snd.mod!==state.src)return loadSounds();
  const s=state.snd;
  if(!s.has_file){
    main.innerHTML=`<div class="empty">“${esc(state.src)}” has no
      <code>data/export_descr_sounds_units_voice.txt</code>.<br>

      to the game's own.</span></div>`;
    sndBtn.textContent='Apply voice edits (0)'; sndBtn.disabled=true; return;
  }
  const qq=search.value.trim().toLowerCase();
  const list=s.tab==='missing'?s.missing:s.tab==='existing'?s.existing:s.orphans;
  const all=list.filter(u=>{
    if(qq&&!(u.type.toLowerCase().includes(qq)||(u.name||'').toLowerCase().includes(qq)))return false;
    const a=sndVal(u,'accent'),c=sndVal(u,'class');
    if(s.fAccent&&a!==s.fAccent)return false;
    if(s.fClass&&c!==s.fClass)return false;
    if(s.onlyBad&&s.tab==='existing'&&!(u.accent_conflict||u.class_conflict))return false;

  count.textContent=`${all.length}/${list.length}`;
  const nConf=s.existing.filter(u=>u.accent_conflict||u.class_conflict).length;
  const tab=(k,label,n)=>`<button class="${s.tab===k?'on':''}" onclick="sndTab('${k}')">${label} <span class="badge">${n}</span></button>`;
  const opt=(v,cur)=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`;
  main.innerHTML=`<div class="sndhead">
      <h2>${esc(state.src)} · unit voices</h2>

        ${s.pairs.length} accent/class blocks.
        ${nConf?`<b class="w-warn">${nConf}</b> unit(s) sit in a block their EDU doesn't point at — the game follows the EDU, so those entries are dead.`:''}</span>
      <div class="sndtabs">
        ${tab('missing','No voice entry',s.missing.length)}

    </div>

    <div class="sndbar">
      <span class="count">Filter</span>
      <select onchange="sndFilter('fAccent',this.value)">
        <option value="">All accents</option>${s.accents.map(a=>opt(a,s.fAccent)).join('')}</select>
      <select onchange="sndFilter('fClass',this.value)">

      ${s.tab==='orphans'?'':`<label class="chk"><input type="checkbox" ${s.onlyBad?'checked':''}
        onchange="sndFilter('onlyBad',this.checked)"> ${s.tab==='existing'?'only ones the EDU disagrees with':'only ones with no usable accent'}</label>`}
      <span class="grow"></span>
      ${s.tab==='orphans'?'':`<span class="count">Set all ${s.view.length} shown to copy</span>
      <select onchange="sndFilter('bulkDonor',this.value)" style="max-width:230px">
        <option value="">— pick a unit —</option>
        ${s.donors.map(d=>`<option value="${esc(d.name)}" ${d.name===s.bulkDonor?'selected':''}>${esc(d.name)} (${esc(d.accent)}/${esc(d['class'])})</option>`).join('')}
      </select>
      <button onclick="sndBulk()">Apply to shown</button>`}
      ${staged?`<button class="danger" onclick="sndReset()">✕ Clear ${staged} staged</button>`:''}
    </div>
    ${all.length?`<div class="sndlist">
      <div class="sndrow hrow"><span>Unit</span><span>In game now</span><span>Accent</span>
        <span>Class</span><span>Copy sounds from</span><span>Drop</span></div>
      ${s.view.map(sndRowHtml).join('')}</div>`
     :'<div class="empty">No units match.</div>'}
    ${all.length>SND_CAP?`<div class="count" style="margin:10px 0">Showing the first
      ${SND_CAP} of ${all.length} — narrow it down with the filters or the search box.</div>`:''}`;
}
function sndRowHtml(u,i){
  const s=state.snd,op=s.ops[u.type]||{};
  const a=sndVal(u,'accent'),c=sndVal(u,'class');
  const isOrphan=s.tab==='orphans', has=u.accent!==undefined;
  const ready=sndReady(u), dropping=!!op.remove;
  // what the game does with this unit right now, before anything staged
  let now;
  if(isOrphan) now=`<span class="w-warn">no such unit</span>`;
  else if(!has) now=u.edu_accent
    ? (u.accent_valid?`<span class="count">${esc(u.edu_accent)} — generic</span>`
                     :`<span class="w-bad" title="the EDU names an accent this mod's voice bank has no block for">${esc(u.edu_accent)} ✗</span>`)
    : `<span class="w-warn" title="no accent line in the EDU at all">no accent</span>`;
  else now=(u.accent_conflict||u.class_conflict)
    ? `<span class="w-bad" title="EDU says ${esc(u.edu_accent||'—')}/${esc(u.edu_class||'—')}, the bank has it in ${esc(u.accent)}/${esc(u['class'])} — the game follows the EDU, so these sounds never play">${esc(u.accent)}/${esc(u['class'])} ✗</span>`
    : `<span class="count">${esc(u.accent)}/${esc(u['class'])}</span>`;
  if(isOrphan) return `<div class="sndrow ${dropping?'dropping':''}">
    <div class="un"><div class="nm">${esc(u.name)}</div><div class="ty">voice entry only</div></div>
    <span class="now">${now}</span>
    <span class="count">${esc(u.accent)}</span><span class="count">${esc(u['class'])}</span>
    <span class="count">—</span>
    <span class="rm"><input type="checkbox" ${dropping?'checked':''} title="delete this entry from the voice bank"
      onchange="sndToggleRemove(${i},this.checked)"></span></div>`;
  const donors=sndDonors(a,c);
  const sel=(cur,vals,key,blank)=>`<select onchange="sndPick(${i},'${key}',this.value)" ${dropping?'disabled':''}>
    <option value="">${blank}</option>
    ${vals.map(v=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
  return `<div class="sndrow ${dropping?'dropping':ready?'staged':''}">
    <div class="un"><div class="nm">${esc(u.name||u.type)}</div><div class="ty">${esc(u.type)}</div></div>
    <span class="now">${now}</span>
    ${sel(a,s.accents,'accent','— accent —')}
    ${sel(c,s.classes,'class','— class —')}
    <select onchange="sndPick(${i},'donor',this.value)" ${dropping?'disabled':''}
      title="${a&&c?`units with their own barks in ${esc(a)}/${esc(c)}`:'pick an accent and a class first'}">
      <option value="">${a&&c?(has?'— keep its own sounds —':`— pick a unit (${donors.length}) —`):'— accent/class first —'}</option>
      ${donors.map(d=>`<option value="${esc(d.name)}" ${d.name===(op.donor||'')?'selected':''}>${esc(d.name)}</option>`).join('')}
    </select>
    <span class="rm">${has?`<input type="checkbox" ${dropping?'checked':''}
      title="remove this unit's voice entry from the bank" onchange="sndToggleRemove(${i},this.checked)">`:''}</span>
  </div>`;
}
async function sndApply(){
  const ops=sndOps(); if(!ops.length)return;
  const modal=document.getElementById('modal');
  modal.className='modal'; modal.innerHTML='<h2>Planning voice edits…</h2>';
  overlay.classList.add('open');
  let r;
  try{ r=await api.post('/api/sounds/plan',{mod:state.src,ops}); }
  catch(e){ r={error:''+e}; }
  if(r.error&&!r.errors){ modal.innerHTML=`<h2>Voice edits</h2><div class="mbody w-bad">${esc(r.error)}</div>
    <div class="foot"><button onclick="closeModal()">Close</button></div>`; return; }
  const bad=(r.errors||[]).length;
  modal.innerHTML=`<h2>Voice edits <span class="pill">${esc(state.src)}</span></h2>
    <div class="mbody">
      ${bad?`<div class="warnbox">⚠ <b>${bad} row(s) can't be written</b> — nothing is applied
        until they are fixed or removed from the selection.<br>
        ${r.errors.map(e=>esc(e)).join('<br>')}</div>`:''}
      <div class="count" style="margin-bottom:8px">Writes
        <code>data/export_descr_sounds_units_voice.txt</code>${r.edu_rewritten?
        ' and <code>data/export_descr_unit.txt</code> (the matching <code>accent</code> / <code>voice_type</code> lines)':''}.
        Both are backed up first — 🕑 Log → Undo restores them byte-exact.</div>
      ${renderSummary(r.summary)}
    </div>
    <div class="foot">${cleanerBoxHtml()}<button onclick="closeModal()">Cancel</button>
      <button class="primary" ${bad?'disabled':''} onclick="sndDoApply()">Apply ${ops.length} change(s)</button></div>`;
}
async function sndDoApply(){
  const ops=sndOps();
  document.getElementById('modal').innerHTML=`<h2>Writing voice edits…</h2>
    <div class="mbody"><div class="progress-track"><div class="progress-fill" style="width:60%"></div></div>
      <div class="count" style="margin-top:8px">${ops.length} unit(s)</div></div>`;
  let r;
  try{ r=await api.post('/api/sounds/apply',{mod:state.src,ops,run_cleaner:cleanerOptIn}); }
  catch(e){ r={error:''+e}; }

/* ======================= UNIT EDITOR (edit mode) =======================
   Edits one mod in place: EDU fields, the localised name/description, the
   battle_models.modeldb entries the unit uses (including creating a new entry
   from an existing one), and deleting the unit. Every apply goes through the
   same backup + log as a transfer, so 🕑 Log → Undo reverts it. */
const enc=encodeURIComponent;
const modRoot=n=>(state.mods.find(m=>m.name===n)||{}).root||'';
// A native dialog hands back an absolute path; show it as the mod-relative one
// the game actually uses (the server accepts either).
function relInMod(p){
  const root=modRoot(state.src); if(!p||!root)return p||'';
  const norm=s=>s.replace(/\\/g,'/').replace(/\/+$/,'');
  const r=norm(root)+'/data/', s=norm(p);
  return s.toLowerCase().startsWith(r.toLowerCase())?s.slice(r.length):s;
}

async function openEditor(type){
  const modal=document.getElementById('modal');
  modal.className='modal wide'; modal.innerHTML='<h2>Loading unit…</h2>';
  overlay.classList.add('open');

  catch(e){ modal.innerHTML=`<h2>Unit editor</h2><div class="mbody w-bad">${esc(''+e)}</div>
    <div class="foot"><button onclick="closeModal()">Close</button></div>`; return; }
  if(d.error){ modal.innerHTML=`<h2>Unit editor</h2><div class="mbody w-bad">${esc(d.error)}</div>
    <div class="foot"><button onclick="closeModal()">Close</button></div>`; return; }
  state.ed={mod:state.src,unit:type,d,tab:'identity',ov:{},rm:new Set(),
            loc:Object.assign({},d.loc),newType:'',newDict:'',
            mEdits:{},newModels:[],open:{},form:null,removeOldIcons:false,added:new Set(),
            // per-entry UI state: which faction has its "unique textures" panel
            // open, and the last /api/edit/model_folder answer for its folder box
            facOpen:{},folder:{}};
  renderEditor();
}
// Every unit opens in its own browser tab, so you can follow "this model is also

function openUnitTab(type){

// A model's users are unit types, plus "mount:<name>" / "file:<name>" referrers

function userLink(name){
