    c._fieldsKey=key;
    // With a base, the SOURCE unit's own values are what a B can be switched back
    // to, so they are fetched alongside (once per unit — they never change).
    if(c.base_type&&!c._srcFields){
      try{
        const s=await api.get(`/api/unit_fields?mod=${encodeURIComponent(state.src)}`
                              +`&type=${encodeURIComponent(type)}`);
        c._srcFields=Object.fromEntries(s.fields||[]);
      }catch(e){ c._srcFields={}; }
    }
    // an override that now matches the new baseline is no longer an override
    for(const k of Object.keys(c.field_overrides))
      if(c.field_overrides[k]===c._orig[k]) delete c.field_overrides[k];
  }
  if(state.editing!==type)return;
  renderAllFields(type);
}
// Show EVERY EDU field of the unit at once (like ModdingTool's unit edit screen).
// Any value changed from its original becomes a field override.
function renderAllFields(type){
  const c=cfgFor(type); const box=document.getElementById('allFields'); if(!box)return;
  if(!c._fields.length){box.innerHTML='<div class="count" style="padding:6px">No editable fields.</div>';updateFieldChanged();return;}
  if(gfMode()==='guided'){
    const host=gfHostComposer();
    box.classList.add('guided'); box.innerHTML=gfRender(host); gfWire(host);
    updateFieldChanged(); return;
  }
  box.classList.remove('guided');
  const inh=new Set(c.base_type?(c._inherited||[]):[]);
  // A copied voice OWNS accent + voice_type: the entry is written into the donor's
  // block, and these two are what send the game there. Editing one here would
  // silently point the unit at a block its entry is not in, so they are shown as
  // the donor's and locked, with the same explanation as the voice panel's 🔒.
  const snd=soundDonor(c), sndLock=snd.accent
    ? {vals:{accent:snd.accent,voice_type:snd.cls},
       why:`Locked by the voice panel — “${snd.name}”’s sounds are copied into `
          +`${snd.accent} / ${snd.cls}, and these two fields are what point the game at `
          +`that block. Choose “Don’t import sound” to edit them yourself.`}
    : null;
  // A unit that has no `accent` line at all still GETS one when a voice is copied
  // (the game can't find the block without it), so show that row rather than
  // writing a field the panel never mentioned. It goes where the EDU keeps it —
  // right after voice_type / class.
  // Replacing a unit does not rename it: `type` and `dictionary` ARE the unit
  // being rewritten. They stay the destination's and are shown as such — editing
  // one here would rename the unit and orphan its localisation entry and icons,
  // which is the one thing this mode exists to avoid.
  const rb=baseUnitOf(c);
  const idLock=(isReplace(c)&&rb)
    ? {vals:{type:rb.type,dictionary:rb.dictionary},
       why:`Locked — this transfer rewrites “${rb.type}” in place, so it keeps its own `
          +`type and dictionary. Those two are what tie it to its name, description `
          +`and icons; change them and you have renamed the unit instead of replacing it.`}
    : null;
  // both locks in one lookup, most specific first
  const lockFor=key=>(idLock&&(key in idLock.vals))?{val:idLock.vals[key],why:idLock.why}
                    :(sndLock&&(key in sndLock.vals))?{val:sndLock.vals[key],why:sndLock.why}
                    :null;
  let fields=c._fields;
  if(sndLock){
    fields=c._fields.slice();
    for(const k of ['voice_type','accent']){
      if(fields.some(([l])=>l===k))continue;
      const after=fields.findIndex(([l])=>l==='voice_type'||l==='class');
      fields.splice(after<0?0:after+1,0,[k,sndLock.vals[k]]);
    }
  }
  box.innerHTML=fields.map(([label,val])=>{
    const dup=/#\d+$/.test(label);
    const key=label.replace(/#\d+$/,'');
    const lk=dup?null:lockFor(key);
    const cur=lk?lk.val
      :(label in c.field_overrides)?c.field_overrides[label]:val;
    const changed=!lk&&(label in c.field_overrides)&&c.field_overrides[label]!==c._orig[label];
    const isInh=inh.has(key);
    const why=lk?lk.why
      :isInh?`${isReplace(c)?'Kept from':'Inherited from the base unit'} ${c.base_type}.`
      :dup?'This field appears more than once in the unit — edit this one in the EDU directly.'
      :(GF_FIELDS[key]&&GF_FIELDS[key].t?GF_FIELDS[key].t+'. '+gfPlainDoc(key):'');
    return `<div class="afrow${dup?' dup':''}" data-label="${esc(label)}">
      <label>${qm(why,label)}${esc(label)}${
        lk?'<span class="ibadge">🔒</span>':isInh?baseBadge(c,label,cur):''}</label>
      <input data-k="${esc(label)}" value="${esc(cur)}" class="${changed?'changed':''}"
        ${lk||dup?'disabled':''}></div>`;
  }).join('');
  box.querySelectorAll('input[data-k]').forEach(inp=>{
    inp.oninput=()=>{const k=inp.dataset.k, v=inp.value;
      if(v!==c._orig[k]) c.field_overrides[k]=v; else delete c.field_overrides[k];
      inp.classList.toggle('changed', v!==c._orig[k]);
      // a typed value is no longer the base's, so the B has to stop claiming it is
      const b=box.querySelector(`button[data-b="${cssq(k)}"]`);
      if(b)b.outerHTML=baseBadge(c,k,v);
      updateFieldChanged();};
  });
  updateFieldChanged(); filterFields();
}
/* The B beside an inherited field is a switch, not a label: ON the field carries
   the base unit's value, OFF it carries the source unit's own. Nothing new is
   stored for it — "off" is just a field override holding the source's value, which
   is what the transfer engine already knows how to write. It follows that typing
   your own value turns the B off too: the field is no longer the base's. */
const baseSrcVal=(c,label)=>(c._srcFields||{})[label];
function baseBadge(c,label,cur){
  const src=baseSrcVal(c,label);
  const rep=isReplace(c);
  const same=src===undefined||src===c._orig[label];
  if(same)                        // nothing to switch to — a plain marker, as before
    return `<span class="ibadge" title="${rep?'kept from':'from base'} ${esc(c.base_type)}${
      src===undefined?" — the transferred unit has no such line, so this one can only come from "+esc(c.base_type)
                     :" — the transferred unit's value is identical"}">B</span>`;
  const on=cur===c._orig[label];
  return `<button type="button" class="ibadge${on?'':' off'}" data-b="${esc(label)}"
    onclick="toggleBaseField('${q1(esc(label))}')"
    title="${on?`${rep?'keeping':'using'} ${esc(c.base_type)}'s value — click to ${rep?'import':'keep'} ${esc(state.editing)}'s own (${esc(src)})`
              :`${rep?'imported from':'using'} ${esc(state.editing)}${rep?'':"'s own value"} — click to go back to ${esc(c.base_type)}'s (${esc(c._orig[label])})`}">B</button>`;
}
function toggleBaseField(label){
  const c=cfgFor(state.editing);
  const src=baseSrcVal(c,label); if(src===undefined)return;
  // guided mode has no single box holding the line — the value lives in the
  // override map and the boxes are drawn from it, so flip it there and redraw
  if(document.querySelector('#allFields .gfwrap')){
    const cur=(label in c.field_overrides)?c.field_overrides[label]:c._orig[label];
    const next=(cur===c._orig[label])?src:c._orig[label];
    if(next!==c._orig[label]) c.field_overrides[label]=next; else delete c.field_overrides[label];
    gfRerenderBody(); updateFieldChanged(); return;
  }
  const inp=document.querySelector(`#allFields input[data-k="${cssq(label)}"]`); if(!inp)return;
  const usingBase=inp.value===c._orig[label];
  const next=usingBase?src:c._orig[label];
  if(next!==c._orig[label]) c.field_overrides[label]=next; else delete c.field_overrides[label];
  inp.value=next;
  inp.classList.toggle('changed', next!==c._orig[label]);
  const b=document.querySelector(`#allFields button[data-b="${cssq(label)}"]`);
  if(b)b.outerHTML=baseBadge(c,label,next);
  updateFieldChanged();
}
function updateFieldChanged(){const c=cfgFor(state.editing);const n=Object.keys(c.field_overrides).length;
  const el=document.getElementById('fieldChanged'); if(el)el.textContent=n?`${n} changed`:'';}
function filterFields(){const qq=(document.getElementById('fieldFilter')?.value||'').toLowerCase();
  // the guided view searches across every section (a field's friendly name and
  // its explanation count too), so it redraws rather than hiding rows
  if(document.querySelector('#allFields .gfwrap')){
    const gf=state.gf; if(!gf)return;
    if((gf.q||'')===qq)return;
    gf.q=qq; gfRerenderBody(); return;
  }
  document.querySelectorAll('#allFields .afrow').forEach(r=>{
    const l=(r.dataset.label||'').toLowerCase(); r.style.display=(!qq||l.includes(qq))?'':'none';});}
function closeModal(){overlay.classList.remove('open');
  // the unit editor widens the modal — put it back for the next dialog
  document.getElementById('modal').className='modal';}

/* ---- clearing data/text/export_units.txt.strings.bin ----------------------
   The game reads that compiled cache, not export_units.txt, and only rebuilds
   it when it is missing — so until it is deleted a transferred or renamed unit
   keeps showing the OLD name and description. Deleting it costs nothing: the
   next launch writes a fresh one.

   Unlike the Full Cleaner.bat this replaced, it removes exactly that one file
   and nothing the mod ships, so it is a setting rather than a per-job risk to
   weigh up: `clear_strings_bin` in settings.json, on by default, applying to
   every transfer / save / voice change / cleanup. The box under each Apply is
   the same setting, put where you would look for it. */
const clearBinOn=()=>(state.settings||{}).clear_strings_bin!==false;
// `what` names the text file whose cache this job would clear — export_units.txt
// for anything unit-shaped, export_buildings.txt for a building rename.
function cleanerBoxHtml(what){
  const kind=what||'unit';
  return `<label class="chk cleanerbox" style="margin-right:auto" title="Deletes data/text/export_${kind}s.txt.strings.bin in the mod being written to. That is the compiled copy of export_${kind}s.txt; until it is gone the game keeps showing the OLD ${kind} text. It is rebuilt on the next launch. This is a setting — it applies to every transfer, save, voice change and cleanup.">
    <input type="checkbox" ${clearBinOn()?'checked':''} onchange="setClearBin(this.checked)">
    Clear the <b>${kind}-text cache</b> afterwards
    <span class="count">— setting, applies to every job</span></label>`;
}
async function setClearBin(on){
  state.settings=await api.post('/api/settings',{clear_strings_bin:on});
  toast(on?'Unit-text cache will be cleared after every job.'
          :'Unit-text cache left alone — new unit text may not show in game.');
}
// what a job's response says about the clear, appended to its toast
function binMsg(r){
  const b=r&&r.strings_bin; if(!b)return '';
  if(b.deleted)return '  · unit-text cache cleared';
  if(b.missing)return '';           // nothing was there — not worth a mention
  return `  · cache not cleared: ${b.error||'?'}`;
}

// per-model checkboxes for a secondary group (officers / crew), so models can be
// picked individually rather than all-or-none. Disabled when the group is off.
function modelChecks(models,groupOn,c){
  const ex=new Set((c.exclude_models||[]).map(s=>s.toLowerCase()));
  return models.map(m=>{
    const on=groupOn&&!ex.has(m.toLowerCase());
    return `<label class="chk mini${groupOn?'':' off'}"><input type="checkbox" ${on?'checked':''} ${groupOn?'':'disabled'} onchange="toggleModel('${q1(esc(m))}',this.checked)"> ${esc(m)}</label>`;
  }).join('');
}
function toggleModel(name,on){
  const c=cfgFor(state.editing);
  const ex=new Set((c.exclude_models||[]).map(s=>s.toLowerCase()));
  if(on)ex.delete(name.toLowerCase()); else ex.add(name.toLowerCase());
  c.exclude_models=[...ex]; doPreview();
}
function optsPayload(type){const c=cfgFor(type);
  // The engine applies field overrides AFTER pinning accent/voice_type to the voice
  // donor's block, so an override left over from before the lock would quietly undo
  // it — drop those two while a donor is in play.
  let fo=c.field_overrides;
  if(soundDonor(c).accent&&('accent' in fo||'voice_type' in fo)){
    fo=Object.assign({},fo); delete fo.accent; delete fo.voice_type;
  }
  const rep=isReplace(c);
  // the replaced unit's identity is not editable — the engine ignores these two
  // when replacing, and sending them would only make the preview lie
  if(rep&&('type' in fo||'dictionary' in fo)){
    fo=Object.assign({},fo); delete fo.type; delete fo.dictionary;
  }
  return {include_officers:c.include_officers,include_mount:c.include_mount,include_crew:c.include_crew,
    include_projectile:c.include_projectile!==false,include_engine:c.include_engine!==false,
    exclude_models:c.exclude_models||[],
    // one picker, two meanings: a stat template, or the unit being rewritten
    mode:rep?'replace':'new',
    base_type:rep?null:(c.base_type||null),
    replace_type:rep?c.base_type:null,
    import_card:!!c.import_card,import_info_card:!!c.import_info_card,
    field_overrides:fo,
    soldier_from:c.soldier_from||'source',officer_from:c.officer_from||'source',
    mount_from:c.mount_from||'source',crew_from:c.crew_from||'source',
    upgrade_from:c.upgrade_from||'source',
    on_conflict:c.on_conflict,new_type:c.new_type||null,new_dictionary:c.new_dictionary||null,
    eop_target:c.eop_target||'auto',
    asset_conflict:c.asset_conflict||'mod_folder',
    asset_reroute_dir:c.asset_reroute_dir||null,
    icon_conflict:c.icon_conflict||'use_existing',
    engine_conflict:c.engine_conflict||'use_existing',
    make_mercenary:!!c.make_mercenary,merc_icons:!!c.merc_icons,
    sound_mode:c.sound_mode||'base',sound_donor:c.sound_donor||null};}
// Render the plan summary as indented rows. Each row's text sits in its own
// column, so a long path wraps under itself and the structure stays readable.
function renderSummary(t){
  const rows=(t||'').split('\n').map((raw,i)=>{
    const m=raw.match(/^(\s*)(.*?)\s*$/); const indent=m[1].length; let body=m[2];
    if(!body)return '';
    const lvl=indent>=6?3:(indent>=2?2:1);
    let sev='';
    if(/ERROR/.test(body))sev='bad';
    else if(/^!/.test(body)||/WARNING|EXCLUDED|NOT found|SKIPPED|differ\b/.test(body))sev='warn';
    else if(/RELOCATED|OVERWRITE|RENAMED|REPLACING|renamed bmdb|reuse existing|base template|byte-identical|supplies them/.test(body))sev='good';
    let icon='';
    if(/^!/.test(body))icon='⚠';
    else if(/^-/.test(body))icon='·';
    body=body.replace(/^[!\-]\s*/,'');
    // highlight counts and file paths inside the line
    let html=esc(body)
      .replace(/(^|\s)(\d+)(?=\s|$|\))/g,'$1<span class="num">$2</span>')
      .replace(/([\w./\\-]+\.(?:mesh|texture|tga|dds|spr|txt|modeldb))/g,'<span class="path">$1</span>');
    return `<div class="srow lvl${lvl}${sev?' '+sev:''}${i===0?' shead':''}">`
      +`<span class="sicon">${icon}</span><span class="stext">${html}</span></div>`;
  }).join('');
  return `<div class="sum">${rows}</div>`;
}

/* ---------- 500 vanilla unit-limit warning ---------- */
function projectedDestCount(){
  const dd=state.destData; if(!dd) return null;
  const have=new Set(dd.units.map(u=>u.type));
  // The cap is a property of export_descr_unit.txt, so M2TWEOP units are not
  // counted — being outside that file is exactly what they are for.
  const current=(dd.edu_count!=null)?dd.edu_count:dd.units.length;
  let add=0, eopAdd=0;
  for(const t of composerList){ const c=cfgFor(t);
    const toEop=eopBound(t);
    if(isReplace(c)) continue;               // rewrites a unit that already exists
    if(have.has(t) && c.on_conflict!=='rename') continue;  // overwrite/skip: no net type
    if(toEop) eopAdd++; else add++;
  }
  return {current, add, eopAdd, projected:current+add, eop:dd.eop_count||0};
}
/* Will this unit's block be written to an M2TWEOP unit file rather than the EDU?
   Mirrors transfer._resolve_eop_target so the banner agrees with what apply does. */
function eopBound(type){
  const dd=state.destData, sd=state.srcData; if(!dd) return false;
  const want=(cfgFor(type).eop_target)||'auto';
  if(!(dd.eop_dirs||[]).length) return false;   // nowhere to write one
  if(want==='eop') return true;
  if(want==='edu') return false;
  const u=(sd&&sd.units||[]).find(x=>x.type===type);
  return !!(u&&u.eop);
}
const limitIgnored=mod=>(state.settings.unit_limit_ignored||[]).includes(mod);
function unitLimitBanner(){
  const p=projectedDestCount(); if(!p) return '';
  if(Math.max(p.current,p.projected)<=VANILLA_UNIT_LIMIT || limitIgnored(state.dst)) return '';
  const now=p.current>VANILLA_UNIT_LIMIT;
  const dd=state.destData||{};
  const hasEop=((dd.eop_dirs||[]).length>0);
  return `<div class="limitwarn">
    <b>⚠ Vanilla unit limit exceeded.</b>
    “${esc(state.dst)}” ${now?`already has ${p.current}`:`will have ${p.projected}`} units in
    export_descr_unit.txt
    (vanilla M2TW caps at ${VANILLA_UNIT_LIMIT}${p.add?`; this transfer adds ${p.add}`:''}).
    ${p.eop?`<div class="sub">Its ${p.eop} M2TWEOP unit${p.eop===1?'':'s'} don't count — they load from the extender.${p.eopAdd?` This transfer adds ${p.eopAdd} more.`:''}</div>`:''}
    <div class="sub">Past ${VANILLA_UNIT_LIMIT}, unmodified M2TW crashes. With M2TWEOP / EOP it's fine.</div>
    <div class="acts">
      ${hasEop?`<button onclick="allToEop()">Write these as M2TWEOP units instead</button>`:''}
      <button onclick="ignoreLimit()">Ignore for “${esc(state.dst)}” (using m2ex/eop)</button>
      <span class="count">${hasEop?'':'Set the mod’s EOP folder in ⚙ Root to use the first option. '}Re-enable in ⚙ Root.</span>
    </div></div>`;
}
/* Flip every unit in the composer to "write as an M2TWEOP unit" — the one-click
   answer to the limit banner, which is the moment the user is actually thinking
   about where these units land. */
function allToEop(){
  for(const t of composerList) cfgFor(t).eop_target='eop';
  renderComposer();
  toast(`${composerList.length} unit(s) will be written as M2TWEOP unit files.`);
}
async function ignoreLimit(){
  const cur=(state.settings.unit_limit_ignored||[]).slice();
  if(!cur.includes(state.dst)) cur.push(state.dst);
  state.settings=await api.post('/api/settings',{unit_limit_ignored:cur});
  renderComposer();
  toast(`Unit-limit warning ignored for “${state.dst}”.`);
}

async function quitServer(){

async function saveClearBin(){

async function saveSoldierBase(){

/* ---------- asset (texture/mesh) conflict resolver ---------- */
const modFolderName=()=>'unit_models/'+(state.src||'').replace(/[^A-Za-z0-9._-]+/g,'_').replace(/^_+|_+$/g,'');
function assetConflictUI(type,r){
  const c=cfgFor(type);
  const list=r.asset_conflicts||[];
  // three buckets, each with its own resolution mode: battle-model assets (which
  // can be relocated), icons (located by name, can't be) and siege-engine files
  // (can't be either — their textures are baked into the mesh binaries).
  const aConf=list.filter(x=>x.kind!=='icon'&&x.kind!=='engine');
  const iConf=list.filter(x=>x.kind==='icon');
  const eConf=list.filter(x=>x.kind==='engine');
  const aDiff=aConf.filter(x=>!x.identical), aIdent=aConf.filter(x=>x.identical);
  const iDiff=iConf.filter(x=>!x.identical);
  const eDiff=eConf.filter(x=>!x.identical);
  const reloc=(c.asset_conflict==='reroute'||c.asset_conflict==='mod_folder');
  let html='';
  // --- meshes / textures: keep, overwrite, or relocate (which avoids conflicts entirely)
  if(aConf.length||reloc){
    const warn=aDiff.length&&!reloc;
    html+=`<fieldset class="assetconf" ${warn?'':'style="border-color:var(--edge)"'}>
      <legend class="${warn?'w-warn':''}">Textures / meshes</legend>
      <div class="count">${aConf.length} file(s) already exist at the same path —
        <b class="w-good">${aIdent.length}</b> identical (reused),
        <b class="${aDiff.length?'w-warn':''}">${aDiff.length}</b> differ.
        ${r.reroute_dir?`<br><span class="w-good">Relocating ${r.relocated_count} file(s) → <code>${esc(r.reroute_dir)}/</code> — no conflicts.</span>`:''}</div>
      <div class="radio-row" style="margin-top:6px">
        <label><input type="radio" name="ac" value="mod_folder" ${c.asset_conflict==='mod_folder'?'checked':''}> Own folder — <code>${esc(modFolderName())}/</code> <b class="w-good">(default)</b></label>
        <label><input type="radio" name="ac" value="reroute" ${c.asset_conflict==='reroute'?'checked':''}> Reroute — choose a folder under <code>unit_models/</code></label>
        <label><input type="radio" name="ac" value="use_existing" ${c.asset_conflict==='use_existing'?'checked':''}> Keep the destination’s files</label>
        <label><input type="radio" name="ac" value="overwrite" ${c.asset_conflict==='overwrite'?'checked':''}> Overwrite with the source’s (backed up, undoable)</label>
      </div>
      <div id="rerouteBox" style="${c.asset_conflict==='reroute'?'':'display:none'};margin-top:8px">
        <div class="brbar">
          <input id="rrPath" value="${esc(c.asset_reroute_dir||'')}" placeholder="unit_models/MyFolder">
          <button onclick="brToggle()">Browse…</button>
        </div>
        <div id="brBox" style="${state.brOpen?'':'display:none'}">
          <div class="brbar" style="margin-top:6px">
            <button onclick="brUp()">↑ Up</button><span class="count" id="brNow"></span>
          </div>
          <div class="brlist" id="brList"></div>
          <div class="brbar" style="margin-top:6px">
            <input id="brNew" placeholder="new sub-folder name">
            <button onclick="brMakeSub()">Use new sub-folder</button>
          </div>
        </div>
      </div>
      ${reloc?`<div class="count" style="margin-top:6px">Files keep their folder structure, and the new modeldb entries point at the new paths.</div>`:''}
      ${aDiff.length&&!reloc?`<div class="flist">${aDiff.map(x=>`<div class="frow"><span class="fp">${esc(x.rel)}</span><span class="fs">src ${x.src_size}B vs dest ${x.dst_size}B${x.src_size===x.dst_size?' — same size, different bytes':''}</span></div>`).join('')}</div>`:''}
    </fieldset>`;
  }
  // --- icons: located by faction folder + dictionary, so they can't be relocated
  if(iConf.length){
    html+=`<fieldset class="assetconf" ${iDiff.length?'':'style="border-color:var(--edge)"'}>
      <legend class="${iDiff.length?'w-warn':''}">Unit card / info icons</legend>

const PROG_ICON={pending:'·',current:'⟳',done:'✓',error:'✗',skipped:'–'};
const PROG_CLS={current:'w-warn',done:'w-good',error:'w-bad',skipped:''};
function renderProgress(types,status){
  const done=status.filter(s=>s==='done'||s==='error'||s==='skipped').length;
  const curIdx=status.indexOf('current');
  const pct=types.length?Math.round((done/types.length)*100):0;
  const rows=types.map((t,i)=>{
    const st=status[i];
    return `<div class="proglist-row ${PROG_CLS[st]||''}"><span class="pi">${PROG_ICON[st]}</span> ${esc(t)}</div>`;
  }).join('');
  document.getElementById('modal').innerHTML=`<h2>Transferring…</h2>
    <div class="mbody">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="count" style="margin:8px 0 12px">${done} of ${types.length} done
        ${curIdx>=0?` — <b>${esc(types[curIdx])}</b>`:''}</div>
      <div class="proglist">${rows}</div>
    </div>`;
}

/* Real progress for the long BMDB jobs (the scan and the cleanup). Each is ONE
   request that runs for seconds, so the server reports where it is under a job id
   and this polls that id alongside the request — a bar parked at a made-up width
   is exactly what this replaces. Polling stops the moment the request settles. */
const newJob=()=>'j'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function jobBox(title,note){
  document.getElementById('modal').innerHTML=`<h2>${esc(title)}</h2>
    <div class="mbody">
      <div class="progress-track"><div class="progress-fill" id="jobFill" style="width:0%"></div></div>
      <div class="count" style="margin-top:8px"><b id="jobPct">0%</b>
        <span id="jobStep">starting…</span></div>
      <div class="count" style="margin-top:10px">${note}</div>
    </div>`;
}
// Only touches the bar if it is still on screen — the job's own result replaces
// the modal, and a late poll must not paint over it.
function jobPaint(pct,label){
  const f=document.getElementById('jobFill'); if(!f)return;
  f.style.width=Math.max(0,Math.min(100,pct))+'%';
  document.getElementById('jobPct').textContent=pct+'%';
  document.getElementById('jobStep').textContent=label?'— '+label:'';
}
async function runJob(job,title,note,run){
  let done=false;
  jobBox(title,note);
  (async()=>{while(!done){
    await new Promise(r=>setTimeout(r,300));
    if(done)break;
    // one try, no retries: a dropped poll just means the next one paints instead
    let p=null; try{p=await api.get('/api/progress?job='+enc(job),1);}catch(e){}
    if(!done&&p&&typeof p.pct==='number')jobPaint(p.pct,p.label||'');
  }})();
  try{ return await run(); } finally{ done=true; }
}
async function doApply(){
  const types=composerList.length?composerList:[state.editing];
  // ensure conflicts are resolved: preview each; if conflict and not yet resolved, focus it
  for(const t of types){
    const r=await api.post('/api/plan',{source:state.src,dest:state.dst,unit:t,options:optsPayload(t)});
    if(r.error){toast(`${t}: ${r.error}`);state.editing=t;renderComposer();await doPreview();return;}
    if(r.base_error){toast(`${t}: ${r.base_error}`);state.editing=t;renderComposer();return;}
    if(r.option_error){toast(`${t}: ${r.option_error}`);state.editing=t;renderComposer();return;}
    if(r.unit_conflict && !cfgFor(t)._resolved){ state.editing=t;renderComposer();await doPreview();
      toast(`“${t}” exists in destination — choose rename / overwrite / skip, then Apply again.`);
      cfgFor(t)._resolved=true; return; }
  }
  let ok=0,skip=0,last=null;
  const status=types.map(()=>'pending');
  for(let i=0;i<types.length;i++){
    const t=types[i];
    status[i]='current'; renderProgress(types,status);
    const res=await api.post('/api/apply',{source:state.src,dest:state.dst,unit:t,
      options:optsPayload(t),
      // once per batch, after the last unit — clearing it earlier just lets the
      // game recompile the cache before the batch has finished writing
      clear_strings_bin:clearBinOn()&&i===types.length-1});
    if(res.error){status[i]='error';renderProgress(types,status);toast(`${t}: ${res.error}`);return;}
    if(res.strings_bin)last=res;
    if(res.plan&&res.plan.skipped){skip++;status[i]='skipped';} else {ok++;status[i]='done';}
    renderProgress(types,status);
  }
  closeModal();
  const repl=types.filter(t=>isReplace(cfgFor(t))).length;
  toast(`${state.src===state.dst?'Created':repl===ok?'Replaced':'Transferred'} ${ok} unit(s)${
    repl&&repl!==ok?` (${repl} replaced)`:''}${skip?`, skipped ${skip}`:''} ✓${binMsg(last)}  (undo in 🕑 Log)`,4200);
  // these ones are done — leaving them ticked invites transferring them twice
  clearSelection();
  state.cfg={};
  if(state.dst===state.src)loadSource();
}

/* ======================= SOUNDS MODE =======================
   The unit VOICE BANK (data/export_descr_sounds_units_voice.txt): which .wav files
   a unit's soldiers shout when you select them.

   A unit's voice needs two things that have to agree: a `unit <type>` entry inside
   one accent/class block of the bank, and the EDU's `accent` + `voice_type` fields
   pointing at that same block. Get one without the other and the unit is silent —
   which is why every row here writes both, and why the accent/class of a row snap
   to whatever donor you pick instead of being editable independently.

   Everything is staged in memory and written in one apply, straight into the mod,
   through the same backups + 🕑 Log undo as a transfer. (The prototype this grew
   out of needed a .bat to generate reference files, a hand-run editor, exported
   patch CSVs, and a second .bat to fold them back in — none of that exists here.) */
async function loadSounds(){
  main.innerHTML='<div class="empty">Reading '+esc(state.src)+'’s voice bank…</div>';
  let r;
  try{ r=await api.get('/api/sounds?mod='+enc(state.src)); }
  catch(e){ main.innerHTML=`<div class="empty">Couldn't read the voice bank.<br>
    <span class="count">${esc(''+e)}</span><br><br>
    <button class="primary" onclick="loadSounds()">Retry</button></div>`; return; }
  // `ops` is the staging area: unit type -> {accent, class, donor, remove}
  state.snd=Object.assign({tab:'missing',ops:{},fAccent:'',fClass:'',onlyBad:false,
                           bulkDonor:'',view:[]},r);
  undoReset();
  renderSounds();
}
// Donors that live in one accent/class block. A donor from another block is no use:
// copying its entry into this block would give the unit that block's neighbours,
// not the sounds you picked.
function sndDonors(accent,cls){
  if(!accent||!cls)return [];
  return state.snd.donors.filter(d=>d.accent===accent&&d['class']===cls);
}
function sndOp(type){const s=state.snd; return s.ops[type]||(s.ops[type]={});}
// The value a row currently shows: what's staged, else the bank's (existing units)
// or the EDU's if the bank has a block for it (missing units — a unit whose EDU
// already names a real accent is nearly always meant to stay there).
function sndVal(u,key){
  const op=state.snd.ops[u.type]||{};
  if(op[key]!==undefined)return op[key];
  if(key==='donor')return '';
  if(key==='accent')return u.accent!==undefined?u.accent:(u.accent_valid?u.edu_accent:'');
  return u['class']!==undefined?u['class']:(u.class_valid?u.edu_class:'');
}
// A row is only sent when it would actually do something. A new entry needs a donor
// to copy (there is nothing else to build one from); an existing one can also just
// move block, or be dropped.
function sndReady(u){
  const op=state.snd.ops[u.type]||{};
  if(op.remove)return true;
  const a=sndVal(u,'accent'),c=sndVal(u,'class');
  if(!a||!c)return false;
  if(u.accent===undefined)return !!op.donor;          // missing -> needs a donor
  return !!op.donor||a!==u.accent||c!==u['class'];
}
function sndOps(){
  const s=state.snd,out=[];
  for(const u of s.missing.concat(s.existing)){
    if(!sndReady(u))continue;
    const op=s.ops[u.type]||{};
    out.push({unit:u.type,accent:sndVal(u,'accent'),class:sndVal(u,'class'),
              donor:op.donor||'',remove:!!op.remove});
  }
  for(const o of s.orphans){const op=s.ops[o.type];
    if(op&&op.remove)out.push({unit:o.type,remove:true});}
  return out;
}
/* One place where every staged change is made, and the ONLY place the row is
   repainted from — state first, paint second. Doing it the other way round is what
   made the prototype need two clicks to take a unit: picking a donor rebuilt the
   dropdown from a `copyFrom` that had not been written yet, so the first pick was
   thrown away and only the second one stuck. */
function sndPick(i,key,value){
  const u=state.snd.view[i]; if(!u)return;
  const op=sndOp(u.type);
  op[key]=value;
  if(key==='donor'&&value){
    const d=state.snd.donors.find(x=>x.name===value);
    if(d){op.accent=d.accent; op['class']=d['class'];}   // the entry has to land in ITS block
  }
  // moving the row to another block orphans a donor from the old one
  if((key==='accent'||key==='class')&&op.donor){
    const d=state.snd.donors.find(x=>x.name===op.donor);
    if(!d||d.accent!==sndVal(u,'accent')||d['class']!==sndVal(u,'class'))op.donor='';
  }
  renderSounds();
}
function sndToggleRemove(i,on){
  const u=state.snd.view[i]; if(!u)return;
  sndOp(u.type).remove=on; renderSounds();
}
function sndTab(t){state.snd.tab=t; renderSounds();}
function sndFilter(key,v){state.snd[key]=v; renderSounds();}
function sndReset(){state.snd.ops={}; renderSounds(); toast('Staged voice changes cleared.');}
// Give every visible row the same donor in one go — the usual job here is "these
// forty new units should all sound like that one", and doing it row by row is the
// step this replaces.
function sndBulk(){
  const name=state.snd.bulkDonor; if(!name){toast('Pick a unit to copy from first.');return;}
  const d=state.snd.donors.find(x=>x.name===name); if(!d)return;
  let n=0;
  for(const u of state.snd.view){
    if(u.type===name)continue;                       // never make a unit copy itself
    const op=sndOp(u.type); op.donor=name; op.accent=d.accent; op['class']=d['class']; n++;
  }
  renderSounds();
  toast(`${n} row(s) set to copy “${name}” (${d.accent}/${d['class']}).`);
}
const SND_CAP=150;   // selects are expensive; the filters above are how you reach the rest
/* ---------- sprites mode ----------
   Sprites are the flat billboards the game swaps in at the far LOD. The engine
   renders them, but only as a side effect of booting with a magic flag, and what
   lands on disk is raw TGA. This workspace does the prep, then owns everything
   after generation: convert, dedup, install and point the modeldb at the result.
   The two published methods differ only in step 1, so that is the only step that
   branches. */
async function loadSprites(){
  main.innerHTML='<div class="empty">Reading '+esc(state.src)+'’s models…</div>';
  let r;
  try{ r=await api.get('/api/sprites?mod='+enc(state.src)); }
  catch(e){ main.innerHTML=`<div class="empty">Couldn't read the modeldb.<br>
    <span class="count">${esc(''+e)}</span><br><br>
    <button class="primary" onclick="loadSprites()">Retry</button></div>`; return; }
  state.spr=Object.assign({
    picked:new Set(),

    method:r.has_eop?'eop':'classic',
    cfg:r.cfgs[0]||'', mipmaps:false, dedup:true, mounts:false, last:null
  },r);
  renderSprites();
}

function sprResultHtml(r){
  const dupes=Object.values(r.duplicates||{}).reduce((n,v)=>n+Object.keys(v).length,0);

  return `<div class="sprnote" style="border-top:1px solid var(--edge);padding-top:9px">
    <b class="w-good">Converted ${r.converted.length} sheet(s)</b> across ${models} model(s);
    ${r.installed.length} file(s) installed${dupes?`, ${dupes} duplicate faction copy(s) collapsed`:''}.
    </div>
    <div class="sprrow"><button class="primary" onclick="sprWire()">
      Point the modeldb at these (${models} model(s))</button></div>`;
}

async function sprConvert(){
  const s=state.spr,job=newJob();

    `TGA → DXT5 DDS → <code>.texture</code>, then installing into

async function sprWire(){

function sndRowHtml(u,i){
  const s=state.snd,op=s.ops[u.type]||{};
  const a=sndVal(u,'accent'),c=sndVal(u,'class');
  const isOrphan=s.tab==='orphans', has=u.accent!==undefined;
  const ready=sndReady(u), dropping=!!op.remove;
  // what the game does with this unit right now, before anything staged
  let now;
  if(isOrphan) now=`<span class="w-warn">no such unit</span>`;
  else if(!has) now=u.edu_accent
    ? (u.accent_valid?`<span class="count">${esc(u.edu_accent)} — generic</span>`
                     :`<span class="w-bad" title="the EDU names an accent this mod's voice bank has no block for">${esc(u.edu_accent)} ✗</span>`)
    : `<span class="w-warn" title="no accent line in the EDU at all">no accent</span>`;
  else now=(u.accent_conflict||u.class_conflict)
    ? `<span class="w-bad" title="EDU says ${esc(u.edu_accent||'—')}/${esc(u.edu_class||'—')}, the bank has it in ${esc(u.accent)}/${esc(u['class'])} — the game follows the EDU, so these sounds never play">${esc(u.accent)}/${esc(u['class'])} ✗</span>`
    : `<span class="count">${esc(u.accent)}/${esc(u['class'])}</span>`;
  if(isOrphan) return `<div class="sndrow ${dropping?'dropping':''}">
    <div class="un"><div class="nm">${esc(u.name)}</div><div class="ty">voice entry only</div></div>
    <span class="now">${now}</span>
    <span class="count">${esc(u.accent)}</span><span class="count">${esc(u['class'])}</span>
    <span class="count">—</span>
    <span class="rm"><input type="checkbox" ${dropping?'checked':''} title="delete this entry from the voice bank"
      onchange="sndToggleRemove(${i},this.checked)"></span></div>`;
  const donors=sndDonors(a,c);
  const sel=(cur,vals,key,blank)=>`<select onchange="sndPick(${i},'${key}',this.value)" ${dropping?'disabled':''}>
    <option value="">${blank}</option>
    ${vals.map(v=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
  return `<div class="sndrow ${dropping?'dropping':ready?'staged':''}">
    <div class="un"><div class="nm">${esc(u.name||u.type)}</div><div class="ty">${esc(u.type)}</div></div>
    <span class="now">${now}</span>
    ${sel(a,s.accents,'accent','— accent —')}
    ${sel(c,s.classes,'class','— class —')}
    <select onchange="sndPick(${i},'donor',this.value)" ${dropping?'disabled':''}
      title="${a&&c?`units with their own barks in ${esc(a)}/${esc(c)}`:'pick an accent and a class first'}">
      <option value="">${a&&c?(has?'— keep its own sounds —':`— pick a unit (${donors.length}) —`):'— accent/class first —'}</option>
      ${donors.map(d=>`<option value="${esc(d.name)}" ${d.name===(op.donor||'')?'selected':''}>${esc(d.name)}</option>`).join('')}
    </select>
    <span class="rm">${has?`<input type="checkbox" ${dropping?'checked':''}
      title="remove this unit's voice entry from the bank" onchange="sndToggleRemove(${i},this.checked)">`:''}</span>
  </div>`;
}

async function sndDoApply(){

/* ======================= UNIT EDITOR (edit mode) =======================
   Edits one mod in place: EDU fields, the localised name/description, the
   battle_models.modeldb entries the unit uses (including creating a new entry
   from an existing one), and deleting the unit. Every apply goes through the
   same backup + log as a transfer, so 🕑 Log → Undo reverts it. */
const enc=encodeURIComponent;
const modRoot=n=>(state.mods.find(m=>m.name===n)||{}).root||'';
// A native dialog hands back an absolute path; show it as the mod-relative one
// the game actually uses (the server accepts either).
function relInMod(p){
  const root=modRoot(state.src); if(!p||!root)return p||'';
  const norm=s=>s.replace(/\\/g,'/').replace(/\/+$/,'');
  const r=norm(root)+'/data/', s=norm(p);
  return s.toLowerCase().startsWith(r.toLowerCase())?s.slice(r.length):s;
}

async function openEditor(type){
  const modal=document.getElementById('modal');
  modal.className='modal wide'; modal.innerHTML='<h2>Loading unit…</h2>';
  overlay.classList.add('open');
  let d;
  try{ d=await api.get(`/api/edit/unit?mod=${enc(state.src)}&type=${enc(type)}`); }
  catch(e){ modal.innerHTML=`<h2>Unit editor</h2><div class="mbody w-bad">${esc(''+e)}</div>
    <div class="foot"><button onclick="closeModal()">Close</button></div>`; return; }

  state.ed={mod:state.src,unit:type,d,tab:'identity',ov:{},rm:new Set(),
            loc:Object.assign({},d.loc),newType:'',newDict:'',
            mEdits:{},newModels:[],open:{},form:null,removeOldIcons:false,added:new Set(),

function edDirty(){
  const e=state.ed; if(!e)return false;
  return !!(Object.keys(e.ov).length||e.rm.size||e.newModels.length||
            edModelEdits().length||e.newType||e.newDict||

/* ---- what each touched bmdb entry sends ----
   Texture paths go by faction + kind, never by span index: ticking a faction on
   or off renumbers every texture slot in the entry, so an index captured by the
   page would land on the wrong one. Meshes keep using indices — those are stable. */
function edModelEdits(){
  const e=state.ed;
  return Object.keys(e.mEdits).map(name=>{
    const me=e.mEdits[name];
    if(!me._touched)return null;
    const m=e.d.models.find(x=>x.name===name); if(!m)return null;
    const v=edTexView(m), kinds=edKinds(m), faction_paths={};
    edFacs(m).forEach(f=>{
      const o={},cur=v.facs[f]||{};
      kinds.forEach(k=>{ if(cur[k]&&cur[k]!==v.defs[k])o[k]=cur[k]; });
      if(Object.keys(o).length)faction_paths[f]=o;
    });
    return {entry:name,new_name:me.new_name||'',paths:me.paths||{},copies:me.copies||[],
      imports:(me.imports||[]).map(x=>({src:x.src,dest_dir:x.dest_dir})),
      defaults:v.defs,faction_paths,factions:me.factions||null,
      move_dir:me.move_dir||'',move_shared:!!me.move_shared};
  }).filter(Boolean);
}
function edPayload(extra){
  const e=state.ed;
  const locChanged=JSON.stringify(e.loc)!==JSON.stringify(e.d.loc);
  return Object.assign({mod:e.mod,unit:e.unit,new_type:e.newType,new_dictionary:e.newDict,
    field_overrides:e.ov,remove_fields:[...e.rm],loc:locChanged?e.loc:null,
    model_edits:edModelEdits(),new_models:e.newModels,
    card_src:e.cardSrc||'',info_src:e.infoSrc||'',
    remove_old_icons:!!e.removeOldIcons},extra||{});
}

function edTab(t){state.ed.tab=t;renderEditor();}
function edRenderTab(){
  const e=state.ed,b=document.getElementById('edBody');
  // Editing anything re-renders the whole tab, and replacing innerHTML throws
  // every scroll position back to the top — both the dialog's and the EDU field
  // list's own box. Ticking a faction 40 rows down must leave you looking at it,
  // not at the top of the unit, so both are put back afterwards.
  const modal=document.getElementById('modal');
  const wasModal=modal?modal.scrollTop:0;
  const fields=document.getElementById('allFields');
  const wasFields=fields?fields.scrollTop:0;
  const gbody=document.getElementById('gfBody');
  const wasG=gbody?gbody.scrollTop:0;
  b.innerHTML=(e.tab==='identity'?edIdentity():e.tab==='fields'?edFields()
              :e.tab==='compare'?edCompare():edModels())
    +'<div id="edPreview"></div>';
  // keep the last preview visible across cosmetic re-renders (tab switch, expanding
  // an entry) — flagged as stale once anything has been edited since it was made
  if(e.plan)document.getElementById('edPreview').innerHTML=edPlanHtml(e.plan,e.planStale);
  if(e.tab==='fields')edWireFields();
  if(e.tab==='identity')edWireIdentity();
  if(e.tab==='models')edWireModels();
  if(e.tab==='compare')edWireCompare();
  const nowFields=document.getElementById('allFields');
  if(nowFields&&wasFields)nowFields.scrollTop=wasFields;
  const nowG=document.getElementById('gfBody');
  if(nowG&&wasG)nowG.scrollTop=wasG;
  if(modal&&wasModal)modal.scrollTop=wasModal;
  paintDirty();
}
function edWireModels(){
  document.querySelectorAll('#edBody input[data-entry]').forEach(inp=>{
    inp.oninput=()=>{const name=inp.dataset.entry,i=+inp.dataset.i;
      const m=state.ed.d.models.find(x=>x.name===name);
      const orig=(m.paths.find(p=>p.i===i)||{}).value;
      const me=edTouch(name);
      if(inp.value!==orig)me.paths[i]=inp.value; else delete me.paths[i];
      inp.classList.toggle('changed',inp.value!==orig);};
  });
  document.querySelectorAll('#edBody input[data-def]').forEach(inp=>{
    inp.oninput=()=>{const name=inp.dataset.def,k=inp.dataset.kind;
      const m=state.ed.d.models.find(x=>x.name===name),me=edTouch(name),v=inp.value.trim();
      if(v&&v!==m.texture_defaults[k])me.defaults[k]=v; else delete me.defaults[k];
      inp.classList.toggle('changed',k in me.defaults);};
  });
  document.querySelectorAll('#edBody input[data-fac]').forEach(inp=>{
    inp.oninput=()=>{const name=inp.dataset.fac,f=inp.dataset.f,k=inp.dataset.kind;
      const me=edTouch(name),v=inp.value.trim();
      const fp=me.faction_paths[f]||(me.faction_paths[f]={});
      if(v)fp[k]=v; else delete fp[k];
      if(!Object.keys(fp).length)delete me.faction_paths[f];
      inp.classList.toggle('changed',!!v);};
  });
}
// Where an imported texture should land: alongside the one it replaces, else in
// the model folder's textures/ (sprites live in their own shared folder).
function edImportDir(m,kind){
  const cur=edTexView(m).defs[kind]||'';
  if(cur.includes('/'))return cur.slice(0,cur.lastIndexOf('/'));
  const me=state.ed.mEdits[m.name]||{};
  const base=me.move_dir||m.folder.base||m.folder.suggestion;
  return kind==='sprite'?'unit_sprites':base+'/textures';
}
const TEX_FILTER='Textures (*.texture)|*.texture|All files (*.*)|*.*';
const SPR_FILTER='Sprites (*.spr)|*.spr|All files (*.*)|*.*';
async function edImportInto(name,kind,set){
  const m=state.ed.d.models.find(x=>x.name===name);
  const r=await api.post('/api/browse_file',
    {title:'Select a file to import',filter:kind==='sprite'?SPR_FILTER:TEX_FILTER});
  if(!r.path)return;
  const dir=edImportDir(m,kind),rel=dir+'/'+r.path.split(/[\\\/]/).pop();
  const me=edTouch(name);
  me.imports=(me.imports||[]).filter(x=>x.rel!==rel).concat([{src:r.path,dest_dir:dir,rel}]);
  set(me,rel); edRenderTab(); edPreview();
}
const edImportDefault=(name,kind)=>edImportInto(name,kind,(me,rel)=>{me.defaults[kind]=rel;});
const edImportFac=(name,fac,kind)=>edImportInto(name,kind,(me,rel)=>{
  (me.faction_paths[fac]||(me.faction_paths[fac]={}))[kind]=rel;});

/* ---- EDU field access shared by every tab ----
   `e.ov` holds overrides keyed by the label block_fields() produced; `e.added`
   remembers fields this session created, so an override that happens to equal
   the (empty) starting value still gets written. */
const csv=s=>(s||'').split(',').map(x=>x.trim()).filter(Boolean);
function edFieldVal(label){const e=state.ed;
  if(label in e.ov)return e.ov[label];
  const f=e.d.fields.find(x=>x[0]===label); return f?f[1]:'';}
function edSetField(label,val){
  const e=state.ed,f=e.d.fields.find(x=>x[0]===label);
  if(!f){e.d.fields=e.d.fields.concat([[label,'']]); e.added.add(label);}
  if(val===((f||['',''])[1])&&!e.added.has(label)) delete e.ov[label]; else e.ov[label]=val;
  e.rm.delete(label); edStale();
}
// Put a field back exactly as it was — including "it wasn't there at all", which
// setting it to "" would not do (an empty EDU line is still a line).
function edRestoreField(label,val){
  const e=state.ed;
  if(val===''&&e.added.has(label)){
    e.added.delete(label); delete e.ov[label];
    e.d.fields=e.d.fields.filter(f=>f[0]!==label); edStale(); return;
  }
  edSetField(label,val);
}

/* ---- every EDU field, editable, with a real delete ----
   Four of them are comma-separated lists whose ORDER is meaningful, so they get
   drag-to-reorder chips instead of a text box: `ownership` / `era 0..2` (the
   factions that may field the unit) and `armour_ug_models` (position N = armour
   upgrade level N). */
const LIST_FIELDS=new Set(['ownership','era 0','era 1','era 2']);
function edFields(){
  return `<fieldset><legend>EDU fields — edited in place</legend>

      <input id="fieldFilter" placeholder="Filter fields…" oninput="filterFields()">
      ${gfToggleHtml()}
      <span class="count" id="fieldChanged"></span>

      ? `<div class="allfields guided" id="allFields">${gfRender(gfHostEditor())}</div>`
      : edRawFields()}

}
function edRawFields(){
  const e=state.ed,d=e.d;
  const present=new Set(d.fields.map(([l])=>l.replace(/#\d+$/,'')));
  const missing=(d.known_fields||[]).filter(k=>!present.has(k));
  // type/dictionary/soldier define the block — the engine refuses to drop them
  const PROTECTED=new Set(['type','dictionary','soldier']);
  const rmBtn=(label,gone)=>PROTECTED.has(label.replace(/#\d+$/,''))
    ? '<span class="rm" title="This field defines the unit and can\'t be removed"> </span>'
    : `<button class="rm" data-rm="${esc(label)}" title="${
        gone?'Keep this field':'Remove this line from the unit'}">${gone?'↺':'✕'}</button>`;
  const rows=d.fields.map(([label,val])=>{
    const cur=(label in e.ov)?e.ov[label]:val;
    const gone=e.rm.has(label);
    const key=label.replace(/#\d+$/,'');
    // what this line is, moved onto the ? beside its name
    const why=GF_FIELDS[key]&&GF_FIELDS[key].t
      ? GF_FIELDS[key].t+'. '+gfPlainDoc(key) : '';
    const head=`<div class="afrow wide${gone?' gone':''}" data-label="${esc(label)}">
      <label>${qm(why,label)}${esc(label)}</label>`;
    if(LIST_FIELDS.has(label)&&!gone)
      return head+edFactionField(label,cur)+rmBtn(label,gone)+'</div>';
    if(label==='armour_ug_models'&&!gone)
      return head+edArmourField(label,cur)+rmBtn(label,gone)+'</div>';
    return `<div class="afrow${gone?' gone':''}" data-label="${esc(label)}">
      <label>${qm(why,label)}${esc(label)}</label>
      <input data-k="${esc(label)}" value="${esc(cur)}" ${gone?'disabled':''}
        class="${(label in e.ov)&&e.ov[label]!==val?'changed':''}">

  }).join('');

    <div class="count" style="margin-top:6px">✕ removes the whole line — clearing a value

      <span class="pl">${qm('Fields the EDU understands that this unit has no line for. Adding one writes a fresh line with an empty value.','Add a missing field')}Add a missing field</span>
      <select id="edAddKey">${missing.map(k=>`<option>${esc(k)}</option>`).join('')||'<option value="">— none missing —</option>'}</select>
      <button onclick="edAddField()">Add</button>
    </div>`;
}
function edWireFields(){
  const e=state.ed;
  if(gfMode()==='guided'){gfWire(gfHostEditor()); return;}
  document.querySelectorAll('#allFields input[data-k]').forEach(inp=>{
    inp.oninput=()=>{const k=inp.dataset.k,orig=(e.d.fields.find(f=>f[0]===k)||['',''])[1];
      if(inp.value!==orig)e.ov[k]=inp.value; else delete e.ov[k];

  });
  document.querySelectorAll('#allFields .rm').forEach(b=>{

function edCount(){
  const e=state.ed,el=document.getElementById('fieldChanged'); if(!el)return;
  const n=Object.keys(e.ov).length,r=e.rm.size;

function edAddField(){
  const e=state.ed,sel=document.getElementById('edAddKey'); const k=sel&&sel.value; if(!k)return;
  e.d.fields=e.d.fields.concat([[k,'']]);      // shows up as a new (empty) row

/* =========================================================================
   COMPARE — the same unit table twice, side by side

   "Is my new spearman better than the one it replaces, and by how much" is a
   question the EDU answers only if you hold two blocks of eleven-value lines in
   your head at once. So the second unit is loaded beside the first and the lines
   are split into their named slots — attack against attack, morale against
   morale — with the better side green and the worse red.

   Which side is "better" is only claimed where it is genuinely a merit: attack
   and armour go up, cost and heat fatigue go down, and everything else (a hit
   sound, a formation width, the skeleton factor) is simply marked as different.
   Guessing a winner for a setting that has none would be worse than saying
   nothing, because it reads as advice.

   Both columns are live boxes and both are written by Save — the whole point is
   to close a gap you can see, in whichever of the two units is wrong. */

// key|part label -> +1 when bigger is better, -1 when smaller is. A slot that
// is not in here has no better side and is only ever marked "different".
const CMP_MERIT=(()=>{
  const m={},set=(key,pairs)=>Object.keys(pairs).forEach(p=>{m[key+'|'+p]=pairs[p];});
  ['stat_pri','stat_sec','stat_ter'].forEach(k=>set(k,
    {'Attack':1,'Charge bonus':1,'Range':1,'Ammo':1,'Delay':-1}));
  ['stat_pri_ex','stat_sec_ex','stat_ter_ex'].forEach(k=>set(k,
    {'Attack vs mounted':1,'Defence vs mounted':1,'Armour penetration':1}));
  set('stat_pri_armour',{'Armour':1,'Defence skill':1,'Shield':1});
  set('stat_armour_ex',{'Armour 0':1,'Armour 1':1,'Armour 2':1,'Armour 3':1,
    'Defence skill':1,'Shield melee':1,'Shield missile':1});
  set('stat_sec_armour',{'Armour':1,'Defence skill':1});
  set('stat_mental',{'Morale':1});
  set('stat_health',{'Man':1,'Mount / animal':1});
  set('stat_ground',{'Scrub':1,'Sand':1,'Forest':1,'Snow':1});
  set('soldier',{'Men':1});
  set('unit_info',{'Melee attack':1,'Missile attack':1,'Defence':1});
  set('move_speed_mod',{'×':1});
  set('stat_heat',{'Heat':-1});
  set('stat_fire_delay',{'Delay':-1});
  set('stat_stl',{'Men':-1});               // men it may lose before it counts as dead
  set('crusading_upkeep_modifier',{'×':-1});
  set('stat_cost',{'Turns':-1,'Recruit':-1,'Upkeep':-1,'Weapon ug.':-1,'Armour ug.':-1,
    'Custom battle':-1,'Price rise':-1});
  return m;
})();
// The two dropdowns that are really a ladder. `impetuous` is deliberately absent
// from the discipline list: it is a different behaviour, not a better one.
const CMP_ORDER={
  'stat_mental|Training':['untrained','trained','highly_trained'],
  'stat_mental|Discipline':['low','normal','disciplined'],
};
const cmpNum=v=>{const n=parseFloat(String(v==null?'':v).trim());return isFinite(n)?n:null;};
const cmpFmt=n=>String(Math.round(n*1000)/1000);
/* One slot's verdict. `absent` names a side that has no such LINE at all, which
   makes its zeroes meaningless — a unit with no `stat_armour_ex` does not have
   0 armour, it has the ordinary line instead — so nothing wins those. */
function cmpVerdict(key,part,va,vb,absent){
  const a=(va==null?'':''+va).trim(),b=(vb==null?'':''+vb).trim();
  if(a===b)return {same:true};
  if(absent)return {diff:true,absent};
  const id=key+'|'+((part&&part.pl)||'');
  const merit=CMP_MERIT[id];
  if(merit){
    const na=cmpNum(a),nb=cmpNum(b);
    if(na!=null&&nb!=null&&na!==nb)
      return {win:((na>nb)===(merit>0))?'a':'b',gap:cmpFmt(Math.abs(na-nb))};
  }
  const order=CMP_ORDER[id];
  if(order){
    const ia=order.indexOf(a.toLowerCase()),ib=order.indexOf(b.toLowerCase());
    if(ia>=0&&ib>=0&&ia!==ib)return {win:ia>ib?'a':'b',gap:''};
  }
  return {diff:true};
}
/* The whole table as data, from two field lookups. Pure — it never touches the
   page — so the same call builds the view and answers "how many differences are
   there" for the header, and the test suite can drive it under node. */
// The two lines that are the unit's IDENTITY rather than a stat. They differ
// between any two units by definition, so they would head the table with a
// difference nobody came to look at — and `type` in particular is renamed
// through its own machinery on the Identity tab, not by writing the field.
const CMP_SKIP=new Set(['type','dictionary']);
function cmpBuild(A,B,labels){
  const secs={},tally={a:0,b:0,neu:0,same:0};
  labels.forEach(label=>{
    const key=gfKey(label),spec=GF_FIELDS[key];
    if(CMP_SKIP.has(key))return;
    const hasA=A.has(label),hasB=B.has(label);
    if(!hasA&&!hasB)return;
    const absent=!hasA?'a':(!hasB?'b':'');
    const parted=spec&&spec.parts&&spec.parts.length;
    const pa=parted?gfParse(spec,A.val(label)):null;
    const pb=parted?gfParse(spec,B.val(label)):null;
    let rows;
    if(pa&&pb&&pa.ok&&pb.ok){
      rows=spec.parts.map((part,i)=>{
        const va=pa.parts[i]==null?'':pa.parts[i],vb=pb.parts[i]==null?'':pb.parts[i];
        return {label,key,pi:i,part,name:part.pl,va,vb,v:cmpVerdict(key,part,va,vb,absent)};
      });
    }else{
      // a list line (ownership, attributes) or one the parser refused: the whole
      // value is the slot, and it is compared as text
      const va=A.val(label),vb=B.val(label);
      rows=[{label,key,pi:-1,part:null,name:(spec&&spec.t)||label,va,vb,
             v:cmpVerdict(key,null,va,vb,absent)}];
    }
    rows.forEach(r=>{ if(r.v.same)tally.same++; else if(r.v.win)tally[r.v.win]++; else tally.neu++; });
    const sid=GF_SECTION_OF[key]||'other';
    const sec=secs[sid]||(secs[sid]={id:sid,
      t:(GF_SECTIONS.find(s=>s.id===sid)||{}).t||'Other lines',fields:[]});
    sec.fields.push({label,key,title:(spec&&spec.t)||label,rows,absent});
  });
  return {sections:GF_SECTIONS.map(s=>secs[s.id]).filter(Boolean),tally};
}

/* ---- the two sides ----
   'a' is the unit the editor opened on and writes through the ordinary edit
   path; 'b' is the compared unit, which carries its own override map and is
   saved by a second request. Neither knows about the other. */
const cmpSide=w=>w==='b'?state.ed.cmp:state.ed;
function cmpVal(w,label){
  const s=cmpSide(w); if(!s||!s.d)return '';
  if(label in s.ov)return s.ov[label];
  const f=s.d.fields.find(x=>x[0]===label); return f?f[1]:'';
}
function cmpHas(w,label){
  const s=cmpSide(w); if(!s||!s.d)return false;
  return !!s.d.fields.find(x=>x[0]===label)&&!(s.rm&&s.rm.has(label));
}
const cmpEdited=(w,label)=>!!(cmpSide(w)&&(label in (cmpSide(w).ov||{})));
function cmpSet(w,label,val){
  if(w==='a')return edSetField(label,val);
  const c=state.ed.cmp,f=c.d.fields.find(x=>x[0]===label);
  if(!f){ c.d.fields=c.d.fields.concat([[label,'']]); c.added.add(label); }
  if(val===((f||['',''])[1])&&!c.added.has(label))delete c.ov[label]; else c.ov[label]=val;
  c.rm.delete(label); edStale();
}
function cmpPart(w,label,pi){
  const key=gfKey(label),spec=GF_FIELDS[key],raw=cmpVal(w,label);
  if(pi<0||!spec||!spec.parts||!spec.parts.length)return raw;
  const p=gfParse(spec,raw);
  return p.ok?(p.parts[pi]==null?'':p.parts[pi]):raw;
}
// Typing into one box rewrites the whole line it belongs to, exactly as the
// guided editor does — a slot has no existence of its own in the EDU.
function cmpWrite(w,label,pi,val){
  const key=gfKey(label),spec=GF_FIELDS[key];
  if(pi<0||!spec||!spec.parts||!spec.parts.length)return cmpSet(w,label,val);
  const p=gfParse(spec,cmpVal(w,label));
  if(!p.ok)return cmpSet(w,label,val);
  const parts=p.parts.slice(); parts[pi]=val;
  cmpSet(w,label,gfBuild(spec,parts));
}
function cmpLabels(){
  const e=state.ed,out=[],seen=new Set();
  const push=l=>{ if(!seen.has(l)){seen.add(l);out.push(l);} };
  (e.d.fields||[]).forEach(([l])=>push(l));
  (e.cmp&&e.cmp.d?e.cmp.d.fields:[]).forEach(([l])=>push(l));
  return out;
}
const edCmpModel=()=>cmpBuild({val:l=>cmpVal('a',l),has:l=>cmpHas('a',l)},
                              {val:l=>cmpVal('b',l),has:l=>cmpHas('b',l)},cmpLabels());
const edCmpDirty=()=>{
  const c=state.ed&&state.ed.cmp;
  return !!(c&&c.d&&(Object.keys(c.ov).length||c.rm.size));
};

/* ---- picking the other unit ---- */
function edCmpUnits(){
  const e=state.ed;
  if(state.data&&state.data.mod===e.mod)return state.data.units||[];
  if(e.cmpUnitsFor===e.mod)return e.cmpUnits||[];
  if(!e._cmpLoading){
    e._cmpLoading=true;
    api.get('/api/units?mod='+enc(e.mod)).then(d=>{
      e._cmpLoading=false; e.cmpUnits=d.units||[]; e.cmpUnitsFor=e.mod;
      if(state.ed===e&&e.tab==='compare')edRenderTab();
    }).catch(()=>{e._cmpLoading=false;});
  }
  return [];
}
async function edCmpPick(type){
  const e=state.ed;
  e.cmp={unit:type,d:null,ov:{},rm:new Set(),added:new Set(),loading:true};
  edRenderTab();
  let d;
  try{ d=await api.get(`/api/edit/unit?mod=${enc(e.mod)}&type=${enc(type)}`); }
  catch(err){ d={error:''+err}; }
  if(state.ed!==e||!e.cmp||e.cmp.unit!==type)return;   // moved on while loading
  if(d.error){ e.cmp={unit:type,d:null,ov:{},rm:new Set(),added:new Set(),error:d.error};
    edRenderTab(); return; }
  e.cmp={unit:type,d,ov:{},rm:new Set(),added:new Set()};
  e.cmpQ=''; edRenderTab();
}
function edCmpClear(){
  const e=state.ed;
  if(edCmpDirty()&&!confirm(`Discard the unsaved changes to ${e.cmp.unit}?`))return;
  e.cmp=null; edRenderTab();
}
function edCmpSetQ(v){ state.ed.cmpQ=v; }
function edCmpToggleSame(on){ state.ed.cmpSame=on; edRenderTab(); }

/* ---- the tab ---- */
function edCompare(){
  const e=state.ed;
  if(!e.cmp)return edCmpPicker();
  if(e.cmp.loading)return `<div class="frm"><div class="count">Loading
    ${esc(e.cmp.unit)}…</div></div>`;
  if(e.cmp.error)return `<div class="frm"><div class="w-bad">Couldn’t open
    ${esc(e.cmp.unit)}: ${esc(e.cmp.error)}</div>
    <button style="margin-top:8px" onclick="state.ed.cmp=null;edRenderTab()">Pick another unit</button></div>`;
  const m=edCmpModel();
  const q=(e.cmpQ||'').trim().toLowerCase();
  const fields=[];
  m.sections.forEach(sec=>{
    const keep=sec.fields.map(f=>{
      const hit=!q||f.key.toLowerCase().includes(q)||f.title.toLowerCase().includes(q)
        ||f.rows.some(r=>(r.name||'').toLowerCase().includes(q));
      if(!hit)return null;
      const rows=e.cmpSame?f.rows:f.rows.filter(r=>!r.v.same);
      return rows.length?Object.assign({},f,{rows}):null;
    }).filter(Boolean);
    if(keep.length)fields.push(Object.assign({},sec,{fields:keep}));
  });
  return `<div class="frm">
    ${edCmpHead(m)}
    <div class="cmpbar">
      <input class="q" id="cmpQ" placeholder="Filter by stat — attack, morale, cost…"
        value="${esc(e.cmpQ||'')}">
      <label class="chk"><input type="checkbox" id="cmpSame" ${e.cmpSame?'checked':''}>
        show the stats they share</label>
      <span class="count">Both columns are editable — <b>Save changes</b> writes both units.</span>
    </div>
    ${fields.length?fields.map(edCmpSection).join('')
      :`<div class="count">${q?'Nothing matches that filter.'
        :'These two units are identical on every line. Tick “show the stats they share” to see them.'}</div>`}
    ${cmpDatalists()}</div>`;
}
function edCmpHead(m){
  const e=state.ed,t=m.tally;
  const nameOf=(mod,type,fallback)=>{
    const u=edCmpUnits().find(x=>x.type===type);
    return (u&&u.name)||fallback||type;
  };
  const side=(w,type,name,extra)=>`<div class="cu ${w}">
      <img onerror="iconRetry(this)" src="${iconUrl(e.mod,type)}" alt="">
      <div style="min-width:0"><div class="nm">${esc(name)}</div>
        <div class="ty">${esc(type)}</div>${extra||''}</div></div>`;
  return `<div class="cmphead">
    ${side('a',e.unit,e.loc.name||e.d.type,
      `<div class="ty"><b class="w">${t.a}</b> better here</div>`)}
    <div class="tally">
      <div><b>${t.a+t.b+t.neu}</b> differ${t.neu?` · ${t.neu} no better side`:''}</div>
      <div class="count">${t.same} identical</div>
      <div style="margin-top:4px"><button onclick="edCmpClear()">⇄ Change</button>
        <button onclick="openUnitTab('${q1(esc(e.cmp.unit))}')"
          title="Open the compared unit in its own editor tab">↗ Open</button></div>
    </div>
    ${side('b',e.cmp.unit,nameOf(e.mod,e.cmp.unit,e.cmp.d.type),
      `<div class="ty"><b class="w">${t.b}</b> better here</div>`)}
  </div>`;
}
function edCmpSection(sec){
  return `<div class="cmpsec"><h5>${esc(sec.t)}</h5>
    <div class="cmplist">${sec.fields.map(edCmpField).join('')}</div></div>`;
}
function edCmpField(f){
  const e=state.ed;
  const missing=f.absent==='a'?`<span class="w-warn"> — ${esc(e.unit)} has no such line</span>`
    :f.absent==='b'?`<span class="w-warn"> — ${esc(e.cmp.unit)} has no such line</span>`:'';
  return `<div class="cmpfield">${esc(f.title)}
      <span class="count">${esc(f.label)}</span>${missing}</div>
    ${f.rows.map(edCmpRow).join('')}`;
}
function edCmpRow(r){
  const v=r.v;
  const cell=w=>`<span class="cv ${w} ${v.same?'':v.win?(v.win===w?'win':'lose'):'diff'} ${
      cmpEdited(w,r.label)?'edited':''}">${cmpWidget(w,r)}</span>`;
  return `<div class="cmprow ${v.same?'same':''}">
    <span class="cl" title="${esc(r.name)}">${esc(r.name)}</span>
    ${cell('a')}
    <span class="cd ${v.same?'':v.win?'win':'neu'}">${cmpDelta(v)}</span>
    ${cell('b')}</div>`;
}
// ◀ points at the unit that wins the slot, with the size of the gap. A slot with
// no better side just says the two are not equal.
function cmpDelta(v){
  if(v.same)return '=';
  if(v.win==='a')return `◀ ${esc(v.gap||'')}`;
  if(v.win==='b')return `${esc(v.gap||'')} ▶`;
  return v.absent?'·':'≠';
}
/* Which vocabularies the table needs a datalist for, emitted once at the bottom
   rather than once per box — a `soldier` model list is two thousand entries and
   the table has forty of them. */
let _cmpLists=null;
function cmpVocabList(name){
  const v=gfVocabFor(state.ed.mod)[name];
  return Array.isArray(v)?v:[];
}
function cmpDatalists(){
  const out=[...(_cmpLists||[])].map(n=>`<datalist id="cmpdl-${esc(n)}">${
    cmpVocabList(n).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`).join('');
  _cmpLists=null;
  return out;
}
function cmpWidget(w,r){
  const val=cmpPart(w,r.label,r.pi);
  const p=r.part,at=`data-cmp="${w}" data-cl="${esc(r.label)}" data-ci="${r.pi}"`;
  if(p&&p.type==='sel'){
    const list=cmpVocabList(p.v);
    if(list.length)return `<select ${at}>${p.optional?'<option value=""></option>':''}${
      list.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('')}${
      val&&!list.includes(val)?`<option value="${esc(val)}" selected>${esc(val)}</option>`:''}</select>`;
  }
  if(p&&p.type==='combo'&&p.v&&cmpVocabList(p.v).length){
    (_cmpLists=_cmpLists||new Set()).add(p.v);
    return `<input ${at} list="cmpdl-${esc(p.v)}" value="${esc(val)}">`;
  }
  return `<input ${at} value="${esc(val)}"${
    p&&p.type==='num'?' inputmode="decimal"':''}>`;
}
function edCmpPicker(){
  const e=state.ed;
  const q=(e.cmpQ||'').trim().toLowerCase();
  const units=edCmpUnits().filter(u=>u.type!==e.unit
    &&(!q||u.name.toLowerCase().includes(q)||u.type.toLowerCase().includes(q))).slice(0,300);
  return `<div class="frm">
    <fieldset><legend>Compare with another unit</legend>
      <div class="count">Pick a unit from <b>${esc(e.mod)}</b>. Its stats are shown beside
        ${esc(e.loc.name||e.d.type)}’s, slot by slot, with the better side in green and the
        worse in red — and both columns stay editable, so a gap can be closed from either
        end. <b>Save changes</b> then writes both units.</div>
      <input class="q" id="cmpQ" style="margin-top:8px;width:100%"
        placeholder="Filter ${esc(e.mod)}’s units…" value="${esc(e.cmpQ||'')}">
      <div class="baselist" style="max-height:340px;margin-top:6px">${units.map(u=>`
        <div class="baserow" onclick="edCmpPick('${q1(esc(u.type))}')">
          <img loading="lazy" onerror="iconRetry(this)" src="${iconUrl(e.mod,u.type)}">
          <div><div class="bn">${esc(u.name)}</div>
            <div class="bs">${esc(u.type)} · ${esc(u.kind||u.category||'')}</div></div>
        </div>`).join('')||`<div class="caprow"><span class="count">${
          edCmpUnits().length?'No units match.':'Loading this mod’s units…'}</span></div>`}</div>
    </fieldset></div>`;
}
function edWireCompare(){
  const e=state.ed;
  const q=document.getElementById('cmpQ');
  if(q)q.oninput=()=>{ e.cmpQ=q.value;
    // in the picker the list itself is the thing being filtered; in the table
    // only the rows are, and both want the caret left where it is
    edRenderTab();
    const n=document.getElementById('cmpQ');
    if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}
  };
  const same=document.getElementById('cmpSame');
  if(same)same.onchange=()=>edCmpToggleSame(same.checked);
  document.querySelectorAll('#edBody [data-cmp]').forEach(el=>{
    const w=el.dataset.cmp,label=el.dataset.cl,pi=+el.dataset.ci;
    const write=()=>{ cmpWrite(w,label,pi,el.value); cmpRepaint(el); };
    el.oninput=write; el.onchange=write;
  });
}
/* Recolour one row in place. A full re-render on every keystroke would throw the
   caret out of the box being typed into, which is exactly the box whose colour
   has to keep up. */
function cmpRepaint(el){
  const row=el.closest('.cmprow'); if(!row)return;
  const label=el.dataset.cl,pi=+el.dataset.ci;
  const key=gfKey(label),spec=GF_FIELDS[key];
  const part=(pi>=0&&spec&&spec.parts)?spec.parts[pi]:null;
  const absent=!cmpHas('a',label)?'a':(!cmpHas('b',label)?'b':'');
  const v=cmpVerdict(key,part,cmpPart('a',label,pi),cmpPart('b',label,pi),absent);
  row.className='cmprow'+(v.same?' same':'');
  ['a','b'].forEach(w=>{
    const cell=row.querySelector('.cv.'+w); if(!cell)return;
    cell.className='cv '+w+' '+(v.same?'':v.win?(v.win===w?'win':'lose'):'diff')
      +(cmpEdited(w,label)?' edited':'');
  });
  const cd=row.querySelector('.cd');
  if(cd){ cd.className='cd '+(v.same?'':v.win?'win':'neu'); cd.innerHTML=cmpDelta(v); }
  const head=document.querySelector('#edBody .cmphead');
  if(head)head.outerHTML=edCmpHead(edCmpModel());
  paintDirty();
}

/* ---- drag-to-reorder chip lists ---------------------------------------
   The order of these lists is data, not decoration: armour_ug_models[N] is the
   model shown at armour upgrade level N, and era lines are conventionally led by
   the faction the unit belongs to. Dropping a chip rewrites the whole line. */
let edDrag=null;
function edDragStart(ev,label,i){
  edDrag={label,i}; ev.dataTransfer.effectAllowed='move';
  try{ev.dataTransfer.setData('text/plain',String(i));}catch(_){}
  ev.currentTarget.classList.add('drag');
}
function edDragOver(ev,label){
  if(!edDrag||edDrag.label!==label)return;
  ev.preventDefault(); ev.currentTarget.classList.add('over');
}
function edDragLeave(ev){ev.currentTarget.classList.remove('over');}
function edDragEnd(ev){ev.currentTarget.classList.remove('drag'); edDrag=null;}
function edDrop(ev,label,i){
  if(!edDrag||edDrag.label!==label)return;
  ev.preventDefault();
  const list=csv(edFieldVal(label)),from=edDrag.i;
  if(from===i){edDrag=null; edRenderTab(); return;}
  const [moved]=list.splice(from,1); list.splice(i,0,moved);
  edDrag=null; edSetField(label,list.join(', ')); edRenderTab();
}
// `opt.cls` styles the list (armour tiers use it to lift their ✕ above the chip)
// and `opt.rm` swaps in a different remove call — an armour tier has to drop its
// armour_ug_levels entry with it, which the plain list remove knows nothing about.
function edChips(label,items,extra,opt){
  const o=opt||{},cls=o.cls?' '+o.cls:'';
  // entries you added stand out from the ones the file already had, and the
  // ones you took out stay as ghosts you can click to put back
  // …except for armour tiers, where a slot is positional: putting one back is
  // not just re-adding a name, so no ghost is offered there
  const was=new Set(csv((state.ed.d.fields.find(x=>x[0]===label)||['',''])[1]));
  const gone=o.cls==='ug'?[]:[...was].filter(v=>items.indexOf(v)<0);
  return `<div class="chips${cls}">${items.map((v,i)=>`<span class="chipd${cls}${
      was.has(v)?'':' added'}" draggable="true"
      ondragstart="edDragStart(event,'${q1(esc(label))}',${i})"
      ondragover="edDragOver(event,'${q1(esc(label))}')" ondragleave="edDragLeave(event)"
      ondragend="edDragEnd(event)" ondrop="edDrop(event,'${q1(esc(label))}',${i})"
      title="${was.has(v)?'drag to reorder':'Added by you · drag to reorder'}">
      <span class="g">⠿</span><span class="${i===0?'first':''}">${esc(v)}</span>
      ${(extra||(()=>''))(v,i)}
      <button class="${o.cls==='ug'?'xup':'x'}" title="Remove ${esc(v)}"
        onclick="${o.rm?o.rm(i,v):`edListRemove('${q1(esc(label))}',${i})`}">✕</button>
    </span>`).join('')||'<span class="count">— empty —</span>'}
    ${gone.map(v=>`<span class="chipd gone" title="Removed by you — click to put it back"
      onclick="edListRestore('${q1(esc(label))}','${q1(esc(v))}')">${esc(v)}</span>`).join('')}</div>`;
}
function edListRestore(label,v){
  const list=csv(edFieldVal(label));
  if(list.indexOf(v)<0)list.push(v);
  edSetField(label,list.join(', ')); edRenderTab();
}
function edListRemove(label,i){
  const list=csv(edFieldVal(label)); list.splice(i,1);
