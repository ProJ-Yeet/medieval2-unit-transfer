<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medieval 2 GUI Toolkit</title>
<style>
  :root{--bg:#14171c;--panel:#1c2128;--panel2:#232a33;--edge:#333c47;--ink:#e6e9ee;--dim:#98a3b3;
    --accent:#c8a45c;--accent2:#5b8def;--good:#5cc98a;--warn:#e0b341;--bad:#e06c6c;
    /* the label column every path row in a model card shares — one value so
       meshes, textures, sprites and attachments all start at the same column */
    --plw:190px;}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--panel);
    border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:10;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;color:var(--accent);letter-spacing:.5px;font-weight:600;white-space:nowrap}
  .sep{width:1px;height:22px;background:var(--edge);margin:0 3px}
  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  select,input,button,textarea{background:var(--panel2);color:var(--ink);border:1px solid var(--edge);
    border-radius:6px;padding:6px 9px;font-size:13px;font-family:inherit}
  input[type=search]{min-width:150px}
  button{cursor:pointer} button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600}
  button.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  button.danger{border-color:var(--bad);color:var(--bad)}
  button:disabled{opacity:.4;cursor:not-allowed}
  label.chk{display:inline-flex;gap:5px;align-items:center;color:var(--dim);font-size:12px;cursor:pointer}
  .count{color:var(--dim);font-size:12px}
  .layout{display:flex;height:calc(100vh - 50px)}
  .filters{width:210px;flex:0 0 210px;padding:12px;overflow:auto;border-right:1px solid var(--edge);background:var(--panel)}
  .filters h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:16px 0 6px}
  .filters h3:first-child{margin-top:0}
  /* A filter group folds shut. The heading is the control, so the whole line is
     clickable and the caret only says which way it is pointing. */
  .filters h3.filtfold{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
    padding:2px 4px;margin-left:-4px;margin-right:-4px;border-radius:5px}
  .filters h3.filtfold:hover{background:var(--panel2);color:var(--fg)}
  .filters h3.filtfold .fgc{font-size:9px;line-height:1;transition:transform .12s ease;
    transform:rotate(90deg);flex:0 0 auto}
  .filters h3.filtfold.shut .fgc{transform:rotate(0deg)}
  .filters h3.filtfold .fgn{margin-left:auto;font-size:10px;color:var(--dim);
    background:var(--panel2);border-radius:9px;padding:0 6px;letter-spacing:0}
  .filters .fgbody.shut{display:none}
  .filters .opt{display:block;padding:2px 0;font-size:13px;cursor:pointer}
  .filters .opt input{vertical-align:middle;margin-right:6px}
  /* NB: no top padding on the scroll container — a scroll-container's top padding
     stays inside the scrollport and shows as a gap above a top:0 sticky header.
     Breathing room comes from the first group's margin, which scrolls away. */
  main{flex:1;overflow:auto;padding:0 16px 16px}
  .faction-group{margin-bottom:24px}
  .faction-group:first-child{margin-top:12px}
  .faction-head{display:flex;align-items:baseline;gap:10px;position:sticky;top:0;background:var(--bg);
    padding:8px 0 6px;border-bottom:1px solid var(--edge);margin-bottom:10px;z-index:1;
    cursor:pointer;user-select:none}
  .faction-head:hover h2{color:var(--accent2)}
  .faction-head h2{margin:0;font-size:15px;color:var(--accent)}
  .faction-head .n{color:var(--dim);font-size:12px}
  /* the whole heading is the hit area, so the marker is a label and not a
     second thing to aim at */
  .faction-head .fold{color:var(--dim);font-size:11px;width:10px}
  .faction-group.folded .faction-head{margin-bottom:0;border-bottom-style:dashed}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
  .card{position:relative;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:8px;
    display:flex;gap:8px;align-items:center;cursor:pointer;transition:border-color .1s}
  .card:hover{border-color:var(--accent2)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .card img{width:48px;height:64px;object-fit:contain;background:#0d0f13;border-radius:4px;flex:0 0 48px}
  .card .meta{min-width:0}
  .card .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .sub{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .tick{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:4px;border:1px solid var(--edge);
    background:var(--panel2);display:none;align-items:center;justify-content:center;font-size:12px}
  body.selmode .card .tick{display:flex}
  .card.sel .tick{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .badge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;background:var(--panel2);
    color:var(--dim);border:1px solid var(--edge);margin-right:3px}
  .badge.merc{color:var(--warn);border-color:var(--warn)}
  /* M2TWEOP unit: defined in the extender's own files, not export_descr_unit.txt.
     Deliberately the loudest badge on the card — which file a unit lives in
     changes where every edit to it is written. */
  .badge.eop{color:var(--accent);border-color:var(--accent);font-weight:600}
  /* class badge sits next to the category one — dimmer so category reads first */
  .badge.cls{background:transparent}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--edge);border-radius:5px;
    padding:2px 7px;margin:2px 3px 2px 0;font-size:12px}
  .empty{color:var(--dim);padding:40px;text-align:center}
  .projline{margin-top:4px;font-size:12px;color:var(--dim)}
  .warnbox{background:#3a2a10;border:1px solid var(--warn);color:#f4d9a0;border-radius:8px;
    padding:9px 11px;margin:0 0 12px;font-size:12.5px;line-height:1.5}
  .warnbox code{background:#00000030;padding:0 4px;border-radius:3px}
  .drawer{position:fixed;top:0;right:0;width:380px;max-width:92vw;height:100vh;background:var(--panel);
    border-left:1px solid var(--edge);box-shadow:-8px 0 24px #0008;transform:translateX(100%);
    transition:transform .16s ease;overflow:auto;z-index:20}
  .drawer.open{transform:translateX(0)}
  .drawer .dh{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--edge);align-items:center}
  .drawer .dh img{width:72px;height:96px;object-fit:contain;background:#0d0f13;border-radius:6px}
  .drawer .dh h2{margin:0 0 4px;font-size:16px}
  .drawer .infowrap{padding:14px 14px 0}
  .drawer .infowrap img{display:block;width:100%;height:auto;object-fit:contain;
    background:#0d0f13;border-radius:8px;border:1px solid var(--edge)}
  .drawer .infowrap .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--dim);margin-bottom:5px}
  .drawer .body{padding:14px}
  .drawer .row{margin-bottom:12px}
  .drawer .row .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:3px}
  .drawer .close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer}
  .overlay{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:center;justify-content:center}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--edge);border-radius:10px;width:640px;max-width:95vw;
    max-height:92vh;overflow:auto;box-shadow:0 12px 40px #000b}
  .modal h2{margin:0;padding:14px 16px;border-bottom:1px solid var(--edge);font-size:16px}
  .modal .mbody{padding:16px}
  .modal .foot{padding:12px 16px;border-top:1px solid var(--edge);display:flex;gap:8px;justify-content:flex-end;
    align-items:center;position:sticky;bottom:0;background:var(--panel)}
  label.chk.cleanerbox{max-width:52%;line-height:1.35}
  fieldset{border:1px solid var(--edge);border-radius:8px;margin:0 0 14px;padding:10px 12px}
  legend{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:0 6px}
  .radio-row label{display:block;margin:4px 0;cursor:pointer}
  .rename-fields{margin-top:8px;padding-left:22px}
  .rename-fields label{display:block;font-size:12px;color:var(--dim);margin:6px 0}
  .rename-fields input{width:100%}
  .preview{background:var(--panel2);border:1px solid var(--edge);border-radius:8px;padding:10px;
    font:12px/1.4 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:220px;overflow:auto}
  .progress-track{background:var(--panel2);border:1px solid var(--edge);border-radius:6px;height:10px;overflow:hidden}
  .progress-fill{background:var(--accent);height:100%;transition:width .15s ease}
  .proglist{max-height:260px;overflow:auto;border:1px solid var(--edge);border-radius:8px}
  .proglist-row{display:flex;gap:8px;align-items:center;padding:6px 10px;font-size:12.5px;
    border-bottom:1px solid var(--edge)}
  .proglist-row:last-child{border-bottom:none}
  .proglist-row .pi{width:14px;text-align:center;flex:0 0 auto}
  .proglist-row.w-warn .pi{animation:spin 1s linear infinite;display:inline-block}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  /* structured plan summary — each row keeps its own indent column so wrapped
     text aligns under itself instead of snapping back to the left margin */
  .sum{background:var(--panel2);border:1px solid var(--edge);border-radius:8px;
    padding:9px 11px;max-height:280px;overflow:auto;font-size:12px;line-height:1.5}
  .srow{display:flex;gap:7px;align-items:flex-start;padding:1px 0}
  .srow .sicon{flex:0 0 12px;text-align:center;color:var(--dim);font-size:11px}
  .srow .stext{flex:1;min-width:0;overflow-wrap:anywhere}
  .srow.lvl2{margin-left:14px} .srow.lvl3{margin-left:30px}
  .srow.warn .stext{color:var(--warn)} .srow.warn .sicon{color:var(--warn)}
  .srow.good .stext{color:var(--good)} .srow.bad .stext{color:var(--bad)}
  .srow.shead{margin-bottom:3px;padding-bottom:4px;border-bottom:1px solid var(--edge)}
  .srow.shead .stext{font-weight:600;color:var(--ink)}
  .srow .path{font-family:ui-monospace,Consolas,monospace;color:var(--dim)}
  .srow .num{color:var(--accent);font-weight:600}
  .w-warn{color:var(--warn)} .w-bad{color:var(--bad)} .w-good{color:var(--good)}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--edge);border-radius:8px;padding:10px 16px;z-index:50;box-shadow:0 6px 20px #000a;display:none}
  .toast.show{display:block}
  /* Loading bar: pinned to the bottom edge, full width, out of the way of the
     content but impossible to miss. Hidden until a burst of requests has run
     long enough to be worth mentioning (LOADBAR_DELAY), so a fast screen never
     flickers one. */
  .loadbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);
    border-top:1px solid var(--edge);padding:6px 14px 7px;display:none;
    box-shadow:0 -4px 14px #0006}
  .loadbar.on{display:block}
  .lbtrack{height:4px;border-radius:3px;background:var(--panel2);overflow:hidden}
  .lbfill{height:100%;width:4%;border-radius:3px;background:var(--accent);
    transition:width .18s ease-out}
  /* One request on its own has no fraction to report — a bar parked at 4% reads
     as "stuck". It sweeps instead, and only becomes a real measure once there
     is something to measure (a burst of several requests). */
  .loadbar.busy .lbfill{width:38%;transition:none;animation:lbsweep 1.15s ease-in-out infinite}
  @keyframes lbsweep{0%{margin-left:-38%}100%{margin-left:100%}}
  .lbrow{display:flex;gap:10px;align-items:baseline;margin-top:4px}
  .lbtext{font-size:11.5px;color:var(--dim)}
  .lbnum{font-size:11px;color:var(--dim);opacity:.8;margin-left:auto}
  .log-item{border:1px solid var(--edge);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--panel2)}
  .log-item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .log-item .when{color:var(--dim);font-size:11px}
  .log-item pre{font:11px/1.35 ui-monospace,Consolas,monospace;white-space:pre-wrap;margin:8px 0 0;color:var(--dim);max-height:130px;overflow:auto}
  .undone{opacity:.5}
  .pill{font-size:10px;padding:1px 6px;border-radius:10px;border:1px solid var(--edge);color:var(--dim)}
  /* base picker */
  .basepick{display:flex;gap:10px;align-items:flex-start}
  .baseimg{width:56px;height:74px;object-fit:contain;background:#0d0f13;border-radius:5px;flex:0 0 56px}
  .baselist{max-height:190px;overflow:auto;border:1px solid var(--edge);border-radius:6px;margin-top:6px}
  .baserow{display:flex;gap:8px;align-items:center;padding:5px 8px;cursor:pointer;border-bottom:1px solid var(--edge)}
  .baserow:hover{background:var(--panel2)} .baserow.sel{background:#2a3340}
  .baserow img{width:32px;height:42px;object-fit:contain;background:#0d0f13;border-radius:3px}
  .baserow .bn{font-size:12px} .baserow .bs{font-size:10px;color:var(--dim)}
  /* batch */
  .batchstrip{display:flex;gap:6px;overflow:auto;padding-bottom:8px;margin-bottom:10px}
  .bchip{flex:0 0 auto;border:1px solid var(--edge);border-radius:8px;padding:6px;text-align:center;cursor:pointer;width:92px;background:var(--panel2)}
  .bchip.sel{border-color:var(--accent)}
  .bchip img{width:40px;height:52px;object-fit:contain;background:#0d0f13;border-radius:3px;display:block;margin:0 auto 3px}
  .bchip .t{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bchip .base{font-size:9px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fieldrow{display:flex;gap:6px;margin:4px 0}
  .fieldrow select{flex:0 0 200px} .fieldrow input{flex:1}
  .ovr{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 6px;border:1px solid var(--edge);border-radius:5px;margin:3px 0}
  .ovr code{color:var(--accent)}
  /* disabled include-option (officer/mount/crew absent) */
  label.chk.off{opacity:.4;cursor:not-allowed}
  label.chk.off input{cursor:not-allowed}
  /* 500 unit-limit warning banner */
  .limitwarn{border:1px solid var(--warn);background:#2a2410;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}
  .limitwarn b{color:var(--warn)}
  .limitwarn .sub{color:var(--dim);font-size:12px;margin-top:4px}
  .limitwarn .acts{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .limitwarn button{font-size:12px;padding:4px 8px}
  /* all-EDU-fields editor (matches ModdingTool's unit edit screen: every field at once) */
  .allfields{max-height:320px;overflow:auto;border:1px solid var(--edge);border-radius:6px;padding:6px;background:var(--panel2)}
  .afrow{display:flex;gap:8px;align-items:center;margin:2px 0}
  .afrow label{flex:0 0 200px;font-size:12px;color:var(--dim);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .afrow input{flex:1;min-width:0;padding:3px 6px;font-size:12px}
  .afrow input.changed{border-color:var(--accent);background:#241f0d;color:var(--ink)}
  .afrow.dup input{opacity:.5}
  .fieldbar{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .fieldbar input{flex:1} .fieldbar .count{white-space:nowrap}
  /* officer / mount / crew name lists in the transfer menu */
  .optnames{margin-top:6px;font-size:12px}
  .optnames .k{color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.5px;margin-right:6px}
  label.chk.mini{background:var(--panel2);border:1px solid var(--edge);border-radius:5px;
    padding:2px 7px;margin:2px 4px 2px 0}
  .frombase{color:var(--accent);font-size:11px;margin-left:6px}
  /* per-group "source or base" toggles, directly above the field editor */
  .basefrom{margin-bottom:8px;padding:7px 9px;border:1px solid var(--edge);
    border-radius:6px;background:var(--panel2)}
  .basefrom.off{opacity:.5}
  .basefrom .bftitle{font-size:11px;color:var(--dim);margin-bottom:5px}
  .basefrom .bftitle b{color:var(--accent)}
  .sbrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:2px 0}
  /* 84px, not 66: the widest label here is "Armour upgrades" and one of the rows
     carries a ? marker in front of its label — both have to fit without wrapping
     or the radios below them stop lining up. */
  .sbrow .k{flex:0 0 150px;color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.5px}
  .sbrow label{font-size:12px;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
  .sbrow .count{font-size:11px}
  /* missing-animation warning, sitting directly under the SOLDIER row it belongs
     to (indented to that row's radios so it reads as part of it) */
  .sbanim{margin:3px 0 5px 160px;padding:5px 7px;font-size:11px;line-height:1.45;
    border:1px solid var(--warn);border-radius:5px;
    background:rgba(224,179,65,.10);color:var(--ink)}
  .sbanim b{color:var(--warn)}
  .sbanim code{font-size:11px}
  .sbanim ul{margin:3px 0 0;padding-left:16px}
  .sbanim li{margin:1px 0}
  .sbanim b+ul+b{display:inline-block;margin-top:7px}
  /* base picker faction filter */
  .basebar{display:flex;gap:6px} .basebar input{flex:1;min-width:0} .basebar select{flex:0 0 150px}
  /* "inherited from base" badge in the field editor — a button when the source
     unit has a value of its own to switch back to, a flat marker when it doesn't */
  .ibadge{display:inline-block;margin-left:5px;font-size:9px;background:var(--accent);color:#1a1a1a;
    border-radius:3px;padding:0 4px;font-weight:700;vertical-align:middle;
    border:1px solid var(--accent);font-family:inherit;line-height:15px}
  button.ibadge{cursor:pointer}
  button.ibadge.off{background:transparent;color:var(--dim);border-color:var(--edge)}
  button.ibadge:hover{filter:brightness(1.15)}
  /* Nothing to switch to, so it is not a button. Hollow with a dashed edge, and
     it says why on the line rather than only in a tooltip. */
  span.ibadge.fixed{background:transparent;color:var(--dim);border-style:dashed;
    border-color:var(--dim);cursor:help}
  .bwhy{font-size:10.5px;color:var(--dim);margin-left:5px;font-style:italic}
  /* reroute folder browser */
  .brbar{display:flex;gap:6px;align-items:center} .brbar input{flex:1;min-width:0}
  .brlist{max-height:140px;overflow:auto;border:1px solid var(--edge);border-radius:6px;margin-top:6px;background:var(--panel2)}
  .brrow{padding:4px 8px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--edge)}
  .brrow:hover{background:#2a3340}
  /* asset (texture/mesh) conflict resolver */
  .assetconf{margin-top:10px;border-color:var(--warn)}
  .assetconf .radio-row label{margin:5px 0}
  .assetconf code{color:var(--accent)}
  /* one file per row, path on its own line so sizes stay readable */
  .assetconf .flist{max-height:140px;overflow:auto;font-size:11px;color:var(--dim);
    margin-top:6px;border-top:1px solid var(--edge);padding-top:6px}
  .assetconf .frow{padding:3px 0;border-bottom:1px solid var(--edge)}
  .assetconf .frow:last-child{border-bottom:none}
  .assetconf .frow .fp{font-family:ui-monospace,Consolas,monospace;color:var(--ink);
    overflow-wrap:anywhere;display:block}
  .assetconf .frow .fs{color:var(--dim);font-size:10px}
  /* ---- unit editor (edit mode) ---- */
  /* ---- burger menu: the module switcher. A drawer, not a dropdown, because the
     module list is growing past what a <select> can present without eating the
     header. Items are built from MODES in one place — adding a module is one
     array entry, not new markup. ---- */
  .navbtn{color:var(--accent);font-weight:600;letter-spacing:.4px;display:inline-flex;
    gap:8px;align-items:center;white-space:nowrap}
  .navbtn .burger{font-size:15px;line-height:1}
  .navback{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;
    pointer-events:none;transition:opacity .15s}
  .navback.open{opacity:1;pointer-events:auto}
  .navmenu{position:fixed;top:0;left:0;bottom:0;width:290px;background:var(--panel);
    border-right:1px solid var(--edge);z-index:41;transform:translateX(-100%);
    transition:transform .15s ease-out;display:flex;flex-direction:column}
  .navmenu.open{transform:none}
  .navbrand{padding:14px 16px 10px;border-bottom:1px solid var(--edge)}
  .navbrand .t{color:var(--accent);font-weight:600;font-size:15px;letter-spacing:.5px}
  .navbrand .s{color:var(--dim);font-size:11px;margin-top:2px}
  .navmodes{flex:1;overflow:auto;padding:8px}
  .navitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;
    border:1px solid transparent;border-radius:6px;padding:9px 10px;margin:1px 0;color:var(--ink)}
  .navitem:hover{background:var(--panel2);border-color:var(--edge)}

  .sprhead h2{margin:0 0 3px;font-size:15px;color:var(--accent)}
  .sndhead{position:sticky;top:0;background:var(--bg);padding:10px 0 6px;z-index:2;
    border-bottom:1px solid var(--edge)}
  .sndhead h2{margin:0 0 3px;font-size:15px;color:var(--accent)}
  .sndtabs{display:flex;gap:6px;margin:10px 0 0}
  .sndbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:8px 10px;
    background:var(--panel);border:1px solid var(--edge);border-radius:8px}
  .sndbar select,.sndbar input{padding:4px 7px;font-size:12px}
  .sndbar .grow{flex:1;min-width:120px}
  .sndlist{border:1px solid var(--edge);border-radius:8px;background:var(--panel);margin-top:10px}
  /* The unit column had 1.5fr and squeezed "In game now" into 88px, which cut off
     the one thing the row is telling you ("English — generic", "Gondor/General ✗").
     Half the width is plenty for a name over its type, and the freed space goes
     where the text actually is. */
  .sndrow{display:grid;grid-template-columns:minmax(170px,.9fr) minmax(150px,.6fr) 130px 100px minmax(180px,1.6fr) 46px;
    gap:8px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--edge)}
  .sndrow:last-child{border-bottom:none}
  .sndrow.hrow{background:var(--panel2);color:var(--dim);font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;position:sticky;top:0;border-radius:8px 8px 0 0}
  .sndrow.staged{background:rgba(92,201,138,.08);box-shadow:inset 3px 0 0 var(--good)}
  .sndrow.dropping{background:rgba(224,108,108,.08);box-shadow:inset 3px 0 0 var(--bad)}
  .sndrow select{width:100%;padding:3px 6px;font-size:12px;min-width:0}
  .sndrow select:disabled{opacity:.55}
  /* the unit card beside the name — the voice bank is hundreds of rows of type
     names, and a type name is the one thing about a unit nobody recognises */
  .sndrow .un{min-width:0;display:flex;align-items:center;gap:8px;cursor:pointer}
  .sndrow .un .uc{width:26px;height:34px;object-fit:contain;background:#0d0f13;
    border-radius:4px;flex:0 0 26px}
  .sndrow .un .uc.empty{display:inline-block;border:1px dashed var(--edge);background:none}
  .sndrow .un .un2{min-width:0}
  .sndrow .un .nm{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sndrow .un .ty{display:block;color:var(--dim);font-size:11px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .sndrow .now{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sndrow .rm{display:flex;justify-content:center}
  /* ---- composer: the voice fieldset ---- */
  .sndopt{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
  .sndpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .sndpick select{flex:0 0 auto;max-width:210px}
  .sndpick .lockicon{color:var(--warn);cursor:help}
  .sndlocked{border:1px dashed var(--warn);border-radius:6px;padding:6px 8px;margin-top:6px}
  .sndlist.mini{max-height:190px;overflow:auto;margin-top:6px}

  /* ================= code view ============================================
     The GUI and the file's own text, side by side. The highlight is a stack of
     empty rows BEHIND a transparent textarea rather than a second copy of the
     text: one copy of the characters means no font, no tab stop and no ligature
     can make the two drift apart. All three columns — gutter, overlay, textarea
     — therefore have to agree on the line box exactly, which is what --cvlh and
     the shared padding are for. */
  /* `align-items:stretch`, not `start`, and that is the whole reason .cvpane's
     `position:sticky` works. Every adopter wraps cvHtml() in a column div, so
     the pane is a CHILD of the grid item rather than the item itself; with the
     item shrink-wrapped to its content there is no room inside it for a sticky
     box to travel, and the pane scrolled away like any other block. Stretching
     the column to the row's height gives the sticky its range back. */
  .cvsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,42%);gap:12px;
    align-items:stretch}
  .cvsplit.off{display:block}
  @media (max-width:1100px){.cvsplit{grid-template-columns:minmax(0,1fr)}}
  .cvpane{--cvlh:17px;border:1px solid var(--edge);border-radius:8px;background:var(--panel);
    padding:8px;position:sticky;top:0}
  .cvpane.bad{border-color:var(--bad)}
  .cvbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .cvbar .sp{flex:1}
  /* Tall enough that a whole unit block is usually on screen at once — the pane
     stays sticky, so it cannot simply grow with the page. */
  .cvwrap{display:flex;height:min(78vh,900px);border:1px solid var(--edge);border-radius:6px;
    background:var(--panel2);overflow:hidden}
  .cvgutter{flex:0 0 44px;overflow:hidden;background:var(--bg);border-right:1px solid var(--edge);
    position:relative}
  .cvcode{position:relative;flex:1;min-width:0}
  .cvhl{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .cvshift{position:absolute;left:0;right:0;top:0;padding:6px 0;will-change:transform}
  .cvg,.cvl{height:var(--cvlh);line-height:var(--cvlh);font:12px/var(--cvlh) ui-monospace,
    "Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace}
  .cvg{color:var(--dim);text-align:right;padding-right:8px;opacity:.55}
  .cvg.on{color:var(--accent);opacity:1;font-weight:600}
  .cvl{position:relative}
  .cvl.on{background:rgba(91,141,239,.22);box-shadow:inset 2px 0 0 var(--accent2)}
  .cvl.err{background:rgba(224,108,108,.22);box-shadow:inset 2px 0 0 var(--bad)}
  /* The ONE value of the line the hovered box edits. Positioned in `ch` against
     the same monospace font the textarea uses, from columns the server has
     already expanded tabs in, so it lands on the characters and not near them. */
  .cvtok{position:absolute;top:0;height:var(--cvlh);display:block;
    background:rgba(91,141,239,.42);border-radius:3px;
    box-shadow:0 0 0 1px var(--accent2)}
  .cvta{position:relative;width:100%;height:100%;border:none;border-radius:0;background:transparent;
    color:var(--ink);padding:6px 8px;resize:none;white-space:pre;overflow:auto;
    tab-size:4;-moz-tab-size:4;
    font:12px/var(--cvlh) ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace}
  .cvta:focus{outline:none}
  .cverr{margin-top:6px;font-size:12px;line-height:1.5;min-height:1px}
  /* ---- raw lines, line for line ------------------------------------------
     One box per EDU line beside the file's own lines, and row n opposite line
     n. Two scrollers cannot hold that, so in this mode NEITHER pane scrolls:
     both are expanded to their full height (set in px by edRawAlign / cvExpand,
     which know the line count) and the dialog is the only thing that moves.
     The rows are absolutely positioned from the spans the server sends, not
     stacked in order — a block has a `type` line, hidden comment lines and
     repeats, so counting rows would drift. --cvlh grows to the height of a box
     for the same reason: it is the unit both sides measure in. */
  .cvsplit.rawpair .cvpane{position:static;--cvlh:26px}
  .cvsplit.rawpair .cvwrap{overflow:visible}
  .cvsplit.rawpair .cvta{overflow:hidden}
  .cvsplit.rawpair .allfields{max-height:none;overflow:visible}
  .allfields.aligned{position:relative}
  .allfields.aligned .afrow{position:absolute;left:6px;right:6px;height:26px;margin:0}
  .allfields.aligned .afrow input{height:22px}
  /* a field the file has no line for yet — it sits under the block, not in it */
  .allfields.aligned .afrow.unplaced{opacity:.75;border-left:2px dashed var(--edge);
    padding-left:5px}
  /* the box on the GUI side whose line the pointer (or the caret) is on */
  .cvlit{background:rgba(91,141,239,.14);border-radius:6px;
    box-shadow:0 0 0 1px var(--accent2) inset}

  /* ================= guided field editor ==================================
     The default view of a unit's EDU lines: every comma-separated slot gets its
     own labelled box, a drop-down where the engine only accepts a fixed set, and
     a one-line explanation of what it does. `.gfraw` is the escape hatch — the
     whole line as text, exactly what the raw view shows. */
  .allfields.guided{max-height:none;overflow:visible;border:none;padding:0;background:none}
  .gfmode{display:inline-flex;border:1px solid var(--edge);border-radius:6px;overflow:hidden}
  .gfmode button{border:none;border-radius:0;padding:3px 9px;font-size:11.5px;background:var(--panel2);
    color:var(--dim)}
  .gfmode button+button{border-left:1px solid var(--edge)}
  .gfmode button.on{background:var(--accent2);color:#fff}
  .gfnav{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 2px;position:sticky;top:0;z-index:2;
    background:var(--panel);padding-bottom:6px}
  .gfnav button{padding:4px 10px;font-size:12px;border-radius:14px}
  .gfnav button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .gfnav button .n{opacity:.65;font-size:10.5px;margin-left:4px}
  .gfnav button .bad{color:var(--warn);margin-left:4px}
  /* No inner scroller. A nested one meant reaching the bottom of the stat list
     handed the wheel to the dialog behind it mid-gesture; the list now grows and
     the dialog is the only thing that scrolls. */
  .gfbody{border:1px solid var(--edge);border-radius:8px;
    padding:10px;background:var(--panel2)}
  .gfintro{font-size:12px;color:var(--dim);margin:0 0 10px;line-height:1.5}
  .gfcard{border:1px solid var(--edge);border-radius:8px;background:var(--panel);padding:9px 11px 11px;
    margin-bottom:9px}
  /* Cards that are one drop-down each, sitting on one line — see GF_PAIRS.
     `--gfn` is how many are on this row; the fallbacks below are for a window
     too narrow to give each of them a usable box. */
  .gfpair{display:grid;gap:0 9px;align-items:stretch;
    grid-template-columns:repeat(var(--gfn,2),minmax(0,1fr))}
  .gfpair>.gfcard{min-width:0}
  @media (max-width:1250px){.gfpair{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:780px){.gfpair{grid-template-columns:minmax(0,1fr)}}
  .gfcard.changed{border-color:var(--accent)}
  .gfcard.gone{opacity:.55}
  .gfcard.gone .gfhead .t{text-decoration:line-through}
  .gfhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .gfhead .t{font-size:13px;font-weight:600}
  .gfhead .k{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
  .gfhead .sp{flex:1}
  .gfhead button{background:none;border:1px solid transparent;color:var(--dim);padding:1px 6px;
    font-size:12px;border-radius:5px;line-height:1.5}
  .gfhead button:hover{border-color:var(--accent);color:var(--ink)}
  .gfhead button.on{border-color:var(--accent2);color:var(--accent2)}
  .gfhead .rm:hover{border-color:var(--bad);color:var(--bad)}
  .gfdoc{font-size:11.5px;color:var(--dim);margin:5px 0 0;line-height:1.5}
  .gfdoc code{background:var(--panel2);padding:0 3px;border-radius:3px}
  /* every note is written as a lead line and then points — see docPoints() */
  .gfdoc ul,.gftip .tb ul,.count ul,.bnote ul,.sprnote ul{margin:4px 0 0;padding-left:16px}
  .gfdoc li,.gftip .tb li,.count li,.bnote li,.sprnote li{margin:2px 0}
  .gfgrid{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:8px}
  .gfpart{display:flex;flex-direction:column;gap:3px;min-width:0}
  .gfpart>.pl{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gfpart input,.gfpart select{padding:4px 7px;font-size:12.5px}
  .gfpart input.gfnum{width:78px;text-align:right;font-variant-numeric:tabular-nums}
  .gfpart.w2 input,.gfpart.w2 select{width:150px}
  .gfpart.w3 input,.gfpart.w3 select{width:210px}
  .gfpart.grow{flex:1;min-width:190px}
  .gfpart.grow input,.gfpart.grow select{width:100%}
  .gfcombo{display:flex;gap:4px;align-items:stretch}
  .gfbrowse{flex:0 0 auto;padding:0 8px;font-size:13px;line-height:1}
  /* ---- the soldier-model picker ---- */
  .mplist{max-height:300px;overflow:auto;border:1px solid var(--edge);border-radius:7px;
    background:var(--panel2)}
  .mprow{display:flex;gap:9px;align-items:center;padding:5px 9px;border-bottom:1px solid var(--edge);
    cursor:pointer}
  .mprow:last-child{border-bottom:none}
  .mprow:hover{background:var(--panel)}
  .mprow.on{outline:1px solid var(--accent);outline-offset:-1px}
  .mprow img{width:30px;height:39px;object-fit:contain;background:#0d0f13;border-radius:4px;flex:0 0 30px}
  .mprow .mn{flex:1;min-width:0;font-size:12.5px;font-family:ui-monospace,Consolas,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mprow .msk{flex:0 0 auto;font-size:10.5px;color:var(--dim);
    font-family:ui-monospace,Consolas,monospace}
  .mprow .mu{flex:0 0 78px;text-align:right;font-size:10.5px;color:var(--dim)}
  .mptabs{display:flex;gap:4px;margin-bottom:8px}
  .mptabs button.on{border-color:var(--accent);color:var(--accent)}
  /* only the PART you changed lights up, not all thirteen numbers of a stat line */
  .gfpart input.changed,.gfpart select.changed{border-color:var(--accent);background:#241f0d}
  .gfpart.changed>.pl{color:var(--accent)}
  .gfpart .chk input.changed{outline:1px solid var(--accent);outline-offset:2px}
  .gfpart .sub{font-size:10.5px;color:var(--dim)}
  .gfrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:7px}
  .gfraw{display:flex;gap:6px;align-items:center;margin-top:8px}
  .gfraw input{flex:1;min-width:0;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;padding:4px 7px}
  .gfraw .pl{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
  .gfnote{font-size:11.5px;margin-top:7px;padding:5px 8px;border-radius:6px;border:1px solid var(--edge);
    background:var(--panel2);color:var(--dim)}
  .gfnote.warn{border-color:var(--warn);color:var(--warn)}
  .gfnote.bad{border-color:var(--bad);color:var(--bad)}
  .gfnote.good{border-color:var(--good);color:var(--good)}
  .gfnote.info{border-style:dashed}
  .gfnote b{color:var(--ink)}
  .gfmissing{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;
    border-top:1px dashed var(--edge);padding-top:9px}
  .gfmissing select{max-width:230px}
  .gfempty{color:var(--dim);font-size:12.5px;padding:14px 4px}
  .gfsum{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
  .gfsum .pill{border:1px solid var(--edge);border-radius:12px;padding:1px 9px;font-size:11.5px;
    color:var(--dim);background:var(--panel)}
  .gfsum .pill.warn{border-color:var(--warn);color:var(--warn);cursor:pointer}
  .gfoff{display:flex;gap:4px;align-items:center}
  .gfoff .idx{font-size:10.5px;color:var(--dim);width:14px;text-align:right}
  /* number box + its own ▴▾ (see gfSpin: not <input type=number>, which refuses
     the decimals, negatives and blanks the EDU is full of) */
  .gfspin{display:inline-flex;align-items:stretch}
  .gfspin input.gfnum{border-top-right-radius:0;border-bottom-right-radius:0;border-right:none}
  .gfsp{display:flex;flex-direction:column;width:17px;flex:0 0 17px}
  .gfsp button{flex:1;padding:0;margin:0;width:17px;min-height:0;font-size:8px;line-height:1;
    border:1px solid var(--edge);border-radius:0;background:var(--panel);color:var(--dim);
    display:flex;align-items:center;justify-content:center}
  .gfsp button:first-child{border-top-right-radius:6px;border-bottom:none}
  .gfsp button:last-child{border-bottom-right-radius:6px}
  .gfsp button:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .gfsp button:active{background:var(--accent);border-color:var(--accent);color:#1a1a1a}
  .gfpart.grow .gfspin,.gfpart.w2 .gfspin,.gfpart.w3 .gfspin{width:100%}
  .gfpart .gfspin input.gfnum{width:78px}
  /* the hover card: what a field or one of its values does */
  .gftip{position:fixed;z-index:60;display:none;max-width:390px;background:var(--panel);
    border:1px solid var(--accent2);border-radius:8px;padding:9px 11px;
    box-shadow:0 10px 30px #000a;pointer-events:none}
  .gftip .tt{font-size:12.5px;font-weight:600;color:var(--ink)}
  .gftip .topt{font-weight:400;color:var(--dim);font-size:11px}
  .gftip .tk{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:var(--accent);
    margin:2px 0 5px;overflow-wrap:anywhere}
  .gftip .tb{font-size:12px;line-height:1.5;color:var(--dim)}
  .gftip .tb b{color:var(--ink)}
  .gftip .tb code,.gftip .tf code{background:var(--panel2);padding:0 3px;border-radius:3px;color:var(--ink)}
  .gftip .tf{font-size:11px;color:var(--dim);margin-top:6px;padding-top:5px;
    border-top:1px solid var(--edge)}
  /* ---- the ? that carries a field's explanation ----
     Small, quiet, and at the field's top-left so it reads before the field does.
     It is a marker, not a button: it never takes an action, it only explains. */
  .qm{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:13px;height:13px;margin-right:5px;border-radius:50%;cursor:help;
    border:1px solid var(--edge);background:var(--panel2);color:var(--dim);
    font-size:9px;font-weight:700;line-height:1;vertical-align:1px;user-select:none;
    font-family:system-ui,sans-serif;letter-spacing:0;text-transform:none}
  .qm:hover,.qm:focus{border-color:var(--accent);color:var(--accent);
    background:var(--panel);outline:none}
  /* "⚠ unsaved changes" — a state to act on, not another grey line to read past */
  .dirtychip{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
    font-size:11.5px;font-weight:600;color:var(--warn);border:1px solid var(--warn);
    background:#2a2410;border-radius:5px;padding:2px 9px;white-space:nowrap}
  /* in a tight row the marker sits alone on the left of the field's label */
  .brow>.qm,.gfrow>.qm{margin-right:2px}
  .prow>.qm{justify-self:start}
  /* ---- Buildings mode: export_descr_buildings.txt ---- */
  /* Building art is landscape (78x62 small, 300x245 constructed), so these cards
     are wider and shorter than a unit card rather than reusing .card's portrait. */
  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:9px}
  .bcard{background:var(--panel);border:1px solid var(--edge);border-radius:8px;overflow:hidden;
    cursor:pointer;transition:border-color .1s;display:flex;flex-direction:column}
  .bcard:hover{border-color:var(--accent2)}
  .bcard .art{position:relative;background:#0d0f13;aspect-ratio:300/245;display:block}
  .bcard .art img{width:100%;height:100%;object-fit:contain;display:block}
  .bcard .art .src{position:absolute;top:5px;right:5px;font-size:9px;padding:1px 5px;border-radius:4px;
    background:#000a;border:1px solid var(--edge);color:var(--dim)}
  .bcard .art .src.vanilla{color:var(--accent2);border-color:var(--accent2)}
  .bcard .art .src.placeholder{color:var(--dim)}
  /* Fixed heights, for the same reason as .ucard: a building's name changes with
     the culture on show ("Stables" / "Warg Breeder"), and the tags below it must
     not move when it does. */
  .bcard .bmeta{padding:7px 9px;border-top:1px solid var(--edge)}
  .bcard .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;line-height:1.35;height:1.35em}
  .bcard .sub{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;line-height:1.35;height:1.35em}
  .bcard .tags{margin-top:4px}
  /* ---- the tree list, the gallery's alternative ----
     The gallery answers "what does this look like"; the tree answers "what is
     in this mod and how deep does it go", which on a 136-line EDB is the
     question you have more often. One row per line, its levels folded under it
     in the line's own `levels` order. */
  .btree{display:flex;flex-direction:column;gap:2px}
  .btrow{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid transparent;
    border-radius:6px;cursor:pointer;background:var(--panel)}
  .btrow:hover{border-color:var(--accent2)}
  .btrow.open{background:var(--panel2);border-color:var(--edge)}
  .btwist{flex:0 0 14px;color:var(--dim);font-size:10px;line-height:1;
    background:none;border:0;padding:0;cursor:pointer}
  .btrow img{flex:0 0 auto;width:44px;height:35px;object-fit:contain;background:#0d0f13;
    border-radius:4px;display:block}
  .btrow .antxt{flex:1 1 auto}
  .btrow .nm{font-size:13px;font-weight:600}
  .btrow .sub{font-size:11px;color:var(--dim)}
  .btlevels{margin:0 0 4px 30px;border-left:1px solid var(--edge);
    display:flex;flex-direction:column;gap:2px;padding:2px 0 2px 8px}
  .btlv{display:flex;align-items:center;gap:8px;padding:3px 7px;border:1px solid transparent;
    border-radius:5px;background:none;cursor:pointer;text-align:left;width:100%;color:inherit}
  .btlv:hover{background:var(--panel2);border-color:var(--edge)}
  .btlv img{width:34px;height:27px;object-fit:contain;background:#0d0f13;border-radius:3px;display:block}
  .btlv .t{flex:1 1 auto;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btlv .n{font-size:10.5px;color:var(--dim)}
  /* the new-tree form: level rows in the dialog */
  .ntlv{display:grid;grid-template-columns:22px 1fr 1fr 30px;gap:6px;align-items:center;
    padding:3px 0}
  .ntlv .i{color:var(--dim);font-size:11px;text-align:right}

  /* ---- number boxes with ▲▼ ----

  .numwrap{display:flex;align-items:center;gap:3px;min-width:0;flex:1}

  /* "= 15 turns": what a recruit rate of 0.066667 actually means */

  #bldBody .poolrow.changed,#bldBody .caprow.changed{

  #bldBody .ucard.changed{border-color:var(--accent)}

  .caprow .x{flex:0 0 auto;padding:2px 7px;font-size:12px}
  /* a recruit pool: unit card, the four pool numbers, its requires clause */

    padding-top:5px;border-top:1px dashed var(--edge)}

    letter-spacing:.5px;color:var(--dim)}

  .poolrow:last-child{border-bottom:none}
  .poolrow.gone{opacity:.4}
  .poolrow img{width:34px;height:45px;object-fit:contain;background:#0d0f13;border-radius:4px;flex:0 0 34px}
  .poolrow .who{flex:0 0 175px;min-width:0}
  .poolrow .who .un{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .poolrow .who .ut{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .poolrow .nums{display:flex;gap:6px;flex:0 0 auto}

  .bsec{margin-bottom:14px}

    display:flex;align-items:center;gap:8px}

  .bsec>h4 button{margin-left:auto;padding:3px 8px;font-size:11.5px}
  .bnote{font-size:11.5px;color:var(--dim);margin:4px 0 0}
  .badge.good{color:var(--good);border-color:var(--good)}
  /* ---- "used by" grid under a bmdb entry ---- */
  .edusers>h4{align-items:center}
  .usertog{background:none;border:none;color:inherit;font:inherit;text-transform:inherit;
    letter-spacing:inherit;padding:0;cursor:pointer;margin:0!important}
  .usertog:hover{color:var(--accent)}
  .usergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;
    max-height:260px;overflow:auto;border:1px solid var(--edge);border-radius:7px;padding:7px;
    background:var(--panel2)}
  .ucell{border:1px solid var(--edge);border-radius:6px;padding:5px;text-align:center;
    background:var(--panel);cursor:pointer;min-width:0}
  .ucell:hover{border-color:var(--accent)}
  .ucell.plain{cursor:default;opacity:.75}
  .ucell.plain:hover{border-color:var(--edge)}
  .ucell img,.ucell .ic{width:100%;height:52px;object-fit:contain;background:#0d0f13;border-radius:4px;

  /* ---- recruitment checks + the cross-tree compare ---- */

    font-size:12px;border-bottom:1px solid var(--edge)}

  .cklist{max-height:230px;overflow:auto}

  .ckrow:last-child{border-bottom:none}
  .ckrow img{width:26px;height:34px;object-fit:contain;background:#0d0f13;border-radius:4px;flex:0 0 26px}
  .ckwho{flex:1;min-width:0}
  .ckwho .un{font-size:12.5px}
  .ckwho .ut{font-size:10.5px;color:var(--dim)}
  .ckrow button{flex:0 0 auto;padding:3px 8px;font-size:11.5px}
  .poolrow.flash,.ucard.flash{outline:2px solid var(--accent);outline-offset:-2px}
  .bpnums label{display:flex;flex-direction:column;font-size:9px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.4px}
  .bpnums input{width:74px;padding:3px 5px;font-size:12px}
  .bcrow{display:flex;gap:8px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--edge)}
  .bcrow:last-child{border-bottom:none}

  .bcb{flex:0 0 190px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .bcn{flex:0 0 auto}
  .bcn input{width:70px;padding:3px 5px;font-size:12px}
  .bcn.odd input{border-color:var(--warn);color:var(--warn)}
  .bctw{flex:0 0 74px;display:flex;gap:4px;align-items:center;justify-content:center}
  .bcreq{flex:1;min-width:70px;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    display:flex;gap:6px;align-items:center}
  .bcreq>:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bcreq.changed{color:var(--accent)}
  /* the Variant drop-down and its ＋, which swaps it for a text box */

  .tiervar select,.tiervar input{flex:1;min-width:0}
  .tiervar button{flex:0 0 auto;padding:5px 10px}
  /* ---- Clean up the unit file: the ordering list and the banner sample ---- */
  .eduband{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .eduband label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim)}

  .eduband input[type=number]{width:80px}
  .eduband input{width:110px}
  .edusample{margin:8px 0 6px;padding:7px 9px;background:#0d0f13;border:1px solid var(--edge);
    border-radius:6px;overflow-x:auto}
  .edusample code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;
    white-space:pre;color:var(--dim)}
  .edulist{border:1px solid var(--edge);border-radius:7px;background:var(--panel2);overflow:hidden}
  .edurow{display:grid;grid-template-columns:minmax(200px,1.4fr) 120px 130px 160px 110px;
    gap:8px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--edge)}
  .edurow:last-child{border-bottom:none}
  .edurow.eduhd{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
  .edurow.placed{box-shadow:inset 3px 0 0 var(--accent)}

  .edurow .eunm .ty{display:block;font-size:10px;color:var(--dim);white-space:nowrap;

  .edurow .eun{min-width:0;display:flex;align-items:center;gap:5px}
  .edurow .eun select{width:100%;min-width:0}
  .edurow select.edited{border-color:var(--accent);color:var(--accent)}
  .edurow .eun .count{flex:0 0 auto;font-size:9.5px}
  .edurow .euk{font-size:10.5px}
  /* ---- city and castle, side by side (bldCompareVariants) ---- */
  .vcbtn{margin-left:auto;align-self:flex-start;font-size:13px;padding:8px 14px;
    white-space:nowrap}
  .vcbtn .badge.warn{background:var(--warn);color:#12151a;margin-left:4px}
  .vchead{display:flex;align-items:center;gap:14px;margin:2px 0 10px}
  .vchead .vcside{flex:1;min-width:0;display:flex;align-items:center;gap:8px;
    background:var(--panel2);border:1px solid var(--edge);border-radius:8px;padding:8px 10px}

  .vchead .vcside code{color:var(--dim);font-size:11px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .vchead .vcvs{flex:0 0 auto;color:var(--accent);font-size:20px}
  .vclv{margin-top:12px}
  .vcbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .vclist{border:1px solid var(--edge);border-radius:7px;background:var(--panel2);

  .vcrow{display:flex;gap:8px;align-items:center;padding:4px 8px;
    border-bottom:1px solid var(--edge)}
  .vcrow:last-child{border-bottom:none}
  .vcrow.vchd{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
  .vcrow.gap{background:#221d13}
  .vcrow .vcu{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
  .vcrow .vcu img{width:26px;height:34px;object-fit:contain;background:#0d0f13;

  .vcrow.vchd .vcu{padding-left:2px}

  .cterm{background:var(--panel2);border:1px solid var(--edge);border-radius:5px;
    padding:1px 6px;font-size:11.5px;display:inline-block;margin:1px 0}
  .cterm.neg{border-color:var(--bad);color:var(--bad)}
  .reqbtn{padding:3px 8px;font-size:11.5px;flex:0 0 auto}
  .condlist{border:1px solid var(--edge);border-radius:7px;background:var(--panel2)}

  /* "📍 8 settlements" — hover it for the list out of descr_regions.txt */
  .where{position:relative;flex:0 0 auto;font-size:11px;color:var(--accent2);cursor:help;

     culture behind it — the bit you need once, to check you ticked the right

  .facrow{display:flex;gap:8px;align-items:center;padding:3px 7px;border-radius:5px;

  .facrow.on{background:#2b3446}

  .ucard .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:3px 6px}
  .ucard .stats label{display:flex;flex-direction:column;font-size:8.5px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.3px;min-width:0}
  .ucard .stats input{width:100%;padding:2px 4px;font-size:11.5px;text-align:center}
  .ucard .stats .numwrap{margin-top:2px}
  .ucard .acts{display:flex;gap:4px}
  .ucard .acts button{padding:2px 6px;font-size:11px;flex:1}
  .viewtoggle{display:inline-flex;border:1px solid var(--edge);border-radius:6px;overflow:hidden}
  .viewtoggle button{border:none;border-radius:0;padding:3px 9px;font-size:11.5px;background:var(--panel2)}
  .viewtoggle button+button{border-left:1px solid var(--edge)}
  .viewtoggle button.on{background:var(--accent2);color:#fff}
  /* ---- the upgrade graph ---- */
  .pathwrap{overflow-x:auto;border:1px solid var(--edge);border-radius:7px;background:var(--panel2);padding:10px}
  /* SCOPED to the graph. Unscoped, this rule (later in the sheet) also hit the
     model card's `.prow`, turning its grid into a flex row — which is what made
     every path box shrink to 148px and every label start at a different x. */
  .pathwrap .prow{display:flex;gap:8px;align-items:center;margin:3px 0;white-space:nowrap}
  .pnode{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--edge);border-radius:7px;
    background:var(--panel);padding:4px 8px 4px 4px;cursor:pointer;flex:0 0 auto}
  .pnode:hover{border-color:var(--accent2)}
  .pnode.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .pnode img{width:34px;height:27px;object-fit:contain;background:#0d0f13;border-radius:3px}
  .pnode .t{font-size:11.5px}
  .pnode .n{font-size:9.5px;color:var(--dim)}
  .parrow{color:var(--dim);flex:0 0 auto}
  .pbranch{color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
  .upgrow{display:flex;gap:6px;align-items:center;padding:4px 7px;border-bottom:1px solid var(--edge)}
  .upgrow:last-child{border-bottom:none}
  .upgrow .un{flex:0 0 auto}
  .upglist{border:1px solid var(--edge);border-radius:7px;background:var(--panel2)}
  /* ---- bulk edit over recruit pools ----
     Filling out a level means giving twenty units the same requires clause, not
     one — so the pools get a selection of their own: tick rows, then act on all
     of them at once. The bar is amber like every other "this is staged" surface
     in the dialog. */
  .bulkbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;padding:7px 9px;
    border:1px solid var(--accent);border-radius:7px;background:#241f0d}
  .bulkbar button{padding:3px 8px;font-size:11.5px}
  .bulkbar button:disabled{opacity:.38;cursor:default;border-color:var(--edge)}
  .bulkbar .n{flex:0 0 auto;font-size:11.5px;color:var(--accent);font-weight:600}
  .bulkbar select{padding:3px 6px;font-size:11.5px}
  .bulkbar .bnums{display:flex;gap:6px;align-items:flex-end;flex:1 1 100%;
    border-top:1px solid var(--edge);margin-top:2px;padding-top:6px}
  .bulkbar .bnums label{display:flex;flex-direction:column;font-size:8.5px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.4px}
  .bulkbar .bnums input{width:66px;padding:3px 5px;font-size:12px}
  .bulkbar .hint{flex:1;min-width:0;font-size:10.5px;color:var(--dim)}
  .bulkbar .lbl2{flex:0 0 auto;font-size:11.5px;color:var(--dim)}
  .pick{flex:0 0 auto;display:flex;align-items:center;cursor:pointer}
  .pick input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  #bldBody .poolrow.picked{box-shadow:inset 3px 0 0 var(--accent2);background:#1b2430}
  #bldBody .ucard.picked{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset}
  .ucard .top .pick{align-self:flex-start;margin-top:2px}
  /* the add-unit picker ticks rather than adds, so its rows carry a box too */
  .baserow.on{background:#2b3446}
  /* ---- comparing two units ----
     The same stat twice with the better side coloured. The point is to see the
     gap and close it without leaving the page, so both columns are live boxes
     rather than text — the unit you opened is on the left, the one you compared
     against on the right, and Save writes both. */
  .cmphead{display:flex;gap:10px;align-items:center;padding:8px 10px;margin-bottom:10px;
    border:1px solid var(--edge);border-radius:8px;background:var(--panel2)}
  .cmphead .cu{display:flex;gap:8px;align-items:center;flex:1;min-width:0}
  .cmphead .cu.b{flex-direction:row-reverse;text-align:right}
  .cmphead img{width:36px;height:47px;object-fit:contain;background:#0d0f13;border-radius:4px;flex:0 0 36px}
  .cmphead .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmphead .ty{font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmphead .tally{flex:0 0 auto;text-align:center;font-size:10.5px;color:var(--dim);line-height:1.3}
  .cmphead .tally .w{color:var(--good);font-weight:600}
  .cmpbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .cmpbar .q{flex:1;min-width:130px;padding:4px 8px;font-size:12.5px}
  .cmpsec{margin-bottom:10px}
  .cmpsec>h5{margin:0 0 3px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--dim);font-weight:600}
  .cmplist{border:1px solid var(--edge);border-radius:7px;background:var(--panel2)}
  /* The stat's name is a fixed-ish label; the extra width of a wide screen
     belongs to the two value columns, which are what you compare. */
  .cmprow{display:grid;gap:7px;align-items:center;padding:3px 8px;border-bottom:1px solid var(--edge);
    grid-template-columns:minmax(104px,230px) minmax(86px,1fr) 62px minmax(86px,1fr)}
  .cmprow:last-child{border-bottom:none}
  .cmprow.same{opacity:.6}
  .cmprow .cl{font-size:11.5px;color:var(--dim);min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .cmprow .cv{min-width:0}
  .cmprow input,.cmprow select{width:100%;padding:2px 6px;font-size:12px;min-width:0}
  .cmprow .cd{text-align:center;font-size:11px;color:var(--dim);white-space:nowrap}
  .cmprow .cd.win{color:var(--good)}
  .cmprow .cd.neu{color:var(--warn)}
  .cv.win input,.cv.win select{border-color:var(--good);background:#12281c}
  .cv.lose input,.cv.lose select{border-color:var(--bad);background:#2a1414}
  .cv.diff input,.cv.diff select{border-color:var(--warn);background:#241f0d}
  .cmprow .cv.edited input,.cmprow .cv.edited select{outline:1px solid var(--accent);outline-offset:1px}
  .cmpfield{display:flex;gap:7px;align-items:baseline;padding:4px 8px;font-size:11px;
    color:var(--accent);background:#1b2027;border-bottom:1px solid var(--edge)}
  .cmpfield .count{font-family:ui-monospace,Consolas,monospace}

  /* ---- Home: one card per mod, with what each module can do with it ---- */
  .homewrap{max-width:1180px;margin:0 auto;padding-top:18px}
  .homehead h2{margin:0 0 4px;font-size:20px;color:var(--accent)}
  .homeresume{display:flex;gap:10px;align-items:center;margin:16px 0 4px}
  .homegrid{display:grid;gap:14px;margin-top:16px;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .homecard{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px}
  .hchead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  /* min-width:0 or the path below refuses to shrink and runs past the card */
  .hchead>div:first-child{flex:1 1 auto;min-width:0}
  .hchead .nm{font-size:16px;font-weight:600;overflow-wrap:anywhere}
  /* a mod path is 90 characters and the card is 340 wide, so it wraps rather
     than ellipsising — the tail is the half that identifies the mod */
  .hchead .sub{color:var(--dim);font-size:11px;font-family:ui-monospace,Consolas,monospace;
    max-width:100%;overflow-wrap:anywhere;line-height:1.35;margin-top:2px}
  .homestep{display:flex;gap:10px;align-items:center;margin:14px 0 0;padding:10px 12px;
    border:1px solid var(--edge);border-radius:8px;background:var(--panel)}
  .homestep .n{flex:0 0 22px;height:22px;border-radius:11px;background:var(--accent);
    color:#000;font-size:12px;font-weight:600;display:flex;align-items:center;
    justify-content:center}
  .homestep .t{flex:1;min-width:0;font-size:12.5px}
  .homestep .t .p{color:var(--dim);font-size:11px;font-family:ui-monospace,Consolas,monospace;
    overflow-wrap:anywhere;line-height:1.35}
  /* Step 3's preference rows: one per line. Two columns was tried and read as a
     jumble — each row is a tick box, a label and a hint of its own length, so
     side by side there was no column edge for the eye to follow. */
  .homeprefs{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .homeprefs > div{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;
    padding:3px 0;border-bottom:1px solid var(--edge)}
  .homeprefs > div:last-child{border-bottom:0}
  .homeprefs .chk{align-items:baseline;margin:0}
  .homeprefs .count{font-size:11px;margin-left:auto;text-align:right}
  .hcmods{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 6px}
  .hcmod{display:inline-flex;gap:6px;align-items:center;padding:5px 9px;font-size:12px}
  .hcmod .ic{font-size:14px}
  .hcmod.off{opacity:.5}
  .hcmod .dot{font-size:9px} .hcmod .dot.bad{color:var(--bad)} .hcmod .dot.warn{color:var(--warn)}
  .hctoggle{border:0;background:none;color:var(--dim);font-size:12px;padding:4px 0}
  .hctoggle:hover{color:var(--ink)}
  .hctab{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  .hctab td{padding:3px 6px;border-top:1px solid var(--edge);vertical-align:top}
  .hctab td.s{width:16px;text-align:center} .hctab td.r{text-align:right;white-space:nowrap}
  .hctab .count{font-size:10px}

  /* ---- the shared trigger builder (web/js/triggerui.js) ---- */
  .trg{border:1px solid var(--edge);border-radius:8px;padding:10px;background:var(--panel)}
  .trgrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .trgrow input{min-width:150px}
  .trghint{font-size:12px;color:var(--dim);margin:6px 0 10px}
  .trgconds{display:flex;flex-direction:column;gap:6px}
  .trgcond{display:flex;gap:6px;align-items:center;flex-wrap:wrap;
    padding:6px 8px;border:1px solid var(--edge);border-radius:6px;background:var(--panel2)}
  .trgcond.bad{border-color:var(--bad)}
  .trgcond .jn{min-width:74px;font-size:12px;color:var(--dim)}
  .trgcond select.jn{min-width:64px;color:var(--ink)}
  .trgterm{max-width:270px}
  .trgargs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .trgop{width:64px} .trgnum{width:88px} .trgname{width:190px}
  .trgdel{margin-left:auto;border:0;background:none;color:var(--dim);padding:2px 6px}
  .trgdel:hover{color:var(--bad)}
  .trgwarn{flex-basis:100%;font-size:11px}
  .trgadd{margin-top:8px}
  .trgeffects{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .trgeff{display:flex;gap:8px;align-items:center}
  .trgeff input{flex:1}

  /* ---- Traits: the trait list, then that trait's header, levels and triggers ---- */
  .trwrap{display:flex;gap:14px;align-items:flex-start;padding-top:12px}
  .trlist{flex:0 0 280px;display:flex;flex-direction:column;gap:6px;
    position:sticky;top:12px;max-height:calc(100vh - 90px)}
  .trnew{flex:0 0 auto}
  .trrows{display:flex;flex-direction:column;gap:3px;overflow:auto;min-height:0}
  .trrow{text-align:left;padding:6px 9px;line-height:1.3}
  .trrow.on{border-color:var(--accent);background:var(--panel2)}
  .trrow .nm{font-size:13px} .trrow .sub{font-size:11px;color:var(--dim)}
  .trmain{flex:1;min-width:0}
  .trbar{display:flex;gap:10px;align-items:center;padding:0 0 10px}
  .trbar .sp{flex:1}
  .trnote,.trfind{font-size:12px;padding:5px 9px;border:1px solid var(--edge);
    border-radius:6px;margin-bottom:6px}
  /* the findings banner, opened */
  .findtog{border:0;background:none;color:inherit;padding:0;font-size:12px;
    font-weight:600;text-align:left;width:100%}
  .findtog:hover{color:var(--ink)}
  .findlist{max-height:240px;overflow:auto;margin-top:5px;font-size:11.5px;
    line-height:1.45}
  .findrow{padding:3px 0;border-top:1px solid var(--edge);color:var(--dim);
    overflow-wrap:anywhere}
  .findrow:first-child{border-top:none}
  .findrow .ulink{color:var(--accent);cursor:pointer}
  .trsec{border:1px solid var(--edge);border-radius:8px;padding:10px 12px;margin-bottom:12px}
  .trsechead{font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--dim);font-weight:600;margin-bottom:8px}
  .trsechead .count{text-transform:none;letter-spacing:0;font-weight:400;margin-left:8px}
  .trgrid{display:grid;grid-template-columns:170px 1fr;gap:6px 10px;align-items:center}
  .trgrid input,.trgrid select{width:100%}
  .trhint{font-size:11px;margin-top:3px}
  .trlevel{border:1px solid var(--edge);border-radius:6px;padding:8px 10px;
    margin-bottom:8px;background:var(--panel2)}
  .trlevhead{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .trlevhead .n{width:20px;height:20px;border-radius:10px;background:var(--edge);
    color:var(--dim);font-size:11px;display:flex;align-items:center;justify-content:center}
  .trlevname{flex:1;max-width:220px} .trnum{width:80px}
  /* the key on the left, the words the player reads on the right */
  .trkey{display:flex;gap:6px} .trkey input:first-child{flex:0 0 44%}
  .trtext{flex:1;min-width:0;font-style:italic}
  .trtext::placeholder{font-style:normal;color:var(--bad)}
  .treffects{display:flex;flex-direction:column;gap:5px;margin-top:8px}
  .treff{display:flex;gap:6px;align-items:center}
  .trattr{width:230px} .trattr.bad{border-color:var(--bad)}
  .trtrig{border:1px solid var(--edge);border-radius:6px;padding:8px 10px;margin-bottom:8px}
  .trtrighead{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .trtrighead .sp{flex:1}
  /* Ancillaries: the row carries its picture, and the pane shows it big */
  .anrow{display:flex;gap:8px;align-items:center}
  .anpic{width:26px;height:26px;object-fit:contain;flex:0 0 auto;
    background:var(--panel2);border-radius:4px}
  .antxt{min-width:0;display:flex;flex-direction:column}
  .antxt .nm,.antxt .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .anhead{display:flex;gap:12px;align-items:flex-start}
  .anbig{width:96px;height:96px;object-fit:contain;flex:0 0 auto;
    background:var(--panel2);border:1px solid var(--edge);border-radius:6px}
  /* the picture, the ✎ on it, and "Where is it?" under it — one column, so the
     buttons never push the fields beside it out of line */
  .anpicbox{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch}
  .anpicbox button:not(.icoedit){padding:3px 7px;font-size:11px}

  /* ---- Minor Files: five files behind one tab strip ---- */
  .mftabs{display:flex;gap:6px;align-items:center;padding:10px 0 0;
    border-bottom:1px solid var(--edge)}
  .mftab{padding:6px 12px;border-bottom-left-radius:0;border-bottom-right-radius:0}
  .mftab.on{border-color:var(--accent);background:var(--panel2);color:var(--fg)}
  .mflvl{display:flex;gap:10px;align-items:flex-start;padding:6px 0;
    border-top:1px solid var(--edge)}
  .mflvlname{flex:0 0 150px;font-size:12px;padding-top:5px;color:var(--dim)}
  .mfag{flex:0 0 84px;font-size:12px;color:var(--dim)}
  /* the art a minor file points at: a religion pip, a resource icon, a
     settlement or agent card. A slot the mod does not ship unpacked is left
     blank and never marked as a fault — see mfArt in minorfiles.js */
  .mfart{display:flex;gap:8px;align-items:center}
  .mfart input{flex:1;min-width:0}
  .mfpip{width:32px;height:32px;object-fit:contain;flex:0 0 32px;
    border:1px solid var(--edge);border-radius:3px;background:var(--panel2)}
  .mfpip.gone{visibility:hidden}
  .mfpip.act{cursor:pointer;transition:border-color .1s}
  .mfpip.act:hover{border-color:var(--accent2)}
  .mfnoart{flex:0 0 32px;text-align:center;color:var(--dim);font-size:11px}
  .mfnames{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12px;
    line-height:1.45;resize:vertical}

  /* ---- Factions: the two map colours are the row's own badge ---- */
  .facrow2{display:flex;gap:8px;align-items:center}
  .facswatch{flex:0 0 auto;display:flex;width:22px;height:22px;border-radius:4px;
    overflow:hidden;border:1px solid var(--edge)}
  .facswatch i{flex:1}
  .faccol{display:flex;gap:6px;align-items:center}
  .faccol input[type=color]{flex:0 0 42px;height:26px;padding:0;border:1px solid var(--edge);
    border-radius:4px;background:none}
  .faccolt{flex:1;min-width:0}
  .facpics{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px}
  .facpics figure{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center}
  .facpics img{width:84px;height:84px;object-fit:contain;background:var(--panel2);
    border:1px solid var(--edge);border-radius:6px}
  .facpics figcaption{font-size:11px;color:var(--dim);text-align:center;max-width:110px}
  .facpics figcaption .count{display:block;font-size:9.5px;overflow-wrap:anywhere}
  .facpics figcaption .sprrow{margin-top:5px;justify-content:center}
  .facpics figcaption .sprrow button{padding:2px 6px;font-size:10.5px}

  /* ---- Strings: the file list, then that file's entries ---- */
  .strwrap{display:flex;gap:14px;align-items:flex-start;padding-top:12px}
  .strlist{flex:0 0 250px;display:flex;flex-direction:column;gap:4px;
    position:sticky;top:12px;max-height:calc(100vh - 90px);overflow:auto}
  .strfile{text-align:left;padding:7px 9px;line-height:1.3}
  .strfile.on{border-color:var(--accent);background:var(--panel2)}
  .strfile .nm{font-size:13px} .strfile .sub{font-size:11px;color:var(--dim)}
  .strmain{flex:1;min-width:0}
  .strbar{display:flex;gap:10px;align-items:center;padding:0 0 10px}
  .strbar .sp{flex:1}
  .strnote{font-size:12px;padding:6px 9px;border:1px solid var(--edge);border-radius:6px;
    margin-bottom:10px}
  .strtab{width:100%;border-collapse:collapse}
  .strtab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--dim);font-weight:600;padding:4px 6px}
  .strtab td{padding:4px 6px;border-top:1px solid var(--edge);vertical-align:top}
  .strtab td.k{width:210px;word-break:break-all} .strtab td.s{width:66px;white-space:nowrap}
  .strtab td.k code{font-size:12px}
  .strtab textarea{width:100%;resize:vertical;font-size:13px}
  .strtab tr.edited td.k code{color:var(--accent)}
  .strtab tr.edited textarea{border-color:var(--accent)}
  .strmore{padding:10px 0;display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
<header>
  <button id="navBtn" class="navbtn" title="Menu: switch module">
    <span class="burger">☰</span><span id="navCur">Unit Transfer</span>
  </button>
  <button id="backBldBtn" style="display:none" title="Go back to the building you came from">← Back to building</button>
  <div class="sep"></div>
  <span class="lbl" id="srcLbl">From</span><select id="srcSel"></select>
  <span id="dstWrap"><span class="lbl">→ To</span><select id="dstSel"></select></span>
  <div class="sep"></div>
  <input type="search" id="search" placeholder="Search…">
  <label class="chk"><input type="checkbox" id="mercOnly"> mercs</label>
  <button id="selBtn" title="Select multiple units">☑ Select</button>
  <button id="batchBtn" class="primary" style="display:none">Transfer selected (0)</button>
  <button id="clearSelBtn" style="display:none" title="Untick every selected unit">✕ Clear</button>
  <button id="packBtn" style="display:none" title="Put the ticked units in a zip someone else can import into their mod">📦 Export pack</button>
  <button id="importPackBtn" style="display:none" title="Import a unit pack somebody sent you">📦 Import pack…</button>
  <button id="newUnitBtn" class="primary" style="display:none" title="Create a new unit using an existing one as the base">＋ New unit</button>
  <button id="cleanBtn" style="display:none" title="Find entries and files nothing uses and move them out of the mod">🧹 Clean up BMDB…</button>
  <button id="tidyEduBtn" style="display:none" title="Group the whole unit file into sections and line its values up">🧹 Clean up unit file…</button>
  <button id="sndBtn" class="primary" style="display:none" title="Write the staged voice changes into this mod">Apply voice edits (0)</button>
  <label class="chk" id="unusedWrap" style="display:none"><input type="checkbox" id="unusedOnly"> unused only</label>
  <button id="settingsBtn" title="Settings: Medieval II root folder, launcher, defaults">⚙ Settings</button>
  <button id="logBtn" title="Log + undo">🕑 Log</button>
  <span class="count" id="count"></span>
</header>

<div class="navback" id="navBack"></div>
<nav class="navmenu" id="navMenu" aria-hidden="true">
  <div class="navbrand">

<div class="layout">
  <aside class="filters" id="unitFilters">
    <h3>Group by</h3>
    <select id="groupBy" style="width:100%">
      <option value="faction">Faction (ownership)</option>
      <option value="kind">Category</option>
      <option value="class">Class</option>
      <option value="era">Era (custom battle)</option>
      <option value="none">Nothing (flat)</option>
    </select>
    <h3>Faction</h3>
    <select id="facSort" style="width:100%;margin-bottom:6px"
      title="Which of the two names factions are listed and sorted by. The other one goes in brackets.">
      <option value="name">A→Z by in-game name</option>
      <option value="code">A→Z by code name</option>
    </select>
    <div id="factionFilter"></div>
    <h3>Category</h3><div id="categoryFilter"></div>
    <h3>Class</h3><div id="classFilter"></div>
    <h3>Era</h3>
    <div id="eraFilter">
      <label class="opt"><input type="checkbox" value="0" class="era"> Early</label>
      <label class="opt"><input type="checkbox" value="1" class="era"> High</label>
      <label class="opt"><input type="checkbox" value="2" class="era"> Late</label>
    </div>
  </aside>
  <!-- Buildings mode brings its own filters: the unit sidebar's category/class/era
       say nothing about a settlement building, and which CULTURE's art to show has
       no equivalent on the unit side at all. -->
  <aside class="filters" id="bldFilters" style="display:none">
    <h3>Culture (art)</h3>
    <select id="bldCulture" style="width:100%"
      title="Building icons are per culture, and this picks whose art the grid shows"></select>
    <h3>Settlement</h3>
    <div id="bldSettleFilter">
      <label class="opt"><input type="checkbox" value="city" class="bldset"> City</label>
      <label class="opt"><input type="checkbox" value="castle" class="bldset"> Castle</label>
      <label class="opt"><input type="checkbox" value="both" class="bldset"> Both</label>
    </div>
    <h3>Shows</h3>
    <label class="opt"><input type="checkbox" id="bldRecruitOnly"> Recruits units only</label>
    <label class="opt"><input type="checkbox" id="bldMissingArt"> Missing its own art</label>
    <h3>Religion</h3><div id="bldReligionFilter"></div>
    <h3>Faction</h3><div id="bldFactionFilter"></div>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

<div class="drawer" id="drawer"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<!-- The loading bar. Bottom of the window, above everything, on whichever menu
     is open — see `loadbar` in core.js, which drives it from the API client. -->
<div class="loadbar" id="loadbar">
  <div class="lbtrack"><div class="lbfill"></div></div>
  <div class="lbrow"><span class="lbtext"></span><span class="lbnum"></span></div>
</div>

<!-- The UI's code, split by module. Plain <script> tags sharing ONE global
     scope: no build step, no module system, nothing to install. The ORDER
     matters — core declares the state every other file reads, and boot calls
     init() once the rest exists. A new module goes in next to its peers and
     gets an entry in core.js's MODES array; a top-level name must be unique
     across all of them (a duplicate silently wins by hoisting). -->
<script src="js/core.js"></script>
<script src="js/codeview.js"></script>
<script src="js/triggerui.js"></script>
<script src="js/undo.js"></script>
<script src="js/home.js"></script>
<script src="js/transfer.js"></script>
<script src="js/strings.js"></script>
<script src="js/sounds.js"></script>
<script src="js/sprites.js"></script>
<script src="js/editor.js"></script>
<script src="js/compare.js"></script>
<script src="js/bmdb.js"></script>
<script src="js/packs.js"></script>
<script src="js/settings.js"></script>
<script src="js/guided.js"></script>
<script src="js/modelpicker.js"></script>
<script src="js/buildings.js"></script>
<script src="js/traits.js"></script>
<script src="js/ancillaries.js"></script>
<script src="js/minorfiles.js"></script>
<script src="js/factions.js"></script>
<script src="js/edusort.js"></script>
<script src="js/images.js"></script>
<script src="js/viewer3d.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
